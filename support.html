<style>
:root {
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --glow: rgba(59,130,246,.4);
  --bg: #f1f5f9;
  --elevated: #ffffff;
  --card: rgba(255,255,255,.55);
  --text: #0f172a;
  --text2: #475569;
  --muted: #64748b;
  --border: rgba(255,255,255,.35);
  --success: #10b981;
  --radius: 22px;
}
[data-theme="dark"] {
  --primary: #60a5fa;
  --primary-hover: #3b82f6;
  --glow: rgba(96,165,250,.35);
  --bg: #030712;
  --elevated: #0b0f19;
  --card: rgba(17,24,39,.55);
  --text: #f1f5f9;
  --text2: #94a3b8;
  --muted: #64748b;
  --border: rgba(255,255,255,.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  transition: background .35s, color .35s;
  min-height: 100vh;
}

#webgl-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ===== HEADER ===== */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  background: color-mix(in srgb, var(--elevated) 75%, transparent);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1120px; margin: 0 auto;
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.logo {
  font-size: 22px; font-weight: 800; letter-spacing: -.5px;
  display: flex; align-items: center; gap: 5px;
  text-decoration: none; color: var(--text);
}
.logo span {
  background: linear-gradient(135deg, var(--primary), #a855f7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo img { height: 34px; width: auto; max-width: 150px; object-fit: contain; display: block; }
.nav-desktop { display: flex; gap: 4px; }
.nav-desktop a {
  padding: 8px 14px; font-size: 14px; font-weight: 500;
  color: var(--text2); border-radius: 9px; transition: .2s;
  text-decoration: none;
}
.nav-desktop a:hover { color: var(--text); background: color-mix(in srgb, var(--primary) 12%, transparent); }
.nav-desktop a.active { color: var(--primary); background: color-mix(in srgb, var(--primary) 15%, transparent); }
.header-actions { display: flex; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; font-size: 14px; font-weight: 600;
  border-radius: 12px; border: none; cursor: pointer;
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  text-decoration: none;
}
.btn-ghost {
  background: color-mix(in srgb, var(--card) 80%, transparent);
  color: var(--text); border: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
.btn-ghost:hover { border-color: var(--primary); transform: translateY(-2px); }
.btn-primary {
  background: var(--primary); color: #fff;
  box-shadow: 0 4px 24px var(--glow);
}
.btn-primary:hover {
  background: var(--primary-hover);
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 10px 36px var(--glow);
}
.icon-btn {
  width: 42px; height: 42px; border-radius: 11px;
  border: 1px solid var(--border); background: color-mix(in srgb, var(--card) 70%, transparent);
  backdrop-filter: blur(10px); color: var(--text); font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: .2s;
}
.icon-btn:hover { background: color-mix(in srgb, var(--primary) 15%, transparent); transform: scale(1.08); }
.menu-btn { display: none; }


.mobile-menu.kinetic-nav {
  display: none;
  position: fixed; inset: 0; z-index: 600 !important;
}
.mobile-menu.kinetic-nav[hidden] { display: none !important; }
.mobile-menu.kinetic-nav.active,
.mobile-menu.kinetic-nav[data-nav="open"] {
  display: block !important;
  visibility: visible !important;
}
.kinetic-overlay {
  position: absolute; inset: 0;
  background: rgba(2,6,23,.45);
  backdrop-filter: blur(8px);
}
.kinetic-panel {
  position: absolute; top: 0; left: 0; bottom: 0; right: auto;
  width: min(300px, 84vw);
  overflow: auto;
  padding: 22px 0 20px;
  background: #1d3fa8;
  color: #e8eeff;
  box-shadow: 18px 0 50px rgba(15,23,42,.28);
  transform: translateX(-105%);
  transition: transform .32s cubic-bezier(.22,1,.36,1);
  display: flex;
  flex-direction: column;
}
.mobile-menu.active .kinetic-panel,
.mobile-menu[data-nav="open"] .kinetic-panel { transform: translateX(0); }
.menu-sheet-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 0 18px 16px;
}
.menu-brand { display: flex; align-items: center; gap: 10px; }
.menu-brand img { width: 34px; height: 34px; object-fit: contain; border-radius: 10px; background: #fff; }
.menu-brand b { display: block; font-size: 15px; font-weight: 800; color: #fff; }
.menu-brand small { display: block; font-size: 11px; color: #c7d7ff; }
.kinetic-close {
  width: 36px; height: 36px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.1); color: #fff;
  display: grid; place-items: center; cursor: pointer;
}
.kinetic-links {
  list-style: none; margin: 8px 0 0; padding: 0 0 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.kinetic-links a {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  margin-left: 14px; margin-right: 0;
  padding: 13px 18px 13px 16px;
  border-radius: 22px 0 0 22px;
  color: #d7e3ff; text-decoration: none;
  font-size: 15px; font-weight: 650;
  background: transparent; border: 0;
}
.kinetic-links a svg { width: 18px; height: 18px; flex: 0 0 auto; opacity: .9; }

.nav-sub { margin: 0; }
.nav-sub-toggle {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  margin-left: 14px; margin-right: 0;
  padding: 13px 18px 13px 16px;
  border-radius: 22px 0 0 22px;
  color: #d7e3ff; text-decoration: none;
  font-size: 15px; font-weight: 650;
  background: transparent; border: 0;
  width: calc(100% - 14px);
  cursor: pointer; font-family: inherit; text-align: left;
}
.nav-sub-toggle svg.icon { width: 18px; height: 18px; flex: 0 0 auto; opacity: .9; }
.nav-sub-toggle .chev {
  margin-left: auto; width: 16px; height: 16px; opacity: .85;
  transition: transform .2s ease;
}
.nav-sub.open .nav-sub-toggle .chev { transform: rotate(180deg); }
.nav-sub-panel {
  display: none;
  flex-direction: column;
  gap: 2px;
  padding: 4px 0 8px 0;
}
.nav-sub.open .nav-sub-panel { display: flex; }
.nav-sub-panel a {
  margin-left: 28px !important;
  padding: 11px 18px 11px 16px !important;
  font-size: 14px !important;
  font-weight: 600 !important;
  opacity: .95;
}

.kinetic-links a.on {
  background: #fff;
  color: #1d3fa8;
  font-weight: 800;
  z-index: 1;
}
.kinetic-links a.on svg { opacity: 1; }
.kinetic-links a.on:before,
.kinetic-links a.on:after {
  content: "";
  position: absolute;
  left: 0;
  width: 22px;
  height: 22px;
  background: transparent;
}
.kinetic-links a.on:before {
  top: -22px;
  border-bottom-left-radius: 22px;
  box-shadow: -6px 6px 0 6px #fff;
}
.kinetic-links a.on:after {
  bottom: -22px;
  border-top-left-radius: 22px;
  box-shadow: -6px -6px 0 6px #fff;
}
.kinetic-auth, .mobile-auth {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-top: auto; padding: 16px 16px 8px;
}
.kinetic-auth .btn-ghost { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.2); }
.kinetic-auth .btn { width: 100%; }
body.menu-open { overflow: hidden; }


/* ===== HERO ===== */
.support-hero {
  position: relative; z-index: 2;
  padding: 80px 24px 30px;
  text-align: center;
}
.support-hero-inner {
  max-width: 800px; margin: 0 auto;
}
.breadcrumb {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500; margin-bottom: 22px;
  padding: 6px 14px;
  background: color-mix(in srgb, var(--primary) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent);
  border-radius: 999px;
}
.breadcrumb a { color: var(--primary); text-decoration: none; }
.breadcrumb span { color: var(--text2); }
.support-hero h1 {
  font-size: clamp(32px, 5vw, 48px); font-weight: 800;
  letter-spacing: -1.5px; line-height: 1.15; margin-bottom: 14px;
}
.support-hero h1 .grad {
  background: linear-gradient(135deg, var(--primary), #a855f7 55%, #ec4899);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.support-hero p {
  font-size: 16px; color: var(--text2);
  max-width: 520px; margin: 0 auto 20px;
}
.support-status {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--text2);
}
.status-dot {
  width: 8px; height: 8px; background: var(--success); border-radius: 50%;
  box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

/* ===== SUPPORT CARDS ===== */
.support-container {
  position: relative; z-index: 2;
  max-width: 780px;
  margin: 20px auto 60px;
  padding: 0 24px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 700px) {
  .support-container { grid-template-columns: 1fr; }
}

.support-card {
  background: var(--card);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: all .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 10px 32px rgba(0,0,0,.12);
}
.support-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 24px 50px rgba(0,0,0,.2), 0 0 40px var(--glow);
  border-color: color-mix(in srgb, var(--primary) 45%, transparent);
}
.support-card-top {
  padding: 28px 24px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 14px;
}
.support-icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  box-shadow: 0 8px 24px rgba(0,0,0,.15);
}
.support-icon.wa { background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; }
.support-icon.tg { background: linear-gradient(135deg, #0088cc, #005580); color: #fff; }

.support-card h3 { font-size: 20px; font-weight: 700; color: var(--text); }
.support-card-body {
  padding: 0 24px 26px;
  text-align: center;
}
.support-card-body p {
  font-size: 14px; color: var(--text2);
  line-height: 1.6; margin-bottom: 22px;
}
.support-action-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 24px; border-radius: 12px;
  font-weight: 700; font-size: 14px;
  text-decoration: none;
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  width: 100%;
}
.btn-whatsapp {
  background: #25d366; color: #fff;
  box-shadow: 0 6px 20px rgba(37,211,102,.35);
}
.btn-whatsapp:hover { background: #128c7e; transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 28px rgba(37,211,102,.5); }
.btn-telegram {
  background: #0088cc; color: #fff;
  box-shadow: 0 6px 20px rgba(0,136,204,.35);
}
.btn-telegram:hover { background: #006699; transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 28px rgba(0,136,204,.5); }

/* ===== FAQ LINK CARD ===== */
.info-card {
  position: relative; z-index: 2;
  max-width: 780px;
  margin: 0 auto 40px;
  padding: 0 24px;
}
.info-card-inner {
  background: var(--card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  box-shadow: 0 8px 24px rgba(0,0,0,.08);
}
.info-card-text h4 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.info-card-text p { font-size: 13px; color: var(--text2); }

footer {
  position: relative; z-index: 2;
  padding: 36px 24px; border-top: 1px solid var(--border);
  text-align: center; color: var(--muted); font-size: 13px;
}
footer a { color: var(--text2); text-decoration: none; }
footer a:hover { color: var(--primary); }

@media (max-width: 768px) {
  .nav-desktop { display: none; }
  .menu-btn { display: flex; }
  .support-hero { padding: 60px 20px 20px; }
  .info-card-inner { flex-direction: column; align-items: flex-start; text-align: left; }
}

.logo { display:inline-flex !important; align-items:center !important; gap:8px !important; line-height:1 !important; text-decoration:none !important; }
.logo img { height:36px !important; width:auto !important; max-width:48px !important; object-fit:contain !important; object-position:center !important; border-radius:8px !important; background:transparent !important; flex:0 0 auto !important; }
.logo-word { font-family:"Plus Jakarta Sans", Inter, system-ui, sans-serif !important; font-size:17px !important; font-weight:800 !important; letter-spacing:-.02em !important; line-height:32px !important; background:none !important; -webkit-background-clip:unset !important; color:#1e3a8a !important; -webkit-text-fill-color:#1e3a8a !important; }
html[data-theme="dark"] .logo-word, body[data-theme="dark"] .logo-word { color:#dbeafe !important; -webkit-text-fill-color:#dbeafe !important; }


.logo { display:inline-flex !important; align-items:center !important; gap:10px !important; height:32px !important; line-height:32px !important; text-decoration:none !important; }
.logo img, .logo .brandLogo, .logo #brandLogo { height:36px !important; width:auto !important; max-width:48px !important; object-fit:contain !important; object-position:center !important; border-radius:8px !important; background:transparent !important; flex:0 0 auto !important; display:block !important; }
.logo-word { font-family:"Plus Jakarta Sans", Inter, system-ui, sans-serif !important; font-size:17px !important; font-weight:800 !important; letter-spacing:-.03em !important; line-height:32px !important; height:32px !important; display:inline-flex !important; align-items:center !important; background:none !important; -webkit-background-clip:unset !important; color:#1e3a8a !important; -webkit-text-fill-color:#1e3a8a !important; }
html[data-theme="dark"] .logo-word, body[data-theme="dark"] .logo-word { color:#dbeafe !important; -webkit-text-fill-color:#dbeafe !important; }


.logo { display:inline-flex !important; align-items:center !important; gap:8px !important; height:28px !important; line-height:28px !important; text-decoration:none !important; }
.logo img, .logo .brandLogo, .logo #brandLogo { height:24px !important; width:auto !important; max-height:24px !important; max-width:none !important; object-fit:contain !important; background:transparent !important; flex:0 0 auto !important; display:block !important; border-radius:0 !important; }
.logo-word { font-family:"Plus Jakarta Sans", Inter, system-ui, sans-serif !important; font-size:24px !important; font-weight:800 !important; letter-spacing:-.04em !important; line-height:24px !important; height:24px !important; display:inline-flex !important; align-items:center !important; background:none !important; -webkit-background-clip:unset !important; color:#1e3a8a !important; -webkit-text-fill-color:#1e3a8a !important; }

</style>

/* ===== MJ HUB MOBILE DRAWER REDESIGN =====
   CSS-only refinement. Existing navigation markup and menu behaviour are preserved. */
.mobile-menu.kinetic-nav {
  isolation: isolate;
}
.mobile-menu .kinetic-overlay {
  background: rgba(5, 12, 29, .62);
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
}
.mobile-menu .kinetic-panel {
  left: 0;
  right: auto;
  transform: translateX(-105%);
  width: min(340px, 88vw);
  max-width: 88vw;
  padding: max(22px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
  background:
    radial-gradient(ellipse at 0% 0%, rgba(55, 111, 235, .25), transparent 48%),
    linear-gradient(180deg, #111d3b 0%, #0d1730 100%);
  color: #f8fbff;
  border-right: 1px solid rgba(255,255,255,.1);
  border-radius: 0 24px 24px 0;
  box-shadow: 20px 0 60px rgba(0,0,0,.34);
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.mobile-menu .menu-sheet-top {
  padding: 2px 18px 18px;
  margin: 0 14px 12px;
  border-bottom: 1px solid rgba(255,255,255,.12);
  gap: 12px;
}
.mobile-menu .menu-brand { gap: 11px; min-width: 0; }
.mobile-menu .menu-brand img {
  width: 40px; height: 40px; border-radius: 12px;
  padding: 3px; background: rgba(255,255,255,.96);
}
.mobile-menu .menu-brand b {
  font-size: 16px; letter-spacing: -.025em; color: #fff;
}
.mobile-menu .menu-brand small {
  margin-top: 2px; font-size: 11px; color: #aebfe2;
  letter-spacing: .02em;
}
.mobile-menu .kinetic-close {
  flex: 0 0 38px; width: 38px; height: 38px;
  border-radius: 50%; font-size: 15px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16);
  transition: background .2s ease, transform .2s ease;
}
.mobile-menu .kinetic-close:active { transform: scale(.94); }
.mobile-menu .kinetic-links {
  gap: 4px;
  margin: 0;
  padding: 0 12px 12px;
}
.mobile-menu .kinetic-links > a,
.mobile-menu .nav-sub-toggle {
  width: 100%;
  min-height: 48px;
  margin: 0;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 13px;
  border: 1px solid transparent;
  border-radius: 13px;
  background: transparent;
  color: #d5def2;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  text-decoration: none;
  text-align: left;
  transition: background .18s ease, color .18s ease, border-color .18s ease;
}
.mobile-menu .kinetic-links > a svg,
.mobile-menu .nav-sub-toggle svg.icon {
  width: 19px; height: 19px; flex: 0 0 19px;
  opacity: .88;
}
.mobile-menu .kinetic-links > a:active,
.mobile-menu .nav-sub-toggle:active {
  background: rgba(255,255,255,.09);
}
.mobile-menu .kinetic-links > a.on {
  color: #fff;

<script>
/* ========== THEME PERSISTENCE ========== */
(function() {
  if (window.mjApplyTheme) window.mjApplyTheme();
  else {
    var pref = localStorage.getItem('mjhub-theme-pref') || localStorage.getItem('mjhub_theme') || 'system';
    var theme = (pref==='light'||pref==='dark') ? pref : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
    document.body.setAttribute('data-theme', theme);
  }
})();

/* ========== THREE.JS BACKGROUND ========== */
(function() {
  const canvas = document.getElementById('webgl-bg');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.z = 8;

  const ambient = new THREE.AmbientLight(0x6688cc, 0.6);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(4, 6, 5);
  scene.add(dir);

  const blobs = [];
  const geometries = [
    new THREE.IcosahedronGeometry(1.1, 1),
    new THREE.SphereGeometry(0.9, 32, 32),
    new THREE.TorusKnotGeometry(0.7, 0.25, 100, 16)
  ];
  const colors = [0x3b82f6, 0x60a5fa, 0x93c5fd, 0xa855f7, 0xc084fc];

  function createBlob(geo, color, x, y, z, scale) {
    const mat = new THREE.MeshStandardMaterial({
      color, roughness: 0.35, metalness: 0.15,
      transparent: true, opacity: 0.75
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.scale.setScalar(scale);
    mesh.userData = {
      baseY: y,
      speed: 0.3 + Math.random() * 0.5,
      rotSpeed: 0.002 + Math.random() * 0.006,
      phase: Math.random() * Math.PI * 2
    };
    scene.add(mesh);
    blobs.push(mesh);
  }

  createBlob(geometries[0], colors[0], -3, 1, -2, 1.2);
  createBlob(geometries[1], colors[3], 3, -0.5, -3, 1.0);
  createBlob(geometries[2], colors[2], 0.5, 1.8, -4, 0.85);
  createBlob(geometries[1], colors[1], -1.8, -1.5, -3, 0.7);

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    blobs.forEach(b => {
      b.position.y = b.userData.baseY + Math.sin(t * b.userData.speed + b.userData.phase) * 0.3;
      b.rotation.x += b.userData.rotSpeed;
      b.rotation.y += b.userData.rotSpeed * 1.3;
    });
    camera.position.x = Math.sin(t * 0.15) * 0.3;
    camera.position.y = Math.cos(t * 0.12) * 0.2;
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

<script>
(function(){
  function knock(img){
    if(!img) return;
    var im=new Image(); im.crossOrigin='anonymous';
    im.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
        var x=c.getContext('2d'); x.drawImage(im,0,0);
        var d=x.getImageData(0,0,c.width,c.height); var p=d.data;
        for(var i=0;i<p.length;i+=4){
          var r=p[i],g=p[i+1],b=p[i+2];
          if((r>232&&g>232&&b>232)||(r<45&&g<55&&b<95)) p[i+3]=0;
        }
        x.putImageData(d,0,0); img.src=c.toDataURL('image/png');
      }catch(e){}
    };
    im.src=img.src;
  }
  function apply(){
    var theme=(document.documentElement.getAttribute('data-theme')||document.body.getAttribute('data-theme')||'');
    if(!theme){
      try{
        var pref=localStorage.getItem('mjhub-theme-pref')||localStorage.getItem('mjhub-theme')||'system';
        theme = (pref==='light'||pref==='dark') ? pref : (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
      }catch(e){ theme='light'; }
      document.documentElement.setAttribute('data-theme', theme);
      if(document.body) document.body.setAttribute('data-theme', theme);
    }
    var src = theme==='dark'
      ? '/img/IMG_3027.png'
      : '/img/IMG_3027.png';
    document.querySelectorAll('img.brandLogo, img#brandLogo').forEach(function(img){ img.src=src; knock(img); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', apply);
  else apply();
})();
</script>

<script>
(function(){
  var btn=document.getElementById('menuToggle');
  var menu=document.getElementById('mobileMenu');
  if(!btn||!menu) return;
  function setOpen(on){
    menu.classList.toggle('active', !!on);
    menu.setAttribute('data-nav', on ? 'open' : 'closed');
    if(on) menu.removeAttribute('hidden');
    else menu.setAttribute('hidden','');
    document.body.classList.toggle('menu-open', !!on);
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  window.toggleLandingMenu=function(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    setOpen(!(menu.classList.contains('active') || menu.getAttribute('data-nav')==='open'));
  };
  btn.onclick=window.toggleLandingMenu;
  var termsToggle=document.getElementById('termsToggle');
  var termsSub=document.getElementById('termsSub');
  if(termsToggle&&termsSub){
    termsToggle.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      var open=termsSub.classList.toggle('open');
      termsToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
  menu.addEventListener('click', function(e){
    var link=e.target.closest('.kinetic-links a');
    if(link){
      menu.querySelectorAll('.kinetic-links a').forEach(function(n){ n.classList.remove('on'); });
      link.classList.add('on');
    }
    if(e.target.closest('[data-close-menu]')) setOpen(false);
  });
})();
</script>

<script>
(function(){
  var menu=document.getElementById('mobileMenu');
  if(!menu)return;
  var path=window.location.pathname;
  if(path.length>1&&path.charAt(path.length-1)==='/')path=path.slice(0,-1);
  var current=path.substring(path.lastIndexOf('/')+1)||'landing.html';
  var links=menu.querySelectorAll('.kinetic-links a[href]');
  links.forEach(function(a){
    var raw=a.getAttribute('href')||'';
    if(!raw||raw.charAt(0)==='#'||/^https?:/i.test(raw))return;
    var target=raw.split('?')[0];
    if(target.charAt(0)==='/')target=target.slice(1);
    if(target.length>1&&target.charAt(target.length-1)==='/')target=target.slice(0,-1);
    if(target===current||(current==='vendor'&&target==='vendor')){
      a.classList.add('on');a.setAttribute('aria-current','page');
      var sub=a.closest('.nav-sub');
      if(sub){sub.classList.add('open');var t=sub.querySelector('.nav-sub-toggle');if(t)t.setAttribute('aria-expanded','true');}
    }else if(target==='landing.html'&&current!=='landing.html'&&current!==''){
      a.classList.remove('on');a.removeAttribute('aria-current');
    }
  });
})();
</script>
