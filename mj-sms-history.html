<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Number History · MJ HUB</title>
<script>(function(){try{var t=localStorage.getItem('mjhub-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<script src="/js/mj-page-loader.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var a = Date.prototype.toLocaleString, b = Date.prototype.toLocaleDateString, c = Date.prototype.toLocaleTimeString;
  function L(o) { return Object.assign({ timeZone: 'Africa/Lagos' }, o || {}); }
  Date.prototype.toLocaleString = function (l, o) { return a.call(this, l || 'en-NG', L(o)); };
  Date.prototype.toLocaleDateString = function (l, o) { return b.call(this, l || 'en-NG', L(o)); };
  Date.prototype.toLocaleTimeString = function (l, o) { return c.call(this, l || 'en-NG', L(o)); };
})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{--p:#5b8af5;--ps:#3b6ef5;--glow:rgba(91,138,245,.22);--bg:#06080f;--card:#0f1524;--text:#f1f5f9;--muted:#8b9bb4;--border:rgba(148,163,184,.12);--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--shadow:0 18px 48px rgba(0,0,0,.42)}
:root[data-theme="light"]{--p:#3b6ef5;--ps:#2554e8;--glow:rgba(59,110,245,.14);--bg:#f0f3f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:rgba(15,23,42,.08);--ok:#059669;--bad:#dc2626;--warn:#d97706;--shadow:0 14px 36px rgba(15,23,42,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 80% 45% at 50% -15%,var(--glow),transparent 55%)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px 48px}
.hdr{display:flex;align-items:center;gap:12px;padding:14px 0;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--border);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none;cursor:pointer;font-size:15px;flex-shrink:0}
.ht{flex:1;min-width:0} .ht h1{font-size:18px;font-weight:800;letter-spacing:-.02em} .ht p{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:18px;font-weight:800} .stat span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none} .filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--border);background:var(--card);color:var(--muted);font:700 12px/1 inherit;padding:10px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff;box-shadow:0 8px 22px var(--glow)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.ct{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}
.ct .name{font-size:15px;font-weight:800;text-transform:capitalize;line-height:1.3}
.ct .price{font-size:14px;font-weight:800;color:var(--p);white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px}
.pill.ok{background:rgba(52,211,153,.14);color:var(--ok)} .pill.wait{background:rgba(91,138,245,.14);color:var(--p)}
.pill.bad{background:rgba(248,113,113,.14);color:var(--bad)} .pill.warn{background:rgba(251,191,36,.14);color:var(--warn)}
.pill.muted{background:rgba(148,163,184,.12);color:var(--muted)}
.grid{display:grid;gap:8px} .row{display:flex;justify-content:space-between;gap:12px;font-size:12px}
.row .l{color:var(--muted);font-weight:600} .row .v{font-weight:700;text-align:right;word-break:break-all}
.row .v.mono{font-family:ui-monospace,Menlo,monospace}
.act{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.act a{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#fff;background:var(--p);text-decoration:none;padding:10px 14px;border-radius:12px}
.empty{text-align:center;padding:48px 20px;background:var(--card);border:1px dashed var(--border);border-radius:18px}
.empty i{font-size:28px;color:var(--muted);margin-bottom:10px} .empty h4{font-size:16px;font-weight:800;margin-bottom:6px} .empty p{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <a class="ib" href="mj-sms-choose-server.html" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="ht"><h1>Number history</h1><p>SMS / OTP numbers you’ve rented</p></div>
    <button type="button" class="ib" id="themeBtn" aria-label="Theme">🌙</button>
  </header>
  <div class="stats">
    <div class="stat"><b id="stAll">0</b><span>All</span></div>
    <div class="stat"><b id="stDone">0</b><span>Completed</span></div>
    <div class="stat"><b id="stCancel">0</b><span>Cancelled</span></div>
  </div>
  <div class="filters" id="filters">
    <button type="button" class="chip on" data-filter="all">All</button>
    <button type="button" class="chip" data-filter="completed">Completed</button>
    <button type="button" class="chip" data-filter="cancelled">Cancelled</button>
    <button type="button" class="chip" data-filter="waiting">Waiting</button>
    <button type="button" class="chip" data-filter="failed">Failed</button>
  </div>
  <div class="list" id="historyList"></div>
</div>
<script>
const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const historyList = document.getElementById('historyList');
let allOrders = [];
let currentFilter = 'all';

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function money(n){ return '₦' + Number(n||0).toLocaleString(); }

const STATUS_LABELS = {
  waiting_for_code: 'Waiting for code',
  completed: 'Code received',
  refunded: 'Cancelled & refunded',
  cancelled: 'Cancelled',
  canceled: 'Cancelled',
  failed: 'Failed'
};

function bucket(status){
  const s = String(status||'').toLowerCase();
  if (s === 'completed' || s === 'success' || s === 'delivered') return 'completed';
  if (s === 'refunded' || s === 'cancelled' || s === 'canceled') return 'cancelled';
  if (s === 'waiting_for_code' || s === 'pending' || s === 'waiting') return 'waiting';
  if (s === 'failed' || s === 'error' || s === 'expired') return 'failed';
  return 'other';
}

function statusPill(status){
  const b = bucket(status);
  const label = STATUS_LABELS[status] || STATUS_LABELS[String(status||'').toLowerCase()] || status || '—';
  const cls = b === 'completed' ? 'ok' : b === 'waiting' ? 'wait' : b === 'cancelled' || b === 'failed' ? 'bad' : 'muted';
  return '<span class="pill ' + cls + '">' + escapeHtml(label) + '</span>';
}

function updateCounts(orders){
  const c = { all: orders.length, completed: 0, cancelled: 0, waiting: 0, failed: 0 };
  orders.forEach(o => {
    const b = bucket(o.status);
    if (c[b] != null) c[b]++;
  });
  document.getElementById('stAll').textContent = c.all;
  document.getElementById('stDone').textContent = c.completed;
  document.getElementById('stCancel').textContent = c.cancelled;
}

function renderOrders(orders){
  const filtered = currentFilter === 'all' ? orders : orders.filter(o => bucket(o.status) === currentFilter);
  if (!filtered.length) {
    historyList.innerHTML = '<div class="empty"><i class="fa-solid fa-mobile-screen"></i><h4>No numbers here</h4><p>' +
      (orders.length ? 'Nothing in this filter. Try All.' : 'Your rented numbers will show up here.') + '</p></div>';
    return;
  }
  historyList.innerHTML = filtered.map(o => {
    const name = (o.service_name || o.service || 'SMS').replace(/_/g,' ');
    const date = o.created_at ? new Date(o.created_at).toLocaleString() : '—';
    const serverTag = o.server === 2 || o.server === '2'
      ? '<span class="pill muted">Server 2</span>'
      : '<span class="pill muted">Server 1</span>';
    let numberPage = 'mj-sms-number.html';
    if (o.server === 2 || o.server === '2' || /server\s*2/i.test(String(o.source||''))) numberPage = 'mj-sms2-number.html';
    let actionHtml = '';
    if (String(o.status) === 'waiting_for_code') {
      actionHtml = '<div class="act"><a href="' + numberPage + '?order_id=' + encodeURIComponent(o.order_id||'') + '"><i class="fa-solid fa-arrow-right"></i> View &amp; check status</a></div>';
    }
    return '<div class="card"><div class="ct"><div class="name">' + escapeHtml(name) + '</div><div class="price">' + money(o.price) + '</div></div>' +
      '<div class="pills">' + statusPill(o.status) + serverTag + '</div>' +
      '<div class="grid">' +
      '<div class="row"><span class="l">Country</span><span class="v">' + escapeHtml(o.country_name || '—') + '</span></div>' +
      '<div class="row"><span class="l">Number</span><span class="v mono">' + escapeHtml(o.phone_number || '—') + '</span></div>' +
      '<div class="row"><span class="l">Code</span><span class="v mono">' + (o.code ? escapeHtml(o.code) : 'Not received') + '</span></div>' +
      '<div class="row"><span class="l">Date</span><span class="v">' + escapeHtml(date) + '</span></div>' +
      '<div class="row"><span class="l">Order ID</span><span class="v mono" style="font-size:11px">' + escapeHtml(o.order_id || '—') + '</span></div>' +
      '</div>' + actionHtml + '</div>';
  }).join('');
}

document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  currentFilter = btn.getAttribute('data-filter') || 'all';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === btn));
  renderOrders(allOrders);
});

function syncThemeUi(){
  const dark = document.documentElement.getAttribute('data-theme') !== 'light';
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = dark ? '🌙' : '☀️';
}
document.getElementById('themeBtn').onclick = function(){
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('mjhub-theme', next); } catch(e){}
  syncThemeUi();
};
syncThemeUi();

async function init(){
  if (!window.supabase) {
    historyList.innerHTML = '<div class="empty"><h4>Failed to load</h4></div>';
    return;
  }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (!session || !session.user) { window.location.href = 'auth.html'; return; }
  const { data, error } = await sb.from('number_orders').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if (error) {
    historyList.innerHTML = '<div class="empty"><h4>Failed to load</h4><p>' + escapeHtml(error.message) + '</p></div>';
    return;
  }
  allOrders = data || [];
  updateCounts(allOrders);
  renderOrders(allOrders);
}
init();
</script>
</body>
</html>
