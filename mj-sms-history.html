let allOrders=[], view='otp', filter='completed', rentFilter='active', liveActiveRentIds=new Set(), liveActiveMeta={};
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function money(n){return '₦'+Number(n||0).toLocaleString()}
function bucket(status){const s=String(status||'').toLowerCase();if(s==='completed'||s==='success')return'completed';if(s==='expired')return'expired';if(s==='refunded'||s==='cancelled'||s==='canceled')return'cancelled';if(s==='waiting_for_code'||s==='pending'||s==='waiting')return'waiting';return'other'}

function usaRentId(o){
  return String(o.idempotency_key||'').replace(/^gotsms-/,'')||String(o.rent_id||'');
}
function isTerminalRentStatus(o){
  if(o.refunded===true) return true;
  var st=String(o.status||'').toLowerCase();
  return ['refunded','cancelled','canceled','expired','ended','finished'].indexOf(st)>=0;
}
function isUsaActiveRow(o){
  // Single rule for filter + badge: DB terminal wins; else future expiry / open status = Active
  if(String(o.source||'').toLowerCase()!=='gotsms') return false;
  if(isTerminalRentStatus(o)) return false;
  var till=parseUsaExpiry(o);
  if(till && till<=Date.now()) return false;
  var st=String(o.status||'').toLowerCase();
  if(st==='expired'||st==='ended'||st==='finished') return false;
  // Live supplier list can only CONFIRM active (DB lag), never demote a still-open rental
  var rid=usaRentId(o);
  if(rid && liveActiveRentIds && liveActiveRentIds.size>0 && liveActiveRentIds.has(String(rid))) return true;
  if(till && till>Date.now()) return true;
  return st==='active'||st==='pending'||st==='processing'||st==='waiting'||st==='waiting_for_code';
}
function isRentActiveRow(o){
  var s=String(o.source||'').toLowerCase();
  if(s==='gotsms') return isUsaActiveRow(o);
  if(s!=='smsbus_rent') return false;
  if(isTerminalRentStatus(o)) return false;
  var till=parseUsaExpiry(o);
  if(till) return till>Date.now();
  var st=String(o.status||'').toLowerCase();
  return st==='active'||st==='pending'||st==='processing';
}
function isRentEndedRow(o){
  return isRent(o) && !isRentActiveRow(o);
}
function isRentCancelledOrRefunded(o){
  if(!o) return false;
  if(o.refunded===true) return true;
  var st=String(o.status||'').toLowerCase();
  return st==='refunded'||st==='cancelled'||st==='canceled';
}
function rentReceivedSms(o){
  if(!o) return false;
  if(o._sms_received===true) return true;
  var st=String(o.status||'').toLowerCase();
  if(st==='completed'||st==='success') return true;
  if(/sms\s*received/i.test(String(o.service_name||''))) return true;
  if(o.sms_received===true||o.has_messages===true||Number(o.message_count||0)>0) return true;
  var rid=typeof usaRentId==='function'?usaRentId(o):'';
  if(rid){
    try{ if(localStorage.getItem('mjhub_rent_sms_'+rid)==='1') return true; }catch(e){}
  }
  var c=String(o.code||'').trim();
  if(c && /^\d{4,8}$/.test(c)) return true;
  return false;
}
/** Completed = received SMS/code AND countdown finished (not cancelled/refunded). */
function isRentCompletedRow(o){
  if(!isRent(o)) return false;
  if(isRentActiveRow(o)) return false;
  if(isRentCancelledOrRefunded(o)) return false;
  if(!rentReceivedSms(o)) return false;
  var st=String(o.status||'').toLowerCase();
  var till=typeof parseUsaExpiry==='function'?parseUsaExpiry(o):0;
  if(till && till<=Date.now()) return true;
  if(st==='expired'||st==='ended'||st==='finished'||st==='completed') return true;
  if(!till && !isRentActiveRow(o)) return true;
  return false;
}
async function refreshLiveUsaActive(accessToken){
  liveActiveRentIds=new Set();
  liveActiveMeta={};
  try{
    var res=await fetch('/api/sms-bus?action=gotsms_rents&status=active',{
      headers:{Authorization:'Bearer '+accessToken,Accept:'application/json'}
    });
    var j=await res.json().catch(function(){return {};});
    (j&&j.success&&Array.isArray(j.data)?j.data:[]).forEach(function(r){
      if(!r||r.id==null) return;
      var id=String(r.id);
      liveActiveRentIds.add(id);
      liveActiveMeta[id]=r;
    });
  }catch(_){}
}
var _smsEnrichDone=false;
async function enrichPastRentSms(accessToken){
  if(_smsEnrichDone||!accessToken) return;
  _smsEnrichDone=true;
  var candidates=(allOrders||[]).filter(function(o){
    if(!isRent(o)) return false;
    if(String(o.source||'').toLowerCase()!=='gotsms') return false;
    if(isRentActiveRow(o)) return false;
    if(isRentCancelledOrRefunded(o)) return false;
    if(rentReceivedSms(o)) return false;
    return !!usaRentId(o);
  }).slice(0, 20);
  if(!candidates.length) return;
  await Promise.all(candidates.map(async function(o){
    var rid=usaRentId(o);
    if(!rid) return;
    try{
      var res=await fetch('/api/sms-bus?action=gotsms_messages&rent_id='+encodeURIComponent(rid),{
        headers:{Authorization:'Bearer '+accessToken,Accept:'application/json'}
      });
      var j=await res.json().catch(function(){return {};});
      var list=(j&&Array.isArray(j.data))?j.data:[];
      var got=list.some(function(m){ return m && (String(m.code||'').trim()||String(m.body||'').trim()); });
      if(got){
        o._sms_received=true;
        try{ localStorage.setItem('mjhub_rent_sms_'+rid,'1'); }catch(e){}
        if(!/sms\s*received/i.test(String(o.service_name||''))){
          o.service_name=(o.service_name||'USA rental')+' · SMS received';
        }
        try{
          fetch('/api/sms-bus?action=gotsms_mark_sms',{
            method:'POST',
            headers:{Authorization:'Bearer '+accessToken,Accept:'application/json','Content-Type':'application/json'},
            body:JSON.stringify({rent_id:rid})
          }).catch(function(){});
        }catch(e){}
      }
    }catch(e){}
  }));
}


function parseUsaExpiry(o){
  // Expiry stored in active_till or in code as ISO (gotsms rentals)
  var raw=o.active_till||o.code||null;
  if(!raw) return 0;
  var s=String(raw);
  // SMS OTP codes are short numeric — not dates
  if(/^\d{4,8}$/.test(s)) return 0;
  var ms=Date.parse(s);
  return isNaN(ms)?0:ms;
}
function usaMetaFromName(name){
  var parts=String(name||'').split('·').map(function(x){return x.trim();}).filter(Boolean)
    .filter(function(x){ return !/^sms\s*received$/i.test(x); });
  return { service: parts[0]||name||'USA rental', duration: parts[1]||'', carrier: parts[2]||'', extra: parts.slice(3).join(' · ') };
}

function isRent(o){var s=String(o.source||'').toLowerCase();return s==='gotsms'||s==='smsbus_rent';}
function serverLabel(o){
  // Customer-facing labels only — never show supplier names
  const src=String(o.source||'').toLowerCase();
  if(src==='gotsms') return 'USA rental';
  if(src==='smsbus_rent'||src.indexOf('rent')>=0) return 'Rental';
  if(src==='smsbus'||src==='logsdomain') return 'Server 2';
  return 'Server 1';
}
function updateHistCta(){
  var a=document.getElementById('histPrimaryCta');
  if(!a) return;
  if(view==='rent'){
    a.href='mj-sms-usa-rent.html';
    a.textContent='+ USA rental';
  } else {
    a.href='mj-sms-choose-server.html';
    a.textContent='Get OTP';
  }
}
function matchesSearch(o){
  var q=(document.getElementById('histSearch')&&document.getElementById('histSearch').value||'').trim().toLowerCase();
  if(!q) return true;
  var blob=[o.phone_number,o.country_name,o.service_name,o.order_id,o.status].join(' ').toLowerCase();
  return blob.indexOf(q)!==-1;
}
function render(){
  let rows=allOrders.filter(function(o){return matchesSearch(o)&&(view==='rent'?isRent(o):!isRent(o))});
  if(view==='otp'&&filter!=='all')rows=rows.filter(function(o){
    var bkt=bucket(o.status);
    if(filter==='completed') return bkt==='completed' || !!(o.code && String(o.code).trim());
    if(filter==='waiting') return bkt==='waiting' || String(o.status||'').toLowerCase()==='waiting_for_code';
    if(filter==='cancelled') return bkt==='cancelled' || bkt==='expired';
    return bkt===filter;
  });
  if(view==='rent'&&rentFilter==='active')rows=rows.filter(function(o){return (typeof isRentActiveRow==='function'?isRentActiveRow:isUsaActiveRow)(o);});
  if(view==='rent'&&rentFilter==='completed')rows=rows.filter(function(o){return typeof isRentCompletedRow==='function'?isRentCompletedRow(o):false;});
  if(view==='rent'&&rentFilter==='ended')rows=rows.filter(function(o){
    if(!isRent(o)) return false;
    if(typeof isRentActiveRow==='function' && isRentActiveRow(o)) return false;
    if(typeof isRentCompletedRow==='function' && isRentCompletedRow(o)) return false;
    return true;
  });
  if(!rows.length){
    listEl.innerHTML='<div class="empty">'+(view==='rent'?(rentFilter==='active'?'No active USA rentals right now.<br><a href="mj-sms-usa-rent.html" style="color:var(--primary)">Rent a number</a>':(rentFilter==='completed'?'No completed rentals yet.<br>Only numbers that received an SMS and whose timer finished appear here.':(rentFilter==='ended'?'No expired or cancelled rentals.<br>Timer-ended numbers without SMS and cancelled/refunded show here.':'No USA rentals yet. Open USA rental to get a number.'))):(filter==='completed'?'No completed OTP numbers yet.<br>Numbers with a successful code will show here.':(filter==='waiting'?'No numbers waiting for a code.':'No OTP numbers yet. Tap Get OTP to choose a server.')))+'</div>';
    return;
  }
  listEl.innerHTML=rows.map(function(o){
    const name=(o.service_name||o.service||'SMS').replace(/_/g,' ');
    const date=o.created_at?new Date(o.created_at).toLocaleString():'—';
    let b=bucket(o.status);
    if(!isRent(o)&&o.code&&String(o.code).trim()&&b!=='cancelled') b='completed';
    let pillCls=b==='completed'?'ok':b==='waiting'?'wait':b==='cancelled'?'bad':'muted';
    let statusLabel=b==='completed'?(isRent(o)?'Active / completed':'Code received'):b==='waiting'?'Waiting for code':b==='expired'?'Expired':b==='cancelled'?'Cancelled':'—';
    let action='';
    const src=String(o.source||'').toLowerCase();
    const isS2=src==='smsbus'||src==='sms-bus';
    if(!isRent(o)&&String(o.status)==='waiting_for_code'){
      const page=isS2?'mj-sms3-number.html':'mj-sms-number.html';
      action='<div class="act"><a class="btn-inbox" href="'+page+'?order_id='+encodeURIComponent(o.order_id||'')+'"><i class="fa-solid fa-inbox"></i> Verify SMS</a></div>';
    }

    // Server 2 only: Reuse for 20 minutes after code received (SMS-Bus rule)
    const REUSE_MS=20*60*1000;
    if(!isRent(o)&&isS2&&b==='completed'&&o.code&&(o.is_reusable===true||o.is_reusable===1||o.is_reusable==='true')){
      const doneAt=new Date(o.updated_at||o.completed_at||o.created_at||0).getTime();
      const left=doneAt? (doneAt+REUSE_MS-Date.now()) : 0;
      if(left>0&&o.country_id!=null&&o.service_id&&o.phone_number){
        const mins=Math.max(1,Math.ceil(left/60000));
        action=
          '<div class="act">'+
            '<button type="button" class="btn-reuse" data-reuse="1" '+
              'data-country="'+esc(String(o.country_id))+'" '+
              'data-service="'+esc(String(o.service_id))+'" '+
              'data-phone="'+esc(String(o.phone_number).replace(/\D/g,''))+'" '+
              'data-cname="'+esc(o.country_name||'')+'" '+
              'data-sname="'+esc(o.service_name||'')+'">'+
              'Reuse number</button>'+
          '</div>'+
          '<div class="reuse-hint">Same number · about '+mins+' min left to reuse</div>';
      }
    }
    // Completed OTP — always allow opening the number page to re-read the code
    if(!isRent(o)&&(b==='completed'||(o.code&&String(o.code).trim()))&&String(o.status)!=='waiting_for_code'){
      const page=isS2?'mj-sms3-number.html':'mj-sms-number.html';
      const oid=encodeURIComponent(o.order_id||'');
      const inboxBtn='<div class="act"><a class="btn-inbox" href="'+page+'?order_id='+oid+'"><i class="fa-solid fa-inbox"></i> View inbox</a></div>';
      action=(action||'')+inboxBtn;
    }
    const isGotsms=String(o.source||'').toLowerCase()==='gotsms';
    const rentId=String(o.idempotency_key||'').replace(/^gotsms-/,'')||String(o.rent_id||'');
    const stLow=String(o.status||'').toLowerCase();
    const tillMs=isGotsms?parseUsaExpiry(o):(o.active_till?new Date(o.active_till).getTime():0);
    const rentStillLive=tillMs?tillMs>Date.now():true;
    const rentDead=['refunded','cancelled','canceled','finished','ended'].indexOf(stLow)>=0;
    // Only mark expired if past active_till OR status is refunded/cancelled — never expire just because code field is odd
    // Trust countdown first: if active_till is still in the future, treat as Active even if DB status lagged
    var isActiveUsa = isGotsms ? isUsaActiveRow(o) : (String(o.source||'').toLowerCase()==='smsbus_rent' ? isRentActiveRow(o) : false);
    const meta=isGotsms?usaMetaFromName(o.service_name||name):null;
    if(isGotsms || String(o.source||'').toLowerCase()==='smsbus_rent'){
      var rentDone = typeof isRentCompletedRow==='function' ? isRentCompletedRow(o) : false;
      if(stLow==='refunded'||o.refunded){ statusLabel='Refunded'; pillCls='bad'; }
      else if(isActiveUsa){ statusLabel='Active'; pillCls='ok'; }
      else if(rentDone){ statusLabel='Completed'; pillCls='ok'; }
      else if(stLow==='cancelled'||stLow==='canceled'){ statusLabel='Cancelled'; pillCls='bad'; }
      else if(tillMs&&tillMs<=Date.now()){ statusLabel='Expired'; pillCls='bad'; }
      else if(stLow==='expired'||stLow==='finished'||stLow==='ended'){ statusLabel='Expired'; pillCls='bad'; }
      else { statusLabel='Ended'; pillCls='muted'; }
    }
    // Active or completed (timer ended after use) — allow inbox so codes stay readable
    var showUsaInbox=isGotsms&&rentId&&(isActiveUsa||(typeof isRentCompletedRow==='function'&&isRentCompletedRow(o)));
    const gotsmsBtn=showUsaInbox?('<div class="act"><a class="btn-inbox" href="mj-sms-usa-number.html?rent_id='+encodeURIComponent(rentId)+'"><i class="fa-solid fa-inbox"></i> View inbox</a></div>'):'';
    const cdId=isActiveUsa?('cd-'+esc(String(o.order_id||rentId).replace(/[^a-zA-Z0-9_-]/g,''))):'';
    const countdownRow=(isActiveUsa&&tillMs)?('<div class="row cd-row"><span class="l">Time left</span><span class="v cd-val" id="'+cdId+'" data-till="'+tillMs+'">—</span></div>'):((isGotsms&&tillMs)?('<div class="row"><span class="l">Ended</span><span class="v">'+esc(new Date(tillMs).toLocaleString())+'</span></div>'):'');
    const durRow=(meta&&(meta.duration||meta.carrier))?('<div class="row"><span class="l">Plan</span><span class="v">'+esc([meta.duration,meta.carrier,meta.extra].filter(Boolean).join(' · ')||'—')+'</span></div>'):'';
    const displayName=meta?meta.service:name;
    return '<div class="card"><div class="card-head"><div class="name">'+esc(displayName)+'</div><div class="price">'+money(o.price)+'</div></div>'+
      '<div class="pills"><span class="pill '+pillCls+'">'+statusLabel+'</span><span class="pill muted">'+esc(serverLabel(o))+'</span></div>'+
      '<div class="row"><span class="l">Country</span><span class="v">'+esc(o.country_name||'—')+'</span></div>'+
      '<div class="row"><span class="l">Number</span><span class="v">'+esc(o.phone_number||'—')+'</span></div>'+
      durRow+
      (isRent(o)?'':('<div class="row"><span class="l">Code</span><span class="v">'+(o.code&&!parseUsaExpiry({code:o.code})?esc(o.code):'—')+'</span></div>'))+
      countdownRow+
      '<div class="row"><span class="l">Date</span><span class="v">'+esc(date)+'</span></div>'+
      '<div class="row"><span class="l">Order ID</span><span class="v" style="font-size:11px">'+esc(o.order_id||'—')+'</span></div>'+
      action+gotsmsBtn+'</div>';
  }).join('');
  tickCountdowns();
}
function tickCountdowns(){
  listEl.querySelectorAll('.cd-val[data-till]').forEach(function(el){
    var till=Number(el.getAttribute('data-till')||0);
    function step(){
      var left=till-Date.now();
      if(left<=0){ el.textContent='Expired'; return; }
      var d=Math.floor(left/86400000), h=Math.floor((left%86400000)/3600000), m=Math.floor((left%3600000)/60000), s=Math.floor((left%60000)/1000);
      el.textContent=(d>0?(d+'d '):'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      setTimeout(step,1000);
    }
    step();
  });
}

let reusing=false;
async function reuseNumber(btn){
  if(reusing||!btn) return;
  reusing=true;
  const prev=btn.textContent;
  btn.disabled=true;
  btn.textContent='Reusing…';
  try{
    const session=(await window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}}).auth.getSession()).data.session;
    if(!session){location.href='auth.html';return}
  try{ startHistoryRealtime(sb, session.user.id); }catch(_rt){}
    const res=await fetch('/api/sms-bus?action=reuse',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body:JSON.stringify({
        country_id:btn.getAttribute('data-country'),
        project_id:btn.getAttribute('data-service'),
        mobile_number:btn.getAttribute('data-phone'),
        country_name:btn.getAttribute('data-cname')||'',
        service_name:btn.getAttribute('data-sname')||''
      })
    });
    const j=await res.json().catch(function(){return {}});
    if(!res.ok||!j.success||!j.data||!j.data.order_id){
      throw new Error((j&&j.message)||'Could not reuse this number');
    }
    const d=j.data;
    const num=d.number||d.phone_number||btn.getAttribute('data-phone')||'';
    try{
      const payload={order_id:d.order_id,number:num,phone_number:num,price:d.price,service_name:d.service_name,country_name:d.country_name,ts:Date.now()};
      sessionStorage.setItem('mj_sms3_last_order',JSON.stringify(payload));
      localStorage.setItem('mj_sms3_last_order',JSON.stringify(payload));
    }catch(_){}
    const q=new URLSearchParams({order_id:String(d.order_id)});
    if(num) q.set('number',num);
    if(d.service_name) q.set('service_name',d.service_name);
    if(d.country_name) q.set('country_name',d.country_name);
    if(d.price!=null) q.set('price',String(d.price));
    location.href='mj-sms3-number.html?'+q.toString();
  }catch(e){
    alert(e.message||'Reuse failed');
    btn.disabled=false;
    btn.textContent=prev;
    reusing=false;
  }
}
document.getElementById('list').addEventListener('click',function(e){
  const btn=e.target.closest('[data-reuse]');
  if(btn) reuseNumber(btn);
});

async function init(){
  try{var _v=new URLSearchParams(location.search).get('view');if(_v==='rent'){view='rent';document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-view')==='rent');});document.getElementById('otpFilters').style.display='none';var _rf0=document.getElementById('rentFilters');if(_rf0)_rf0.style.display='flex';}}catch(_){}

  
var _histCacheKey=null,_histMem=null;
function histCacheKey(uid){ return uid ? ('mjhub_hist_sms_v1_'+uid) : null; }
function readHistCache(uid){
  try{
    var k=histCacheKey(uid); if(!k) return null;
    if(_histMem && _histMem._fetchedAt && (Date.now()-_histMem._fetchedAt) < 2*24*60*60*1000) return _histMem;
    var raw=sessionStorage.getItem(k)||localStorage.getItem(k);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(!o||!o.t||!o.data) return null;
    if(Date.now()-o.t > 2*24*60*60*1000) return null;
    _histMem=o.data; if(_histMem) _histMem._fetchedAt=o.t;
    return o.data;
  }catch(e){ return null; }
}
function writeHistCache(uid, data){
  try{
    var k=histCacheKey(uid); if(!k||!data) return;
    data._fetchedAt=Date.now();
    _histMem=data;
    var payload=JSON.stringify({t:Date.now(),data:data});
    try{ sessionStorage.setItem(k,payload); }catch(e1){}
    try{ localStorage.setItem(k,payload); }catch(e2){}
  }catch(e){}
}
function invalidateHistCache(uid){
  _histMem=null;
  try{
    var k=histCacheKey(uid);
    if(k){ sessionStorage.removeItem(k); localStorage.removeItem(k); }
  }catch(e){}
}

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}});

var _histRt=null,_histRtT=null;
function startHistoryRealtime(sbClient, userId){
  if(!sbClient||!userId||_histRt) return;
  function bump(){
    if(_histRtT) clearTimeout(_histRtT);
    _histRtT=setTimeout(function(){
      try{ invalidateHistCache(userId); init(); }catch(e){}
    }, 500);
  }
  try{
    _histRt=sbClient.channel('mj-hist-'+userId)
      .on('postgres_changes',{event:'*',schema:'public',table:'number_orders',filter:'user_id=eq.'+userId},bump)
      .subscribe();
  }catch(e){}
}

  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='auth.html';return}
  try{ startHistoryRealtime(sb, session.user.id); }catch(_rt){}
  try {
    const headers = { Authorization: 'Bearer ' + session.access_token };
    await Promise.all([
      fetch('/api/grizzly-sync?action=expire_stale', { headers }).catch(function(){ return null; }),
      fetch('/api/sms-bus?action=expire_stale', { headers }).catch(function(){ return null; }),
      (typeof refreshLiveUsaActive==='function' ? refreshLiveUsaActive(session.access_token) : Promise.resolve())
    ]);
  } catch (_) {
    try { if (typeof refreshLiveUsaActive==='function') await refreshLiveUsaActive(session.access_token); } catch(__){}
  }
  // 2-day cache + incremental: only pull new SMS rows / open statuses (not full table every time)
  try {
    var cached = (typeof readHistCache==='function') ? readHistCache(session.user.id) : null;
    var headers = { Authorization: 'Bearer ' + session.access_token, Accept: 'application/json' };
    var maxCreated = 0;
    if (cached && Array.isArray(cached)) {
      for (var ci = 0; ci < cached.length; ci++) {
        var ct = new Date(cached[ci] && cached[ci].created_at || 0).getTime();
        if (ct > maxCreated) maxCreated = ct;
      }
    }
    var url = '/api/order?action=my_orders';
    if (cached && cached.length && maxCreated) {
      url += '&since=' + encodeURIComponent(new Date(maxCreated).toISOString());
    } else {
      url += '&full=1';
    }
    const res = await fetch(url, { headers: headers });
    const json = await res.json().catch(function () { return {}; });
    if (res.ok && json && json.success && Array.isArray(json.sms)) {
      var sms = json.sms;
      if (json.incremental && cached && cached.length) {
        var map = new Map();
        cached.forEach(function (r) {
          var k = String((r && (r.id || r.order_id)) || '');
          if (k) map.set(k, r);
        });
        sms.forEach(function (r) {
          var k = String((r && (r.id || r.order_id)) || '');
          if (k) map.set(k, Object.assign({}, map.get(k) || {}, r));
        });
        // Drop terminal rows that are no longer in open set if we got open status updates:
        // keep all merged; UI filters Active separately
        allOrders = Array.from(map.values()).sort(function (a, b) {
          return new Date(b.created_at || 0) - new Date(a.created_at || 0);
        });
      } else {
        allOrders = sms;
      }
      try { if (typeof writeHistCache === 'function') writeHistCache(session.user.id, allOrders); } catch (_w) {}
      updateHistCta();
      render();
      try {
        if (typeof enrichPastRentSms==='function') {
          await enrichPastRentSms(session.access_token);
          render();
        }
      } catch (_e) {}
      return;
    }
    // If incremental failed but we have cache, show cache
    if (cached && cached.length) {
      allOrders = cached;
      updateHistCta();
      render();
      try {
        if (typeof enrichPastRentSms==='function') {
          await enrichPastRentSms(session.access_token);
          render();
        }
      } catch (_e) {}
      return;
    }
  } catch (e) { console.warn('history api', e); }
  const {data,error}=await sb.from('number_orders').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(200);
  if(error){listEl.innerHTML='<div class="empty">Failed to load</div>';return}
  allOrders=data||[];
  try { if (typeof writeHistCache==='function') writeHistCache(session.user.id, allOrders); } catch(_w2){}
  updateHistCta();render();
  // After list is on screen, force-check past USA rentals for inbox SMS → Completed filter
  try {
    if (typeof enrichPastRentSms==='function') {
      await enrichPastRentSms(session.access_token);
      updateHistCta();
      render();
    }
  } catch (_en) {}
}

init();
</script>
