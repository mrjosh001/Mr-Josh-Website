<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Number History · MJ HUB</title>
<script>
(function(){try{var t=localStorage.getItem('mjhub-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<script src="/js/mj-page-loader.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var a=Date.prototype.toLocaleString,b=Date.prototype.toLocaleDateString,c=Date.prototype.toLocaleTimeString;
  function L(o){return Object.assign({timeZone:'Africa/Lagos'},o||{});}
  Date.prototype.toLocaleString=function(l,o){return a.call(this,l||'en-NG',L(o));};
  Date.prototype.toLocaleDateString=function(l,o){return b.call(this,l||'en-NG',L(o));};
  Date.prototype.toLocaleTimeString=function(l,o){return c.call(this,l||'en-NG',L(o));};
})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{--bg:#06080f;--card:#0f1524;--border:rgba(148,163,184,.12);--text:#f8fafc;--text2:#cbd5e1;--muted:#94a3b8;--primary:#3b82f6;--ok:#34d399;--bad:#f87171;--chip:#131b2e;--shadow:0 12px 40px rgba(0,0,0,.4)}
:root[data-theme="light"]{--bg:#f4f6fb;--card:#fff;--border:rgba(15,23,42,.08);--text:#0f172a;--text2:#334155;--muted:#64748b;--primary:#2563eb;--ok:#059669;--bad:#dc2626;--chip:#f1f5f9;--shadow:0 10px 28px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.shell{max-width:560px;margin:0 auto;padding:0 16px 64px}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 0;position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px)}
.btn-icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.topbar h1{font-size:18px;font-weight:800}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);font:700 13px inherit;cursor:pointer}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.chip{flex-shrink:0;border:1px solid var(--border);background:var(--chip);color:var(--text2);font:700 12px inherit;padding:10px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act a,.act button{flex:1;min-width:120px;text-align:center;padding:10px 12px;border-radius:12px;font:700 12px inherit;text-decoration:none;border:none;cursor:pointer}
.act a{background:rgba(59,130,246,.15);color:var(--primary)}
.btn-reuse{background:linear-gradient(135deg,#0d9488,#0891b2)!important;color:#fff!important}
.reuse-hint{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}

.card-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.name{font-size:15px;font-weight:800}
.price{font-weight:800;color:var(--primary)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.pill.ok{background:rgba(52,211,153,.15);color:var(--ok)}
.pill.wait{background:rgba(59,130,246,.15);color:var(--primary)}
.pill.bad{background:rgba(248,113,113,.15);color:var(--bad)}
.pill.muted{background:var(--chip);color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin:6px 0}
.row .l{color:var(--muted);font-weight:600}
.row .v{font-weight:700;text-align:right;word-break:break-all}
.act{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.act a,.act button{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#fff;background:var(--primary);border:none;text-decoration:none;padding:10px 14px;border-radius:12px;cursor:pointer}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:14px}
.section-title{font-size:13px;font-weight:800;color:var(--muted);margin:8px 0 10px;text-transform:uppercase;letter-spacing:.04em}
</style>
<link rel="stylesheet" href="/css/mj-motion.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="btn-icon" href="mj-sms-choose-server.html"><i class="fa-solid fa-arrow-left"></i></a>
    <h1>Number history</h1>
  </header>
  <div class="tabs">
    <button type="button" class="tab on" data-view="otp">OTP numbers</button>
    <button type="button" class="tab" data-view="rent">Rented numbers</button>
  </div>
  <div id="otpFilters" class="filters">
    <button type="button" class="chip on" data-filter="all">All</button>
    <button type="button" class="chip" data-filter="completed">Completed</button>
    <button type="button" class="chip" data-filter="cancelled">Cancelled</button>
    <button type="button" class="chip" data-filter="waiting">Waiting</button>
  </div>
  <div style="display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap;align-items:center">
    <input id="histSearch" type="search" placeholder="Search number, country, order id…" style="flex:1;min-width:160px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:600 13px inherit">
    <a id="histPrimaryCta" href="mj-sms-choose-server.html" style="padding:10px 14px;border-radius:12px;background:var(--primary,#3b82f6);color:#fff;font:800 12px inherit;text-decoration:none;white-space:nowrap">Get OTP</a>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
const SUPABASE_URL='https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const listEl=document.getElementById('list');
let allOrders=[], view='otp', filter='all';
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function money(n){return '₦'+Number(n||0).toLocaleString()}
function bucket(status){const s=String(status||'').toLowerCase();if(s==='completed'||s==='success')return'completed';if(s==='expired')return'expired';if(s==='refunded'||s==='cancelled'||s==='canceled')return'cancelled';if(s==='waiting_for_code'||s==='pending'||s==='waiting')return'waiting';return'other'}
function isRent(o){return String(o.source||'')==='smsbus_rent'||String(o.service_id||'')==='rent'||/rental/i.test(String(o.service_name||''))}
function serverLabel(o){
  // Customer-facing labels only — never show supplier names
  const src=String(o.source||'').toLowerCase();
  if(src==='smsbus_rent'||src.indexOf('rent')>=0) return 'Rental';
  if(src==='smsbus'||src==='logsdomain') return 'Server 2';
  return 'Server 1';
}
function updateHistCta(){
  var a=document.getElementById('histPrimaryCta');
  if(!a) return;
  if(view==='rent'){
    a.href='mj-sms-rent.html';
    a.textContent='+ Rent a Number';
  } else {
    a.href='mj-sms-choose-server.html';
    a.textContent='Get OTP';
  }
}
function matchesSearch(o){
  var q=(document.getElementById('histSearch')&&document.getElementById('histSearch').value||'').trim().toLowerCase();
  if(!q) return true;
  var blob=[o.phone_number,o.country_name,o.service_name,o.order_id,o.status].join(' ').toLowerCase();
  return blob.indexOf(q)!==-1;
}
function render(){
  let rows=allOrders.filter(function(o){return matchesSearch(o)&&(view==='rent'?isRent(o):!isRent(o))});
  if(view==='otp'&&filter!=='all')rows=rows.filter(function(o){return bucket(o.status)===filter});
  if(!rows.length){
    listEl.innerHTML='<div class="empty">'+(view==='rent'?'No rented numbers yet. Use + Rent a Number to get one.':'No OTP numbers yet. Tap Get OTP to choose a server.')+'</div>';
    return;
  }
  listEl.innerHTML=rows.map(function(o){
    const name=(o.service_name||o.service||'SMS').replace(/_/g,' ');
    const date=o.created_at?new Date(o.created_at).toLocaleString():'—';
    const b=bucket(o.status);
    const pillCls=b==='completed'?'ok':b==='waiting'?'wait':b==='cancelled'?'bad':'muted';
    const statusLabel=b==='completed'?(isRent(o)?'Active / completed':'Code received'):b==='waiting'?'Waiting for code':b==='expired'?'Expired':b==='cancelled'?'Cancelled':'—';
    let action='';
    const src=String(o.source||'').toLowerCase();
    const isS2=src==='smsbus'||src==='sms-bus';
    if(!isRent(o)&&String(o.status)==='waiting_for_code'){
      const page=isS2?'mj-sms3-number.html':'mj-sms-number.html';
      action='<div class="act"><a href="'+page+'?order_id='+encodeURIComponent(o.order_id||'')+'">Verify SMS</a></div>';
    }
    // Server 2 only: Reuse for 20 minutes after code received (SMS-Bus rule)
    const REUSE_MS=20*60*1000;
    if(!isRent(o)&&isS2&&b==='completed'&&o.code&&(o.is_reusable===true||o.is_reusable===1||o.is_reusable==='true')){
      const doneAt=new Date(o.updated_at||o.completed_at||o.created_at||0).getTime();
      const left=doneAt? (doneAt+REUSE_MS-Date.now()) : 0;
      if(left>0&&o.country_id!=null&&o.service_id&&o.phone_number){
        const mins=Math.max(1,Math.ceil(left/60000));
        action=
          '<div class="act">'+
            '<button type="button" class="btn-reuse" data-reuse="1" '+
              'data-country="'+esc(String(o.country_id))+'" '+
              'data-service="'+esc(String(o.service_id))+'" '+
              'data-phone="'+esc(String(o.phone_number).replace(/\D/g,''))+'" '+
              'data-cname="'+esc(o.country_name||'')+'" '+
              'data-sname="'+esc(o.service_name||'')+'">'+
              'Reuse number</button>'+
          '</div>'+
          '<div class="reuse-hint">Same number · about '+mins+' min left to reuse</div>';
      }
    }
    const expire=(isRent(o)&&o.code)?('<div class="row"><span class="l">Expires</span><span class="v">'+esc(o.code)+'</span></div>'):'';
    return '<div class="card"><div class="card-head"><div class="name">'+esc(name)+'</div><div class="price">'+money(o.price)+'</div></div>'+
      '<div class="pills"><span class="pill '+pillCls+'">'+statusLabel+'</span><span class="pill muted">'+esc(serverLabel(o))+'</span></div>'+
      '<div class="row"><span class="l">Country</span><span class="v">'+esc(o.country_name||'—')+'</span></div>'+
      '<div class="row"><span class="l">Number</span><span class="v">'+esc(o.phone_number||'—')+'</span></div>'+
      (isRent(o)?'':('<div class="row"><span class="l">Code</span><span class="v">'+(o.code?esc(o.code):'—')+'</span></div>'))+
      expire+
      '<div class="row"><span class="l">Date</span><span class="v">'+esc(date)+'</span></div>'+
      '<div class="row"><span class="l">Order ID</span><span class="v" style="font-size:11px">'+esc(o.order_id||'—')+'</span></div>'+
      action+'</div>';
  }).join('');
}
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    view=t.getAttribute('data-view');
    document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===t)});
    document.getElementById('otpFilters').style.display=view==='otp'?'flex':'none';
    updateHistCta();
    render();
  };
});
document.getElementById('otpFilters').onclick=function(e){
  const c=e.target.closest('.chip');if(!c)return;
  filter=c.getAttribute('data-filter')||'all';
  document.querySelectorAll('#otpFilters .chip').forEach(function(x){x.classList.toggle('on',x===c)});
  render();
};
document.getElementById('histSearch').addEventListener('input',function(){render()});

let reusing=false;
async function reuseNumber(btn){
  if(reusing||!btn) return;
  reusing=true;
  const prev=btn.textContent;
  btn.disabled=true;
  btn.textContent='Reusing…';
  try{
    const session=(await window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}}).auth.getSession()).data.session;
    if(!session){location.href='auth.html';return}
    const res=await fetch('/api/sms-bus?action=reuse',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body:JSON.stringify({
        country_id:btn.getAttribute('data-country'),
        project_id:btn.getAttribute('data-service'),
        mobile_number:btn.getAttribute('data-phone'),
        country_name:btn.getAttribute('data-cname')||'',
        service_name:btn.getAttribute('data-sname')||''
      })
    });
    const j=await res.json().catch(function(){return {}});
    if(!res.ok||!j.success||!j.data||!j.data.order_id){
      throw new Error((j&&j.message)||'Could not reuse this number');
    }
    const d=j.data;
    const num=d.number||d.phone_number||btn.getAttribute('data-phone')||'';
    try{
      const payload={order_id:d.order_id,number:num,phone_number:num,price:d.price,service_name:d.service_name,country_name:d.country_name,ts:Date.now()};
      sessionStorage.setItem('mj_sms3_last_order',JSON.stringify(payload));
      localStorage.setItem('mj_sms3_last_order',JSON.stringify(payload));
    }catch(_){}
    const q=new URLSearchParams({order_id:String(d.order_id)});
    if(num) q.set('number',num);
    if(d.service_name) q.set('service_name',d.service_name);
    if(d.country_name) q.set('country_name',d.country_name);
    if(d.price!=null) q.set('price',String(d.price));
    location.href='mj-sms3-number.html?'+q.toString();
  }catch(e){
    alert(e.message||'Reuse failed');
    btn.disabled=false;
    btn.textContent=prev;
    reusing=false;
  }
}
document.getElementById('list').addEventListener('click',function(e){
  const btn=e.target.closest('[data-reuse]');
  if(btn) reuseNumber(btn);
});

async function init(){
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}});
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='auth.html';return}
  // Expire past-window OTP on both servers before showing history
  try {
    const headers = { Authorization: 'Bearer ' + session.access_token };
    await Promise.all([
      fetch('/api/grizzly-sync?action=expire_stale', { headers }).catch(function(){ return null; }),
      fetch('/api/sms-bus?action=expire_stale', { headers }).catch(function(){ return null; })
    ]);
  } catch (_) {}
  try{
    const res=await fetch('/api/order?action=my_orders',{headers:{Authorization:'Bearer '+session.access_token,Accept:'application/json'}});
    const json=await res.json().catch(function(){return {}});
    if(res.ok&&json&&json.success&&Array.isArray(json.sms)){
      allOrders=json.sms;updateHistCta();render();return;
    }
  }catch(e){console.warn('history api',e)}
  const {data,error}=await sb.from('number_orders').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false});
  if(error){listEl.innerHTML='<div class="empty">Failed to load</div>';return}
  allOrders=data||[];updateHistCta();render();
}
init();
</script>
</body>
</html>
