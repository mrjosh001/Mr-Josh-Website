async function authCall(promise,ms=7000){
  let timer;try{return await Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('Sign-in check timed out')),ms)})])}
  finally{clearTimeout(timer)}
}
async function getToken(){
  if(!sb)throw new Error('Secure sign-in service did not load. Check your connection and try again.');
  try{
    const {data,error}=await authCall(sb.auth.getSession());
    if(!error&&data.session?.access_token){token=data.session.access_token;return token}

  try{
    const {data,error}=await authCall(sb.auth.refreshSession(),7000);

}

async function api(action,method='GET',data){

function formatCountdown(ms){if(!Number.isFinite(ms)||ms<=0)return '00:00';const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updateCancelTimers(){
  const now=Date.now();
  document.querySelectorAll('[data-refund-timer]').forEach(el=>{
    const available=Date.parse(el.dataset.available),expires=Date.parse(el.dataset.expires),btn=el.closest('[data-refund]');
    if(!btn)return;
    if(!Number.isFinite(available)||!Number.isFinite(expires)){btn.disabled=true;el.textContent='Timer unavailable';return}
    if(now>=expires){btn.disabled=true;el.textContent='Expired';return}

    btn.disabled=false;el.textContent='Refund';
  });

function ago(d){const s=Math.max(1,Math.round((Date.now()-new Date(d))/1000));
  if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hr ago';
  return new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function detectCode(m){
  const source=String(m||'');
  if(!source.trim())return '';
  const doc=new DOMParser().parseFromString(source,'text/html');
  doc.querySelectorAll('script,style,noscript,template,head,svg,iframe').forEach(n=>n.remove());
  const text=(doc.body?.textContent||source.replace(/<[^>]*>/g,' ')).replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\r/g,'\n');
  const candidates=[...text.matchAll(/(?<![\d])\d{4,8}(?![\d])/g)].map(x=>({code:x[0],index:x.index}));
  if(!candidates.length)return '';
  const scored=candidates.map(c=>{let score=0;const left=text.slice(Math.max(0,c.index-120),c.index).toLowerCase();const right=text.slice(c.index,c.index+80).toLowerCase();
    if(/(?:enter|input|type|use|submit)\s+(?:this\s+)?(?:the\s+)?code[^\n.]{0,90}$/.test(left))score+=120;
    if(/(?:verification|security|one[- ]time|login|sign[- ]in|authentication)\s+(?:code|otp)?[^\n.]{0,90}$/.test(left))score+=100;
    if(/(?:^|\b)(?:code|otp)\b[^\n.]{0,90}$/.test(left))score+=80;
    if(/^\s*(?:is|:|-)?\s*$/.test(right))score+=5;
    if(/^(.)\1+$/.test(c.code))score-=100;
    return {...c,score};
  }).sort((a,b)=>b.score-a.score||a.index-b.index);
  if(scored[0].score>0)return scored[0].code;
  return candidates.length===1?candidates[0].code:'';
}

  const source=String(raw||'');
  const parsed=new DOMParser().parseFromString(/<[a-z][\\s\\S]*>/i.test(source)?source:'<pre>'+esc(source)+'</pre>','text/html');
  parsed.querySelectorAll('script,iframe,frame,frameset,object,embed,form,input,button,textarea,select,video,audio,svg,math,portal,template').forEach(n=>n.remove());
  parsed.querySelectorAll('meta[http-equiv],base').forEach(n=>n.remove());
  parsed.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(attr=>{
      const name=attr.name.toLowerCase(),value=attr.value.trim();
      if(name.startsWith('on')||name==='srcdoc'||name==='formaction')el.removeAttribute(attr.name);
      if(['href','src','xlink:href','background','poster'].includes(name)&&/^(?:javascript|vbscript|file):/i.test(value))el.removeAttribute(attr.name);
    });
    if(el.tagName==='A'){
      const href=el.getAttribute('href')||'';
      if(!/^(https?:|mailto:)/i.test(href))el.removeAttribute('href');
      else {el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer');}
    }
    if(el.tagName==='IMG'){
      const src=el.getAttribute('src')||'';
      if(!/^(https?:|data:image\\/(?:png|gif|jpe?g|webp);base64,)/i.test(src))el.removeAttribute('src');
      el.setAttribute('loading','lazy');el.setAttribute('referrerpolicy','no-referrer');
    }
  });
  let head=parsed.head;
  if(!head){head=parsed.createElement('head');parsed.documentElement.insertBefore(head,parsed.body||null);}
  const csp=parsed.createElement('meta');
  csp.setAttribute('http-equiv','Content-Security-Policy');
  csp.setAttribute('content',"default-src https: data:; img-src https: data:; style-src 'unsafe-inline' https:; font-src https: data:; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'");
  head.insertBefore(csp,head.firstChild);
  const viewport=parsed.createElement('meta');viewport.name='viewport';viewport.content='width=device-width,initial-scale=1';head.appendChild(viewport);
  const frameStyle=parsed.createElement('style');
  frameStyle.textContent='html{margin:0!important;padding:0!important}body{max-width:100%!important;overflow-wrap:anywhere!important}img{max-width:100%!important;height:auto!important}table{max-width:100%!important}pre{white-space:pre-wrap;overflow-wrap:anywhere}';
  head.appendChild(frameStyle);
  return '<!doctype html>'+parsed.documentElement.outerHTML;
}
function renderEmailMessages(){
  document.querySelectorAll('[data-message]').forEach(el=>{
    if(el.dataset.rendered==='true')return;
    const iframe=document.createElement('iframe');
    iframe.className='mm-original-email-frame';
    iframe.title='Original email content';
    iframe.setAttribute('sandbox','allow-same-origin allow-popups');
    iframe.setAttribute('loading','lazy');
    iframe.setAttribute('referrerpolicy','no-referrer');
    iframe.setAttribute('scrolling','auto');
    iframe.style.cssText='display:block;width:100%;height:320px;min-height:220px;border:0;background:#fff;border-radius:8px';
    iframe.srcdoc=prepareEmailDocument(el.dataset.message||'');
    iframe.addEventListener('load',()=>{
      try{
        const doc=iframe.contentDocument;
        const fit=()=>{const h=Math.max(220,Math.min(900,Math.max(doc.documentElement.scrollHeight,doc.body?.scrollHeight||0)+8));iframe.style.height=h+'px'};
        fit();
        doc.querySelectorAll('img').forEach(img=>img.addEventListener('load',fit,{once:true}));
        doc.fonts?.ready?.then(fit).catch(()=>{});
      }catch(_){}
    });
    el.replaceChildren(iframe);el.dataset.rendered='true';
  });
}
function messagePreview(raw){
  if(!raw)return 'No message received yet';
  const doc=new DOMParser().parseFromString(String(raw),'text/html');
  return (doc.body.textContent||String(raw).replace(/<[^>]*>/g,' ')).replace(/\s+/g,' ').trim().slice(0,150)||'Email message received';
}
function messageSubject(raw){
  if(!raw)return 'Waiting for incoming email';
  const doc=new DOMParser().parseFromString(String(raw),'text/html');
  return (doc.querySelector('title')?.textContent||doc.querySelector('h1,h2,h3')?.textContent||'Email message').trim().slice(0,90);
}
async function copy(text){try{await navigator.clipboard.writeText(text)}catch(_){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(__){}t.remove()}toast('Copied ✓')}

/* ---------- sheet ---------- */
let sheetBusy=false;
function openSheet({title,html,yes,onYes}){
  $('shT').textContent=title;$('shB').innerHTML=html;$('shErr').textContent='';$('shYes').textContent=yes;$('shYes').classList.remove('loading');
  $('ov').hidden=false;sheetBusy=false;
  $('shYes').onclick=async()=>{if(sheetBusy)return;sheetBusy=true;$('shYes').classList.add('loading');
    try{await onYes();sheetBusy=false;$('ov').hidden=true}catch(e){$('shErr').textContent=e.message;$('shYes').classList.remove('loading');sheetBusy=false}};
  $('shNo').onclick=()=>{if(!sheetBusy)$('ov').hidden=true}}
$('ov').addEventListener('click',e=>{if(e.target===$('ov')&&!sheetBusy)$('ov').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheetBusy)$('ov').hidden=true});

/* ---------- render ---------- */
function isClosedOrder(o){return ['cancelled','canceled','expired','refunded','failed'].includes(String(o.status||'').toLowerCase())||(o.expires_at&&Number.isFinite(Date.parse(o.expires_at))&&Date.now()>=Date.parse(o.expires_at))}
function visible(){const g=GROUPS[filter];const q=query.trim().toLowerCase();
  return rows.filter(o=>(filter==='closed'?isClosedOrder(o):filter==='active'?!isClosedOrder(o)&&g.includes(o.status):g.includes(o.status))&&(!q||[o.email,o.site,o.domain,messageSubject(o.message),messagePreview(o.message)].join(' ').toLowerCase().includes(q)))}
function drawTabs(){$('tabs').innerHTML=Object.keys(LABELS).map(k=>{const n=GROUPS[k]?rows.filter(o=>k==='closed'?isClosedOrder(o):k==='active'?!isClosedOrder(o)&&GROUPS[k].includes(o.status):GROUPS[k].includes(o.status)).length:rows.length;
  return '<button class="tab'+(k===filter?' on':'')+'" data-f="'+k+'">'+LABELS[k]+'<i>'+n+'</i></button>'}).join('');
  $('tabs').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;draw()})}
function card(o,flash){
  const st=STATUS[o.status]||[String(o.status||'').replace(/_/g,' '),'mute'];
  const code=detectCode(o.message)||o.value||'';const waiting=o.status==='waiting';
  const closedStatus=isClosedOrder(o);
  const refundAvailable=o.refund_available_at?Date.parse(o.refund_available_at):NaN;
  const mailExpires=o.expires_at?Date.parse(o.expires_at):NaN;
  const canRetryRefund=o.status==='cancel_pending_refund';
  const sender=esc(o.site||'Incoming message');
  const subject=esc(messageSubject(o.message));
  const preview=esc(messagePreview(o.message));
  const initials=esc((o.site||'M').replace(/^https?:\/\//,'').replace(/^www\./,'').slice(0,1).toUpperCase());
  return '<article class="order mm-inbox-card'+(flash?' flash':'')+'" data-id="'+esc(o.id)+'">'+
   '<div class="mm-inbox-card-head"><div class="mm-avatar">'+initials+'</div><div class="mm-inbox-main"><div class="mm-inbox-sender">'+sender+'</div><div class="mm-inbox-subject">'+subject+'</div><div class="mm-inbox-preview">'+preview+'</div></div><div class="mm-inbox-side"><span class="mm-inbox-time">'+ago(o.created_at)+'</span><span class="status '+st[1]+'">'+esc(st[0])+'</span></div></div>'+
   '<div class="mm-address-row"><div class="mm-address-label">TO</div><div class="email">'+esc(o.email||'Email address pending')+'</div>'+(o.email?'<button class="copy" data-copy="'+esc(o.email)+'">Copy</button>':'')+'</div>'+
   '<div class="muted o-sub mm-order-meta">'+esc(o.site)+' · '+esc(o.domain)+' · '+money(o.price)+(o.reused_from_order_id?' · Reused address':'')+'</div>'+
   (code?'<div class="codebox"><div class="lbl">'+(o.value?'Verification code':'Code found in message')+'</div><div class="copyrow"><div class="code">'+esc(code)+'</div><button class="copy" data-copy="'+esc(code)+'">Copy code</button></div></div>':'')+
   (waiting&&!code?'<div class="waitline"><span class="dot"></span>Waiting for your verification email</div><div class="pulse-bar"></div>':'')+
   (waiting&&Number.isFinite(mailExpires)?'<div class="mail-expiry">Email rental expires in <strong data-mail-timer data-expires="'+esc(o.expires_at)+'">'+formatCountdown(mailExpires-Date.now())+'</strong> <span>· 20-minute total rental</span></div>':'')+
   (o.status==='reconciliation_required'?'<p class="muted" style="margin:12px 0 0">We are confirming your email rental. Please do not retry while this is being checked.</p>':'')+
   (o.message?'<details class="msg" data-d="'+esc(o.id)+'"'+(openIds.has(o.id)?' open':'')+'><summary><span>Open email</span><small>View full message</small></summary><div class="body" data-message="'+esc(o.message)+'"></div></details>':'')+
   '<div class="actions">'+(!closedStatus&&(o.can_refresh||o.status!=='reconciliation_required')?'<button class="btn sm" data-refresh="'+esc(o.id)+'">↻ Check inbox</button>':'')+
   (waiting?'<button class="btn sm refund-btn" data-refund="'+esc(o.id)+'" '+((!Number.isFinite(refundAvailable)||!Number.isFinite(mailExpires)||Date.now()<refundAvailable||Date.now()>=mailExpires)?'disabled':'')+'><span data-refund-timer data-available="'+esc(o.refund_available_at||'')+'" data-expires="'+esc(o.expires_at||'')+'">'+(!Number.isFinite(refundAvailable)||!Number.isFinite(mailExpires)?'Timer unavailable':Date.now()<refundAvailable?'Available in '+formatCountdown(refundAvailable-Date.now()):Date.now()>=mailExpires?'Expired':'Refund')+'</span></button>':canRetryRefund?'<button class="btn sm refund-btn" data-refund="'+esc(o.id)+'">Retry refund</button>':'')+
   (o.can_reuse?'<button class="btn sm reuse-btn" data-reuse="'+esc(o.id)+'">Reuse this address</button>':'')+'</div></article>';
}
function draw(flashId){
  drawTabs();const list=visible();
  const waiting=rows.some(o=>['waiting','cancel_pending_refund'].includes(o.status)||(o.status==='completed'&&!o.message&&!o.value));$('live').hidden=!waiting;
  if(!rows.length){$('orders').innerHTML='<div class="empty card"><span class="ico">📬</span><b>Your inbox is empty</b><br>Messages from your rented email activations will appear here automatically.</div>';return}
  if(!list.length){$('orders').innerHTML='<div class="empty card"><span class="ico">🔎</span><b>Nothing here</b><br>No orders match this filter or search.</div>';return}
  $('orders').innerHTML=list.map(o=>card(o,o.id===flashId)).join('');
  renderEmailMessages();
  $('orders').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  $('orders').querySelectorAll('[data-refresh]').forEach(b=>b.onclick=()=>refresh(b.dataset.refresh,b));
  $('orders').querySelectorAll('[data-refund]').forEach(b=>b.onclick=()=>askRefund(b.dataset.refund));$('orders').querySelectorAll('[data-reuse]').forEach(b=>b.onclick=()=>askReuse(b.dataset.reuse));updateCancelTimers();
  $('orders').querySelectorAll('details[data-d]').forEach(d=>d.addEventListener('toggle',()=>{d.open?openIds.add(d.dataset.d):openIds.delete(d.dataset.d)}))}

/* ---------- data ---------- */
async function load(manual){
  const started=Date.now();
  try{
    if(!ordersLoaded&&!rows.length){
      $('live').hidden=true;
      $('orders').innerHTML='<div class="mm-skeleton-card"><div class="mm-skeleton-line wide"></div><div class="mm-skeleton-line short"></div><div class="mm-skeleton-line medium"></div></div><div class="mm-skeleton-card"><div class="mm-skeleton-line wide"></div><div class="mm-skeleton-line short"></div><div class="mm-skeleton-line medium"></div></div>';
    }
    await getToken();
    if(!token){$('signin').hidden=false;rows=[];$('orders').innerHTML='<div class="empty card"><b>Sign in to view your inbox</b><br><a class="btn sm" href="/auth.html">Sign in</a></div>';return}
    $('signin').hidden=true;
    const out=await api('orders');rows=Array.isArray(out.orders)?out.orders:[];ordersLoaded=true;
    $('notice').textContent=rows.length?rows.length+' email order'+(rows.length>1?'s':''):'';
    draw();
    schedulePoll();
  }catch(e){
    $('live').hidden=true;
    $('notice').textContent='';
    $('orders').innerHTML='<div class="empty card"><span class="ico">⚠️</span><b>Could not load your inbox</b><br><span>'+esc(e.message||'A connection error occurred.')+'</span><br><button class="btn sm" type="button" id="inboxRetry">Try again</button></div>';
    $('inboxRetry')?.addEventListener('click',()=>load(true));
  }finally{ordersLoaded=true}
}
function merge(order,announce){
  const i=rows.findIndex(r=>r.id===order.id);if(i<0)return;
  const before=rows[i];rows[i]=order;
  const gotNew=(order.message&&order.message!==before.message)||(order.value&&order.value!==before.value);
  if(gotNew&&announce){toast('New message for '+(order.email||'your email')+' 📩');try{navigator.vibrate&&navigator.vibrate(120)}catch(_){}}
  return gotNew?order.id:null}
async function refresh(id,btn){
  if(busy.has(id))return;busy.add(id);btn&&btn.classList.add('loading');
  try{const out=await api('refresh','POST',{id});const flash=merge(out.order,false);toast(out.refunded?'No message received. Your wallet has been refunded ✓':(flash?'Message received ✓':'No new message yet'));draw(flash)}
  catch(e){toast(e.message)}finally{busy.delete(id);btn&&btn.classList.remove('loading')}}
function askReuse(id){
  const o=rows.find(r=>r.id===id);if(!o||!o.can_reuse)return;
  const requestId=crypto.randomUUID();
  openSheet({title:'Reuse this email address?',yes:'Reuse · '+money(o.price),
    html:'<div class="rows"><div><span>Email address</span><b style="overflow-wrap:anywhere">'+esc(o.email)+'</b></div><div><span>Service</span><b>'+esc(o.site)+'</b></div><div><span>New activation</span><b>'+money(o.price)+'</b></div></div><p class="muted" style="margin:0">MJ HUB will ask the email provider to reopen this same address for a new activation. This is a new paid activation. Your previous email and order history will remain unchanged.</p>',
    onYes:async()=>{
      const out=await api('reuse','POST',{id,request_id:requestId,expected_price:o.price});
      sheetBusy=false;$('ov').hidden=true;
      toast(out.pending?out.message:'Same email reused ✓');
      await load();
    }});
}
function askRefund(id){
  const o=rows.find(r=>r.id===id);if(!o)return;
  openSheet({title:o.status==='cancel_pending_refund'?'Retry your refund?':'Request email refund?',yes:o.status==='cancel_pending_refund'?'Retry refund':'Refund',
    html:'<div class="rows"><div><span>Email</span><b style="overflow-wrap:anywhere">'+esc(o.email||'Pending')+'</b></div><div><span>Refund amount</span><b>'+money(o.price)+'</b></div></div><p class="muted" style="margin:0">MJ HUB will request cancellation and verify the final status before issuing a refund. Your wallet is refunded only after that confirmation. Refund requests become available after 2 minutes and before the 20-minute rental expires.</p>',
    onYes:async()=>{const out=await api('cancel','POST',{id});toast(out.message||'Supplier cancellation confirmed · wallet refunded');await load()}})}
/* ---------- auto-check waiting orders ---------- */
function hasPendingMail(){return rows.some(o=>{const s=String(o.status||'').toLowerCase();return !o.refunded&&!o.message&&!o.value&&(['waiting','cancel_pending_refund'].includes(s)||(s==='completed'&&!!o.expires_at))&&!busy.has(o.id)})}
function schedulePoll(delay){clearTimeout(pollTimer);pollTimer=null;if(document.hidden||!token||!hasPendingMail())return;pollTimer=setTimeout(poll,delay==null?POLL_MS:delay)}
async function poll(){
  pollTimer=null;
  if(polling||document.hidden||!token||!hasPendingMail())return;
  const waiting=rows.filter(o=>{const s=String(o.status||'').toLowerCase();return !o.refunded&&!o.message&&!o.value&&(['waiting','cancel_pending_refund'].includes(s)||(s==='completed'&&!!o.expires_at))&&!busy.has(o.id)})
    .sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0));
  if(!waiting.length)return;
  const index=pollCursor%waiting.length;pollCursor=(pollCursor+1)%Math.max(waiting.length,1);const order=waiting[index];
  polling=true;try{const out=await api('refresh','POST',{id:order.id});const flash=merge(out.order,true);draw(flash)}catch(_){}finally{polling=false;schedulePoll(POLL_MS)}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(pollTimer);pollTimer=null}else schedulePoll(800)});

/* ---------- init ---------- */
let qt;$('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{query=e.target.value;draw()},150)});
drawTabs();load();

/* Keep the dashboard idle timer accurate while users are in MJ Mails. */
(function(){var key='mjhub-last-activity';function mark(){try{localStorage.setItem(key,String(Date.now()))}catch(e){}}mark();['pointerdown','keydown','touchstart','scroll'].forEach(function(evt){document.addEventListener(evt,mark,{passive:true})});})();
