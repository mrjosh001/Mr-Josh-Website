<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MJ Mails Orders · MJ HUB</title><link rel="stylesheet" href="/css/graceful.css"><link rel="stylesheet" href="/css/mj-motion.css"><script src="/js/mj-theme.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:var(--bg,#080d18);color:var(--text,#f4f7fb);font-family:Inter,system-ui,sans-serif}.wrap{max-width:860px;margin:auto;padding:22px 16px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px}a{color:var(--primary,#60a5fa);text-decoration:none}.panel{background:var(--card,#111827);border:1px solid var(--border,#263244);border-radius:18px;padding:17px;margin:12px 0}.order{padding:16px 0;border-bottom:1px solid var(--border,#263244)}.order:last-child{border:0}h1{font-size:27px;margin:8px 0}p,.muted{color:var(--muted,#9ca3af);line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;background:var(--primary,#2563eb);color:white;padding:10px 13px;font-weight:800;cursor:pointer}button.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}button:disabled{opacity:.5}.email{font-weight:900;font-size:18px;overflow-wrap:anywhere}.code{font-size:20px;font-weight:900;color:var(--primary,#60a5fa);overflow-wrap:anywhere}.status{display:inline-block;border:1px solid var(--border);border-radius:99px;padding:4px 9px;font-size:12px;margin:7px 0}.notice{color:var(--muted)}
</style></head><body><main class="wrap">
<header class="top"><a href="/mj-mails.html">← MJ Mails</a><a href="/dashboard.html">MJ HUB</a></header>
<h1>My email orders</h1><p>Check activation status and view received verification messages here.</p>
<section class="panel"><div class="top"><strong>Email inbox</strong><button id="reload" class="secondary">Refresh orders</button></div><div id="notice" class="notice">Loading your orders…</div><div id="orders"></div></section>
<script>
const SUPABASE_URL='https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInR5cCI6MTc4NTA3NTIzOCwiZXhwIjoyMTAwNjUxMjM4fQ.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let token='';
const $=id=>document.getElementById(id);const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{maximumFractionDigits:0});
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(action,method='GET',data){const r=await fetch('/api/mails?action='+action,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw new Error(j.message||'Request failed');return j}
function render(rows){if(!rows.length){$('orders').innerHTML='<p>No email orders yet. <a href="/mj-mails.html">Rent your first email address.</a></p>';return}
$('orders').innerHTML=rows.map(o=>'<article class="order"><div class="top"><div><div class="email">'+esc(o.email||'Email address pending')+'</div><div class="muted">'+esc(o.site)+' · '+esc(o.domain)+'</div></div><span class="status">'+esc(o.status.replaceAll('_',' '))+'</span></div><div class="muted">Order price: '+money(o.price)+' · '+new Date(o.created_at).toLocaleString()+'</div>'+(o.value?'<p><strong>Verification code / value</strong><br><span class="code">'+esc(o.value)+'</span></p>':'')+(o.message?'<p><strong>Message</strong><br>'+esc(o.message)+'</p>':'<p class="muted">No message received yet.</p>')+'<div class="actions"><button data-refresh="'+o.id+'">Check for message</button>'+((o.status==='waiting')?'<button class="secondary" data-cancel="'+o.id+'">Cancel</button>':'')+'</div></article>').join('');
document.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=()=>refresh(b.dataset.refresh,b));document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancel(b.dataset.cancel,b))}
async function load(){try{const s=await sb.auth.getSession();token=s.data.session?.access_token||'';if(!token)throw new Error('Sign in to view your email orders.');const out=await api('orders');render(out.orders||[]);$('notice').textContent=(out.orders||[]).length+' email order(s)'}catch(e){$('notice').textContent=e.message}}
async function refresh(id,b){b.disabled=true;b.textContent='Checking…';try{const out=await api('refresh','POST',{id});$('notice').textContent='Order updated';await load()}catch(e){$('notice').textContent=e.message}finally{b.disabled=false;b.textContent='Check for message'}}
async function cancel(id,b){if(!confirm('Cancel this email activation? A refund is issued only if the provider confirms cancellation.'))return;b.disabled=true;try{await api('cancel','POST',{id});$('notice').textContent='Activation cancelled and refunded';await load()}catch(e){$('notice').textContent=e.message;b.disabled=false}}
$('reload').onclick=load;load();
</script></main></body></html>
