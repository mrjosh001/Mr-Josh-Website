<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>My Orders · MJ Hub</title>
  <meta name="theme-color" content="#0b1220" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/graceful.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/graceful.js" defer></script>
  <style>
    :root {
      --bg:#060a12; --bg2:#0b1220; --card:rgba(15,23,42,.72); --text:#f1f5f9; --muted:#94a3b8;
      --border:rgba(148,163,184,.14); --blue:#3b82f6; --blue2:#2563eb; --blue-soft:rgba(59,130,246,.14);
      --success:#34d399; --danger:#f87171; --shadow:0 16px 40px rgba(0,0,0,.35); --radius:20px;
      --safe-b:env(safe-area-inset-bottom,0px);
    }
    :root[data-theme="light"] {
      --bg:#f1f5f9; --bg2:#e8eef7; --card:rgba(255,255,255,.92); --text:#0f172a; --muted:#64748b;
      --border:rgba(15,23,42,.08); --blue-soft:rgba(37,99,235,.1); --shadow:0 12px 32px rgba(37,99,235,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--text);min-height:100vh;
      background:radial-gradient(900px 400px at 10% -10%,rgba(59,130,246,.22),transparent 55%),
        radial-gradient(700px 360px at 100% 0%,rgba(37,99,235,.12),transparent 50%),var(--bg);
      padding-bottom:calc(88px + var(--safe-b));
    }
    .topbar{
      position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 16px;
      padding-top:max(14px,env(safe-area-inset-top));
      background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
    }
    .back{
      width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
      background:var(--card);border:1px solid var(--border);color:var(--text);text-decoration:none;
    }
    .topbar h1{
      font-size:18px;font-weight:800;letter-spacing:-.02em;
      background:linear-gradient(135deg,#93c5fd,#3b82f6 55%,#1d4ed8);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .topbar p{font-size:12px;color:var(--muted);font-weight:600}
    .wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px}

    /* Type tabs at top */
    .type-tabs{
      display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;
      padding:6px;border-radius:16px;background:var(--card);border:1px solid var(--border);
    }
    .type-tab{
      border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;
      padding:11px 8px;border-radius:12px;background:transparent;color:var(--muted);
      display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s;
    }
    .type-tab i{font-size:15px}
    .type-tab.active{
      background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;
      box-shadow:0 8px 18px rgba(37,99,235,.35);
    }
    .type-tab .count{
      font-size:10px;font-weight:700;opacity:.85;
    }

    .hero{
      border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;
      background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(15,23,42,.5));
      border:1px solid rgba(96,165,250,.25);box-shadow:var(--shadow);
    }
    :root[data-theme="light"] .hero{background:linear-gradient(135deg,#eff6ff,#fff)}
    .hero h2{font-size:17px;font-weight:800}
    .hero .sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}

    .list{display:flex;flex-direction:column;gap:12px}
    .card{
      position:relative;overflow:hidden;
      background:linear-gradient(145deg,rgba(59,130,246,.1),rgba(15,23,42,.45));
      border:1px solid rgba(96,165,250,.22);border-radius:var(--radius);padding:16px;
      box-shadow:var(--shadow);backdrop-filter:blur(12px);
    }
    :root[data-theme="light"] .card{background:linear-gradient(145deg,#fff,#eff6ff);border-color:rgba(59,130,246,.15)}
    .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#60a5fa,#1d4ed8)}
    .row{display:flex;gap:12px;align-items:flex-start}
    .icon{
      width:46px;height:46px;border-radius:14px;flex-shrink:0;
      background:linear-gradient(145deg,#3b82f6,#1d4ed8);color:#fff;
      display:grid;place-items:center;font-weight:800;font-size:16px;
      box-shadow:0 8px 18px rgba(37,99,235,.35);
    }
    .icon.sms{background:linear-gradient(145deg,#06b6d4,#0284c7)}
    .icon.boost{background:linear-gradient(145deg,#a78bfa,#7c3aed)}
    .main{flex:1;min-width:0}
    .title-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .title{font-size:14px;font-weight:800;line-height:1.35}
    .status{
      font-size:10px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;
      background:rgba(52,211,153,.15);color:var(--success);border:1px solid rgba(52,211,153,.28);
    }
    .status.pending{background:rgba(251,191,36,.15);color:#fbbf24;border-color:rgba(251,191,36,.3)}
    .status.failed{background:rgba(248,113,113,.12);color:var(--danger);border-color:rgba(248,113,113,.3)}
    .meta{margin-top:8px;font-size:12px;font-weight:700;color:#93c5fd;display:flex;flex-wrap:wrap;gap:8px 12px}
    :root[data-theme="light"] .meta{color:#2563eb}
    .bottom{margin-top:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
    .price{font-size:17px;font-weight:800}
    .date{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
    .btn-view{
      border:none;cursor:pointer;font-family:inherit;
      background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-weight:700;font-size:12px;
      padding:10px 14px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;
      box-shadow:0 8px 18px rgba(37,99,235,.35);text-decoration:none;
    }
    .empty{text-align:center;padding:44px 18px;border-radius:var(--radius);border:1px dashed var(--border);background:var(--card)}
    .empty .ico{font-size:34px;margin-bottom:10px}
    .empty h3{font-size:16px;font-weight:800;margin-bottom:6px}
    .empty p{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.45}
    .empty a{
      display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#3b82f6,#2563eb);
      color:#fff;text-decoration:none;font-weight:700;padding:11px 16px;border-radius:12px;
    }
    .skeleton{height:108px;border-radius:var(--radius);background:linear-gradient(90deg,rgba(148,163,184,.08),rgba(148,163,184,.16),rgba(148,163,184,.08));background-size:200% 100%;animation:sk 1.2s ease infinite}
    @keyframes sk{to{background-position:-200% 0}}

    .modal{display:none;position:fixed;inset:0;z-index:1000;align-items:flex-end;justify-content:center;background:rgba(2,6,23,.55);backdrop-filter:blur(8px);padding:12px}
    .modal.open{display:flex}
    .sheet{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:#fff;color:#0f172a;border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
    .sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #eef2f7}
    .sheet-h strong{font-size:15px;font-weight:800}
    .sheet-h span{display:block;font-size:12px;color:#64748b;margin-top:2px;font-weight:600}
    .sheet-h button{border:none;background:none;font-size:18px;color:#64748b;cursor:pointer}
    .sheet-b{padding:16px 18px 22px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .actions button,.actions a{flex:1;min-width:100px;text-align:center;text-decoration:none;border:none;border-radius:12px;padding:11px 10px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
    .btn-copy{background:#eff6ff;color:#1d4ed8}
    .btn-dl{background:#f1f5f9;color:#334155}
    .btn-guide{background:#ecfdf5;color:#047857}
    .warn{background:#fff7ed;color:#9a3412;border-radius:12px;padding:12px;font-size:12px;font-weight:600;line-height:1.45;margin-bottom:12px}
    .cred{background:#0f172a;color:#e2e8f0;border-radius:14px;padding:14px;font-size:13px;font-weight:600;white-space:pre-wrap;word-break:break-word;line-height:1.55;font-family:ui-monospace,Menlo,monospace}
    .detail-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    .detail-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 10px;background:#f8fafc;border-radius:10px}
    .detail-row .l{color:#64748b;font-weight:600}
    .detail-row .v{font-weight:700;color:#0f172a;text-align:right;word-break:break-word}
    .toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);z-index:1100;background:#0f172a;color:#fff;border:1px solid rgba(148,163,184,.25);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:var(--shadow);display:none}
    .toast.show{display:block}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;align-items:center;padding:10px 8px calc(10px + var(--safe-b));background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--border)}
    .bottom-nav a{text-decoration:none;color:var(--muted);font-size:10px;font-weight:700;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:56px}
    .bottom-nav a i{font-size:16px}
    .bottom-nav a.active{color:#60a5fa}
    .progress{height:6px;border-radius:99px;background:rgba(148,163,184,.2);overflow:hidden;margin-top:10px}
    .progress>span{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#3b82f6);border-radius:99px}
  
    /* Advanced polish */
    .type-tabs {
      box-shadow: 0 8px 28px rgba(0,0,0,.2);
    }
    .type-tab {
      letter-spacing: 0.02em;
    }
    .type-tab:not(.active):hover {
      color: var(--text);
      background: rgba(59,130,246,.08);
    }
    .hero {
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      right: -20px; top: -30px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(96,165,250,.25), transparent 70%);
      pointer-events: none;
    }
    .card {
      transition: transform .18s ease, border-color .2s, box-shadow .2s;
    }
    .card:active {
      transform: scale(0.992);
    }
    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(59,130,246,.1);
      border: 1px solid rgba(96,165,250,.15);
      font-size: 11px;
    }
    :root[data-theme="light"] .meta span {
      background: rgba(37,99,235,.06);
    }
    .btn-view {
      transition: filter .15s, transform .15s, box-shadow .15s;
    }
    .btn-view:hover {
      filter: brightness(1.08);
      box-shadow: 0 10px 22px rgba(37,99,235,.45);
    }
    .sheet {
      animation: sheetUp .28s ease;
    }
    @keyframes sheetUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .progress {
      box-shadow: inset 0 1px 2px rgba(0,0,0,.2);
    }
    .progress > span {
      box-shadow: 0 0 12px rgba(59,130,246,.45);
      transition: width .4s ease;
    }

  
    /* Log receipt modal — match reference (light, high contrast) */
    .sheet{
      background:#ffffff !important;
      color:#0f172a !important;
      border-radius:24px 24px 0 0;
      max-height:min(88vh,720px);
      overflow:auto;
      box-shadow:0 -12px 40px rgba(15,23,42,.18);
    }
    .sheet-h{
      display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
      padding:18px 18px 12px;border-bottom:1px solid #eef2f7;background:#fff;
      position:sticky;top:0;z-index:2
    }
    .sheet-h strong{
      display:block;font-size:18px;font-weight:800;color:#0f172a !important;
      letter-spacing:-0.02em;line-height:1.25
    }
    .sheet-h span{
      display:block;margin-top:4px;font-size:13px;font-weight:600;color:#64748b !important
    }
    .sheet-h button{
      width:36px;height:36px;border-radius:12px;border:none;background:#f1f5f9;
      color:#0f172a;font-size:16px;cursor:pointer;flex-shrink:0
    }
    .sheet-b{padding:16px 18px 28px;background:#fff;color:#0f172a}

    .sheet-b .log-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    .sheet-b .la-btn{
      flex:1;min-width:96px;border:none;cursor:pointer;font-family:inherit;
      font-weight:700;font-size:13px;padding:12px 12px;border-radius:14px;
      display:inline-flex;align-items:center;justify-content:center;gap:7px;
      text-decoration:none;line-height:1.2
    }
    .sheet-b .la-btn.copy{
      background:#eef2ff;color:#4338ca;border:1px solid #e0e7ff
    }
    .sheet-b .la-btn.dl{
      background:#f1f5f9;color:#334155;border:1px solid #e2e8f0
    }
    .sheet-b .la-btn.guide{
      background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1c1917;
      box-shadow:0 6px 16px rgba(245,158,11,.35);border:none
    }

    .sheet-b .vpn-banner{
      display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:14px;
      margin-bottom:14px;background:#fffbeb;border:1px solid #fcd34d;
      color:#92400e;font-size:13px;font-weight:600;line-height:1.5
    }
    .sheet-b .vpn-banner strong{color:#b45309;font-weight:800}
    .sheet-b .vpn-banner i{color:#d97706;margin-top:2px;flex-shrink:0}

    .sheet-b .desc-box{
      padding:14px 16px;border-radius:14px;margin-bottom:14px;
      background:#f8fafc;border:1px solid #e2e8f0;
      color:#1e293b;font-size:13.5px;font-weight:600;line-height:1.55
    }
    .sheet-b .desc-box .lbl{
      font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;
      letter-spacing:.06em;margin-bottom:8px
    }

    .sheet-b .cred-cards{display:flex;flex-direction:column;gap:10px}
    .sheet-b .cred-card{
      border-radius:16px;padding:14px 16px;background:#f8fafc;border:1px solid #e2e8f0
    }
    .sheet-b .cred-card .idx{
      font-size:13px;font-weight:700;color:#94a3b8;margin-bottom:12px
    }
    .sheet-b .cred-line{
      display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap
    }
    .sheet-b .cred-line:last-child{margin-bottom:0}
    .sheet-b .cred-k{
      min-width:88px;font-weight:800;font-size:12px;letter-spacing:.03em;color:#64748b
    }
    .sheet-b .cred-k.pass{color:#dc2626}
    .sheet-b .cred-v{
      flex:1;font-weight:700;word-break:break-all;color:#0f172a;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px
    }
    .sheet-b .cred-v button,
    .sheet-b .cred-v .copy-one{
      margin-left:8px;border:none;background:#e0e7ff;color:#3730a3;border-radius:8px;
      padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit
    }


    .sheet-b .detail-grid{display:flex;flex-direction:column;gap:8px}
    .sheet-b .detail-row{
      display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
      padding:12px 14px;border-radius:12px;background:#f8fafc;border:1px solid #eef2f7
    }
    .sheet-b .detail-row .l{font-size:13px;font-weight:600;color:#64748b;flex-shrink:0}
    .sheet-b .detail-row .v{font-size:13px;font-weight:700;color:#0f172a;text-align:right;word-break:break-word}
    .sheet-b .detail-row.detail-link{flex-direction:column;align-items:stretch}
    .sheet-b .detail-row.detail-link .l{margin-bottom:8px}
    .sheet-b .link-row{display:flex;flex-direction:column;gap:10px;text-align:left !important}
    .sheet-b a.link-url{
      color:#2563eb;font-weight:700;font-size:13px;word-break:break-all;text-decoration:none
    }
    .sheet-b a.link-open{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;align-self:flex-start;
      padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;text-decoration:none;
      background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;
      box-shadow:0 8px 18px rgba(37,99,235,.3)
    }
    .sheet-b .progress{
      height:6px;border-radius:999px;background:#e2e8f0;overflow:hidden
    }
    .sheet-b .progress span{
      display:block;height:100%;border-radius:999px;
      background:linear-gradient(90deg,#60a5fa,#2563eb)
    }

  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="dashboard.html" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
      <h1>My Orders</h1>
      <p>Logs · SMS · Boosters</p>
    </div>
  </header>

  <main class="wrap">
    <div class="type-tabs" role="tablist">
      <button type="button" class="type-tab active" data-tab="logs" id="tabLogs">
        <i class="fa-solid fa-box"></i> Logs
        <span class="count" id="countLogs">—</span>
      </button>
      <button type="button" class="type-tab" data-tab="sms" id="tabSms">
        <i class="fa-solid fa-comment-sms"></i> SMS
        <span class="count" id="countSms">—</span>
      </button>
      <button type="button" class="type-tab" data-tab="boosters" id="tabBoost">
        <i class="fa-solid fa-bolt"></i> Boosters
        <span class="count" id="countBoost">—</span>
      </button>
    </div>

    <section class="hero">
      <h2 id="heroTitle">MJ Logs</h2>
      <p class="sub" id="heroSub">Account logins and digital deliveries from your purchases.</p>
    </section>

    <div class="list" id="list">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </main>

  <div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-h">
        <div>
          <strong id="mTitle">Order</strong>
          <span id="mSub"></span>
        </div>
        <button type="button" onclick="closeModal()" aria-label="Close">✕</button>
      </div>
      <div class="sheet-b" id="mBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <nav class="bottom-nav">
    <a href="dashboard.html"><i class="fa-solid fa-house"></i>Home</a>
    <a href="mj-orders.html" class="active"><i class="fa-solid fa-receipt"></i>Orders</a>
    <a href="dashboard.html#cart"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
    <a href="dashboard.html#profile"><i class="fa-solid fa-user"></i>Profile</a>
  </nav>

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function toast(m) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = m;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}
function money(n) {
  return '₦' + Number(n || 0).toLocaleString();
}
function fmtDate(iso) {
  try {
    return new Date(iso).toLocaleString(undefined, {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  } catch (e) {
    return '';
  }
}
function statusClass(s) {
  s = String(s || '').toLowerCase();
  if (/pending|processing|progress|waiting|in progress/.test(s)) return 'pending';
  if (/fail|cancel|refund|reject|partial/.test(s) && !/complete/.test(s)) return 'failed';
  return '';
}
/** Never show raw backend / API key errors to customers */
function friendlyError(err) {
  const raw = String((err && err.message) || err || '').toLowerCase();
  if (/invalid api key|jwt|api key|not authorized|401|403/.test(raw)) {
    return 'Session expired. Please sign out and sign in again.';
  }
  if (/failed to fetch|network|timeout/.test(raw)) {
    return 'Network error. Check your connection and try again.';
  }
  if (/row level security|rls|permission/.test(raw)) {
    return 'Unable to load orders for this account. Contact support if this continues.';
  }
  return 'Could not load orders right now. Pull to refresh or try again shortly.';
}

function groupLogs(rows) {
  const map = new Map(),
    keys = [];
  rows.forEach((o) => {
    const key = o.order_id || 'single-' + (o.id || Math.random());
    if (!map.has(key)) {
      map.set(key, []);
      keys.push(key);
    }
    map.get(key).push(o);
  });
  return keys.map((key) => {
    const items = map.get(key),
      first = items[0];
    return {
      order_id: first.order_id || key,
      product_name: first.product_name || first.title || 'Product',
      status: first.status || 'Completed',
      created_at: first.created_at,
      quantity: items.reduce((s, it) => s + (Number(it.quantity) || 1), 0),
      amount: items.reduce((s, it) => s + (Number(it.amount) || 0), 0),
      items,
      login_credentials:
        first.login_credentials ||
        [first.credentials_id, first.credentials_pass].filter(Boolean).join(':') ||
        '',
      guide_url: first.guide_url || 'https://t.me/mj_hub_tg',
      description: first.description || ''
    };
  });
}

async function ensureAuth() {
  let {
    data: { session: s }
  } = await sb.auth.getSession();
  if (!s) {
    const ref = await sb.auth.refreshSession();
    s = ref.data && ref.data.session;
  }
  if (!s || !s.user) return null;
  session = s;
  return s;
}

/** Server-side load (same approach as boosters / owlet) — avoids browser anon-key failures */
let _myOrdersCache = null;

async function fetchMyOrdersFromApi() {
  if (_myOrdersCache) return _myOrdersCache;
  const token = session && session.access_token;
  if (!token) throw new Error('Please sign in');
  const res = await fetch('/api/order?action=my_orders', {
    headers: { Authorization: 'Bearer ' + token }
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || !json.success) {
    throw new Error(json.message || 'Could not load orders');
  }
  _myOrdersCache = json;
  return json;
}

async function loadLogs() {
  loadErrors.logs = null;
  if (!(session && session.user)) {
    logGroups = [];
    document.getElementById('countLogs').textContent = '0';
    return;
  }
  try {
    const json = await fetchMyOrdersFromApi();
    let rows = json.logs || [];
    if (!rows.length) {
      try {
        const uid = session.user.id;
        const cached = JSON.parse(localStorage.getItem('mjhub_orders_' + uid) || '[]');
        if (Array.isArray(cached) && cached.length) rows = cached;
      } catch (e) {}
    }
    logGroups = groupLogs(rows);
    document.getElementById('countLogs').textContent = String(logGroups.length);
  } catch (e) {
    console.warn('[orders] logs', e);
    loadErrors.logs = friendlyError(e);
    logGroups = [];
    document.getElementById('countLogs').textContent = '0';
  }
}

async function loadSms() {
  loadErrors.sms = null;
  if (!(session && session.user)) {
    smsRows = [];
    document.getElementById('countSms').textContent = '0';
    return;
  }
  try {
    const json = await fetchMyOrdersFromApi();
    smsRows = (json.sms || []).slice().sort((a, b) => {
      return new Date(b.created_at || 0) - new Date(a.created_at || 0);
    });
    document.getElementById('countSms').textContent = String(smsRows.length);
  } catch (e) {
    console.warn('[orders] sms', e);
    loadErrors.sms = friendlyError(e);
    smsRows = [];
    document.getElementById('countSms').textContent = '0';
  }
}

async function loadBoosters() {
  loadErrors.boosters = null;
  const s = session || (await ensureAuth());
  const token = s && s.access_token;
  if (!token) {
    boostRows = [];
    document.getElementById('countBoost').textContent = '0';
    return;
  }
  try {
    const res = await fetch('/api/owlet?action=my_orders&page_size=50&live=0', {
      headers: { Authorization: 'Bearer ' + token }
    });
    const json = await res.json().catch(() => ({}));
    if (!json.success) throw new Error(json.message || 'Could not load boosters');
    boostRows = json.data || [];
    document.getElementById('countBoost').textContent = String(boostRows.length);
  } catch (e) {
    console.warn('[orders] boosters', e);
    loadErrors.boosters = friendlyError(e);
    boostRows = [];
    document.getElementById('countBoost').textContent = '0';
  }
}

function setHero() {
  const map = {
    logs: ['MJ Logs', 'Account logins and digital deliveries from your purchases.'],
    sms: ['MJ SMS', 'Virtual numbers and OTP codes you bought.'],
    boosters: ['MJ Boosters', 'Social growth orders and live delivery progress.']
  };
  const [t, sub] = map[tab];
  document.getElementById('heroTitle').textContent = t;
  document.getElementById('heroSub').textContent = sub;
}

function bindViewButtons() {
  // Event delegation — works even after re-render
  const list = document.getElementById('list');
  if (!list || list._viewBound) return;
  list._viewBound = true;
  list.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-kind][data-i]');
    if (!btn || !list.contains(btn)) return;
    e.preventDefault();
    const kind = btn.getAttribute('data-kind');
    const i = Number(btn.getAttribute('data-i'));
    if (!kind || Number.isNaN(i)) return;
    openModal(kind, i);
  });
}

function boostProgress(o) {
  const qty = Number(o.quantity || o.qty || 0);
  const remains = Number(o.remains != null ? o.remains : qty);
  const delivered = Math.max(0, qty - (isNaN(remains) ? 0 : remains));
  const pct = qty > 0 ? Math.min(100, Math.round((delivered / qty) * 100)) : 0;
  return { qty, remains: isNaN(remains) ? '—' : remains, delivered, pct };
}

function openModal(kind, i) {
  const title = document.getElementById('mTitle');
  const body = document.getElementById('mBody');
  const sub = document.getElementById('mSub');
  if (!title || !body) {
    console.warn('[orders] modal elements missing');
    return;
  }

  if (kind === 'logs') {
    const g = logGroups[i];
    if (!g) return;
    const items = g.items && g.items.length ? g.items : [g];
    const guide = g.guide_url || items[0].guide_url || 'https://t.me/mj_hub_tg';
    const desc = g.description || items[0].description || '';
    title.textContent = g.product_name || 'Order';
    if (sub) sub.textContent = (g.quantity || items.length || 1) + ' log' + ((g.quantity || items.length || 1) > 1 ? 's' : '');

    function splitCred(raw) {
      raw = String(raw || '').trim();
      if (!raw) return { id: '', pass: '' };
      // email:pass | user:pass | Username x Password y
      let id = '', pass = '';
      const up = raw.match(/username\s*[:\s]+(\S+)\s+password\s*[:\s]+(\S+)/i);
      if (up) return { id: up[1], pass: up[2] };
      if (raw.includes(':') && !raw.includes(' ')) {
        const p = raw.split(':');
        id = p.shift() || '';
        pass = p.join(':');
        return { id, pass };
      }
      if (raw.includes('|')) {
        const p = raw.split('|').map((s) => s.trim());
        return { id: p[0] || '', pass: p[1] || '' };
      }
      const lines = raw.split(/\n/).map((s) => s.trim()).filter(Boolean);
      if (lines.length >= 2) return { id: lines[0], pass: lines[1] };
      return { id: raw, pass: '' };
    }

    const cards = items.map((it, idx) => {
      const raw =
        it.login_credentials ||
        [it.credentials_id, it.credentials_pass].filter(Boolean).join(':') ||
        g.login_credentials ||
        '';
      const { id, pass } = splitCred(raw);
      return (
        '<div class="cred-card">' +
        '<div class="idx">' + (idx + 1) + (items.length > 1 ? ' of ' + items.length : '') + '</div>' +
        '<div class="cred-line"><span class="cred-k">ID</span><span class="cred-v">' + esc(id || '—') +
        (id ? ' <button type="button" onclick="copyRaw(\'' + esc(id).replace(/'/g, "\\'") + '\')">Copy</button>' : '') +
        '</span></div>' +
        '<div class="cred-line"><span class="cred-k pass">PASSWORD</span><span class="cred-v">' + esc(pass || '—') +
        (pass ? ' <button type="button" onclick="copyRaw(\'' + esc(pass).replace(/'/g, "\\'") + '\')">Copy</button>' : '') +
        '</span></div>' +
        '</div>'
      );
    }).join('');

    const allText = items.map((it, idx) => {
      const raw =
        it.login_credentials ||
        [it.credentials_id, it.credentials_pass].filter(Boolean).join(':') ||
        g.login_credentials ||
        '';
      const { id, pass } = splitCred(raw);
      return (items.length > 1 ? '#' + (idx + 1) + '\n' : '') + 'ID: ' + id + '\nPASSWORD: ' + pass;
    }).join('\n\n');

    body.innerHTML =
      '<div class="log-actions">' +
      '<button type="button" class="la-btn copy" onclick="copyRaw(document.getElementById(\'credBox\').textContent)"><i class="fa-regular fa-copy"></i> Copy All</button>' +
      '<button type="button" class="la-btn dl" onclick="downloadText()"><i class="fa-solid fa-download"></i> Download .txt</button>' +
      '<a class="la-btn guide" href="' + esc(guide) + '" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> How to Login</a>' +
      '</div>' +
      '<div class="vpn-banner"><i class="fa-solid fa-shield-halved"></i><div>Please kindly use a <strong>GOOD VPN</strong> to login and add <strong>2-step verification</strong> after purchase.</div></div>' +
      (desc ? '<div class="desc-box"><div class="lbl">Description</div>' + esc(desc) + '</div>' : '') +
      '<div class="cred-cards">' + cards + '</div>' +
      '<div class="cred" id="credBox" style="position:absolute;left:-9999px;height:0;overflow:hidden">' + esc(allText) + '</div>';
  } else if (kind === 'sms') {

    const o = smsRows[i];
    if (!o) return;
    title.textContent = (o.service_name || 'SMS').replace(/_/g, ' ');
    if (sub) sub.textContent = o.phone_number || o.status || '';
    body.innerHTML = `
      <div class="detail-grid">
        <div class="detail-row"><span class="l">Status</span><span class="v">${esc(o.status || '—')}</span></div>
        <div class="detail-row"><span class="l">Number</span><span class="v" style="font-family:monospace">${esc(o.phone_number || '—')}</span></div>
        <div class="detail-row"><span class="l">Country</span><span class="v">${esc(o.country_name || '—')}</span></div>
        <div class="detail-row"><span class="l">Price</span><span class="v">${money(o.price)}</span></div>
      </div>
      <div class="actions">
        ${o.order_id ? `<a class="btn-guide" href="mj-sms-number.html?order_id=${encodeURIComponent(o.order_id)}">Open number</a>` : ''}
      </div>`;
  } else if (kind === 'boosters' || kind === 'boost') {
    const o = boostRows[i];
    if (!o) return;
    const p = boostProgress(o);
    const oid = o.order_id || o.supplier_order_id || o.id || '';
    const link = String(o.link || o.url || '').trim();
    const price = o.price_ngn != null ? o.price_ngn : (o.charge != null ? o.charge : o.price);
    title.textContent = o.service_name || o.service || 'Boost';
    if (sub) sub.textContent = (o.status || '') + (oid ? ' · #' + oid : '');

    window.__boostCopyText = [
      'Service: ' + (o.service_name || o.service || ''),
      'Status: ' + (o.status || ''),
      'Progress: ' + p.delivered + ' / ' + (p.qty || '—') + ' (left ' + p.remains + ')',
      'Link: ' + (link || '—'),
      'Order ID: ' + (oid || '—'),
      'Price: ' + money(price),
      'Date: ' + (o.created_at || '')
    ].join('\n');

    const openBtn = link
      ? '<a class="link-open" href="' + esc(link) + '" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open link</a>'
      : '';

    body.innerHTML =
      '<div class="detail-grid">' +
        '<div class="detail-row"><span class="l">Status</span><span class="v">' + esc(o.status || '—') + '</span></div>' +
        '<div class="detail-row"><span class="l">Delivered</span><span class="v">' + p.delivered + ' / ' + (p.qty || '—') + '</span></div>' +
        '<div class="detail-row"><span class="l">Remaining</span><span class="v">' + esc(String(p.remains)) + '</span></div>' +
        '<div class="detail-row"><span class="l">Price</span><span class="v">' + money(price) + '</span></div>' +
        '<div class="detail-row"><span class="l">Order ID</span><span class="v">' + esc(String(oid || '—')) + '</span></div>' +
        '<div class="detail-row detail-link"><span class="l">Link</span><span class="v link-row">' +
          (link
            ? '<a class="link-url" href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(link) + '</a>' + openBtn
            : '—') +
        '</span></div>' +
        '<div class="detail-row"><span class="l">Date</span><span class="v">' + esc(fmtDate(o.created_at)) + '</span></div>' +
      '</div>' +
      '<div class="progress" style="margin:14px 0 16px"><span style="width:' + p.pct + '%"></span></div>' +
      '<div class="log-actions">' +
        '<button type="button" class="la-btn copy" onclick="copyRaw(window.__boostCopyText||\'\')"><i class="fa-regular fa-copy"></i> Copy details</button>' +
        '<a class="la-btn dl" href="mj-boosters-history.html" style="background:#ecfdf5;color:#047857;border:1px solid #a7f3d0"><i class="fa-solid fa-bolt"></i> Full history</a>' +
      '</div>';
  } else {


    title.textContent = 'Order';
    if (sub) sub.textContent = '';
    body.innerHTML = '<p style="color:var(--muted);padding:12px">No details for this item.</p>';
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
function copyRaw(t) {
  navigator.clipboard.writeText(String(t || '')).then(() => toast('Copied')).catch(() => toast('Copy failed'));
}
function copyText() {
  const t = document.getElementById('credBox');
  navigator.clipboard
    .writeText((t && t.textContent) || '')
    .then(() => toast('Copied'))
    .catch(() => toast('Copy failed'));
}
function downloadText() {
  const t = (document.getElementById('credBox') && document.getElementById('credBox').textContent) || '';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: 'text/plain' }));
  a.download = 'mj-hub-order.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

function render() {
  setHero();
  if (tab === 'logs') renderLogs();
  else if (tab === 'sms') renderSms();
  else renderBoosters();
}

document.querySelectorAll('.type-tab').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-tab').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    tab = btn.getAttribute('data-tab') || 'logs';
    render();
  });
});

async function boot() {
  const s = await ensureAuth();
  if (!s || !s.user) {
    location.href = 'auth.html';
    return;
  }
  session = s;
  _myOrdersCache = null;
  const list = document.getElementById('list');
  if (list) list.innerHTML = '<div class="empty"><p>Loading your orders…</p></div>';
  await Promise.all([loadLogs(), loadSms(), loadBoosters()]);
  try {
    const q = new URLSearchParams(location.search).get('tab');
    if (q === 'sms' || q === 'boosters' || q === 'logs') {
      tab = q;
      document.querySelectorAll('.type-tab').forEach((b) => {
        b.classList.toggle('active', b.getAttribute('data-tab') === tab);
      });
    }
  } catch (e) {}
  bindViewButtons();
  render();
}
boot();

</script>
