<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ Hub</title>
<script>
(function () {
  var q = '';
  var h = '';
  var ref = '';
  try {
    q = window.location.search || '';
    h = window.location.hash || '';
    var p = new URLSearchParams(q);
    ref = (p.get('ref') || p.get('referral') || p.get('r') || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '');
    if (ref && ref.length >= 3) {
      try { localStorage.setItem('mjhub_ref_code', ref); } catch (e) {}
      try { sessionStorage.setItem('mjhub_ref_code', ref); } catch (e) {}
      try {
        document.cookie = 'mjhub_ref_code=' + encodeURIComponent(ref) + '; path=/; max-age=' + (30 * 86400) + '; SameSite=Lax';
      } catch (e) {}
    }
  } catch (e) {}
  var next = '/landing.html' + q + h;
  try { window.location.replace(next); } catch (e) { window.location.href = next; }
})();
</script>
<link rel="canonical" href="https://app.mjhub.store/landing.html">
</head>
<body>
<p style="font-family:system-ui,sans-serif;text-align:center;margin-top:2rem;">
  <a href="/landing.html">Continue to MJ Hub</a>
</p>
</body>
</html>
