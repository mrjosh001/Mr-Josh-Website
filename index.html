<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ Hub</title>
<!-- Root must not compete with landing.html. Vercel also redirects / and /index.html → /landing.html -->
<script>
(function () {
  try {
    var q = window.location.search || '';
    var h = window.location.hash || '';
    // Preserve ?ref= and other query params on the real landing page
    window.location.replace('/landing.html' + q + h);
  } catch (e) {
    window.location.href = '/landing.html';
  }
})();
</script>
<meta http-equiv="refresh" content="0;url=/landing.html">
<link rel="canonical" href="https://www.mjhub.store/landing.html">
</head>
<body>
<p style="font-family:system-ui,sans-serif;text-align:center;margin-top:2rem;">
  <a href="/landing.html">Continue to MJ Hub</a>
</p>
</body>
</html>
