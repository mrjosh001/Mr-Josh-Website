<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MJ HUB Support Inbox</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font:15px system-ui}header{padding:18px;border-bottom:1px solid #293548}a{color:#93c5fd;text-decoration:none}.app{max-width:980px;margin:24px auto;padding:0 14px}.shell{height:calc(100vh - 110px);min-height:480px;display:grid;grid-template-columns:280px 1fr;border:1px solid #293548;border-radius:16px;overflow:hidden;background:#111827}.side{border-right:1px solid #293548;display:flex;flex-direction:column}.side h3,.head{padding:16px;margin:0;border-bottom:1px solid #293548}.tickets{overflow:auto;flex:1}.ticket{width:100%;padding:14px;text-align:left;background:none;border:0;border-bottom:1px solid #293548;color:white}.ticket.active{background:#1d3559}.ticket small{display:block;color:#94a3b8}.new,.send{border:0;border-radius:9px;padding:12px;background:#2563eb;color:white;font-weight:700;margin:10px;cursor:pointer}.chat{display:flex;flex-direction:column;min-width:0}.head small{display:block;color:#94a3b8}.messages{padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}.bubble{max-width:80%;padding:12px;border-radius:14px;background:#263449;white-space:pre-wrap;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#1d4ed8}.other{align-self:flex-start}.meta{font-size:10px;color:#cbd5e1;text-align:right;margin-top:6px}.read{color:#bfdbfe;font-weight:800}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid #293548}.compose textarea{flex:1;background:#0b1220;color:white;border:1px solid #293548;border-radius:10px;padding:12px;font:inherit;resize:none}.compose .send{margin:0}@media(max-width:600px){.app{margin:0;padding:0}.shell{height:calc(100vh - 58px);border:0;border-radius:0;grid-template-columns:112px 1fr}.side h3{font-size:12px;padding:12px 6px}.ticket{font-size:11px;padding:10px 6px}.ticket small{font-size:9px}.new{font-size:10px;padding:10px 3px;margin:5px}.head{padding:12px}.bubble{max-width:94%;font-size:14px}.messages{padding:10px}.compose{padding:8px}.compose .send{padding:10px}}</style></head><body><header><a href="/support.html">← MJ HUB Support</a>　<strong>Support Inbox</strong></header><div class="app"><div class="shell"><aside class="side"><h3>Your conversations</h3><div id="tickets" class="tickets">Loading…</div><button id="new" class="new">＋ New chat</button></aside><main class="chat"><div class="head" id="head">MJ HUB Support<small>Select a conversation</small></div><div id="messages" class="messages">Your messages will appear here.</div><form id="form" class="compose"><textarea id="body" maxlength="4000" placeholder="Write a message…" disabled></textarea><button class="send" id="send" disabled>Send</button></form></main></div></div><script>
(function(){const sb=supabase.createClient('https://atczodlljmlayvldxfmv.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI',{auth:{persistSession:true,autoRefreshToken:true,storage:sessionStorage}});let uid=null,active=null,tickets=[];const $=x=>document.getElementById(x),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tm=x=>{try{return new Date(x).toLocaleString('en-NG',{timeZone:'Africa/Lagos',hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}catch(e){return ''}};function receipt(m){return m.read_at?'<span class="read">✓✓ Read</span>':m.delivered_at?'✓ Delivered':'Sent'}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/auth.html?mode=signin&next='+encodeURIComponent('/support-inbox.html');return}uid=session.user.id;await list();sb.channel('support-inbox-live-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'support_messages'},p=>{if(p.eventType==='INSERT'&&p.new?.sender_type==='admin')sb.rpc('mj_support_mark_delivered',{p_ticket_id:p.new.ticket_id}).catch(()=>{});if(p.new?.ticket_id===active&&document.visibilityState==='visible')load();list()}).subscribe()}
async function list(){const {data,error}=await sb.from('support_tickets').select('id,subject,status,last_message_at').eq('user_id',uid).order('last_message_at',{ascending:false});if(error){$('tickets').textContent='Could not load chats';return}tickets=data||[];$('tickets').innerHTML=tickets.map(t=>'<button class="ticket '+(t.id===active?'active':'')+'" data-id="'+t.id+'">'+esc(t.subject||'Support chat')+'<small>'+esc(t.status)+' · '+tm(t.last_message_at)+'</small></button>').join('')||'<p style="padding:10px;color:#94a3b8">No chats yet</p>';$('tickets').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id))}
async function open(id){active=id;const t=tickets.find(x=>x.id===id);$('head').innerHTML=esc(t?.subject||'Support')+'<small>MJ HUB Support · '+esc(t?.status||'open')+'</small>';$('body').disabled=false;$('send').disabled=false;await list();await load();if(window.thread)sb.removeChannel(window.thread);window.thread=sb.channel('support-thread-'+id).on('postgres_changes',{event:'*',schema:'public',table:'support_messages',filter:'ticket_id=eq.'+id},load).subscribe()}
async function load(){if(!active)return;let q=await sb.from('support_messages').select('*').eq('ticket_id',active).order('created_at',{ascending:true});if(q.error){$('messages').textContent='Could not load messages';return}if(document.visibilityState==='visible'){const incoming=(q.data||[]).filter(m=>['admin','agent','staff','support'].includes(String(m.sender_type||'').toLowerCase())).map(m=>m.id).filter(Boolean);const delivered=await sb.rpc('mj_support_mark_delivered',{p_ticket_id:active});if(delivered.error)console.warn('Support delivered receipt failed',delivered.error);if(incoming.length){const read=await sb.rpc('mj_support_mark_read',{p_ticket_id:active,p_message_ids:incoming});if(read.error)console.warn('Support read receipt failed',read.error)}const fresh=await sb.from('support_messages').select('*').eq('ticket_id',active).order('created_at',{ascending:true});if(!fresh.error)q=fresh}$('messages').innerHTML=(q.data||[]).map(m=>'<div class="bubble '+(m.sender_type==='user'?'mine':'other')+'">'+esc(m.body)+'<div class="meta">'+(m.sender_type==='user'?'You':'MJ HUB Support')+' · '+tm(m.created_at)+'</div>'+(m.sender_type==='user'?'<div class="meta">'+receipt(m)+'</div>':'')+'</div>').join('')||'No messages yet.';$('messages').scrollTop=$('messages').scrollHeight}
$('new').onclick=async()=>{const {data,error}=await sb.from('support_tickets').insert({user_id:uid,subject:'Support conversation',status:'open'}).select('id').single();if(error){alert('Could not start chat: '+error.message);return}await list();await open(data.id);$('body').focus()};
$('form').onsubmit=async e=>{e.preventDefault();const body=$('body').value.trim();if(!body||!active)return;$('send').disabled=true;const {error}=await sb.from('support_messages').insert({ticket_id:active,sender_type:'user',sender_id:uid,body:body.slice(0,4000)});$('send').disabled=false;if(error){alert('Could not send: '+error.message);return}$('body').value='';await load();await list()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&active)load()});init().catch(e=>{console.error(e);$('tickets').textContent='Could not start inbox'})})();
</script></body></html>
