function serviceCatalogSkeleton(){
  var tiles = '';
  for (var i = 0; i < 12; i++) tiles += '<div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>';
  return '<div class="sk-svc-grid" aria-hidden="true" aria-busy="true">' + tiles + '</div>';
}

async function loadServiceCatalog(){
  try{
    if(serviceGrid){
      serviceGrid.innerHTML = serviceCatalogSkeleton();
      serviceGrid.dataset.skelReady = '1';
    }
    if(!sbClient){
      if(!window.supabase) throw new Error('Supabase not loaded');
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
      });
    }

    // SAME as old working page: countries via RPC
    const { data: countries, error: cErr } = await sbClient.rpc('grizzly_countries');
    if(cErr) throw new Error(cErr.message || 'Countries failed');
    allCountries = countries || [];

    // Build service catalog using the EXACT per-country query that already worked
    serviceCountryIndex = {};
    const catalogMap = new Map();
    const ids = allCountries.map(c => c.country_id).filter(id => id != null);
    const batchSize = 6;
    // Cap countries scanned so mobile does not stall; 30 countries is plenty for a full service list
    const maxCountries = Math.min(ids.length, 36);

    for(let i = 0; i < maxCountries; i += batchSize){
      const batch = ids.slice(i, i + batchSize);
      const results = await Promise.all(batch.map(async (countryId) => {
        const cmeta = allCountries.find(c => c.country_id === countryId) || {};
        // identical filters to old selectCountry()
        const { data, error } = await sbClient
          .from('number_services')
          .select('service_id, service_name, category, price, available_quantity')
          .eq('source', 'grizzlysms')
          .eq('is_available', true)
          .eq('country_id', countryId)
          .gt('price', 0)
          .order('service_name', { ascending: true });
        if(error){
          console.warn('country services', countryId, error.message);
          return { countryId, cmeta, rows: [] };
        }
        return { countryId, cmeta, rows: data || [] };
      }));

      results.forEach(({ countryId, cmeta, rows }) => {
        rows.forEach(row => {
          const name = String(row.service_name || row.service_id || '').replace(/_/g, ' ').trim();
          if(!name) return;
          const key = name.toLowerCase();
          if(!catalogMap.has(key)){
            catalogMap.set(key, { service_id: row.service_id, service_name: name, key: key });
          }
          if(!serviceCountryIndex[key]) serviceCountryIndex[key] = [];
          serviceCountryIndex[key].push({
            country_id: countryId,
            country_name: cmeta.country_name || ('Country ' + countryId),
            price: row.price,
            available_quantity: row.available_quantity,
            service_id: row.service_id,
            service_name: name
          });
        });
      });
    }

    allServiceCatalog = Array.from(catalogMap.values()).sort((a, b) => {
      const ra = popularRank(a.service_name), rb = popularRank(b.service_name);
      if(ra !== rb) return ra - rb;
      return a.service_name.localeCompare(b.service_name);
    });

    if(!allServiceCatalog.length){
      serviceGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📵</div><h4>No Services Found</h4><p>Catalog may still be syncing. Try again in a moment.</p><button type="button" class="btn btn-primary" style="margin-top:12px;width:auto;padding:10px 16px" onclick="loadServiceCatalog()">Retry</button></div>';
      return;
    }
    renderServiceCatalog(allServiceCatalog);
  }catch(err){
    console.error('loadServiceCatalog', err);
    serviceGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h4>Failed to load</h4><p>'+escapeHtml(err.message||String(err))+'</p><button type="button" class="btn btn-primary" style="margin-top:12px;width:auto;padding:10px 16px" onclick="loadServiceCatalog()">Retry</button></div>';
  }
}

function renderServiceCatalog(list){
  if(!list.length){
    serviceGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📵</div><h4>No Services Found</h4></div>';
    if(serviceCountBadge) serviceCountBadge.innerHTML = '';
    return;
  }
  if(serviceCountBadge) serviceCountBadge.innerHTML = '<span class="product-count-badge">'+list.length+' service'+(list.length!==1?'s':'')+'</span>';
  let html = '<div class="svc-icon-grid">';
  list.forEach((s, index) => {
    const name = s.service_name || 'Service';
    const icon = serviceIcon(name);
    const iconHtml = icon
      ? '<div class="svc-icon" style="background:'+icon.color+'"><i class="'+icon.cls+'"></i></div>'
      : '<div class="svc-icon svc-icon-fallback"><i class="fa-solid fa-mobile-screen"></i></div>';
    html += '<button type="button" class="svc-tile" data-index="'+index+'">'+iconHtml+'<span class="svc-label">'+escapeHtml(name)+'</span></button>';
  });
  html += '</div>';
  serviceGrid.innerHTML = html;
  serviceGrid.querySelectorAll('.svc-tile').forEach(btn => {
    btn.addEventListener('click', () => selectService(list[Number(btn.dataset.index)]));
  });
}

function selectService(svc){
  currentServicePick = svc;
  currentCountry = null;
  activeService = null;
  serviceStep.style.display = 'none';
  countryStep.style.display = 'block';
  const icon = serviceIcon(svc.service_name);
  const mini = icon
    ? '<span class="mini-icon" style="background:'+icon.color+'"><i class="'+icon.cls+'"></i></span>'
    : '';
  document.getElementById('selectedServiceName').innerHTML = mini + escapeHtml(svc.service_name);
  countrySearch.value = '';

  const key = (svc.key || svc.service_name || '').toLowerCase();
  let rows = (serviceCountryIndex[key] || []).slice();
  // dedupe by country keep cheapest
  const byC = new Map();
  rows.forEach(c => {
    const id = String(c.country_id);
    if(!byC.has(id) || Number(c.price) < Number(byC.get(id).price)) byC.set(id, c);
  });
  allCountries = Array.from(byC.values()).sort((a,b) => Number(a.price) - Number(b.price));
  renderCountryPrices(allCountries);
}

function renderCountryPrices(list){
  if(!list.length){
    countryList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><h4>No countries for this service</h4></div>';
    return;
  }
  countryList.innerHTML = list.map((c, i) => {
    return '<div class="country-price-row" data-index="'+i+'"><div class="left"><span class="flag">'+countryFlag(c.country_name)+'</span><span class="cname">'+escapeHtml(c.country_name)+'</span></div><div class="right"><span class="cprice">'+money(c.price)+'</span><span class="chev"><i class="fa-solid fa-chevron-right"></i></span></div></div>';
  }).join('');
  countryList.querySelectorAll('.country-price-row').forEach(row => {
    row.addEventListener('click', () => {
      const c = list[Number(row.dataset.index)];
      if(!c) return;
      currentCountry = { country_id: c.country_id, country_name: c.country_name };
      openPurchaseModal({
        service_id: c.service_id,
        service_name: c.service_name,
        price: c.price,
        available_quantity: c.available_quantity
      });
    });
  });
}

function openPurchaseModal(s){
  activeService = s;
  const name = (s.service_name || s.service_id || 'Service').replace(/_/g,' ');
  const icon = serviceIcon(name);
  const iconEl = document.getElementById('psIcon');
  if(icon){
    iconEl.innerHTML = `<i class="${icon.cls}"></i>`;
    iconEl.style.background = icon.color;
  } else {
    iconEl.textContent = (name.charAt(0)||'M').toUpperCase();
    iconEl.style.background = '#1877f2';
  }
  document.getElementById('psName').textContent = name;
  document.getElementById('psUnitPrice').textContent = money(s.price);
  document.getElementById('psStock').textContent = (s.available_quantity ?? '—') + ' available';
  document.getElementById('psCountry').innerHTML = `<span class="flag">${countryFlag(currentCountry.country_name)}</span>${escapeHtml(currentCountry.country_name)}`;
  document.getElementById('psTotal').textContent = money(s.price);
  window.__mjSmsBuyId = null;
  document.getElementById('purchaseModal').classList.add('active');
}
function closePurchaseModal(){
  document.getElementById('purchaseModal').classList.remove('active');
  activeService = null;
}
document.getElementById('purchaseCloseBtn').addEventListener('click', closePurchaseModal);
document.getElementById('purchaseModal').addEventListener('click', function(e){ if(e.target===this) closePurchaseModal(); });

document.getElementById('psBuyBtn').addEventListener('click', async function(){
  if(!activeService || !currentCountry || isBuying) return;
  if(!currentUserId){
    showToast('Please sign in to buy a number','error');
    setTimeout(() => window.location.href = 'auth.html', 900);
    return;
  }
  // Lock immediately — before any await — so rapid taps cannot start a second buy
  isBuying = true;
  const btn = this;
  btn.disabled = true;
  const originalLabel = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Purchasing...';

  const price = parseFloat(activeService.price) || 0;
  // Stable id for this confirmation attempt (reused if network retries)
  if(!window.__mjSmsBuyId){
    window.__mjSmsBuyId = 'MJ-GZ-' + Date.now() + '-' + Math.random().toString(36).slice(2,9);
  }
  const externalOrderId = window.__mjSmsBuyId;

  try{
    const balCheck = await refreshBalance();
    if(!balCheck.ok){
      showToast('Could not verify your balance: ' + balCheck.reason, 'error');
      isBuying = false; btn.disabled = false; btn.innerHTML = originalLabel;
      return;
    }
    if(currentBalanceNgn < price){
      showToast('Insufficient balance. Redirecting to deposit...', 'error');
      isBuying = false; btn.disabled = false; btn.innerHTML = originalLabel;
      setTimeout(() => window.location.href = 'deposit.html', 900);
      return;
    }

    const res = await fetch('/api/grizzly-sync?action=order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        country_id: currentCountry.country_id,
        service_id: activeService.service_id,
        user_id: currentUserId,
        external_order_id: externalOrderId
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      showToast(data.message || 'Purchase failed. Please try again.', 'error');
      window.__mjSmsBuyId = null;
      isBuying = false; btn.disabled = false; btn.innerHTML = originalLabel;
      return;
    }
    // Success: keep locked and navigate — do not re-enable (prevents second buy)
    showToast('Number purchased! Redirecting...', 'success');
    const oid = data.data && data.data.order_id;
    setTimeout(() => {
      window.location.href = 'mj-sms-number.html?order_id=' + encodeURIComponent(oid);
    }, 500);
  }catch(err){
    showToast('Network error: ' + (err.message || err), 'error');
    window.__mjSmsBuyId = null;
    isBuying = false; btn.disabled = false; btn.innerHTML = originalLabel;
  }
});

<script>

  function paint(){
    if(!window.mjSkeleton && !window.MJSkeleton) return;

    var nodes = document.querySelectorAll('[data-skel], #countryList, #serviceGrid, #list, #catalog, #servicesGrid, #productsGrid, #orderList');

      if(el.id === 'serviceGrid'){
        if(typeof serviceCatalogSkeleton === 'function') el.innerHTML = serviceCatalogSkeleton();

        return;
      }
      if(el.id === 'countryList'){ el.dataset.skelReady = '1'; return; }
      var type = el.getAttribute('data-skel') || (el.id && /list|order/i.test(el.id) ? 'cards' : 'grid');
      el.innerHTML = (mjSkeleton[type] || mjSkeleton.grid)(type === 'cards' ? 3 : 6);
      el.dataset.skelReady = '1';
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);
  else paint();
  // retry once scripts loaded
  setTimeout(paint, 50);
})();
</script>

</body>
</html>
