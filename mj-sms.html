const SERVICE_ICON_EXACT = { line:['fa-brands fa-line','#00C300'], vk:['fa-brands fa-vk','#0077FF'], x:['fa-brands fa-x-twitter','#000000'] };
function serviceIcon(name){
  const n = (name||'').toLowerCase().trim();
  if(SERVICE_ICON_EXACT[n]) return { cls: SERVICE_ICON_EXACT[n][0], color: SERVICE_ICON_EXACT[n][1] };
  for(const [key, cls, color] of SERVICE_ICON_MAP){ if(n.includes(key)) return { cls, color }; }
  return null;
}

// --- Country flags. Grizzly's site shows flags too — same story as above,
// the reseller API only returns country names, not flag images, so this
// renders a Unicode flag emoji from a name→ISO lookup. Unmatched names
// (spelling variants we haven't seen) fall back to a globe icon instead of
// showing a broken/wrong flag. ---

  russia:'ru',ukraine:'ua',kazakhstan:'kz',china:'cn',philippines:'ph',myanmar:'mm',indonesia:'id',

  gambia:'gm',serbia:'rs',yemen:'ye','south africa':'za',romania:'ro',turkmenistan:'tm',chile:'cl','sri lanka':'lk',
  peru:'pe',pakistan:'pk',thailand:'th','saudi arabia':'sa',mexico:'mx',taiwan:'tw',spain:'es',
  iran:'ir',algeria:'dz',slovenia:'si',bangladesh:'bd',senegal:'sn',turkey:'tr','czech republic':'cz',

  bulgaria:'bg',slovakia:'sk',norway:'no',finland:'fi',ethiopia:'et',moldova:'md',portugal:'pt',greece:'gr',switzerland:'ch',

  bahamas:'bs',botswana:'bw',bolivia:'bo','south sudan':'ss',jordan:'jo',tunisia:'tn',kuwait:'kw',

};
function isoToFlagEmoji(iso2){
  if(!iso2 || iso2.length!==2) return '';
  return String.fromCodePoint(...[...iso2.toUpperCase()].map(c => 127397 + c.charCodeAt(0)));
}
function countryFlag(name){
  const iso = COUNTRY_ISO[(name||'').toLowerCase().trim()];
  return iso ? isoToFlagEmoji(iso) : '🌍';
}

async function initSession(){
  try{
    if(!window.supabase) return;
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
});
    const { data: { session } } = await sbClient.auth.getSession();
    if(session && session.user){
      currentUserId = session.user.id;
      await refreshBalance();
      await loadRecentActivity();
    }
  }catch(e){}
}

// Surfaces an in-progress order right on this page (so a customer who
// already has a number waiting for a code doesn't accidentally buy a
// second one, and can easily get back to it). Deliberately does NOT show
// a general history/recent-numbers list here — this page is for buying a
// new number, not browsing past ones; that's what mj-sms-history.html is for.
async function loadRecentActivity(){
  const area = document.getElementById('recentActivityArea');
  if(!area || !sbClient || !currentUserId) return;
  try{
    const { data, error } = await sbClient
      .from('number_orders')
      .select('order_id, service_name, phone_number, status')
      .eq('source', 'grizzlysms')
      .eq('user_id', currentUserId)
      .eq('status', 'waiting_for_code')
      .order('created_at', { ascending: false })
      .limit(1);
    if(error || !data || !data.length){ return; }

    const pending = data[0];
    const name = (pending.service_name || 'a service').replace(/_/g,' ');
    area.innerHTML = `<a class="pending-banner" href="mj-sms-number.html?order_id=${encodeURIComponent(pending.order_id)}">
      <div class="pb-icon"><i class="fa-solid fa-hourglass-half"></i></div>
      <div class="pb-text">
        <div class="pb-title">You have a number waiting for a code</div>
        <div class="pb-sub" style="text-transform:capitalize;">${escapeHtml(name)} · ${escapeHtml(pending.phone_number||'')} — tap to view</div>
      </div>
      <i class="fa-solid fa-chevron-right" style="color:var(--muted);"></i>
    </a>`;
  }catch(e){ /* non-critical — the main order flow below still works fine without this */ }
}

async function refreshBalance(){
  if(!currentUserId || !sbClient) return { ok:false, reason:'not signed in' };
  try{
    const { data, error } = await sbClient.from('profiles').select('balance').eq('id', currentUserId).single();
    if(error) return { ok:false, reason: error.message };
    if(data) currentBalanceNgn = parseFloat(data.balance) || 0;
    return { ok:true };
  }catch(e){ return { ok:false, reason: e.message || String(e) }; }
}

async function loadCountries(){
  try{
    const { data, error } = await sbClient.rpc('grizzly_countries');
    if(error){ countryList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h4>Failed to load</h4><p>'+escapeHtml(error.message)+'</p></div>'; return; }
    allCountries = data || [];
    renderCountries(allCountries);
  }catch(err){
    countryList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h4>Failed to load</h4><p>'+escapeHtml(err.message||String(err))+'</p></div>';
  }
}

function renderCountries(list){
  if(!list.length){ countryList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><h4>No countries found</h4></div>'; return; }
  countryList.innerHTML = list.map(c => `
    <div class="country-row" data-id="${c.country_id}">
      <span class="name"><span class="flag">${countryFlag(c.country_name)}</span>${escapeHtml(c.country_name)}</span>
      <span class="count">${c.service_count} services</span>
    </div>`).join('');
  countryList.querySelectorAll('.country-row').forEach(row => {
    row.addEventListener('click', () => selectCountry(Number(row.dataset.id)));
  });
}

countrySearch.addEventListener('input', () => {
  const q = countrySearch.value.trim().toLowerCase();
  renderCountries(q ? allCountries.filter(c => c.country_name.toLowerCase().includes(q)) : allCountries);
});

async function selectCountry(countryId){
  currentCountry = allCountries.find(c => c.country_id === countryId);
  if(!currentCountry) return;
  countryStep.style.display = 'none';
  serviceStep.style.display = 'block';
  document.getElementById('selectedCountryName').innerHTML = `<span class="flag">${countryFlag(currentCountry.country_name)}</span>${escapeHtml(currentCountry.country_name)}`;
  serviceGrid.innerHTML = '<div class="sk-grid" aria-hidden="true" aria-busy="true"><div class="sk-grid-item"><div class="sk-bone sk-thumb"></div><div class="sk-bone sk-line w90"></div><div class="sk-bone sk-line w60"></div><div class="sk-bone sk-line w40"></div></div><div class="sk-grid-item"><div class="sk-bone sk-thumb"></div><div class="sk-bone sk-line w90"></div><div class="sk-bone sk-line w60"></div><div class="sk-bone sk-line w40"></div></div><div class="sk-grid-item"><div class="sk-bone sk-thumb"></div><div class="sk-bone sk-line w90"></div><div class="sk-bone sk-line w60"></div><div class="sk-bone sk-line w40"></div></div><div class="sk-grid-item"><div class="sk-bone sk-thumb"></div><div class="sk-bone sk-line w90"></div><div class="sk-bone sk-line w60"></div><div class="sk-bone sk-line w40"></div></div><div class="sk-grid-item"><div class="sk-bone sk-thumb"></div><div class="sk-bone sk-line w90"></div><div class="sk-bone sk-line w60"></div><div class="sk-bone sk-line w40"></div></div><div class="sk-grid-item"><div class="sk-bone sk-thumb"></div><div class="sk-bone sk-line w90"></div><div class="sk-bone sk-line w60"></div><div class="sk-bone sk-line w40"></div></div></div>';
  serviceSearch.value = '';

  const { data, error } = await sbClient
    .from('number_services')
    .select('service_id, service_name, category, price, available_quantity')
    .eq('source', 'grizzlysms')
    .eq('is_available', true)
    .eq('country_id', countryId)
    .gt('price', 0)
    .order('service_name', { ascending: true });

  if(error){ serviceGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h4>Failed to load</h4><p>'+escapeHtml(error.message)+'</p></div>'; return; }
  allServices = data || [];
  renderServices(allServices);
}

function backToCountries(){
  serviceStep.style.display = 'none';
  countryStep.style.display = 'block';
  currentCountry = null;
  allServices = [];
}

function renderServices(list){
  if(!list.length){
    serviceGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📵</div><h4>No Services Found</h4><p>Try a different search or country</p></div>';
    serviceCountBadge.innerHTML = '';
    return;
  }
  serviceCountBadge.innerHTML = '<span class="product-count-badge">'+list.length+' service'+(list.length!==1?'s':'')+' available</span>';
  let html = '<div class="product-grid">';
  list.forEach((s, index) => {
    const rawName = (s.service_name || s.service_id || 'Service').replace(/_/g,' ');
    const name = escapeHtml(rawName);
    const icon = serviceIcon(rawName);
    const iconHtml = icon
      ? `<div class="svc-icon" style="background:${icon.color}"><i class="${icon.cls}"></i></div>`
      : `<div class="svc-icon svc-icon-fallback"><i class="fa-solid fa-mobile-screen"></i></div>`;
    html += `<div class="product-card">
      <div class="product-header">
        ${iconHtml}
        <div class="product-name" style="flex:1;">${name}</div>
        <div class="product-price">${money(s.price)}</div>
      </div>
      <div class="product-badges"><span class="badge badge-stock">${s.available_quantity ?? '—'} available</span></div>
      <div class="product-actions" style="display:flex;">
        <button class="btn btn-primary" data-index="${index}">Buy Number</button>
      </div>
    </div>`;
  });
  html += '</div>';
  serviceGrid.innerHTML = html;
  serviceGrid.querySelectorAll('.btn-primary[data-index]').forEach(btn => {
    btn.addEventListener('click', () => openPurchaseModal(list[Number(btn.dataset.index)]));
  });
}

serviceSearch.addEventListener('input', () => {
  const q = serviceSearch.value.trim().toLowerCase();
  renderServices(q ? allServices.filter(s => (s.service_name||s.service_id||'').toLowerCase().includes(q)) : allServices);
});

function openPurchaseModal(s){
  activeService = s;
  const name = (s.service_name || s.service_id || 'Service').replace(/_/g,' ');
  const icon = serviceIcon(name);
  const iconEl = document.getElementById('psIcon');
  if(icon){
    iconEl.innerHTML = `<i class="${icon.cls}"></i>`;
    iconEl.style.background = icon.color;
  } else {
    iconEl.textContent = (name.charAt(0)||'M').toUpperCase();
    iconEl.style.background = '#1877f2';
  }
  document.getElementById('psName').textContent = name;
  document.getElementById('psUnitPrice').textContent = money(s.price);
  document.getElementById('psStock').textContent = (s.available_quantity ?? '—') + ' available';
  document.getElementById('psCountry').innerHTML = `<span class="flag">${countryFlag(currentCountry.country_name)}</span>${escapeHtml(currentCountry.country_name)}`;
  document.getElementById('psTotal').textContent = money(s.price);
  document.getElementById('purchaseModal').classList.add('active');
}
function closePurchaseModal(){
  document.getElementById('purchaseModal').classList.remove('active');
  activeService = null;
}
document.getElementById('purchaseCloseBtn').addEventListener('click', closePurchaseModal);
document.getElementById('purchaseModal').addEventListener('click', function(e){ if(e.target===this) closePurchaseModal(); });

document.getElementById('psBuyBtn').addEventListener('click', async function(){
  if(!activeService || !currentCountry || isBuying) return;
  if(!currentUserId){
    showToast('Please sign in to buy a number','error');
    setTimeout(() => window.location.href = 'auth.html', 900);
    return;
  }
  const price = parseFloat(activeService.price) || 0;
  const balCheck = await refreshBalance();
  if(!balCheck.ok){
    showToast('Could not verify your balance: ' + balCheck.reason, 'error');
    return;
  }
  if(currentBalanceNgn < price){
    showToast('Insufficient balance. Redirecting to deposit...', 'error');
    setTimeout(() => window.location.href = 'dashboard.html#deposit', 900);
    return;
  }

  const btn = this;
  isBuying = true;
  btn.disabled = true;
  const originalLabel = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Purchasing...';

  try{
    const res = await fetch('/api/grizzly-sync?action=order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        country_id: currentCountry.country_id,
        service_id: activeService.service_id,
        user_id: currentUserId,
        external_order_id: 'MJ-GZ-' + Date.now() + '-' + Math.random().toString(36).slice(2,7)
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      showToast(data.message || 'Purchase failed. Please try again.', 'error');
      return;
    }
    showToast('Number purchased! Redirecting...', 'success');
    setTimeout(() => {
      window.location.href = 'mj-sms-number.html?order_id=' + encodeURIComponent(data.data.order_id);
    }, 600);
  }catch(err){
    showToast('Network error: ' + (err.message || err), 'error');
  }finally{
    isBuying = false;
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
});

initSession();
loadCountries();
</script>

<script>
(function(){
  function paint(){
    if(!window.mjSkeleton && !window.MJSkeleton) return;
    var mjSkeleton = window.mjSkeleton || window.MJSkeleton;
    var nodes = document.querySelectorAll('[data-skel], #countryList, #serviceGrid, #list, #catalog, #servicesGrid, #productsGrid, #orderList');
    nodes.forEach(function(el){
      if(el.dataset.skelReady) return;
      var type = el.getAttribute('data-skel') || (el.id && /list|order/i.test(el.id) ? 'cards' : 'grid');
      el.innerHTML = (mjSkeleton[type] || mjSkeleton.grid)(type === 'cards' ? 3 : 6);
      el.dataset.skelReady = '1';
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);
  else paint();
  // retry once scripts loaded
  setTimeout(paint, 50);
})();
</script>

</body>
