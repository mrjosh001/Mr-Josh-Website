name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure API routes exist
        run: |
          set -e
          test -f api/admin.js
          test -f api/owlet.js
          # PocketFi was consolidated into the deposit route; Vercel rewrites
          # /api/pocketfi and related legacy endpoints to /api/deposit.
          test -f api/deposit.js
          test -f api/order.js
          if [ -f api/products.js ]; then node --check api/products.js; fi

      - name: Block service role JWT in HTML
        run: |
          if grep -R -nE "SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*['\"]eyJ" --include="*.html" . ; then
            echo "Service role JWT must not appear in HTML"
            exit 1
          fi
          echo "OK"

      - name: Syntax check all JavaScript source files
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            echo "check $f"
            node --check "$f"
            count=$((count + 1))
          done < <(find . -type f \\( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \\) \\
            -not -path './.git/*' -not -path './node_modules/*' -print0)
          if [ "$count" -eq 0 ]; then
            echo "No JavaScript source files matched"
            exit 1
          fi
          echo "Syntax OK: checked $count JavaScript files"
