name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure API routes exist
        run: |
          test -f api/admin.js
          test -f api/owlet.js
          test -f api/pocketfi.js
          test -f api/order.js
          if [ -f api/products.js ]; then node --check api/products.js; fi

      - name: Block service role JWT in HTML
        run: |
          if grep -R -nE "SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*['\"]eyJ" --include="*.html" . ; then
            echo "Service role JWT must not appear in HTML"
            exit 1
          fi
          echo "OK"

      - name: Syntax check API and lib JS
        run: |
          set -e
          shopt -s nullglob
          files=(api/*.js lib/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JS files matched"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "check $f"
            node --check "$f"
          done
          echo "Syntax OK"
