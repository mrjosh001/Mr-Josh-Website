name: Apply eSIM dashboard patch 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch when ready
        run: |
          if [ ! -f .esim-patch-ready ]; then exit 0; fi
          curl -fsSL 'https://sb-6k3mkjb457n6.vercel.run/esim-dashboard.patch' -o /tmp/esim-dashboard.patch
          git apply --binary /tmp/esim-dashboard.patch
          rm -f .esim-patch-ready .github/workflows/apply-esim-dashboard-patch.yml .github/workflows/apply-esim-dashboard-patch2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add dedicated eSIM orders to dashboard'
          git push origin HEAD:main
