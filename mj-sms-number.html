<script>
// Force all date/time displays to Nigeria time (WAT, Africa/Lagos),
// regardless of the viewer's device timezone — keeps order timestamps
// consistent for admins and users everywhere, so orders sort/display
// the same way no matter where someone is looking from.
(function () {
  var _toLocaleString = Date.prototype.toLocaleString;
  var _toLocaleDateString = Date.prototype.toLocaleDateString;
  var _toLocaleTimeString = Date.prototype.toLocaleTimeString;
  function withLagos(opts) { return Object.assign({ timeZone: 'Africa/Lagos' }, opts || {}); }
  Date.prototype.toLocaleString = function (locales, opts) { return _toLocaleString.call(this, locales || 'en-NG', withLagos(opts)); };
  Date.prototype.toLocaleDateString = function (locales, opts) { return _toLocaleDateString.call(this, locales || 'en-NG', withLagos(opts)); };
  Date.prototype.toLocaleTimeString = function (locales, opts) { return _toLocaleTimeString.call(this, locales || 'en-NG', withLagos(opts)); };
})();
</script>

// Grizzly reservation window (~20 min). After this with no code → auto refund.
const EXPIRY_SECONDS = 20 * 60;
// Cancel lock — "Available in" countdown beside Cancel (5 minutes).
const CANCEL_COOLDOWN_SECONDS = 5 * 60;

function escapeHtml(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function money(n){return '₦'+Number(n||0).toLocaleString()}
function showToast(msg,type){const t=document.createElement('div');t.className='toast'+(type==='error'?' error':'');t.innerHTML='<span>'+(type==='error'?'❌':'✅')+'</span><span>'+escapeHtml(msg)+'</span>';toastContainer.appendChild(t);setTimeout(()=>t.remove(),3500)}

function formatCountdown(seconds){
  if(seconds <= 0) return '0:00';
  const m = Math.floor(seconds/60);
  const s = seconds%60;
  return m+':'+String(s).padStart(2,'0');
}

function stopCountdown(){
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null;
}
function stopCancelCooldown(){
  if(cancelCooldownTimer) clearInterval(cancelCooldownTimer);
  cancelCooldownTimer = null;
}

function updateCancelButtonState(){
  const btn = document.getElementById('cancelBtn');
  const avail = document.getElementById('cancelAvailable');
  const hint = document.getElementById('cancelHint');
  if(!btn) return;
  if(cancelling) return;

  const startMs = orderCreatedAt ? new Date(orderCreatedAt).getTime() : Date.now();
  const elapsed = Math.floor((Date.now() - startMs) / 1000);
  const waitLeft = CANCEL_COOLDOWN_SECONDS - elapsed;

  // Grizzly-style: Cancel button stays labeled "Cancel"; countdown sits beside it
  btn.innerHTML = 'Cancel';
  if(waitLeft > 0){
    btn.disabled = true;
    if(avail){
      avail.style.display = '';
      avail.innerHTML = 'Available in : <strong>' + formatCountdown(waitLeft) + '</strong>';
    }
    if(hint) hint.textContent = '';
  } else {
    btn.disabled = false;
    if(avail){
      avail.style.display = 'none';
      avail.innerHTML = '';
    }
    if(hint) hint.textContent = 'No code yet? Cancel to restore your balance.';
  }
}

function startCancelCooldown(){
  stopCancelCooldown();
  updateCancelButtonState();
  cancelCooldownTimer = setInterval(updateCancelButtonState, 1000);
}

function startCountdown(createdAt){
  stopCountdown();
  orderCreatedAt = createdAt || orderCreatedAt || new Date().toISOString();
  const startMs = new Date(orderCreatedAt).getTime();
  function tick(){
    const elapsed = Math.floor((Date.now() - startMs) / 1000);
    const remaining = EXPIRY_SECONDS - elapsed;
    const label = document.getElementById('countdownValue');
    if(!label) { stopCountdown(); return; }
    if(remaining <= 0){
      label.textContent = 'Expired — refunding…';
      // Auto-refund once when countdown ends and still no code
      if(!autoRefundStarted && !cancelling){
        autoRefundStarted = true;
        autoRefundOnExpiry();
      }
      return;
    }
    label.textContent = formatCountdown(remaining);
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
  startCancelCooldown();
}

async function autoRefundOnExpiry(){
  if(!orderId || !currentUserId) return;
  stopPolling();
  const btn = document.getElementById('cancelBtn');
  if(btn){
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Refunding…';
  }
  try{
    const res = await fetch('/api/grizzly-sync?action=cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
    });
    const data = await res.json();
    if(res.ok && data.success){
      showToast('Time expired — balance restored', 'success');
      renderCancelled('Time ran out with no SMS. Your balance has been restored.');
      return;
    }
    // If supplier already cancelled / check can refund
    const check = await fetch('/api/grizzly-sync?action=check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
    });
    const checkData = await check.json();
    if(check.ok && checkData.success && checkData.data?.status === 'refunded'){
      showToast('Balance restored', 'success');
      renderCancelled('No SMS received. Your balance has been restored.');
      return;
    }
    if(check.ok && checkData.success && checkData.data?.status === 'completed' && checkData.data?.code){
      renderCompleted(checkData.data);
      return;
    }
    showToast(data.message || 'Could not auto-refund yet. Try Cancel or Check again.', 'error');
    autoRefundStarted = false;
    pollTimer = setTimeout(checkStatus, 5000);
  }catch(err){
    autoRefundStarted = false;
    showToast('Network error during refund. Try Cancel.', 'error');
    pollTimer = setTimeout(checkStatus, 6000);
  }
}

  document.getElementById('cancelBtn').addEventListener('click', cancelOrder);

function renderCompleted(data){
  stopPolling();
  stopCountdown();
  stopCancelCooldown();
  const serviceLabel = (data.service_name || '').replace(/_/g,' ');
  statusCard.innerHTML = `
    <div class="status-icon success"><i class="fa-solid fa-circle-check"></i></div>
    <div class="status-title">Code Received!</div>
    <div class="status-sub">Copy the code below and use it to complete verification. This order is complete — no cancel or refund.</div>
    <div class="number-display" style="text-transform:capitalize;">
      <div class="label">Service</div>
      <div class="value" style="font-size:16px;">${escapeHtml(serviceLabel || '—')}${data.country_name ? ' · ' + escapeHtml(data.country_name) : ''}</div>
    </div>
    <div class="number-display">
      <div class="label">Number</div>
      <div class="value">${escapeHtml(data.number || data.phone_number || '—')}</div>
    </div>
    <div class="number-display">
      <div class="label">Price</div>
      <div class="value" style="font-size:16px;color:var(--primary);">${money(data.price)}</div>
    </div>
    <div class="code-display">
      <div class="label">Verification Code</div>
      <div class="value" id="codeValue">${escapeHtml(data.code || '—')}</div>
    </div>
    <button type="button" class="btn btn-primary" id="copyCodeBtn"><i class="fa-solid fa-copy"></i> Copy Code</button>
    <a href="mj-sms.html" class="btn btn-outline">Buy Another Number</a>
    <a href="dashboard.html" class="btn btn-outline">Back to Home</a>
  `;
  document.getElementById('copyCodeBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(data.code || '');
    showToast('Code copied!', 'success');
  });
}

function renderCancelled(msg){
  stopPolling();
  stopCountdown();
  stopCancelCooldown();
  statusCard.innerHTML = `
    <div class="status-icon cancelled"><i class="fa-solid fa-circle-xmark"></i></div>
    <div class="status-title">Balance Restored</div>
    <div class="status-sub">${escapeHtml(msg || 'This number was cancelled and your wallet balance has been restored.')}</div>
    <a href="mj-sms.html" class="btn btn-primary">Buy Another Number</a>
    <a href="dashboard.html" class="btn btn-outline">Back to Home</a>
  `;
}

function renderError(msg){
  stopPolling();
  stopCountdown();
  stopCancelCooldown();
  statusCard.innerHTML = `
    <div class="status-icon cancelled"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="status-title">Something went wrong</div>
    <div class="status-sub">${escapeHtml(msg)}</div>
    <a href="mj-sms.html" class="btn btn-primary">Back to MJ SMS</a>
    <a href="dashboard.html" class="btn btn-outline">Back to Home</a>
  `;
}

function stopPolling(){
  if(pollTimer) clearTimeout(pollTimer);
  pollTimer = null;
}

async function checkStatus(){
  if(!orderId || !currentUserId) return;
  try{
    const res = await fetch('/api/grizzly-sync?action=check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      renderError(data.message || 'Could not check this order.');
      return;
    }
    const status = data.data.status;
    if(data.data.created_at) orderCreatedAt = data.data.created_at;

    if(status === 'completed' && data.data.code){
      renderCompleted(data.data);
    } else if(status === 'refunded' || data.data.refunded){
      renderCancelled('No SMS received. Your balance has been restored.');
    } else {
      // Avoid full re-render every poll (keeps countdown smooth) if already waiting
      const existingCountdown = document.getElementById('countdownValue');
      if(!existingCountdown){
        renderWaiting(data.data);
      } else {
        // keep polling only
      }
      pollTimer = setTimeout(checkStatus, 5000);
    }
  }catch(err){
    pollTimer = setTimeout(checkStatus, 6000);
  }
}

async function checkNow(){
  if(checkingNow) return;
  checkingNow = true;
  stopPolling();
  const btn = document.getElementById('checkNowBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...'; }
  // Force full refresh path
  const res = await fetch('/api/grizzly-sync?action=check', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
  }).catch(() => null);
  checkingNow = false;
  if(!res){
    showToast('Network error', 'error');
    pollTimer = setTimeout(checkStatus, 5000);
    return;
  }
  const data = await res.json();
  if(!res.ok || !data.success){
    showToast(data.message || 'Check failed', 'error');
    pollTimer = setTimeout(checkStatus, 5000);
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Check for SMS Now'; }
    return;
  }
  const status = data.data.status;
  if(status === 'completed' && data.data.code){
    renderCompleted(data.data);
  } else if(status === 'refunded' || data.data.refunded){
    renderCancelled('No SMS received. Your balance has been restored.');
  } else {
    renderWaiting(data.data);
    pollTimer = setTimeout(checkStatus, 5000);
  }
}

async function cancelOrder(){
  if(cancelling || !orderId || !currentUserId) return;

  const startMs = orderCreatedAt ? new Date(orderCreatedAt).getTime() : 0;
  const elapsed = startMs ? Math.floor((Date.now() - startMs) / 1000) : CANCEL_COOLDOWN_SECONDS;
  if(elapsed < CANCEL_COOLDOWN_SECONDS){
    const left = CANCEL_COOLDOWN_SECONDS - elapsed;
    showToast('Cancel available in ' + formatCountdown(left), 'error');
    return;
  }

  cancelling = true;
  stopPolling();
  const btn = document.getElementById('cancelBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cancelling...'; }
  try{
    const res = await fetch('/api/grizzly-sync?action=cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      if(data.code === 'EARLY_CANCEL_DENIED'){
        showToast(data.message || 'Cancel not available yet — wait a bit longer.', 'error');
      } else if(data.code === 'NUMBER_CODE_ALREADY_RECEIVED'){
        showToast('Code already received — cannot cancel.', 'error');
        await checkStatus();
        cancelling = false;
        return;
      } else {
        showToast(data.message || 'Could not cancel this order.', 'error');
      }
      cancelling = false;
      updateCancelButtonState();
      pollTimer = setTimeout(checkStatus, 5000);
      return;
    }
    showToast('Cancelled — balance restored', 'success');
    renderCancelled('Number cancelled. Your balance has been restored.');
  }catch(err){
    showToast('Network error: ' + (err.message || err), 'error');
    cancelling = false;
    pollTimer = setTimeout(checkStatus, 5000);
  }
}

async function init(){
  if(!orderId){ renderError('No order specified.'); return; }
  if(!window.supabase){ renderError('Failed to load Supabase.'); return; }
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
});
  const { data: { session } } = await sbClient.auth.getSession();
  if(!session || !session.user){
    showToast('Please sign in', 'error');
    setTimeout(() => window.location.href = 'auth.html', 900);
    return;
  }
  currentUserId = session.user.id;
  checkStatus();
}

init();
</script>
