<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Get Number - MJ HUB</title>
<script>
(function(){try{var t=localStorage.getItem('mjhub-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{--primary:#5b8af5;--primary-strong:#3b6ef5;--primary-glow:rgba(91,138,245,.28);--accent:#a78bfa;--bg:#06080f;--card:#0f1524;--text:#f1f5f9;--muted:#8b9bb4;--border:rgba(148,163,184,.12);--success:#34d399;--danger:#f87171;--shadow:0 18px 50px rgba(0,0,0,.45);}
:root[data-theme="light"]{--primary:#3b6ef5;--primary-strong:#2554e8;--primary-glow:rgba(59,110,245,.18);--accent:#7c5cfc;--bg:#f4f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:rgba(15,23,42,.08);--success:#059669;--danger:#dc2626;--shadow:0 16px 40px rgba(15,23,42,.08);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 80% 50% at 10% -10%,rgba(91,138,245,.12),transparent 50%),radial-gradient(ellipse 60% 40% at 100% 0%,rgba(167,139,250,.08),transparent 45%)}
.header,.main-content,.toast-container{position:relative;z-index:1}
.header{padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.back-button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.page-title{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.main-content{padding:16px;max-width:520px;margin:0 auto}
.status-card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:28px 22px;text-align:center;margin-bottom:16px;}
.status-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;}
.status-icon.waiting{background:var(--primary-glow);color:var(--primary);}
.status-icon.success{background:rgba(52,211,153,.15);color:var(--success);}
.status-icon.cancelled{background:rgba(248,113,113,.15);color:var(--danger);}
.status-title{font-size:18px;font-weight:800;margin-bottom:6px;}
.status-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.number-display{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
.number-display .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:6px;}
.number-display .value{font-size:22px;font-weight:800;font-family:monospace;letter-spacing:.02em;word-break:break-all;}
.code-display{background:linear-gradient(135deg,rgba(52,211,153,.15),rgba(52,211,153,.05));border:1px solid rgba(52,211,153,.3);border-radius:14px;padding:20px;margin-bottom:14px;}
.code-display .label{font-size:11px;color:var(--success);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:8px;}
.code-display .value{font-size:32px;font-weight:800;font-family:monospace;letter-spacing:.08em;color:var(--success);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);animation:pulse 1.4s ease-in-out infinite;margin-right:6px;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.btn{width:100%;padding:14px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:inherit;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-strong));color:#fff;}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(248,113,113,.4);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.toast-container{position:fixed;top:76px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--success);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;max-width:280px;pointer-events:all;box-shadow:var(--shadow);color:var(--text)}
.toast.error{border-color:var(--danger)}
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<header class="header">
<a href="mj-sms.html" class="back-button"><i class="fa-solid fa-arrow-left"></i></a>
<h1 class="page-title">Get Number</h1>
</header>
<main class="main-content">
<div class="status-card" id="statusCard">
<div class="spinner"></div>
<div class="status-title">Loading order...</div>
</div>
</main>

<script>
const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';

const statusCard = document.getElementById('statusCard');
const toastContainer = document.getElementById('toastContainer');
const params = new URLSearchParams(window.location.search);
const orderId = params.get('order_id');

let sbClient = null;
let currentUserId = null;
let pollTimer = null;
let countdownTimer = null;
let cancelling = false;
let checkingNow = false;
// GrizzlySMS (sms-activate-compatible) numbers are reserved for 20 minutes
// before the supplier auto-releases them if no code arrives. Adjust this if
// your supplier account's actual reservation window differs.
const EXPIRY_SECONDS = 20 * 60;

function escapeHtml(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function money(n){return '₦'+Number(n||0).toLocaleString()}
function showToast(msg,type){const t=document.createElement('div');t.className='toast'+(type==='error'?' error':'');t.innerHTML='<span>'+(type==='error'?'❌':'✅')+'</span><span>'+escapeHtml(msg)+'</span>';toastContainer.appendChild(t);setTimeout(()=>t.remove(),3500)}

function formatCountdown(seconds){
  if(seconds <= 0) return '0:00';
  const m = Math.floor(seconds/60);
  const s = seconds%60;
  return m+':'+String(s).padStart(2,'0');
}

function startCountdown(createdAt){
  stopCountdown();
  const startMs = createdAt ? new Date(createdAt).getTime() : Date.now();
  const el = document.getElementById('countdownValue');
  if(!el) return;
  function tick(){
    const elapsed = Math.floor((Date.now() - startMs) / 1000);
    const remaining = EXPIRY_SECONDS - elapsed;
    const label = document.getElementById('countdownValue');
    if(!label) { stopCountdown(); return; }
    if(remaining <= 0){
      label.textContent = 'Expired — still checking…';
      return;
    }
    label.textContent = formatCountdown(remaining);
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}
function stopCountdown(){
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null;
}

function renderWaiting(data){
  const serviceLabel = (data.service_name || '').replace(/_/g,' ');
  statusCard.innerHTML = `
    <div class="status-icon waiting"><i class="fa-solid fa-mobile-screen"></i></div>
    <div class="status-title">Waiting for code</div>
    <div class="status-sub"><span class="pulse-dot"></span>We'll show the code here the moment it arrives — usually within a minute or two.</div>
    <div class="number-display" style="text-transform:capitalize;">
      <div class="label">Service</div>
      <div class="value" style="font-size:16px;">${escapeHtml(serviceLabel || '—')}${data.country_name ? ' · ' + escapeHtml(data.country_name) : ''}</div>
    </div>
    <div class="number-display">
      <div class="label">Your Number</div>
      <div class="value">${escapeHtml(data.number || '—')}</div>
    </div>
    <div class="number-display">
      <div class="label">Price</div>
      <div class="value" style="font-size:16px;color:var(--primary);">${money(data.price)}</div>
    </div>
    <div class="number-display" style="margin-bottom:14px;">
      <div class="label">Time Remaining</div>
      <div class="value" id="countdownValue" style="color:var(--primary);">--:--</div>
    </div>
    <button type="button" class="btn btn-outline" id="checkNowBtn"><i class="fa-solid fa-rotate"></i> Check for SMS Now</button>
    <button type="button" class="btn btn-danger" id="cancelBtn">Cancel</button>
    <a href="mj-sms.html" class="btn btn-outline">Back to MJ SMS</a>
    <a href="index.html" class="btn btn-outline">Back to Home</a>
  `;
  document.getElementById('cancelBtn').addEventListener('click', cancelOrder);
  document.getElementById('checkNowBtn').addEventListener('click', checkNow);
  startCountdown(data.created_at);
}

function renderCompleted(data){
  stopPolling();
  stopCountdown();
  const serviceLabel = (data.service_name || '').replace(/_/g,' ');
  statusCard.innerHTML = `
    <div class="status-icon success"><i class="fa-solid fa-circle-check"></i></div>
    <div class="status-title">Code Received!</div>
    <div class="status-sub">Copy the code below and use it to complete verification.</div>
    <div class="number-display" style="text-transform:capitalize;">
      <div class="label">Service</div>
      <div class="value" style="font-size:16px;">${escapeHtml(serviceLabel || '—')}${data.country_name ? ' · ' + escapeHtml(data.country_name) : ''}</div>
    </div>
    <div class="number-display">
      <div class="label">Number</div>
      <div class="value">${escapeHtml(data.number || '—')}</div>
    </div>
    <div class="number-display">
      <div class="label">Price</div>
      <div class="value" style="font-size:16px;color:var(--primary);">${money(data.price)}</div>
    </div>
    <div class="code-display">
      <div class="label">Verification Code</div>
      <div class="value" id="codeValue">${escapeHtml(data.code || '—')}</div>
    </div>
    <button type="button" class="btn btn-primary" id="copyCodeBtn"><i class="fa-solid fa-copy"></i> Copy Code</button>
    <a href="mj-sms.html" class="btn btn-outline">Buy Another Number</a>
    <a href="index.html" class="btn btn-outline">Back to Home</a>
  `;
  document.getElementById('copyCodeBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(data.code || '');
    showToast('Code copied!', 'success');
  });
}

function renderCancelled(){
  stopPolling();
  stopCountdown();
  statusCard.innerHTML = `
    <div class="status-icon cancelled"><i class="fa-solid fa-circle-xmark"></i></div>
    <div class="status-title">Order Cancelled</div>
    <div class="status-sub">This number was cancelled and your balance has been refunded.</div>
    <a href="mj-sms.html" class="btn btn-primary">Buy Another Number</a>
    <a href="index.html" class="btn btn-outline">Back to Home</a>
  `;
}

function renderError(msg){
  stopPolling();
  stopCountdown();
  statusCard.innerHTML = `
    <div class="status-icon cancelled"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="status-title">Something went wrong</div>
    <div class="status-sub">${escapeHtml(msg)}</div>
    <a href="mj-sms.html" class="btn btn-primary">Back to MJ SMS</a>
    <a href="index.html" class="btn btn-outline">Back to Home</a>
  `;
}

function stopPolling(){
  if(pollTimer) clearTimeout(pollTimer);
  pollTimer = null;
}

async function checkStatus(){
  if(!orderId || !currentUserId) return;
  try{
    const res = await fetch('/api/grizzly-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      renderError(data.message || 'Could not check this order.');
      return;
    }
    const status = data.data.status;
    if(status === 'completed' && data.data.code){
      renderCompleted(data.data);
    } else if(status === 'refunded'){
      renderCancelled();
    } else {
      renderWaiting(data.data);
      pollTimer = setTimeout(checkStatus, 5000);
    }
  }catch(err){
    // Network hiccup — keep trying rather than dead-ending the page.
    pollTimer = setTimeout(checkStatus, 6000);
  }
}

async function checkNow(){
  if(checkingNow) return;
  checkingNow = true;
  stopPolling();
  const btn = document.getElementById('checkNowBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...'; }
  await checkStatus();
  checkingNow = false;
}

async function cancelOrder(){
  if(cancelling || !orderId || !currentUserId) return;
  cancelling = true;
  stopPolling();
  const btn = document.getElementById('cancelBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cancelling...'; }
  try{
    const res = await fetch('/api/grizzly-cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      showToast(data.message || 'Could not cancel this order.', 'error');
      cancelling = false;
      pollTimer = setTimeout(checkStatus, 5000);
      return;
    }
    showToast('Cancelled and refunded', 'success');
    renderCancelled();
  }catch(err){
    showToast('Network error: ' + (err.message || err), 'error');
    cancelling = false;
    pollTimer = setTimeout(checkStatus, 5000);
  }
}

async function init(){
  if(!orderId){ renderError('No order specified.'); return; }
  if(!window.supabase){ renderError('Failed to load Supabase.'); return; }
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await sbClient.auth.getSession();
  if(!session || !session.user){
    showToast('Please sign in', 'error');
    setTimeout(() => window.location.href = 'auth.html', 900);
    return;
  }
  currentUserId = session.user.id;
  checkStatus();
}

init();
</script>
</body>
</html>
