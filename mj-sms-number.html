/** Split full MSISDN into dial code + national number. Copy uses national only. */
function splitPhoneDisplay(raw, countryName) {
  var digits = String(raw || '').replace(/\D/g, '');
  var cn = String(countryName || '').toLowerCase().replace(/\s+/g, ' ').trim();
  var dialMap = {
    'united states':'1','usa':'1','us':'1','usa (2)':'1','canada':'1','ca':'1',

    'slovakia':'421','slovenia':'386','cyprus':'357','georgia':'995','armenia':'374','azerbaijan':'994'
  };
  var dial = '';
  if (cn && dialMap[cn]) dial = dialMap[cn];
  else {
    for (var k in dialMap) {
      if (cn.indexOf(k) === 0 || k.indexOf(cn) === 0) { dial = dialMap[k]; break; }
    }
  }
  var national = digits;
  if (dial && digits.indexOf(dial) === 0 && digits.length > dial.length + 4) {
    national = digits.slice(dial.length);
  } else if (!dial && digits.length > 10) {
    if (digits.charAt(0) === '1' && digits.length === 11) { dial = '1'; national = digits.slice(1); }

  };

function formatCountdown(seconds){
  if(seconds <= 0) return '0:00';
  const m = Math.floor(seconds/60);
  const s = seconds%60;
  return m+':'+String(s).padStart(2,'0');
}

function stopCountdown(){
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null;
}
function stopCancelCooldown(){
  if(cancelCooldownTimer) clearInterval(cancelCooldownTimer);
  cancelCooldownTimer = null;
}

function updateCancelButtonState(){
  const btn = document.getElementById('cancelBtn');
  const avail = document.getElementById('cancelAvailable');
  const hint = document.getElementById('cancelHint');
  if(!btn) return;
  if(cancelling) return;

  const startMs = orderCreatedAt ? new Date(orderCreatedAt).getTime() : Date.now();
  const elapsed = Math.floor((Date.now() - startMs) / 1000);
  const waitLeft = CANCEL_COOLDOWN_SECONDS - elapsed;

  btn.innerHTML = 'Cancel';
  if(waitLeft > 0){
    btn.disabled = true;
    if(avail){
      avail.style.display = '';
      avail.innerHTML = 'Available in : <strong>' + formatCountdown(waitLeft) + '</strong>';
    }
    if(hint) hint.textContent = '';
  } else {
    btn.disabled = false;
    if(avail){
      avail.style.display = 'none';
      avail.innerHTML = '';
    }
    if(hint) hint.textContent = 'No code yet? Cancel to restore your balance.';
  }
}

function startCancelCooldown(){

function startCountdown(createdAt){
  stopCountdown();

  function tick(){
    const elapsed = Math.floor((Date.now() - startMs) / 1000);
    const remaining = EXPIRY_SECONDS - elapsed;
    const label = document.getElementById('countdownValue');
    if(!label) { stopCountdown(); return; }

    if(bar){
      const frac = Math.max(0, Math.min(1, remaining / EXPIRY_SECONDS));
      bar.style.transform = 'scaleX(' + frac + ')';

      label.textContent = 'Expired — refunding…';
      if(bar) bar.style.transform = 'scaleX(0)';
      if(!autoRefundStarted && !cancelling){
        autoRefundStarted = true;
        autoRefundOnExpiry();
      }
      return;
    }
    label.textContent = formatCountdown(remaining);
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
  startCancelCooldown();
}

async function autoRefundOnExpiry(){
  if(!orderId || !currentUserId) return;
  stopPolling();
  const btn = document.getElementById('cancelBtn');
  if(btn){
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Refunding…';
  }
  try{
    const res = await fetch(API + '?action=cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
    });
    const data = await res.json();
    if(res.ok && data.success){
      showToast('Time expired — balance restored', 'success');
      renderCancelled('Time ran out with no SMS. Your balance has been restored.');
      return;
    }
    // If service already cancelled / check can refund
    const check = await fetch(API + '?action=check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
    });
    const checkData = await check.json();
    if(check.ok && checkData.success && isRefundedStatus(checkData.data)){
      showToast('Balance restored', 'success');
      renderCancelled('No SMS received. Your balance has been restored.');
      return;
    }
    if(check.ok && checkData.success && checkData.data?.status === 'completed' && checkData.data?.code){
      renderCompleted(checkData.data);
      return;
    }
    showToast(data.message || 'Could not auto-refund yet. Try Cancel or Check again.', 'error');
    autoRefundStarted = false;
    pollTimer = setTimeout(checkStatus, 5000);
  }catch(err){
    autoRefundStarted = false;
    showToast('Network error during refund. Try Cancel.', 'error');
    pollTimer = setTimeout(checkStatus, 6000);
  }
}

function infoBlocks(data){
  const serviceLabel = (data.service_name || '').replace(/_/g,' ');
  return `
    <div class="n3-grid">
      <div class="n3-card">
        <div class="n3-lab">Service</div>
        <div class="n3-val">${escapeHtml(serviceLabel || '—')}</div>
        ${data.country_name ? '<div class="n3-sub">' + escapeHtml(data.country_name) + '</div>' : ''}
      </div>
      <div class="n3-card">
        <div class="n3-lab">Paid</div>
        <div class="n3-val ac">${money(data.price)}</div>
      </div>
    </div>`;
}

function bindCopyPhone(){
  var _cp = document.getElementById('copyPhoneBtn');
  if (_cp) {
    _cp.addEventListener('click', function () {
      var n = (document.getElementById('phoneValue') && document.getElementById('phoneValue').textContent) || '';
      n = String(n).replace(/\s/g, '');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(n).then(function () { showToast('Number copied', 'success'); });
      }
    });
  }
}

function renderWaiting(data){
  if(data.created_at) orderCreatedAt = data.created_at;
  applyCancelCooldownFromOrder(data);
  statusCard.className = 'n3';
  statusCard.innerHTML = `
    <div class="n3-state">
      <div class="n3-live"><i class="fa-solid fa-mobile-screen"></i></div>
      <div>
        <div class="n3-st">Waiting for code</div>
        <div class="n3-ss">Keep this page open. Your code appears here the moment it arrives, usually within a minute or two.</div>
      </div>
    </div>
    ${phoneBlockHtml(data.number || data.phone_number || '', data.country_name || '')}
    ${infoBlocks(data)}
    <div class="n3-card">
      <div class="n3-lab">Time remaining</div>
      <div class="n3-time" id="countdownValue">--:--</div>
      <div class="n3-track mj-wait-track" aria-hidden="true"><div class="n3-bar mj-wait-bar" id="mjWaitBar" style="transform:scaleX(1)"></div></div>
    </div>
    <button type="button" class="n3-btn n3-primary" id="checkNowBtn"><i class="fa-solid fa-rotate"></i> Check for SMS Now</button>
    <div class="n3-cancel">
      <button type="button" class="n3-btn n3-danger" id="cancelBtn" disabled>Cancel</button>
      <span class="cancel-available" id="cancelAvailable">Available in : <strong>--:--</strong></span>
    </div>
    <div class="cancel-hint" id="cancelHint"></div>
    <div class="n3-tip">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <div><b>Important activation advice</b><span>Use a VPN from the same country as the phone number you're verifying, for smooth delivery.</span></div>
    </div>
    <div class="n3-links">
      <a href="${BACK_PAGE}" class="n3-btn n3-ghost">Back to Server 1</a>
      <a href="dashboard.html" class="n3-btn n3-ghost">Back to Home</a>
    </div>
  `;
  document.getElementById('cancelBtn').addEventListener('click', cancelOrder);
  document.getElementById('checkNowBtn').addEventListener('click', checkNow);
  bindCopyPhone();
  startCountdown(data.created_at || orderCreatedAt);
}

function renderCompleted(data){
  stopPolling();
  stopCountdown();
  stopCancelCooldown();
  const digits = String(data.code || '—').split('').map(function(ch){ return '<span>' + escapeHtml(ch) + '</span>'; }).join('');
  statusCard.className = 'n3';
  statusCard.innerHTML = `
    <div class="n3-state">
      <div class="n3-live" style="background:var(--ok-soft);color:var(--ok)"><i class="fa-solid fa-circle-check"></i></div>
      <div>
        <div class="n3-st">Code received</div>
        <div class="n3-ss">Copy the code and finish your verification. This order is complete, so there is no cancel or refund.</div>
      </div>
    </div>
    <div class="n3-card n3-codecard">
      <div class="n3-lab">Verification code</div>
      <div class="n3-digits" id="codeValue">${digits}</div>
    </div>
    <button type="button" class="n3-btn ok" id="copyCodeBtn"><i class="fa-solid fa-copy"></i> Copy Code</button>
    ${phoneBlockHtml(data.number || data.phone_number || '', data.country_name || '')}
    ${infoBlocks(data)}
    <div class="n3-tip" id="codeSecureAdvice">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <div><b>Protect this account</b><span>
        If this code was for a messaging app (WhatsApp, Telegram, etc.), secure the account first. Add a passkey and email where the app allows it.<br><br>
        Do not rush to send messages. Let the account sit on your phone. Prefer that someone messages you first.<br><br>
        That helps keep the number from getting banned. Enjoy.
      </span></div>
    </div>
    <div class="n3-links">
      <a href="${BACK_PAGE}" class="n3-btn n3-ghost">Buy Another Number</a>
      <a href="dashboard.html" class="n3-btn n3-ghost">Back to Home</a>
    </div>
  `;
  document.getElementById('copyCodeBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(data.code || '');
    showToast('Code copied!', 'success');
  });
  bindCopyPhone();
}

function renderCancelled(msg){
  stopPolling();
  stopCountdown();
  stopCancelCooldown();
  statusCard.className = 'n3-card n3-center';
  statusCard.innerHTML = `
    <div class="n3-ico bad"><i class="fa-solid fa-rotate-left"></i></div>
    <h2>Balance restored</h2>
    <p>${escapeHtml(msg || 'This number was cancelled and your wallet balance has been restored.')}</p>
    <div style="display:grid;gap:10px;margin-top:16px">
      <a href="${BACK_PAGE}" class="n3-btn n3-primary">Buy Another Number</a>
      <a href="dashboard.html" class="n3-btn n3-ghost">Back to Home</a>
    </div>
  `;
}

function renderError(msg){
  stopPolling();
  stopCountdown();
  stopCancelCooldown();
  statusCard.className = 'n3-card n3-center';
  statusCard.innerHTML = `
    <div class="n3-ico bad"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h2>Something went wrong</h2>
    <p>${escapeHtml(msg)}</p>
    <div style="display:grid;gap:10px;margin-top:16px">
      <a href="${BACK_PAGE}" class="n3-btn n3-primary">Back to Server 1</a>
      <a href="dashboard.html" class="n3-btn n3-ghost">Back to Home</a>
    </div>
  `;
}

function stopPolling(){
  if(pollTimer) clearTimeout(pollTimer);
  pollTimer = null;
}

function isRefundedStatus(d){
  return d && (d.status === 'refunded' || d.status === 'expired' || d.status === 'cancelled' || d.refunded === true);
}

async function checkStatus(){
  if(!orderId || !currentUserId) return;
  try{
    const res = await fetch(API + '?action=check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      renderError('Could not refresh this number right now. Try again.');
      return;
    }
    const status = data.data.status;
    if(data.data.created_at) orderCreatedAt = data.data.created_at;

    if(status === 'completed' && data.data.code){
      renderCompleted(data.data);
    } else if(isRefundedStatus(data.data)){
      renderCancelled('No SMS received. Your balance has been restored.');
    } else {
      // Avoid full re-render every poll (keeps countdown smooth) if already waiting
      const existingCountdown = document.getElementById('countdownValue');
      if(!existingCountdown){
        renderWaiting(data.data);
      }
      pollTimer = setTimeout(checkStatus, 5000);
    }
  }catch(err){
    pollTimer = setTimeout(checkStatus, 6000);
  }
}

async function checkNow(){
  if(checkingNow) return;
  checkingNow = true;
  stopPolling();
  const btn = document.getElementById('checkNowBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...'; }
  const res = await fetch(API + '?action=check', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
  }).catch(() => null);
  checkingNow = false;
  if(!res){
    showToast('Network error', 'error');
    pollTimer = setTimeout(checkStatus, 5000);
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Check for SMS Now'; }
    return;
  }
  const data = await res.json();
  if(!res.ok || !data.success){
    showToast(data.message || 'Check failed', 'error');
    pollTimer = setTimeout(checkStatus, 5000);
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Check for SMS Now'; }
    return;
  }
  const status = data.data.status;
  if(status === 'completed' && data.data.code){
    renderCompleted(data.data);
  } else if(isRefundedStatus(data.data)){
    renderCancelled('No SMS received. Your balance has been restored.');
  } else {
    renderWaiting(data.data);
    pollTimer = setTimeout(checkStatus, 5000);
  }
}

async function cancelOrder(){
  if(cancelling || !orderId || !currentUserId) return;

  const startMs = orderCreatedAt ? new Date(orderCreatedAt).getTime() : 0;
  const elapsed = startMs ? Math.floor((Date.now() - startMs) / 1000) : CANCEL_COOLDOWN_SECONDS;
  if(elapsed < CANCEL_COOLDOWN_SECONDS){
    const left = CANCEL_COOLDOWN_SECONDS - elapsed;
    showToast('Cancel available in ' + formatCountdown(left), 'error');
    return;
  }

  cancelling = true;
  stopPolling();
  const btn = document.getElementById('cancelBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cancelling...'; }
  try{
    const res = await fetch(API + '?action=cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, user_id: currentUserId })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      if(data.code === 'EARLY_CANCEL_DENIED'){
        showToast(data.message || 'Cancel not available yet — wait a bit longer.', 'error');
      } else if(data.code === 'NUMBER_CODE_ALREADY_RECEIVED'){
        showToast('Code already received — cannot cancel.', 'error');
        cancelling = false;
        await checkStatus();
        return;
      } else {
        if (data && (data.code === 'EARLY_CANCEL_DENIED' || data.wait_seconds != null)) {
          const left = Math.max(1, Number(data.wait_seconds) || 0);
          if (left > 0) CANCEL_COOLDOWN_SECONDS = Math.max(CANCEL_COOLDOWN_SECONDS, left + Math.floor((Date.now() - (orderCreatedAt ? new Date(orderCreatedAt).getTime() : Date.now())) / 1000));
          showToast(data.message || ('Cancel available in ' + formatCountdown(left)), 'error');
        } else {
          showToast(data.message || 'Could not cancel this order.', 'error');
        }
      }
      cancelling = false;
      updateCancelButtonState();
      pollTimer = setTimeout(checkStatus, 5000);
      return;
    }
    showToast('Cancelled — balance restored', 'success');
    renderCancelled('Number cancelled. Your balance has been restored.');
  }catch(err){
    showToast('Network error: ' + (err.message || err), 'error');
    cancelling = false;
    pollTimer = setTimeout(checkStatus, 5000);
  }
}

async function init(){
  if(!orderId){ renderError('No order specified.'); return; }
  if(!window.supabase){ renderError('Failed to load Supabase.'); return; }
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
  });
  const { data: { session } } = await sbClient.auth.getSession();
  if(!session || !session.user){
    showToast('Please sign in', 'error');
    setTimeout(() => window.location.href = 'auth.html', 900);
    return;
  }
  currentUserId = session.user.id;
  checkStatus();
}

init();
</script>
