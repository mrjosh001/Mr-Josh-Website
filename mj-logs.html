// regardless of the viewer's device timezone — keeps order timestamps
// consistent for admins and users everywhere, so orders sort/display
// the same way no matter where someone is looking from.
(function () {
  var _toLocaleString = Date.prototype.toLocaleString;
  var _toLocaleDateString = Date.prototype.toLocaleDateString;
  var _toLocaleTimeString = Date.prototype.toLocaleTimeString;
  function withLagos(opts) { return Object.assign({ timeZone: 'Africa/Lagos' }, opts || {}); }
  Date.prototype.toLocaleString = function (locales, opts) { return _toLocaleString.call(this, locales || 'en-NG', withLagos(opts)); };
  Date.prototype.toLocaleDateString = function (locales, opts) { return _toLocaleDateString.call(this, locales || 'en-NG', withLagos(opts)); };

  'premium vpn for pc': {solid:'fa-solid fa-shield-halved', color:'#0ea5e9'},
  'premium vpn for phone': {solid:'fa-solid fa-shield-halved', color:'#0ea5e9'},
  'random country facebook': {brand:'facebook', color:'#1877F2'},
  'reddit': {brand:'reddit', color:'#FF4500'},
  'snapchat': {brand:'snapchat', color:'#FFFC00', darkGlyph:true},
  'social networks accounts': {solid:'fa-solid fa-users', color:'#6366f1'},
  'streaming site': {solid:'fa-solid fa-play', color:'#8b5cf6'},
  'texting app': {solid:'fa-solid fa-comment-dots', color:'#22c55e'},
  'tiktok/high followers': {brand:'tiktok', color:'#000000'},
  'tutorial/update': {dual:true},
  'x / twitter': {brand:'x', color:'#000000'}
};
// Substring fallback (category, then product name) for anything not in the
// exact list above — new suppliers, renamed categories, future products.
const LOG_ICON_KEYWORDS = [
  ['facebook','facebook','#1877F2'],['instagram','instagram','#E1306C'],
  ['tiktok','tiktok','#000000'],['twitter','x','#000000'],[' x ','x','#000000'],
  ['discord','discord','#5865F2'],['linkedin','linkedin','#0A66C2'],
  ['reddit','reddit','#FF4500'],['snapchat','snapchat','#FFFC00'],
  ['whatsapp','whatsapp','#25D366'],['telegram','telegram','#26A5E4'],
  ['google','google','#4285F4'],['gmail','google','#4285F4'],
  ['apple','apple','#000000'],['spotify','spotify','#1DB954'],
  ['steam','steam','#1B2838'],['twitch','twitch','#9146FF'],
  ['youtube','youtube','#FF0000'],['paypal','paypal','#00457C']
];
const GENERIC_KEYWORDS = [
  ['proxy','fa-solid fa-shield-halved','#0ea5e9'],['vpn','fa-solid fa-shield-halved','#0ea5e9'],
  ['mail','fa-solid fa-envelope','#64748b'],['dating','fa-solid fa-heart','#fb7185'],
  ['game','fa-solid fa-gamepad','#f59e0b'],['stream','fa-solid fa-play','#8b5cf6'],
  ['tutorial','__dual__',null],['update','__dual__',null]
];
function logIcon(category, name){
  const cat = (category||'').toLowerCase().trim();
  if(LOG_ICON_EXACT[cat]) return LOG_ICON_EXACT[cat];
  const n = (name||'').toLowerCase();
  for(const [key, slug, color] of LOG_ICON_KEYWORDS){
    if(cat.includes(key) || n.includes(key)) return {brand:slug, color, gradient: slug==='instagram'};
  }
  for(const [key, cls, color] of GENERIC_KEYWORDS){
    if(cat.includes(key) || n.includes(key)) return cls==='__dual__' ? {dual:true} : {solid:cls, color};
  }
  return null; // unmatched -> generic fallback icon rendered by caller
}
function logIconInnerHtml(icon){
  if(icon.dual) return '<i class="fa-solid fa-screwdriver-wrench"></i><i class="fa-solid fa-arrows-rotate"></i>';
  if(icon.brand){
    const glyphColor = icon.darkGlyph ? '000000' : 'ffffff';
    const fallbackCls = icon.brand==='x' ? 'fa-brands fa-x-twitter' : ('fa-brands fa-'+icon.brand);
    return '<img src="https://cdn.simpleicons.org/'+icon.brand+'/'+glyphColor+'" alt="" '
      + 'onerror="this.replaceWith(Object.assign(document.createElement(\'i\'),{className:\''+fallbackCls+'\'}))" />';
  }
  return '<i class="'+icon.solid+'"></i>';
}
function renderLogIconHtml(category, name, sizeClass){
  const icon = logIcon(category, name);
  const cls = sizeClass || 'log-icon';
  if(!icon) return '<div class="'+cls+' log-icon-fallback"><i class="fa-solid fa-layer-group"></i></div>';
  if(icon.dual) return '<div class="'+cls+' log-icon-dual">'+logIconInnerHtml(icon)+'</div>';
  if(icon.gradient) return '<div class="'+cls+' log-icon-instagram">'+logIconInnerHtml(icon)+'</div>';
  const bg = icon.color ? 'background:'+icon.color : '';
  return '<div class="'+cls+'" style="'+bg+'">'+logIconInnerHtml(icon)+'</div>';
}

/* Always prefer display_description for customers */
function getDisplayDescription(p){
return cleanText(p.display_description || p.description || '');
}
function getAccountFormat(p){
return p.account_format || p.accountFormat || p.format || p.delivery_format || p.product_format || '';
}
function buildCartItem(p, qty){
qty = Math.max(1, parseInt(qty,10)||1);
const key = p.product_key || null;
const source = p.source || (String(key || '').startsWith('ld_') ? 'logsdomain' : 'fadded');
return {
product_id: p.id || null,
product_key: key,
product_code: p.product_code || p.code || p.sku || key || null,
title: cleanText(p.name || 'Product'),
price: (parseFloat(p.price)||0) * qty,
unit_price: parseFloat(p.price)||0,
type: 'log',
subtitle: getDisplayDescription(p).slice(0,120),
category: p.category || 'Others',
quantity: qty,
account_format: getAccountFormat(p) || null,
source: source
};
}

/* Combines the active category filter with the search box query */
function getFilteredProducts(){
const c = categoryFilter.value;
let list = c==='all' ? allProducts : allProducts.filter(p=>(p.category||'').trim()===c);
if(searchQuery){
const q = searchQuery.toLowerCase();
list = list.filter(p=>
cleanText(p.name||'').toLowerCase().includes(q) ||
getDisplayDescription(p).toLowerCase().includes(q) ||
(p.category||'').toLowerCase().includes(q)
);
}
// Within a specific category, show cheapest first — makes it easy to
// compare options at a glance instead of a random/insertion order.
// "All Categories" stays grouped by category (unsorted by price) since
// interleaving every category by price would break that grouping.
if(c!=='all'){
list = [...list].sort((a,b) => (parseFloat(a.price)||0) - (parseFloat(b.price)||0));
}
return list;
}

async function loadProducts(){
try{
setStatus('Connecting to database...');
if(!window.supabase){showError('Supabase library did not load.');return}
if(!sbClient) sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
});
const sb = sbClient;
setStatus('Fetching products...');
const {data:products,error} = await sb.from('products').select('*').eq('is_available',true).order('category',{ascending:true});
if(error){showError('Database error: '+error.message);return}
if(!products||!products.length){
productGrid.innerHTML='<div class="empty-state"><div class="empty-state-icon">📦</div><h4>No Products</h4><p>Check back later</p></div>';
categoryFilter.innerHTML='<option value="all">No categories</option>';
return;
}
allProducts = products;
const categories = [...new Set(products.map(p=>(p.category||'').trim()).filter(Boolean))].sort();
categoryFilter.innerHTML='<option value="all">All Categories ('+products.length+')</option>';
categories.forEach(cat=>{
const count=products.filter(p=>(p.category||'').trim()===cat).length;
const opt=document.createElement('option');opt.value=cat;opt.textContent=cat+' ('+count+')';categoryFilter.appendChild(opt);
});
renderProducts(getFilteredProducts());
}catch(err){showError('Unexpected error: '+(err.message||err))}
}

async function refreshBalance(){
if(!currentUserId || !sbClient) return currentBalanceNgn;
try{
const { data, error } = await sbClient.from('profiles').select('balance').eq('id', currentUserId).single();
if(error){ console.error('Balance refresh failed:', error.message); return currentBalanceNgn; }
if(data) currentBalanceNgn = parseFloat(data.balance) || 0;
}catch(e){ console.error('Balance refresh failed:', e.message || e); }
return currentBalanceNgn;
}

async function initSession(){
try{
if(!window.supabase) return;
if(!sbClient) sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
});
const { data: { session } } = await sbClient.auth.getSession();
if(session && session.user){
currentUserId = session.user.id;
await refreshBalance();
}
}catch(e){}
}

function renderProducts(products){
if(!products||!products.length){
const msg = searchQuery ? 'No products match "'+escapeHtml(searchQuery)+'"' : 'Try a different category';
productGrid.innerHTML='<div class="empty-state"><div class="empty-state-icon">🔍</div><h4>No Products Found</h4><p>'+msg+'</p></div>';
productCountBadge.innerHTML='';return;
}
productCountBadge.innerHTML='<span class="product-count-badge">'+products.length+' product'+(products.length!==1?'s':'')+'</span>';
const cart=getCart();
let html='<div class="product-grid">';
products.forEach((p,index)=>{
const name=escapeHtml(cleanText(p.name||'Product'));
const desc=escapeHtml(getDisplayDescription(p));
const price=parseFloat(p.price)||0;
const stock=parseInt(p.stock_quantity,10);
const hasStock=!Number.isNaN(stock);
const inStock=hasStock?stock>0:true;
const cat=escapeHtml(p.category||'');
const inCart=cart.some(i=>(p.id&&i.product_id===p.id)||i.title===cleanText(p.name||''));
html+='<div class="product-card">';
html+='<div class="product-header"><div class="product-header-left">'+renderLogIconHtml(p.category, cleanText(p.name||''))+'<div class="product-name">'+name+'</div></div><div class="product-price">'+money(price)+'</div></div>';
if(desc) html+='<details><summary class="product-description-toggle">Description</summary><div class="product-description-body">'+desc+'</div></details>';
html+='<div class="product-badges">';
if(cat) html+='<span class="badge badge-cat">'+cat+'</span>';
if(hasStock) html+=inStock?'<span class="badge badge-stock">In Stock ('+stock+')</span>':'<span class="badge badge-out">Out of Stock</span>';
html+='</div><div class="product-actions">';
if(inStock){
html+='<button class="btn btn-outline" data-index="'+index+'" data-action="cart"'+(inCart?' disabled':'')+'>'+(inCart?'In Cart':'Add to Cart')+'</button>';
html+='<button class="btn btn-primary" data-index="'+index+'" data-action="buy">Buy Now</button>';
} else html+='<button class="btn btn-primary" disabled>Out of Stock</button>';
html+='</div></div>';
});
html+='</div>';
productGrid.innerHTML=html;
const list=products;
document.querySelectorAll('.btn[data-action]').forEach(btn=>{
btn.addEventListener('click',function(){
const p=list[Number(this.dataset.index)]; if(!p) return;
if(this.dataset.action==='cart') addToCart(p);
else openPurchaseModal(p);
});
});
}

categoryFilter.addEventListener('change',()=>{
renderProducts(getFilteredProducts());
});

/* Live search as the user types */
productSearch.addEventListener('input',function(){
searchQuery = this.value.trim();
searchClearBtn.classList.toggle('show', searchQuery.length>0);
renderProducts(getFilteredProducts());
});

searchClearBtn.addEventListener('click',function(){
productSearch.value='';
searchQuery='';
searchClearBtn.classList.remove('show');
renderProducts(getFilteredProducts());
productSearch.focus();
});

function addToCart(p){
const item=buildCartItem(p,1);
const cart=getCart();
if(cart.find(i=>(item.product_id&&i.product_id===item.product_id)||i.title===item.title)){showToast('"'+item.title+'" already in cart');return}
cart.push(item);saveCart(cart);showToast('"'+item.title+'" added to cart!');
renderProducts(getFilteredProducts());
}

function openPurchaseModal(p){
activeProduct=p;
activeQty=1;
const name=cleanText(p.name||'Product');
const desc=getDisplayDescription(p) || 'No description';
const price=parseFloat(p.price)||0;
const stock=parseInt(p.stock_quantity,10);
const hasStock=!Number.isNaN(stock);
const format=getAccountFormat(p);
document.getElementById('psName').textContent=name;
const psIconEl=document.getElementById('psIcon');
const psIconInfo=logIcon(p.category, name);
if(!psIconInfo){
psIconEl.className='ps-icon log-icon-fallback';
psIconEl.style.background='';
psIconEl.innerHTML='<i class="fa-solid fa-layer-group"></i>';
} else if(psIconInfo.dual){
psIconEl.className='ps-icon log-icon-dual';
psIconEl.style.background='';
psIconEl.innerHTML=logIconInnerHtml(psIconInfo);
} else if(psIconInfo.gradient){
psIconEl.className='ps-icon log-icon-instagram';
psIconEl.style.background='';
psIconEl.innerHTML=logIconInnerHtml(psIconInfo);
} else {
psIconEl.className='ps-icon';
psIconEl.style.background=psIconInfo.color||'#1877f2';
psIconEl.innerHTML=logIconInnerHtml(psIconInfo);
}
document.getElementById('psDesc').textContent=desc||'—';
document.getElementById('psUnitPrice').textContent=money(price);
document.getElementById('psQty').textContent='1';
const stockEl=document.getElementById('psStock');
if(hasStock){
if(stock>0){stockEl.className='ps-pill ps-pill-stock';stockEl.textContent=stock+' in stock'}
else{stockEl.className='ps-pill ps-pill-out';stockEl.textContent='Out of stock'}
} else {stockEl.className='ps-pill ps-pill-stock';stockEl.textContent='Available'}
const wrap=document.getElementById('psFormatWrap');
if(format){wrap.style.display='block';document.getElementById('psFormat').textContent=format}
else{wrap.style.display='none'}
updatePurchaseTotal();
document.getElementById('purchaseModal').classList.add('active');
}

function updatePurchaseTotal(){
if(!activeProduct) return;
const price=parseFloat(activeProduct.price)||0;
document.getElementById('psQty').textContent=String(activeQty);
document.getElementById('psTotal').textContent=money(price*activeQty);
const stock=parseInt(activeProduct.stock_quantity,10);
const buyBtn=document.getElementById('psBuyBtn');
if(!Number.isNaN(stock) && activeQty>stock){
buyBtn.disabled=true;
} else {
buyBtn.disabled=false;
}
}

function closePurchaseModal(){
document.getElementById('purchaseModal').classList.remove('active');
activeProduct=null;
}
document.getElementById('purchaseCloseBtn').addEventListener('click', closePurchaseModal);
document.getElementById('purchaseModal').addEventListener('click', function(e){ if(e.target===this) closePurchaseModal(); });
document.getElementById('psQtyMinus').addEventListener('click', function(){
if(activeQty>1){activeQty--;updatePurchaseTotal()}
});
document.getElementById('psQtyPlus').addEventListener('click', function(){
const stock=parseInt(activeProduct&&activeProduct.stock_quantity,10);
if(!Number.isNaN(stock) && activeQty>=stock){showToast('Only '+stock+' in stock','error');return}
activeQty++;updatePurchaseTotal();
});
document.getElementById('psBuyBtn').addEventListener('click', confirmBuyNow);

async function confirmBuyNow(){
if(!activeProduct || isBuying) return;
if(!currentUserId){
showToast('Please sign in to buy','error');
setTimeout(function(){ window.location.href='auth.html'; }, 900);
return;
}
// Capture the product now, while activeProduct is still set. closePurchaseModal()
// (called below, after a successful order) resets the global activeProduct to
// null — reading activeProduct again after that point was throwing
// "null is not an object (evaluating 'p.name')" on every successful purchase,
// which then got caught and shown to the customer as a false "Network error"
// even though the order had already gone through and been paid for.
const purchasedProduct = activeProduct;
const price = parseFloat(purchasedProduct.price)||0;
const total = price * activeQty;
await refreshBalance();
if(currentBalanceNgn < total){
showToast('Insufficient balance. Redirecting to deposit...','error');
setTimeout(function(){ window.location.href='dashboard.html#deposit'; }, 900);
return;
}
const buyBtn = document.getElementById('psBuyBtn');
isBuying = true;
buyBtn.disabled = true;
const originalLabel = buyBtn.innerHTML;
buyBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
try{
const productSource = purchasedProduct.source
|| (String(purchasedProduct.product_key || '').startsWith('ld_') ? 'logsdomain'
: String(purchasedProduct.product_key || '').startsWith('manual_') ? 'manual'
: String(purchasedProduct.product_key || '').startsWith('sj_') ? 'sujandepartment'
: 'fadded');
const orderEndpoint = productSource === 'manual' ? '/api/order-manual'
: productSource === 'logsdomain' ? '/api/order-logsdomain'
: productSource === 'sujandepartment' ? '/api/sujan'
: '/api/order';
const { data: { session: orderSess } } = await sbClient.auth.getSession();
const orderToken = orderSess && orderSess.access_token;
if (!orderToken) { showToast('Please sign in again', 'error'); return; }
const res = await fetch(orderEndpoint, {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + orderToken },
body: JSON.stringify({
product_key: purchasedProduct.product_key,
quantity: activeQty,
user_id: currentUserId,
external_order_id: 'MJ-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)
})
});
const data = await res.json();
if(!res.ok || !data.success){
showToast(data.message || 'Order failed. Please try again.', 'error');
return;
}
if(data.data && data.data.new_balance != null){
currentBalanceNgn = Number(data.data.new_balance);
}
const items = (data.data && data.data.items) ? data.data.items : [];
const creds = items.map(function(it){ return it.details; }).filter(Boolean).join('\n\n') || 'Delivered — see My Orders for details';
const desc = getDisplayDescription(purchasedProduct);
const purchasedQty = activeQty;
closePurchaseModal();
openReceiptModal(purchasedProduct, desc, creds);
showToast('Purchase successful!','success');
// Reflect reduced stock locally so the grid doesn't show stale numbers
const stock = parseInt(purchasedProduct.stock_quantity,10);
if(!Number.isNaN(stock)) purchasedProduct.stock_quantity = Math.max(0, stock - purchasedQty);
renderProducts(getFilteredProducts());
}catch(err){
showToast('Network error: '+(err.message||err), 'error');
}finally{
isBuying = false;
buyBtn.disabled = false;
buyBtn.innerHTML = originalLabel;
}
}

function openReceiptModal(p, desc, creds){
document.getElementById('rcName').textContent = cleanText(p.name||'Product');
document.getElementById('rcIcon').textContent = (cleanText(p.name||'M').charAt(0)||'M').toUpperCase();
const descWrap = document.getElementById('rcDescWrap');
if(desc){ descWrap.style.display='block'; document.getElementById('rcDesc').textContent = desc; }
else { descWrap.style.display='none'; }
document.getElementById('rcCreds').textContent = creds;
document.getElementById('rcCopyBtn').onclick = function(){
navigator.clipboard.writeText(creds);
showToast('Copied to clipboard!','success');
};
document.getElementById('receiptModal').classList.add('active');
}
document.getElementById('receiptCloseBtn').addEventListener('click', function(){
document.getElementById('receiptModal').classList.remove('active');
});
document.getElementById('receiptModal').addEventListener('click', function(e){
if(e.target===this) this.classList.remove('active');
});

initSession();
loadProducts();
</script>

<script>
(function(){
  function paint(){
    if(!window.mjSkeleton && !window.MJSkeleton) return;
    var mjSkeleton = window.mjSkeleton || window.MJSkeleton;
    var nodes = document.querySelectorAll('[data-skel], #productGrid, #list, #catalog, #servicesGrid, #productsGrid, #orderList');
    nodes.forEach(function(el){
      if(el.dataset.skelReady) return;
      var type = el.getAttribute('data-skel') || (el.id && /list|order/i.test(el.id) ? 'cards' : 'grid');
      el.innerHTML = (mjSkeleton[type] || mjSkeleton.grid)(type === 'cards' ? 3 : 6);
      el.dataset.skelReady = '1';
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);
  else paint();
  // retry once scripts loaded
  setTimeout(paint, 50);
})();
</script>
