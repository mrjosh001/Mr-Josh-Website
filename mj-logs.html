<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Hub - MJ Logs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <span class="brand-title">MJ HUB</span>
        </div>
    </nav>

    <main class="main-content">
        <div class="content-card">
            <h2>MJ Logs – Live Supplier Products</h2>
            <p class="helper-text" style="margin-bottom: 15px;">Browsing verified logs dynamically synced via API.</p>
            
            <div id="loading" class="loading">Fetching products from supplier...</div>
            <div id="products-container" class="products-grid"></div>
        </div>
    </main>

    <script>
        async function fetchApiProducts() {
            const container = document.getElementById('products-container');
            const loading = document.getElementById('loading');

            const baseUrl = 'https://fadded.net/api/v1/reseller';
            const apiKey = 'rsk_live_s5ATWd0yskBvEagViPwQd6HxwfdLrkkpGyZIZFXDnhPEj8W6'; // Note: For true production safety, this should go through a backend server proxy, but you can plug your key here for testing.

            try {
                const response = await fetch(`${baseUrl}/products`, {
                    method: 'GET',
                    headers: {
                        'X-Api-Key': apiKey,
                        'Accept': 'application/json'
                    }
                });

                const result = await response.json();
                loading.style.display = 'none';

                if (!result.success || !result.data || result.data.length === 0) {
                    container.innerHTML = '<p class="empty-text">No products available at the moment.</p>';
                    return;
                }

                // Loop through the API products and build the cards dynamically
                result.data.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div>
                            <h3 style="font-size: 16px; margin-bottom: 6px;">${product.name}</h3>
                            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">${product.description}</p>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid var(--border-color); pt-10px;">
                            <span style="font-weight: 700; color: var(--primary-color);">₦${product.unit_price.toLocaleString()}</span>
                            <span style="font-size: 12px; color: var(--text-muted);">Stock: ${product.in_stock}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                loading.textContent = 'Error connecting to the supplier API.';
                console.error('API Fetch error:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', fetchApiProducts);
    </script>

</body>
</html>
