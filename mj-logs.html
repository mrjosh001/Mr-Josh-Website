<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ HUB — User Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #07090e;
            --card: #0d1322;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .header-sub {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 20px;
        }

        /* Category Filter Dropdown Container */
        .category-filter-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .category-filter-container label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-dropdown {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #1f2937;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        .category-dropdown:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .category-dropdown option {
            background-color: var(--card);
            color: #ffffff;
        }

        /* Product Cards */
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }

        .product-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            word-break: break-word;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            margin-top: 4px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: #34d399;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-cart {
            padding: 8px 14px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-buy {
            padding: 8px 14px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .empty-msg {
            text-align: center;
            color: var(--muted);
            padding: 40px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1 class="header-title">MJ Logs – Verified Accounts & Updates</h1>
    <p class="header-sub">Browse available logs dynamically categorized in real-time.</p>

    <!-- Dynamic Category Dropdown Filter -->
    <div class="category-filter-container">
        <label for="categorySelect">Select Category</label>
        <select id="categorySelect" class="category-dropdown" onchange="handleCategoryChange(this.value)">
            <option value="ALL">All Categories</option>
            <!-- Categories will populate dynamically from Supabase -->
        </select>
    </div>

    <div id="loading" style="color: var(--muted); text-align: center; padding: 30px;">Loading logs...</div>
    <div id="productsContainer" class="products-grid"></div>

    <script>
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let currentSelectedCategory = 'ALL';

        /* ---------- EXACT ADMIN LOGIC FOR CATEGORY PARSING ---------- */
        function getBusinessLabel(p) {
            const b = (p.business || '').trim();
            if (b) {
                const bl = b.toLowerCase();
                if (bl.includes('sms')) return 'MJ SMS';
                if (bl.includes('boost') || bl.includes('smm')) return 'MJ Boosters';
                if (bl.includes('log')) return 'MJ Logs';
            }
            return 'MJ Logs';
        }

        function getProductCategoryLabel(p) {
            const businessNames = ['mj logs', 'mj sms', 'mj boosters', 'logs', 'sms', 'boosters'];
            let raw = (p.product_category || p.sub_category || p.type || '').trim();
            if (!raw) {
                const c = (p.category || '').trim();
                if (c && !businessNames.includes(c.toLowerCase())) raw = c;
            }
            const n = ((p.name || '') + ' ' + raw).toLowerCase();
            if (raw) {
                const r = raw.toLowerCase();
                if (r.includes('face') || r === 'fb') return 'Facebook';
                if (r.includes('insta') || r === 'ig') return 'Instagram';
                if (r.includes('twitter') || r === 'x' || r.includes('tweet')) return 'Twitter/X';
                if (!businessNames.includes(r)) return raw;
            }
            if (n.includes('facebook') || n.includes(' fb ')) return 'Facebook';
            if (n.includes('instagram') || n.includes(' ig ') || n.includes('insta')) return 'Instagram';
            if (n.includes('twitter') || /\bx\b/.test(n) || n.includes('tweet')) return 'Twitter/X';
            return 'Others';
        }

        function stripHtml(html) {
            if (!html) return '';
            let text = String(html);
            text = text
                .replace(/&nbsp;/gi, ' ')
                .replace(/&amp;/gi, '&')
                .replace(/&lt;/gi, '<')
                .replace(/&gt;/gi, '>')
                .replace(/&quot;/gi, '"')
                .replace(/&#39;/gi, "'");
            text = text.replace(/<[^>]*>/g, ' ');
            text = text.replace(/\s+/g, ' ').trim();
            return text;
        }

        /* ---------- DROPDOWN SETUP LOGIC ---------- */
        function setupCategories() {
            const dropdown = document.getElementById('categorySelect');
            
            // Collect unique categories matching Admin logic
            const categories = [...new Set(allProducts.map(p => getProductCategoryLabel(p)))].sort();

            dropdown.innerHTML = '<option value="ALL">All Categories</option>';

            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                dropdown.appendChild(option);
            });
        }

        function handleCategoryChange(cat) {
            currentSelectedCategory = cat;
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            const filtered = currentSelectedCategory === 'ALL'
                ? allProducts
                : allProducts.filter(p => getProductCategoryLabel(p) === currentSelectedCategory);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-msg">No available products in this category.</div>';
                return;
            }

            filtered.forEach(p => {
                const plainDesc = stripHtml(p.description || '');
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <div class="product-title">${p.name || 'Unnamed Product'}</div>
                        <div class="product-desc">${plainDesc || 'No description provided.'}</div>
                    </div>
                    <div class="product-footer">
                        <div class="product-price">₦${Number(p.price || 0).toLocaleString()}</div>
                        <div class="action-btns">
                            <button class="btn-cart">Add to Cart</button>
                            <button class="btn-buy">Buy Now</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function loadData() {
            const loading = document.getElementById('loading');
            try {
                const { data, error } = await sb
                    .from('products')
                    .select('*')
                    .order('name');

                if (error) throw error;

                allProducts = (data || []).filter(p => p.is_available !== false);
                loading.style.display = 'none';

                setupCategories();
                renderProducts();
            } catch (err) {
                loading.textContent = 'Failed to load products.';
                console.error('Error fetching products:', err);
            }
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
