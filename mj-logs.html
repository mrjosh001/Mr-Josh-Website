<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Hub - MJ Logs</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .filter-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--border-color, #333);
            background: #1a1d24;
            color: #8a8d93;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .filter-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <span class="brand-title">MJ HUB</span>
        </div>
    </nav>
    <main class="main-content">
        <div class="content-card">
            <h2>MJ Logs – Social Media Logs</h2>
            <p class="helper-text" style="margin-bottom: 15px;">Browse our verified social media logs and aged accounts provided by MJ HUB.</p>

            <!-- Dynamic Category Filter Buttons -->
            <div id="filterPills" class="filter-container">
                <button class="filter-btn active" data-category="ALL">All Logs</button>
            </div>

            <div id="loading" class="loading">Loading available logs...</div>
            <div id="products-container"></div>
        </div>
    </main>
    <script>
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [];
        let currentFilter = 'ALL';

        function renderCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div>
                    <h3 style="font-size: 16px; margin-bottom: 6px;">${product.name}</h3>
                    <p style="font-size: 13px; color: #8a8d93; margin-bottom: 10px;">${product.description || ''}</p>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid #282c34; padding-top: 10px;">
                    <span style="font-weight: 700; color: #2563eb; font-size: 16px;">₦${Number(product.price).toLocaleString()}</span>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-cart" style="padding: 8px 16px; background: #2563eb; border: none; border-radius: 8px; color: white; cursor: pointer;">Add to Cart</button>
                        <button class="btn-buy" style="padding: 8px 16px; background: #111; border: 1px solid #333; border-radius: 8px; color: white; cursor: pointer;">Buy Now</button>
                    </div>
                </div>
            `;
            return card;
        }

        function displayFilteredProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            const filtered = currentFilter === 'ALL' 
                ? allProducts 
                : allProducts.filter(p => p.category === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = '<p class="empty-text">No products available in this category.</p>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'products-grid';
            filtered.forEach(p => grid.appendChild(renderCard(p)));
            container.appendChild(grid);
        }

        function setupFilterButtons() {
            const pillsContainer = document.getElementById('filterPills');
            
            // Extract unique categories from Supabase data
            const categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))].sort();

            // Clear old dynamic buttons keeping "All Logs"
            pillsContainer.innerHTML = '<button class="filter-btn active" data-category="ALL">All Logs</button>';

            // Create pill button for each unique database category (e.g. Mails, VPN, Facebook)
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.category = cat;
                btn.textContent = cat;
                pillsContainer.appendChild(btn);
            });

            // Handle button clicks
            pillsContainer.addEventListener('click', (e) => {
                if (!e.target.classList.contains('filter-btn')) return;

                // Toggle active state styling
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                // Update filter and re-render
                currentFilter = e.target.dataset.category;
                displayFilteredProducts();
            });
        }

        async function fetchProducts() {
            const loading = document.getElementById('loading');
            try {
                const { data: products, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .order('category', { ascending: true })
                    .order('name', { ascending: true });

                if (error) throw error;

                loading.style.display = 'none';
                allProducts = products || [];

                setupFilterButtons();
                displayFilteredProducts();
            } catch (error) {
                loading.textContent = 'Error loading logs from database.';
                console.error('Database Fetch error:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
