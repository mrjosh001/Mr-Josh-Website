<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Hub - MJ Logs</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <span class="brand-title">MJ HUB</span>
        </div>
    </nav>
    <main class="main-content">
        <div class="content-card">
            <h2>MJ Logs – Live Supplier Products</h2>
            <p class="helper-text" style="margin-bottom: 15px;">Browsing verified logs dynamically synced via database.</p>

            <div id="loading" class="loading">Loading available logs...</div>
            <div id="products-container" class="products-grid"></div>
        </div>
    </main>
    <script>
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchApiProducts() {
            const container = document.getElementById('products-container');
            const loading = document.getElementById('loading');
            try {
                const { data: products, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .order('name', { ascending: true });

                loading.style.display = 'none';
                if (error) throw error;

                if (!products || products.length === 0) {
                    container.innerHTML = '<p class="empty-text">No products available at the moment.</p>';
                    return;
                }

                products.forEach(product => {
                    const inStock = product.is_available && product.stock_quantity > 0;
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div>
                            <h3 style="font-size: 16px; margin-bottom: 6px;">${product.name}</h3>
                            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">${product.description || ''}</p>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                            <span style="font-weight: 700; color: var(--primary-color);">₦${Number(product.price).toLocaleString()}</span>
                            <span style="font-size: 12px; ${inStock ? 'color: var(--text-muted);' : 'color: #e8685d; font-weight:700;'}">${inStock ? 'Stock: ' + product.stock_quantity : 'No stock'}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                loading.textContent = 'Error loading logs from database.';
                console.error('Database Fetch error:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', fetchApiProducts);
    </script>
</body>
</html>
