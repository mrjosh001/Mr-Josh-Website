<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Logs - MJ HUB</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --primary-color: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --primary-hover: #2563eb;
            --bg-main: #07090e;
            --card-bg: #0d1322;
            --card-hover: #131d35;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .header {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            background: var(--bg-main);
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .back-button {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
        }

        .back-button:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .page-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-content {
            padding: 16px;
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
        }

        @media(min-width: 768px) {
            .main-content { max-width: 700px; }
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            width: 100%;
            overflow: hidden;
        }

        .content-card h2 {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .helper-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .filter-dropdown {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 22px;
            padding-right: 44px;
            margin-bottom: 14px;
            font-family: inherit;
        }

        .filter-dropdown:focus {
            border-color: var(--primary-color);
        }

        .filter-dropdown option {
            background: var(--card-bg);
            color: var(--text-main);
            padding: 10px;
        }

        .product-count-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
        }

        @media(min-width: 600px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .product-card {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .product-card:hover {
            border-color: var(--primary-color);
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
            flex: 1;
            min-width: 0;
            word-wrap: break-word;
        }

        .product-price {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-color);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .product-description-toggle {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-color);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            padding: 2px 0;
        }
        .product-description-toggle::-webkit-details-marker { display: none; }
        .product-description-toggle::before {
            content: '▸';
            font-size: 10px;
            transition: transform 0.15s;
        }
        details[open] .product-description-toggle::before {
            transform: rotate(90deg);
        }

        .product-description-body {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            word-wrap: break-word;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            margin-top: 4px;
        }

        .product-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
        }

        .badge-stock {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
        }

        .badge-out {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
        }

        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            gap: 14px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }

        .empty-state-icon {
            font-size: 44px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .toast-container {
            position: fixed;
            top: 80px;
            right: 12px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: calc(100% - 24px);
        }

        .toast {
            background: var(--card-bg);
            border: 1px solid var(--success-color);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
            max-width: 280px;
            pointer-events: all;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(13, 19, 34, 0.9);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 10px;
            gap: 4px;
            font-weight: 700;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .plus-circle {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--primary-color), #7c3aed);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-top: -20px;
            border: 4px solid var(--bg-main);
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="header">
        <a href="index.html" class="back-button">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="page-title">MJ Logs</h1>
    </div>

    <main class="main-content">
        <div class="content-card">
            <h2><i class="fa-solid fa-box-archive" style="color: var(--primary-color);"></i>Browse Logs</h2>
            <p class="helper-text">Browse our verified social media logs and aged accounts. All quality-checked.</p>

            <select class="filter-dropdown" id="categoryFilter">
                <option value="all">Loading categories...</option>
            </select>

            <div id="productCountBadge"></div>

            <div id="productGrid">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <span class="loading-text">Loading products...</span>
                </div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html#home" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="index.html#history" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 7 7 0 0 1-7-7h-2a9 9 0 1 0 9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            <span>History</span>
        </a>
        <a href="index.html" class="nav-item">
            <div class="plus-circle">+</div>
        </a>
        <a href="index.html#cart" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            <span>Cart</span>
        </a>
        <a href="index.html#profile" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';

        const productGrid = document.getElementById('productGrid');
        const categoryFilter = document.getElementById('categoryFilter');
        const productCountBadge = document.getElementById('productCountBadge');
        const toastContainer = document.getElementById('toastContainer');

        let allProducts = [];
        let supabase = null;

        function cleanText(str) {
            if (!str) return '';
            const temp = document.createElement('div');
            temp.innerHTML = str;
            let text = temp.textContent || temp.innerText || '';
            text = text.replace(/\s+/g, ' ').trim();
            return text;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = '<span>✅</span><span>' + message + '</span>';
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showLoadFailure(reason) {
            productGrid.innerHTML =
                '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h4>Failed to Load</h4><p>' +
                escapeHtml(reason || 'Something went wrong') +
                '</p><button class="btn btn-primary" style="max-width:200px;margin:0 auto;" onclick="location.reload()">Retry</button></div>';
        }

        async function loadProducts() {
            try {
                productGrid.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><span class="loading-text">Loading products...</span></div>';

                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .eq('is_available', true)
                    .order('category', { ascending: true });

                if (error) throw error;

                if (!products || products.length === 0) {
                    productGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><h4>No Products</h4><p>Check back later</p></div>';
                    categoryFilter.innerHTML = '<option value="all">No categories</option>';
                    return;
                }

                allProducts = products;

                const categories = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
                categoryFilter.innerHTML = '<option value="all">📋 All Categories (' + products.length + ')</option>';
                categories.forEach(cat => {
                    const count = products.filter(p => p.category === cat).length;
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat + ' (' + count + ')';
                    categoryFilter.appendChild(option);
                });

                renderProducts(products);

            } catch (err) {
                console.error('Error:', err);
                showLoadFailure(err.message);
            }
        }

        function renderProducts(products) {
            if (!products || products.length === 0) {
                productGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><h4>No Products Found</h4><p>Try a different category</p></div>';
                productCountBadge.innerHTML = '';
                return;
            }

            productCountBadge.innerHTML = '<span class="product-count-badge">' + products.length + ' product' + (products.length !== 1 ? 's' : '') + '</span>';

            let gridHtml = '<div class="product-grid">';

            products.forEach(product => {
                const name = escapeHtml(cleanText(product.name || 'Product'));
                const desc = escapeHtml(cleanText(product.description || ''));
                const price = parseFloat(product.price) || 0;
                const stock = parseInt(product.stock_quantity) || 0;
                const inStock = stock > 0;

                gridHtml += '<div class="product-card">';
                gridHtml += '<div class="product-header">';
                gridHtml += '<div class="product-name">' + name + '</div>';
                gridHtml += '<div class="product-price">₦' + price.toLocaleString() + '</div>';
                gridHtml += '</div>';

                if (desc) {
                    gridHtml += '<details><summary class="product-description-toggle">Description</summary><div class="product-description-body">' + desc + '</div></details>';
                }

                gridHtml += '<div class="product-badges">';
                if (inStock) {
                    gridHtml += '<span class="badge badge-stock">In Stock (' + stock + ')</span>';
                } else {
                    gridHtml += '<span class="badge badge-out">Out of Stock</span>';
                }
                gridHtml += '</div>';

                gridHtml += '<div class="product-actions">';
                if (inStock) {
                    gridHtml += '<button class="btn btn-primary" data-name="' + name + '" data-price="' + price + '" data-desc="' + desc + '" data-action="cart">Add to Cart</button>';
                    gridHtml += '<button class="btn btn-outline" data-name="' + name + '" data-price="' + price + '" data-desc="' + desc + '" data-action="buy">Buy Now</button>';
                } else {
                    gridHtml += '<button class="btn btn-primary" disabled>Out of Stock</button>';
                }
                gridHtml += '</div>';

                gridHtml += '</div>';
            });

            gridHtml += '</div>';
            productGrid.innerHTML = gridHtml;

            document.querySelectorAll('.btn[data-action]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const name = this.dataset.name;
                    const price = parseFloat(this.dataset.price);
                    const desc = this.dataset.desc;
                    const action = this.dataset.action;

                    if (action === 'cart') {
                        addToCart(name, price, desc);
                    } else if (action === 'buy') {
                        buyNow(name, price, desc);
                    }
                });
            });
        }

        categoryFilter.addEventListener('change', () => {
            const cat = categoryFilter.value;
            if (cat === 'all') {
                renderProducts(allProducts);
            } else {
                renderProducts(allProducts.filter(p => p.category === cat));
            }
        });

        function addToCart(name, price, desc) {
            const cart = JSON.parse(localStorage.getItem('mjhub_cart') || '[]');
            if (cart.find(i => i.title === name)) {
                showToast('"' + name + '" already in cart');
                return;
            }
            cart.push({ title: name, price: price, type: 'log', subtitle: desc });
            localStorage.setItem('mjhub_cart', JSON.stringify(cart));
            showToast('"' + name + '" added to cart!');
        }

        function buyNow(name, price, desc) {
            localStorage.setItem('mjhub_cart', JSON.stringify([{ title: name, price: price, type: 'log', subtitle: desc }]));
            showToast('Redirecting to cart...');
            setTimeout(() => {
                window.location.href = 'index.html#cart';
            }, 600);
        }

        function initSupabaseAndLoad() {
            if (!window.supabase) {
                showLoadFailure('Could not reach Supabase library. Check your connection and retry.');
                return;
            }
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            loadProducts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            let started = false;
            const start = () => { if (!started) { started = true; initSupabaseAndLoad(); } };

            if (window.supabase) {
                start();
            } else {
                let attempts = 0;
                const waitForSupabase = setInterval(() => {
                    attempts++;
                    if (window.supabase) {
                        clearInterval(waitForSupabase);
                        start();
                    } else if (attempts > 40) {
                        clearInterval(waitForSupabase);
                        showLoadFailure('Supabase library failed to load (network issue). Tap Retry.');
                    }
                }, 100);
            }

            setTimeout(() => {
                if (!started) {
                    start();
                }
            }, 6000);
        });
    </script>
</body>
</html>
