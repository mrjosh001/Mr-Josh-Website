<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Hub - MJ Logs</title>
    <!-- Link to your shared stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Top Navbar Match -->
    <nav class="navbar">
        <div class="nav-left">
            <span class="brand-title">MJ HUB</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-card">
            <h2>MJ Logs – Social Media & Account Logs</h2>
            <p class="helper-text" style="margin-bottom: 15px;">Browse our verified social media logs and aged accounts automatically synced from suppliers.</p>
            
            <!-- Loading Indicator -->
            <div id="loading" class="loading">Loading products from suppliers page...</div>

            <!-- Products Grid where items will appear -->
            <div id="products-container" class="products-grid"></div>
        </div>
    </main>

    <script>
        async function fetchSupplierProducts() {
            const container = document.getElementById('products-container');
            const loading = document.getElementById('loading');

            try {
                // Change 'suppliers.html' if your supplier page filename is different
                const response = await fetch('suppliers.html');
                const htmlText = await response.text();
                
                // Parse the fetched HTML text
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                // MAKE SURE THIS SELECTOR MATCHES your product wrapper class on suppliers.html
                // (e.g., if each product on suppliers.html has class "product-card" or "log-item")
                const productElements = doc.querySelectorAll('.product-card');

                loading.style.display = 'none';

                if (productElements.length === 0) {
                    container.innerHTML = '<p class="empty-text">No products found on the suppliers page yet. Check your CSS selector.</p>';
                    return;
                }

                // Loop through each product found and append it to the grid
                productElements.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = product.innerHTML;
                    container.appendChild(card);
                });

            } catch (error) {
                loading.textContent = 'Error loading products. Ensure suppliers.html is in the same repository.';
                console.error('Fetch error:', error);
            }
        }

        // Run the function when the page loads
        window.addEventListener('DOMContentLoaded', fetchSupplierProducts);
    </script>

</body>
</html>
