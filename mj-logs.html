<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ HUB — User Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #07090e;
            --card-bg: #0d1322;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Top Navigation Bar --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }

        .nav-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-main); }
        .brand-title { font-size: 20px; font-weight: 800; color: #3b82f6; letter-spacing: 0.5px; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .notification-icon { position: relative; font-size: 18px; cursor: pointer; color: var(--text-main); }
        .badge-dot { position: absolute; top: 0; right: 0; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; }
        
        .profile-icon {
            width: 38px;
            height: 38px;
            background: var(--primary-color);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* --- Main Content Area --- */
        .main-content {
            margin-top: 70px;
            padding: 20px;
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 90px;
        }

        /* Hero Welcome Box */
        .welcome-box {
            background: var(--card-bg);
            color: #ffffff;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .welcome-box h2 {
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .welcome-box p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 18px;
            line-height: 1.5;
        }

        /* Category Filter Select Dropdown */
        .category-filter-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-dropdown {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #192238;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        .category-dropdown:focus {
            border-color: var(--primary-color);
        }

        .category-dropdown option {
            background-color: var(--card-bg);
            color: #ffffff;
        }

        /* Products Grid */
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
        }

        .product-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            word-break: break-word;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
            margin-top: 4px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: #34d399;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-cart {
            padding: 8px 14px;
            background: var(--primary-color);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-buy {
            padding: 8px 14px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 14px;
        }

        /* --- Mobile Bottom Nav Bar --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 10px;
            gap: 3px;
        }

        .bottom-nav-center {
            width: 44px;
            height: 44px;
            background: var(--primary-color);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
            margin-top: -15px;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <header class="navbar">
        <div class="nav-left">
            <button class="menu-btn">☰</button>
            <span class="brand-title">MJ HUB</span>
        </div>
        <div class="nav-right">
            <div class="notification-icon">🔔<span class="badge-dot"></span></div>
            <div class="profile-icon">M</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="welcome-box">
            <h2>MJ Logs – Social Media Logs</h2>
            <p>Browse our verified social media logs and aged accounts provided by MJ HUB.</p>

            <!-- SELECT DROPDOWN -->
            <div class="category-filter-container">
                <select id="categorySelect" class="category-dropdown" onchange="handleCategoryChange(this.value)">
                    <option value="ALL">All Categories</option>
                </select>
            </div>
        </div>

        <div id="loading" style="color: var(--text-muted); text-align: center; padding: 30px;">Loading accounts...</div>
        <div id="productsContainer" class="products-grid"></div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="bottom-nav-item"><span>🏠</span><span>Home</span></a>
        <a href="#" class="bottom-nav-item"><span>🕒</span><span>History</span></a>
        <div class="bottom-nav-center">+</div>
        <a href="#" class="bottom-nav-item"><span>🛒</span><span>Cart</span></a>
        <a href="#" class="bottom-nav-item"><span>👤</span><span>Profile</span></a>
    </nav>

    <script>
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let currentSelectedCategory = 'ALL';

        function stripHtml(html) {
            if (!html) return '';
            let text = String(html);
            text = text
                .replace(/&nbsp;/gi, ' ')
                .replace(/&amp;/gi, '&')
                .replace(/&lt;/gi, '<')
                .replace(/&gt;/gi, '>')
                .replace(/&quot;/gi, '"')
                .replace(/&#39;/gi, "'");
            text = text.replace(/<[^>]*>/g, ' ');
            text = text.replace(/\s+/g, ' ').trim();
            return text;
        }

        /* ---------- FETCH & POPULATE CATEGORIES DIRECTLY FROM SUPABASE ---------- */
        function setupCategories() {
            const dropdown = document.getElementById('categorySelect');
            
            // Extract raw 'category' field directly from Supabase items
            const rawCategories = allProducts
                .map(p => (p.category || p.product_category || '').trim())
                .filter(Boolean);

            const uniqueCategories = [...new Set(rawCategories)].sort();

            dropdown.innerHTML = '<option value="ALL">All Categories</option>';

            uniqueCategories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                dropdown.appendChild(option);
            });
        }

        function handleCategoryChange(cat) {
            currentSelectedCategory = cat;
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            const filtered = currentSelectedCategory === 'ALL'
                ? allProducts
                : allProducts.filter(p => {
                    const itemCat = (p.category || p.product_category || '').trim();
                    return itemCat === currentSelectedCategory;
                });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-msg">No accounts available for this category.</div>';
                return;
            }

            filtered.forEach(p => {
                const plainDesc = stripHtml(p.description || '');
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <div class="product-title">${p.name || 'Unnamed Account'}</div>
                        <div class="product-desc">${plainDesc || 'No description provided.'}</div>
                    </div>
                    <div class="product-footer">
                        <div class="product-price">₦${Number(p.price || 0).toLocaleString()}</div>
                        <div class="action-btns">
                            <button class="btn-cart">Add to Cart</button>
                            <button class="btn-buy">Buy Now</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function loadData() {
            const loading = document.getElementById('loading');
            try {
                const { data, error } = await sb
                    .from('products')
                    .select('*')
                    .order('name');

                if (error) throw error;

                allProducts = (data || []).filter(p => p.is_available !== false);
                loading.style.display = 'none';

                setupCategories();
                renderProducts();
            } catch (err) {
                loading.textContent = 'Failed to load accounts.';
                console.error('Error fetching products:', err);
            }
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
