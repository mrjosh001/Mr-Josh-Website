<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Hub - MJ Logs</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .category-dropdown {
            width: 100%;
            padding: 14px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            appearance: none;
            -webkit-appearance: none;
        }
        .category-heading {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 10px;
        }
        .category-heading:first-child { margin-top: 0; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <span class="brand-title">MJ HUB</span>
        </div>
    </nav>
    <main class="main-content">
        <div class="content-card">
            <h2>MJ Logs – Live Supplier Products</h2>
            <p class="helper-text" style="margin-bottom: 15px;">Browsing verified logs dynamically synced via database.</p>

            <select id="categoryFilter" class="category-dropdown">
                <option value="">Shop by Categories</option>
            </select>

            <div id="loading" class="loading">Loading available logs...</div>
            <div id="products-container"></div>
        </div>
    </main>
    <script>
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [];

        function renderCard(product) {
            const inStock = product.is_available && product.stock_quantity > 0;
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div>
                    <h3 style="font-size: 16px; margin-bottom: 6px;">${product.name}</h3>
                    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">${product.description || ''}</p>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                    <span style="font-weight: 700; color: var(--primary-color);">₦${Number(product.price).toLocaleString()}</span>
                    <span style="font-size: 12px; ${inStock ? 'color: var(--text-muted);' : 'color: #e8685d; font-weight:700;'}">${inStock ? 'Stock: ' + product.stock_quantity : 'No stock'}</span>
                </div>
            `;
            return card;
        }

        function renderProducts(filterCategory) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            if (allProducts.length === 0) {
                container.innerHTML = '<p class="empty-text">No products available at the moment.</p>';
                return;
            }

            if (filterCategory) {
                const grid = document.createElement('div');
                grid.className = 'products-grid';
                allProducts
                    .filter(p => p.category === filterCategory)
                    .forEach(p => grid.appendChild(renderCard(p)));
                container.appendChild(grid);
                return;
            }

            // Group products under category headings
            const categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
            categories.forEach(cat => {
                const heading = document.createElement('div');
                heading.className = 'category-heading';
                heading.textContent = cat;
                container.appendChild(heading);

                const grid = document.createElement('div');
                grid.className = 'products-grid';
                allProducts
                    .filter(p => p.category === cat)
                    .forEach(p => grid.appendChild(renderCard(p)));
                container.appendChild(grid);
            });
        }

        async function fetchApiProducts() {
            const loading = document.getElementById('loading');
            try {
                // Fetch directly from table without strict DB-side filtering
                const { data: products, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .order('category', { ascending: true })
                    .order('name', { ascending: true });

                console.log('Database raw response:', { products, error });

                if (error) throw error;

                loading.style.display = 'none';

                // Filter client-side: match source = 'api' or items with categories
                const rawList = products || [];
                allProducts = rawList.filter(item => {
                    const isApiSource = item.source && String(item.source).toLowerCase().trim() === 'api';
                    const hasCategory = item.category && item.category.trim() !== '';
                    return isApiSource || hasCategory;
                });

                console.log('Filtered logs to display:', allProducts);

                const select = document.getElementById('categoryFilter');
                select.innerHTML = '<option value="">Shop by Categories</option>';
                
                const categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))].sort();
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    select.appendChild(opt);
                });
                
                // Avoid duplicate listeners
                select.onchange = () => renderProducts(select.value);

                renderProducts('');
            } catch (error) {
                loading.textContent = 'Error loading logs from database.';
                console.error('Database Fetch error:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', fetchApiProducts);
    </script>
</body>
</html>
