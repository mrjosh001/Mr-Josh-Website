<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Hub - MJ Logs</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <span class="brand-title">MJ HUB</span>
        </div>
    </nav>
    <main class="main-content">
        <div class="content-card">
            <h2>MJ Logs – Live Supplier Products</h2>
            <p class="helper-text" style="margin-bottom: 15px;">Browsing verified logs dynamically synced via database.</p>

            <div id="loading" class="loading">Loading available logs...</div>
            <div id="products-container" class="products-grid"></div>
        </div>
    </main>
    <script>
        <script>
const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function fetchApiProducts() {
    const container = document.getElementById('products-container');
    const loading = document.getElementById('loading');

    container.innerHTML = '';
    loading.style.display = 'block';
    loading.textContent = 'Loading available logs...';

    try {

        const { data: products, error } = await supabaseClient
            .from('products')
            .select('*')
            .order('name', { ascending: true });

        console.log('Products:', products);
        console.log('Error:', error);

        if (error) {
            loading.innerHTML = `<span style="color:red;">Database Error: ${error.message}</span>`;
            return;
        }

        loading.style.display = 'none';

        if (!products || products.length === 0) {
            container.innerHTML = `
                <div style="padding:20px;text-align:center;">
                    <h3>No products found</h3>
                    <p>Your products table returned 0 records.</p>
                </div>
            `;
            return;
        }

        products.forEach(product => {

            const card = document.createElement('div');
            card.className = 'product-card';

            const price = Number(product.price || 0).toLocaleString();

            const stock = Number(product.stock_quantity || 0);

            const available =
                product.is_available === true && stock > 0;

            card.innerHTML = `
                <div>
                    <h3 style="font-size:16px;margin-bottom:6px;">
                        ${product.name || 'Unnamed Product'}
                    </h3>

                    <p style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">
                        ${product.description || ''}
                    </p>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;border-top:1px solid var(--border-color);padding-top:10px;">

                    <span style="font-weight:700;color:var(--primary-color);">
                        ₦${price}
                    </span>

                    <span style="font-size:12px;color:${available ? '#16a34a' : '#dc2626'};">
                        ${available ? `Stock: ${stock}` : 'Out of Stock'}
                    </span>

                </div>
            `;

            container.appendChild(card);

        });

    } catch (err) {

        console.error(err);

        loading.innerHTML = `
            <span style="color:red;">
                ${err.message}
            </span>
        `;
    }
}

window.addEventListener('DOMContentLoaded', fetchApiProducts);
</script>
    </script>
</body>
</html>
