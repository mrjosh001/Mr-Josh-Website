<style>
:root {
  --primary: #3b82f6; --bg: #f1f5f9; --elevated: #fff; --card: #fff;
  --text: #0f172a; --text2: #475569; --muted: #64748b; --border: rgba(15,23,42,.08);
}
[data-theme="dark"] {
  --primary: #60a5fa; --bg: #030712; --elevated: #0b0f19; --card: #0f1524;
  --text: #f1f5f9; --text2: #94a3b8; --muted: #64748b; --border: rgba(255,255,255,.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; min-height: 100vh; }
.header { position: fixed; top: 0; left: 0; right: 0; z-index: 500; background: color-mix(in srgb, var(--elevated) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.header-inner { max-width: 820px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-weight: 800; font-size: 18px; text-decoration: none; color: var(--text); }
.logo span { color: var(--primary); }
.wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
.meta { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
h2 { font-size: 17px; font-weight: 700; margin: 28px 0 10px; }
p, li { color: var(--text2); font-size: 15px; margin-bottom: 10px; }
ul { padding-left: 1.2em; margin-bottom: 12px; }
a { color: var(--primary); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px 20px; }
.footer { text-align: center; padding: 24px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
.footer a { margin: 0 8px; text-decoration: none; }

.back-dash {
  display:inline-flex; align-items:center; gap:8px;
  font-size:14px; font-weight:700; text-decoration:none;
  color:var(--primary); padding:8px 12px; border-radius:10px;
  border:1px solid var(--border); background:var(--card);
}
.back-dash:hover { background: color-mix(in srgb, var(--primary) 12%, var(--card)); }
.legal-bottom-bar {
  position:sticky; bottom:0; left:0; right:0; z-index:40;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--elevated) 92%, transparent);
  backdrop-filter: blur(10px);
  border-top:1px solid var(--border);
  text-align:center;
}
.legal-bottom-bar a {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  width:100%; max-width:420px; padding:14px 18px; border-radius:14px;
  background:#2563eb; color:#fff; font-weight:700; font-size:15px; text-decoration:none;
}


.mobile-menu.kinetic-nav {
  display: none;
  position: fixed; inset: 0; z-index: 600 !important;
}
.mobile-menu.kinetic-nav[hidden] { display: none !important; }
.mobile-menu.kinetic-nav.active,
.mobile-menu.kinetic-nav[data-nav="open"] {
  display: block !important;
  visibility: visible !important;
}
.kinetic-overlay {
  position: absolute; inset: 0;
  background: rgba(2,6,23,.45);
  backdrop-filter: blur(8px);
}
.kinetic-panel {
  position: absolute; top: 0; left: 0; bottom: 0; right: auto;
  width: min(300px, 84vw);
  overflow: auto;
  padding: 22px 0 20px;
  background: #1d3fa8;
  color: #e8eeff;
  box-shadow: 18px 0 50px rgba(15,23,42,.28);
  transform: translateX(-105%);
  transition: transform .32s cubic-bezier(.22,1,.36,1);
  display: flex;
  flex-direction: column;
}
.mobile-menu.active .kinetic-panel,
.mobile-menu[data-nav="open"] .kinetic-panel { transform: translateX(0); }
.menu-sheet-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 0 18px 16px;
}
.menu-brand { display: flex; align-items: center; gap: 10px; }
.menu-brand img { width: 34px; height: 34px; object-fit: contain; border-radius: 10px; background: #fff; }
.menu-brand b { display: block; font-size: 15px; font-weight: 800; color: #fff; }
.menu-brand small { display: block; font-size: 11px; color: #c7d7ff; }
.kinetic-close {
  width: 36px; height: 36px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.1); color: #fff;
  display: grid; place-items: center; cursor: pointer;
}
.kinetic-links {
  list-style: none; margin: 8px 0 0; padding: 0 0 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.kinetic-links a {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  margin-left: 14px; margin-right: 0;
  padding: 13px 18px 13px 16px;
  border-radius: 22px 0 0 22px;
  color: #d7e3ff; text-decoration: none;
  font-size: 15px; font-weight: 650;
  background: transparent; border: 0;
}
.kinetic-links a svg { width: 18px; height: 18px; flex: 0 0 auto; opacity: .9; }

.nav-sub { margin: 0; }
.nav-sub-toggle {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  margin-left: 14px; margin-right: 0;
  padding: 13px 18px 13px 16px;
  border-radius: 22px 0 0 22px;
  color: #d7e3ff; text-decoration: none;
  font-size: 15px; font-weight: 650;
  background: transparent; border: 0;
  width: calc(100% - 14px);
  cursor: pointer; font-family: inherit; text-align: left;
}
.nav-sub-toggle svg.icon { width: 18px; height: 18px; flex: 0 0 auto; opacity: .9; }
.nav-sub-toggle .chev {
  margin-left: auto; width: 16px; height: 16px; opacity: .85;
  transition: transform .2s ease;
}
.nav-sub.open .nav-sub-toggle .chev { transform: rotate(180deg); }
.nav-sub-panel {
  display: none;
  flex-direction: column;
  gap: 2px;
  padding: 4px 0 8px 0;
}
.nav-sub.open .nav-sub-panel { display: flex; }
.nav-sub-panel a {
  margin-left: 28px !important;
  padding: 11px 18px 11px 16px !important;
  font-size: 14px !important;
  font-weight: 600 !important;
  opacity: .95;
}

.kinetic-links a.on {
  background: #fff;
  color: #1d3fa8;
  font-weight: 800;
  z-index: 1;
}
.kinetic-links a.on svg { opacity: 1; }
.kinetic-links a.on:before,
.kinetic-links a.on:after {
  content: "";
  position: absolute;
  left: 0;
  width: 22px;
  height: 22px;
  background: transparent;
}
.kinetic-links a.on:before {
  top: -22px;
  border-bottom-left-radius: 22px;
  box-shadow: -6px 6px 0 6px #fff;
}
.kinetic-links a.on:after {
  bottom: -22px;
  border-top-left-radius: 22px;
  box-shadow: -6px -6px 0 6px #fff;
}
.kinetic-auth, .mobile-auth {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-top: auto; padding: 16px 16px 8px;
}
.kinetic-auth .btn-ghost { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.2); }
.kinetic-auth .btn { width: 100%; }
body.menu-open { overflow: hidden; }


.logo { display:inline-flex !important; align-items:center !important; gap:8px !important; line-height:1 !important; text-decoration:none !important; }
.logo img { height:36px !important; width:auto !important; max-width:48px !important; object-fit:contain !important; object-position:center !important; border-radius:8px !important; background:transparent !important; flex:0 0 auto !important; }
.logo-word { font-family:"Plus Jakarta Sans", Inter, system-ui, sans-serif !important; font-size:17px !important; font-weight:800 !important; letter-spacing:-.02em !important; line-height:32px !important; background:none !important; -webkit-background-clip:unset !important; color:#1e3a8a !important; -webkit-text-fill-color:#1e3a8a !important; }
html[data-theme="dark"] .logo-word, body[data-theme="dark"] .logo-word { color:#dbeafe !important; -webkit-text-fill-color:#dbeafe !important; }


.logo { display:inline-flex !important; align-items:center !important; gap:10px !important; height:32px !important; line-height:32px !important; text-decoration:none !important; }
.logo img, .logo .brandLogo, .logo #brandLogo { height:36px !important; width:auto !important; max-width:48px !important; object-fit:contain !important; object-position:center !important; border-radius:8px !important; background:transparent !important; flex:0 0 auto !important; display:block !important; }
.logo-word { font-family:"Plus Jakarta Sans", Inter, system-ui, sans-serif !important; font-size:17px !important; font-weight:800 !important; letter-spacing:-.03em !important; line-height:32px !important; height:32px !important; display:inline-flex !important; align-items:center !important; background:none !important; -webkit-background-clip:unset !important; color:#1e3a8a !important; -webkit-text-fill-color:#1e3a8a !important; }
html[data-theme="dark"] .logo-word, body[data-theme="dark"] .logo-word { color:#dbeafe !important; -webkit-text-fill-color:#dbeafe !important; }


.logo { display:inline-flex !important; align-items:center !important; gap:8px !important; height:28px !important; line-height:28px !important; text-decoration:none !important; }
.logo img, .logo .brandLogo, .logo #brandLogo { height:24px !important; width:auto !important; max-height:24px !important; max-width:none !important; object-fit:contain !important; background:transparent !important; flex:0 0 auto !important; display:block !important; border-radius:0 !important; }
.logo-word { font-family:"Plus Jakarta Sans", Inter, system-ui, sans-serif !important; font-size:24px !important; font-weight:800 !important; letter-spacing:-.04em !important; line-height:24px !important; height:24px !important; display:inline-flex !important; align-items:center !important; background:none !important; -webkit-background-clip:unset !important; color:#1e3a8a !important; -webkit-text-fill-color:#1e3a8a !important; }
html[data-theme="dark"] .logo-word, body[data-theme="dark"] .logo-word { color:#dbeafe !important; -webkit-text-fill-color:#dbeafe !important; }

</style>

<script>
(function(){
  function done(){
    var el=document.getElementById('mj-boot');
    if(!el||el.classList.contains('is-done'))return;
    el.classList.add('is-done');
    el.setAttribute('aria-busy','false');
    setTimeout(function(){ try{ el.remove(); var s=document.getElementById('mj-boot-style'); if(s)s.remove(); }catch(e){} }, 280);
    try{ sessionStorage.removeItem('mj_nav_loading'); }catch(e){}
    if(window.mjHidePageLoader) try{ window.mjHidePageLoader(); }catch(e){}
  }
  if(document.readyState==='complete') setTimeout(done, 60);
  else {
    window.addEventListener('load', function(){ setTimeout(done, 60); });
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(done, 4000); });
    setTimeout(done, 12000);
  }
})();
</script>

<script>
(function(){
  function knock(img){
    if(!img) return;
    var im=new Image(); im.crossOrigin='anonymous';
    im.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
        var x=c.getContext('2d'); x.drawImage(im,0,0);
        var d=x.getImageData(0,0,c.width,c.height); var p=d.data;
        for(var i=0;i<p.length;i+=4){
          var r=p[i],g=p[i+1],b=p[i+2];
          if((r>232&&g>232&&b>232)||(r<45&&g<55&&b<95)) p[i+3]=0;
        }
        x.putImageData(d,0,0); img.src=c.toDataURL('image/png');
      }catch(e){}
    };
    im.src=img.src;
  }
  function apply(){
    var theme=(document.documentElement.getAttribute('data-theme')||document.body.getAttribute('data-theme')||'');
    if(!theme){
      try{
        var pref=localStorage.getItem('mjhub-theme-pref')||localStorage.getItem('mjhub-theme')||'system';
        theme = (pref==='light'||pref==='dark') ? pref : (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
      }catch(e){ theme='light'; }
      document.documentElement.setAttribute('data-theme', theme);
      if(document.body) document.body.setAttribute('data-theme', theme);
    }
    var src = theme==='dark'
      ? '/img/IMG_3027.png'
      : '/img/IMG_3027.png';
    document.querySelectorAll('img.brandLogo, img#brandLogo').forEach(function(img){ img.src=src; knock(img); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', apply);
  else apply();
})();
</script>

<script>
(function(){
  var btn=document.getElementById('menuToggle');
  var menu=document.getElementById('mobileMenu');
  if(!btn||!menu) return;
  function setOpen(on){
    menu.classList.toggle('active', !!on);
    menu.setAttribute('data-nav', on ? 'open' : 'closed');
    if(on) menu.removeAttribute('hidden');
    else menu.setAttribute('hidden','');
    document.body.classList.toggle('menu-open', !!on);
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  window.toggleLandingMenu=function(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    setOpen(!(menu.classList.contains('active') || menu.getAttribute('data-nav')==='open'));
  };
  btn.onclick=window.toggleLandingMenu;
  var termsToggle=document.getElementById('termsToggle');
  var termsSub=document.getElementById('termsSub');
  if(termsToggle&&termsSub){
    termsToggle.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      var open=termsSub.classList.toggle('open');
      termsToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
  menu.addEventListener('click', function(e){
    var link=e.target.closest('.kinetic-links a');
    if(link){
      menu.querySelectorAll('.kinetic-links a').forEach(function(n){ n.classList.remove('on'); });
      link.classList.add('on');
    }
    if(e.target.closest('[data-close-menu]')) setOpen(false);
  });
})();
</script>

<script>
(function(){
  var menu=document.getElementById('mobileMenu');
  if(!menu)return;
  var path=window.location.pathname;
  if(path.length>1&&path.charAt(path.length-1)==='/')path=path.slice(0,-1);
  var current=path.substring(path.lastIndexOf('/')+1)||'landing.html';
  var links=menu.querySelectorAll('.kinetic-links a[href]');
  links.forEach(function(a){
    var raw=a.getAttribute('href')||'';
    if(!raw||raw.charAt(0)==='#'||/^https?:/i.test(raw))return;
    var target=raw.split('?')[0];
    if(target.charAt(0)==='/')target=target.slice(1);
    if(target.length>1&&target.charAt(target.length-1)==='/')target=target.slice(0,-1);
    if(target===current||(current==='vendor'&&target==='vendor')){
      a.classList.add('on');a.setAttribute('aria-current','page');
      var sub=a.closest('.nav-sub');
      if(sub){sub.classList.add('open');var t=sub.querySelector('.nav-sub-toggle');if(t)t.setAttribute('aria-expanded','true');}
    }else if(target==='landing.html'&&current!=='landing.html'&&current!==''){
      a.classList.remove('on');a.removeAttribute('aria-current');
    }
  });
})();
</script>
