function phoneParts(raw,country){const d=String(raw||'').replace(/\D/g,'');const map={usa:'1','united states':'1',canada:'1','united kingdom':'44',nigeria:'234',india:'91',germany:'49',france:'33',spain:'34',italy:'39',australia:'61',south africa:'27',kenya:'254',ghana:'233',uae:'971','united arab emirates':'971',turkey:'90',brazil:'55',mexico:'52',indonesia:'62',philippines:'63',vietnam:'84',thailand:'66',malaysia:'60',singapore:'65',japan:'81','south korea':'82',china:'86',hong kong:'852'};const n=String(country||'').toLowerCase().trim();let dial=map[n]||'';if(!dial){for(const k in map){if(n.startsWith(k)||k.startsWith(n)){dial=map[k];break;}}}let national=d;if(dial&&d.startsWith(dial)&&d.length>dial.length+4)national=d.slice(dial.length);return{dial:dial?'+'+dial:'',national:national||d||'—'};}

function startCountdown(){stopTimer();if(!createdAt)createdAt=new Date().toISOString();const start=new Date(createdAt).getTime();function tick(){const elapsed=Math.floor((Date.now()-start)/1000),left=EXPIRY-elapsed,wait=Math.max(0,CANCEL_WAIT-elapsed),tv=document.getElementById('timerValue'),bar=document.getElementById('timerBar'),ca=document.getElementById('cancelAvailable'),cb=document.getElementById('cancelBtn');if(tv)tv.textContent=left>0?fmt(left):'Expired';if(bar)bar.style.transform='scaleX('+Math.max(0,Math.min(1,left/EXPIRY))+')';if(ca)ca.textContent=wait>0?'Available in '+fmt(wait):'Ready to cancel';if(cb&&!cancelling)cb.disabled=wait>0;if(left<=0&&!autoRefundStarted&&!cancelling){autoRefundStarted=true;cancelOrder(true);}}tick();timer=setInterval(tick,1000);}

function fatal(message){stopPoll();stopTimer();document.getElementById('heroTitle').textContent='Unable to load order';document.getElementById('heroSub').textContent='No wallet change was made by this page.';content.innerHTML='<section class="panel" style="text-align:center"><div class="error-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><h2 style="font-size:17px;margin:0 0 7px">Something went wrong</h2><p style="font-size:10px;color:var(--muted);line-height:1.6;margin:0">'+esc(message||'Please refresh and try again.')+'</p></section><section class="actions"><button class="btn btn-primary" id="retryBtn">Retry</button><a class="btn btn-ghost" href="mj-sms-s3.html">Back to Server 3</a></section>';document.getElementById('retryBtn').onclick=()=>checkStatus(true);}
function authHeaders(){return session&&session.access_token?{Authorization:'Bearer '+session.access_token}:{};}
async function checkStatus(manual){if(checking||!orderId||!userId)return;checking=true;stopPoll();const b=document.getElementById('checkBtn');if(manual&&b){b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Checking';}try{const r=await fetch(API+'?action=check',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({order_id:orderId,user_id:userId})}),j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||'Order check failed');const d=j.data||{};const st=String(d.status||'').toLowerCase();if(st==='completed'&&d.code){completed(d);return;}if(['refunded','expired','cancelled','canceled'].includes(st)||d.refunded===true){refunded('No SMS was delivered. Your balance has been restored.');return;}waiting(d);pollTimer=setTimeout(()=>checkStatus(false),5000);}catch(e){if(manual)toast(e.message||'Could not check order','error');pollTimer=setTimeout(()=>checkStatus(false),6000);}finally{checking=false;if(b&&!cancelling){b.disabled=false;b.innerHTML='<i class="fa-solid fa-rotate"></i> Check now';}}}
async function cancelOrder(expiry){if(cancelling||!orderId||!userId)return;cancelling=true;stopPoll();const b=document.getElementById('cancelBtn');if(b){b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> '+(expiry?'Refunding…':'Cancelling…');}try{const r=await fetch('/api/vsms-cancel',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({order_id:orderId})}),j=await r.json();if(r.ok&&j.success){toast('Refund committed','ok');refunded('The order was cancelled and the original purchase debit was refunded exactly once.');return;}if(j.code==='ALREADY_REFUNDED'){refunded('This order was already refunded. No additional credit was created.');return;}if(j.code==='NUMBER_CODE_ALREADY_RECEIVED'){toast('A code has already arrived. This order cannot be refunded.','error');cancelling=false;await checkStatus(true);return;}if(j.code==='EARLY_CANCEL_DENIED'){toast(j.message||'Cancellation is not available yet.','error');cancelling=false;startCountdown();return;}throw new Error(j.message||'Cancellation was not confirmed.');}catch(e){toast(e.message||'Cancellation failed. No new balance credit was issued.','error');cancelling=false;checkStatus(false);}}
async function boot(){if(!orderId){fatal('No order ID was supplied.');return;}if(!window.supabase){fatal('Supabase failed to load.');return;}try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}});const s=await sb.auth.getSession();session=s.data&&s.data.session;if(!session||!session.user){location.href='auth.html';return;}userId=session.user.id;await checkStatus(false);}catch(e){fatal(e.message||'Authentication failed.');}}
boot();
</script>
