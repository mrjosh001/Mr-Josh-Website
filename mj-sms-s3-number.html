<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">

<script>(function(){try{var t=localStorage.getItem('mjhub-theme-pref')||localStorage.getItem('mjhub-theme')||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/mj-page-loader.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root[data-theme="dark"]{--bg:#06080f;--card:#0f1524;--card2:#141c30;--text:#f5f7fb;--muted:#91a0b7;--line:rgba(148,163,184,.14);--primary:#5b8af5;--accent:#a78bfa;--good:#34d399;--bad:#f87171;--warn:#fbbf24}
:root[data-theme="light"]{--bg:#f4f7fc;--card:#fff;--card2:#f8faff;--text:#101828;--muted:#667085;--line:rgba(15,23,42,.09);--primary:#3b6ef5;--accent:#7657e8;--good:#059669;--bad:#dc2626;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(680px,100%);margin:auto;padding:14px}.top{display:flex;align-items:center;gap:12px;padding:10px 2px 16px}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;display:grid;place-items:center;color:var(--text);text-decoration:none;background:var(--card)}.brand{min-width:0}.eyebrow{font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:800}.title{font-size:17px;font-weight:800}.pill{margin-left:auto;font-size:9px;font-weight:800;color:var(--primary);border:1px solid var(--line);background:rgba(91,138,245,.1);padding:8px 10px;border-radius:999px}.hero,.panel{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(145deg,var(--card),var(--card2))}.hero h1{font-size:21px;margin:0 0 6px}.hero p{font-size:11px;line-height:1.5;color:var(--muted);margin:0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.meta>div{padding:11px;border:1px solid var(--line);border-radius:14px;background:rgba(148,163,184,.04)}.label{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin-bottom:4px}.value{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.number{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:28px;font-weight:900;letter-spacing:.03em;word-break:break-word}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:36px;font-weight:900;color:var(--good);letter-spacing:.12em;text-align:center}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}.good .dot{background:var(--good)}.bad .dot{background:var(--bad)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{min-height:45px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:800;font-size:11px;cursor:pointer}.primary{background:linear-gradient(135deg,var(--primary),var(--accent));border:0;color:#fff}.danger{color:var(--bad);border-color:rgba(248,113,113,.25)}.btn:disabled{opacity:.5;cursor:not-allowed}.loading{text-align:center;padding:45px 12px}.spinner{width:38px;height:38px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading h2{font-size:14px;margin:0 0 5px}.loading p,.hint{font-size:10px;color:var(--muted);line-height:1.5}.error{text-align:center}.error i{font-size:30px;color:var(--bad);margin-bottom:10px}.toast{position:fixed;right:12px;bottom:18px;max-width:320px;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:13px;box-shadow:0 15px 40px rgba(0,0,0,.2);font-size:10px;font-weight:700;z-index:9999}@media(max-width:480px){.wrap{padding:10px}.meta{grid-template-columns:1fr 1fr}.number{font-size:23px}.code{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="back" href="mj-sms-s3.html"><i class="fa-solid fa-arrow-left"></i></a><div class="brand"><div class="eyebrow">MJ HUB · SMS</div><div class="title">Verification session</div></div><div class="pill">SERVER 3</div></header>
<section class="hero"><h1 id="heading">Preparing your number</h1><p id="sub">Loading the Server 3 order. This should only take a moment.</p><div id="meta" class="meta" hidden></div></section>
<div id="content"><section class="panel loading"><div class="spinner"></div><h2>Loading order…</h2><p>Checking your verification session.</p></section></div>
</div>
<script>
(function(){
'use strict';
const API='/api/grizzly-sync';
const params=new URLSearchParams(location.search);
const orderId=params.get('order_id')||params.get('id')||'';
const content=document.getElementById('content'),heading=document.getElementById('heading'),sub=document.getElementById('sub'),meta=document.getElementById('meta');
let session=null,checking=false,timer=null,expiresAt=0;
const SUPABASE_URL='https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12IiwiaWF0IjoxNzg1MDc1MjM4LCJleHAiOjIxMDA2NTEyMzh9.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb=window.supabase&&window.supabase.createClient?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function authHeaders(){return session&&session.access_token?{Authorization:'Bearer '+session.access_token}: {}}
function showError(msg){content.innerHTML='<section class="panel error"><i class="fa-solid fa-circle-exclamation"></i><h2>Unable to load this order</h2><p class="hint">'+esc(msg||'Please refresh and try again.')+'</p><div class="actions"><button class="btn primary" id="retry">Retry</button><a class="btn" href="mj-sms-s3.html" style="display:grid;place-items:center;text-decoration:none">Back</a></div></section>';document.getElementById('retry').onclick=()=>boot(true)}
function showMeta(d){meta.hidden=false;meta.innerHTML='<div><div class="label">Service</div><div class="value">'+esc(d.service_name||d.service||'Verification')+'</div></div><div><div class="label">Country</div><div class="value">'+esc(d.country_name||d.country||'Server 3')+'</div></div>'}
function render(d){
const status=String(d.status||'').toLowerCase();
const number=d.number||d.phone||d.mobile_number||d.msisdn||d.data?.number||d.data?.phone||'';
const code=d.code||d.sms_code||d.verification_code||d.data?.code||d.data?.sms_code||'';
showMeta(d);
if(status==='refunded'||status==='cancelled'||d.refunded){heading.textContent='Order cancelled';sub.textContent='No SMS was received. Your balance has been restored.';content.innerHTML='<section class="panel"><div class="status good"><span class="dot"></span>Refund completed</div><div class="actions"><a class="btn primary" href="mj-sms-s3.html" style="display:grid;place-items:center;text-decoration:none">Get another number</a></div></section>';return true}
if(code){heading.textContent='Verification code received';sub.textContent='Your SMS code has arrived.';content.innerHTML='<section class="panel"><div class="code">'+esc(code)+'</div><p class="hint" style="text-align:center">Code received from Server 3.</p></section>';return true}
if(number){heading.textContent='Your Server 3 number';sub.textContent='Waiting for the verification SMS.';content.innerHTML='<section class="panel"><div class="label">Phone number</div><div class="number">'+esc(number)+'</div><div class="status" style="margin-top:12px"><span class="dot"></span><span id="waitText">Waiting for SMS…</span></div><div class="actions"><button class="btn danger" id="cancelBtn">Cancel & refund</button><button class="btn" id="checkBtn">Check now</button></div><p class="hint">Cancel is protected against duplicate refunds.</p></section>';document.getElementById('cancelBtn').onclick=cancelOrder;document.getElementById('checkBtn').onclick=()=>checkStatus(true);return false}
heading.textContent='Verification session';sub.textContent='Order is active. Waiting for supplier details.';content.innerHTML='<section class="panel"><div class="status"><span class="dot"></span><span id="waitText">Waiting for supplier response…</span></div><div class="actions"><button class="btn danger" id="cancelBtn">Cancel & refund</button><button class="btn" id="checkBtn">Check now</button></div></section>';document.getElementById('cancelBtn').onclick=cancelOrder;document.getElementById('checkBtn').onclick=()=>checkStatus(true);return false
}
async function api(action,body){const ctl=new AbortController();const timeout=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch(API+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify(body),signal:ctl.signal});const j=await r.json().catch(()=>({success:false,message:'Invalid server response'}));if(!r.ok||j.success===false)throw new Error(j.message||('Request failed ('+r.status+')'));return j}finally{clearTimeout(timeout)}}
async function checkStatus(manual){if(checking||!orderId)return;checking=true;try{const userId=session?.user?.id||'';if(!userId)throw new Error('Your login session is missing. Please sign in again.');const j=await api('check',{order_id:orderId,user_id:userId});const d=j.data||j.order||{};const done=render(d);if(!done)startPoll()}catch(e){if(manual)showError(e.name==='AbortError'?'The order check timed out. Please try again.':e.message)}finally{checking=false}}
async function cancelOrder(){const b=document.getElementById('cancelBtn');if(b)b.disabled=true;try{const j=await api('cancel',{order_id:orderId,user_id:session?.user?.id||''});const d=j.data||{};heading.textContent='Order cancelled';sub.textContent='Refund processed safely.';content.innerHTML='<section class="panel"><div class="status good"><span class="dot"></span>Refund committed</div><p class="hint">'+esc(j.message||d.message||'Your balance has been restored.')+'</p><div class="actions"><a class="btn primary" href="mj-sms-s3.html" style="display:grid;place-items:center;text-decoration:none">Get another number</a></div></section>';stopPoll()}catch(e){if(b)b.disabled=false;toast(e.message||'Cancellation failed')}}
function startPoll(){stopPoll();timer=setInterval(()=>checkStatus(false),5000)}
function stopPoll(){if(timer){clearInterval(timer);timer=null}}
async function boot(){
stopPoll();
if(!orderId){showError('No order ID was supplied. Please return to Server 3 and open the order again.');return}
try{
if(!sb)throw new Error('Authentication library failed to load.');
const got=await Promise.race([sb.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Authentication check timed out.')),8000))]);
session=got?.data?.session||null;
if(!session){showError('Your login session has expired. Please sign in again.');return}
await checkStatus(true);
}catch(e){showError(e.message||'Could not initialize the verification session.')}
}
window.addEventListener('beforeunload',stopPoll);
boot();
})();
</script>
</body>
</html>
