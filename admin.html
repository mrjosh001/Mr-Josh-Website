<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ HUB - Admin Portal</title>
    <!-- Supabase CDN Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-main: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.95);
            --text-main: #ffffff;
            --text-muted: #93c5fd;
            --border-color: rgba(59, 130, 246, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; padding: 20px; }
        
        .container { width: 100%; max-width: 1200px; }
        
        /* Top Header */
        .page-header { background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px 25px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .page-header h1 { font-size: 20px; font-weight: 700; color: #fff; }
        
        .action-btn { background: #dc2626; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: #b91c1c; }
        .primary-btn { background: var(--primary-color); }
        .primary-btn:hover { background: #1d4ed8; }

        /* Login Box */
        .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 14px; width: 100%; max-width: 400px; margin: 0 auto; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; }
        .auth-card h2 { margin-bottom: 20px; font-size: 22px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 10px 14px; background: #07090e; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px; }
        
        /* Metrics Grid */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 14px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        .metric-card h3 { font-size: 13px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 8px; }
        .metric-card .value { font-size: 28px; font-weight: 700; color: #fff; }

        /* Data Section */
        .data-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 25px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        .section-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 20px; }
        
        /* Table Design */
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: rgba(15, 23, 42, 0.9); color: var(--text-muted); padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--border-color); }
        td { padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #cbd5e1; }
        tr:hover td { background: rgba(59, 130, 246, 0.03); }

        .message-box { margin-top: 15px; font-size: 13px; color: #f87171; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Standalone Login Screen -->
        <div id="loginScreen" class="auth-card hidden">
            <h2>Admin Sign In</h2>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="adminEmail" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter your password">
            </div>
            <button class="action-btn primary-btn" style="width: 100%; padding: 12px;" onclick="handleLogin()">Login to Dashboard</button>
            <div id="loginError" class="message-box"></div>
        </div>

        <!-- Protected Admin Dashboard Wrapper -->
        <div id="adminDashboard" class="hidden">
            <!-- Admin Header -->
            <div class="page-header">
                <h1>MJ HUB Admin Portal</h1>
                <button class="action-btn" onclick="handleLogout()">Sign Out</button>
            </div>
            
            <!-- Metrics Row -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <h3>Total Registered Users</h3>
                    <div class="value" id="totalUsersCount">0</div>
                </div>
                <div class="metric-card">
                    <h3>Security Status</h3>
                    <div class="value" style="color: #4ade80; font-size: 20px; margin-top: 5px;">Active & Authorized</div>
                </div>
            </div>

            <!-- User Activity Logs Table -->
            <div class="data-section">
                <div class="section-title">Website User Profiles & Activity Monitor</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Full Name</th>
                                <th>Username</th>
                                <th>Email Address</th>
                                <th>Phone Number</th>
                                <th>Admin Status</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Populated dynamically via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            checkAuth();
        });

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                document.getElementById('loginScreen').classList.remove('hidden');
                return;
            }

            // Verify admin status in profiles table
            const { data: profileData, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (error || !profileData || !profileData.is_admin) {
                await supabaseClient.auth.signOut();
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('loginError').innerText = 'Access Denied: Account lacks admin privileges.';
                return;
            }

            // Authorized! Show Dashboard
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadAdminData();
        }

        async function handleLogin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            const errorBox = document.getElementById('loginError');
            errorBox.innerText = '';

            if (!email || !password) {
                errorBox.innerText = 'Please enter both email and password.';
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorBox.innerText = error.message;
                return;
            }

            checkAuth();
        }

        async function loadAdminData() {
            const { data: profiles, error } = await supabaseClient
                .from('profiles')
                .select('*');

            if (error) {
                console.error('Error fetching profiles:', error.message);
                return;
            }

            document.getElementById('totalUsersCount').innerText = profiles.length;

            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            profiles.forEach(profile => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${profile.full_name || 'N/A'}</td>
                    <td>${profile.username || 'N/A'}</td>
                    <td>${profile.email || 'Registered User'}</td>
                    <td>${profile.phone_number || 'N/A'}</td>
                    <td><span style="color: ${profile.is_admin ? '#4ade80' : '#93c5fd'}">${profile.is_admin ? 'Admin' : 'Standard'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }
    </script>
</body>
</html>
