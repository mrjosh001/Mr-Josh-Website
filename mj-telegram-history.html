<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Telegram Orders · MJ HUB</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/mj-page-loader.js" defer></script>
<script>
(function(){try{var t=localStorage.getItem('mjhub-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<meta name="theme-color" content="#2563eb">
<style>
:root[data-theme="dark"] {
  --bg:#06080f; --title:#f8fafc; --muted:#94a3b8; --card:#ffffff; --card-ink:#0f172a;
  --line:#e2e8f0; --blue:#2563eb; --blue-2:#1d4ed8; --blue-ring:rgba(37,99,235,.2);
  --ok:#059669; --ok-soft:#ecfdf5; --warn:#d97706; --warn-soft:#fffbeb;
  --bad:#dc2626; --bad-soft:#fef2f2; --shadow:0 10px 30px rgba(15,23,42,.12);
}
:root[data-theme="light"] {
  --bg:#f4f6fb; --title:#0f172a; --muted:#64748b; --card:#ffffff; --card-ink:#0f172a;
  --line:#e2e8f0; --blue:#2563eb; --blue-2:#1d4ed8; --blue-ring:rgba(37,99,235,.18);
  --ok:#059669; --ok-soft:#ecfdf5; --warn:#d97706; --warn-soft:#fffbeb;
  --bad:#dc2626; --bad-soft:#fef2f2; --shadow:0 10px 28px rgba(37,99,235,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--card-ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.shell{max-width:540px;margin:0 auto;padding:0 16px calc(88px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 0 14px;position:sticky;top:0;z-index:20;background:var(--bg)}
.back,.icon-btn{width:42px;height:42px;border-radius:14px;border:none;background:#fff;color:#0f172a;display:grid;place-items:center;text-decoration:none;cursor:pointer;box-shadow:var(--shadow);font-size:15px}
.topbar-copy{flex:1;min-width:0}
.topbar-copy h1{font-size:18px;font-weight:800;color:var(--title)}
.topbar-copy p{font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1.5px solid #dbeafe;border-radius:20px;padding:16px;box-shadow:var(--shadow);color:#0f172a}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.title{font-size:15px;font-weight:800;line-height:1.3}
.status{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.02em}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.link-row{display:flex;align-items:center;gap:8px;background:#f1f5f9;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px;margin-bottom:12px}
.link-row .link-text{flex:1;min-width:0;font-size:12px;font-weight:600;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-open{flex-shrink:0;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:800 11px/1 'Plus Jakarta Sans',system-ui,sans-serif;padding:10px 12px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;box-shadow:0 8px 18px var(--blue-ring)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;color:#64748b;margin:6px 0}
.row span:last-child{color:#0f172a;font-weight:800}
.empty{text-align:center;padding:48px 20px;background:#fff;border:1.5px solid #dbeafe;border-radius:20px;box-shadow:var(--shadow)}
.empty h3{font-size:17px;font-weight:800;margin:10px 0 8px;color:#0f172a}
.empty p{font-size:13px;color:#64748b;margin-bottom:16px}
.empty a{display:inline-flex;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-2));text-decoration:none;padding:12px 18px;border-radius:12px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
.bottom-nav a{text-decoration:none;color:var(--muted);font-size:10px;font-weight:700;text-align:center}
.bottom-nav a i{display:block;font-size:16px;margin-bottom:3px}
.bottom-nav a.on{color:var(--blue)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--blue);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:50;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="back" href="mj-telegram.html" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="topbar-copy">
      <h1>Telegram orders</h1>
      <p>Premium &amp; Stars deliveries</p>
    </div>
    <button type="button" class="icon-btn" id="refreshBtn" aria-label="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
  </header>
  <div class="list" id="list"></div>
</div>
<nav class="bottom-nav">
  <a href="mj-telegram.html"><i class="fa-brands fa-telegram"></i>Shop</a>
  <a href="mj-telegram-history.html" class="on"><i class="fa-solid fa-clock-rotate-left"></i>Orders</a>
  <a href="dashboard.html"><i class="fa-solid fa-house"></i>Home</a>
</nav>
<div id="toast"></div>
<script>
const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.sessionStorage }
});
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return '₦' + Number(n||0).toLocaleString(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg||''; t.classList.add('on'); clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove('on'),3000); }
function stClass(s){
  s=String(s||'');
  if(/complete/i.test(s)) return 'ok';
  if(/cancel|fail|refund/i.test(s)) return 'bad';
  return 'warn';
}
function openTg(link){
  let href=String(link||'').trim();
  if(!href) return;
  if(href.startsWith('@')) href='https://t.me/'+href.slice(1);
  else if(/^(t\.me|telegram\.me)\//i.test(href)) href='https://'+href;
  else if(!/^https?:\/\//i.test(href)) href='https://t.me/'+href.replace(/^@/,'');
  window.open(href,'_blank','noopener,noreferrer');
}
window.openTg=openTg;

(async function main(){
  const el=document.getElementById('list');
  async function loadOrders(){
    el.innerHTML=((window.mjSkeleton||window.MJSkeleton)?(window.mjSkeleton||window.MJSkeleton).cards(3):'<div class="empty"><p>Loading…</p></div>');
    let session=null;
    try{
      const res=await sb.auth.getSession();
      session=res.data&&res.data.session;
    }catch(e){ console.error(e); }
    if(!session||!session.access_token){
      el.innerHTML='<div class="empty"><h3>Please sign in</h3><p>Your session is missing. Sign in again to see orders.</p><a href="auth.html?next=mj-telegram-history.html">Sign in</a></div>';
      return;
    }
    try{
      const res=await fetch('/api/owlet?action=my_orders&page_size=50&live=0&source=smmkings',{
        headers:{ Authorization:'Bearer '+session.access_token }
      });
      const json=await res.json().catch(()=>({}));
      if(!json.success){
        el.innerHTML=`<div class="empty"><h3>Could not load</h3><p>${esc(json.message||'Error')}</p><a href="auth.html?next=mj-telegram-history.html">Sign in again</a></div>`;
        return;
      }
      let rows=Array.isArray(json.data)?json.data:[];
      rows=rows.filter(o => String(o.source||'').toLowerCase()==='smmkings');
      if(!rows.length){
        el.innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:8px">✈️</div><h3>No orders yet</h3><p>Your Premium and Stars deliveries will show here.</p><a href="mj-telegram.html">Send now</a></div>';
        return;
      }
      el.innerHTML=rows.map(o=>{
        const link=o.link||'';
        const sc=stClass(o.status);
        return `<div class="card">
          <div class="top">
            <div class="title">${esc(o.service_name||'Telegram')}</div>
            <span class="status ${sc}">${esc(o.status||'Pending')}</span>
          </div>
          <div class="link-row">
            <span class="link-text">${link?esc(link):'No recipient'}</span>
            ${link?`<button type="button" class="btn-open" onclick='openTg(${JSON.stringify(String(link))})'><i class="fa-solid fa-arrow-up-right-from-square"></i> Open</button>`:''}
          </div>
          <div class="row"><span>Quantity ${Number(o.quantity||1).toLocaleString()}</span><span>${fmt(o.price_ngn)}</span></div>
          <div class="row"><span>Order #${esc(o.supplier_order_id||o.id||'')}</span><span>${o.created_at?new Date(o.created_at).toLocaleString():''}</span></div>
        </div>`;
      }).join('');
    }catch(e){
      el.innerHTML=`<div class="empty"><h3>Could not load</h3><p>${esc(e.message||'Network error')}</p><a href="#" onclick="location.reload();return false">Retry</a></div>`;
    }
  }
  document.getElementById('refreshBtn').onclick=()=>{ toast('Refreshing…'); loadOrders(); };
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadOrders(); });
  await loadOrders();
})();
</script>
</body>
</html>
