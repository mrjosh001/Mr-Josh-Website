<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>MJ HUB - Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Use the same root variables and styling from your dashboard for consistency */
        :root[data-theme="dark"] {
            --primary-color: #2563eb;
            --bg-main: #0b0f19;
            --card-bg: #121824;
            --text-main: #ffffff;
            --text-muted: #93c5fd;
            --border-color: #1e3a8a;
        }
        body { background: var(--bg-main); color: var(--text-main); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 10px; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: var(--primary-color); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 style="margin-bottom: 20px; text-align: center; color: var(--primary-color);">MJ HUB Access</h2>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="emailInput" placeholder="yourname@gmail.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="••••••••">
        </div>
        <button class="btn-primary" onclick="handleLogin()">Sign In / Register</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'Sb_publishable_r-_iYf6LNwBtCNM4k4x4Ow_t7UIEwGM';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        async function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }

            // Attempt login
            let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            // If user doesn't exist, automatically sign them up
            if (error) {
                let signUpRes = await supabaseClient.auth.signUp({ email, password });
                if (signUpRes.error) {
                    alert('Authentication Error: ' + signUpRes.error.message);
                    return;
                }
                alert('Account created and logged in successfully!');
            } else {
                alert('Logged in successfully!');
            }

            // Redirect to the main dashboard
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
