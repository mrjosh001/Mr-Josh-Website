    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ HUB - Sign In & Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0356C5;
            --primary-bright: #1a6fe0;
            --primary-deep: #0248a8;
            --primary-glow: rgba(3, 86, 197, 0.45);
            --midnight: #02060E;
            --navy: #0a1628;
            --glass: rgba(255, 255, 255, 0.07);
            --glass-strong: rgba(255, 255, 255, 0.11);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-border-soft: rgba(255, 255, 255, 0.10);
            --text-main: #ffffff;
            --text-muted: rgba(203, 213, 225, 0.85);
            --text-faint: rgba(203, 213, 225, 0.55);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.16);
            --error-color: #f87171;
            --success-color: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background: var(--midnight);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        /* Abstract fluid ribbons — pure blue / midnight only */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(3, 86, 197, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse 70% 50% at 85% 75%, rgba(3, 86, 197, 0.28) 0%, transparent 50%),
                radial-gradient(ellipse 50% 40% at 50% 100%, rgba(2, 72, 168, 0.22) 0%, transparent 45%),
                linear-gradient(165deg, #02060E 0%, #061428 40%, #0a1a35 70%, #02060E 100%);
            pointer-events: none;
        }

        /* Soft flowing shapes */
        body::after {
            content: '';
            position: fixed;
            inset: -20%;
            z-index: 0;
            background:
                radial-gradient(ellipse 35% 55% at 10% 60%, rgba(26, 111, 224, 0.18) 0%, transparent 60%),
                radial-gradient(ellipse 40% 45% at 90% 30%, rgba(3, 86, 197, 0.20) 0%, transparent 55%),
                radial-gradient(ellipse 25% 35% at 70% 90%, rgba(2, 72, 168, 0.15) 0%, transparent 50%);
            filter: blur(40px);
            pointer-events: none;
            animation: ambientDrift 28s ease-in-out infinite alternate;
        }

        @keyframes ambientDrift {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-2%, 3%) scale(1.04); }
        }

        /* Top Nav */
        .top-nav {
            position: relative;
            z-index: 10;
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2, 6, 14, 0.35);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-bottom: 1px solid var(--glass-border-soft);
        }

        .brand-logo-img {
            height: 34px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            display: block;
        }

        .home-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .home-link:hover {
            background: var(--glass-strong);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.28);
            transform: translateY(-1px);
        }

        /* Main */
        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 36px 18px;
            position: relative;
            z-index: 5;
        }

        /* True glass card — Apple-style */
        .auth-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 42px 36px 32px;
            border-radius: 28px;
            background: linear-gradient(
                165deg,
                rgba(255, 255, 255, 0.12) 0%,
                rgba(255, 255, 255, 0.05) 45%,
                rgba(255, 255, 255, 0.03) 100%
            );
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 32px 64px -12px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 1px 0 rgba(255, 255, 255, 0.18) inset;
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        /* Subtle top highlight on glass */
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
            pointer-events: none;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header */
        .form-icon-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(145deg, rgba(3, 86, 197, 0.35), rgba(3, 86, 197, 0.12));
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow:
                0 10px 28px rgba(3, 86, 197, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .form-icon-header h3 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: -0.4px;
        }

        .form-icon-header p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Tabs */
        .tab-switcher {
            display: flex;
            margin-bottom: 26px;
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--glass-border-soft);
        }

        .tab-btn {
            flex: 1;
            padding: 11px 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 13px;
            border-radius: 11px;
            font-family: inherit;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-bright) 100%);
            color: #fff;
            box-shadow: 0 6px 18px var(--primary-glow);
        }

        /* Form fields */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 7px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            color: var(--text-main);
            border-radius: 14px;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .form-group input::placeholder {
            color: var(--text-faint);
        }

        .form-group input:focus {
            border-color: var(--primary-bright);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 0 4px rgba(3, 86, 197, 0.22);
        }

        .remember-me-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .remember-me-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Primary button — solid blue, no purple */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-bright) 0%, var(--primary) 55%, var(--primary-deep) 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.25s ease;
            box-shadow:
                0 10px 28px var(--primary-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            font-family: inherit;
            letter-spacing: 0.2px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow:
                0 14px 32px rgba(3, 86, 197, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.75;
            cursor: wait;
            transform: none;
            pointer-events: none;
        }

        .btn-submit.is-loading {
            position: relative;
        }

        .btn-submit.is-loading .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: authSpin 0.7s linear infinite;
            vertical-align: -3px;
            margin-right: 8px;
        }

        @keyframes authSpin {
            to { transform: rotate(360deg); }
        }

        .forgot-password-link {
            display: block;
            text-align: right;
            margin-top: -6px;
            margin-bottom: 14px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 600;
        }

        .forgot-password-link:hover {
            color: #fff;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 26px 0 0;
            color: var(--text-faint);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            font-weight: 700;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--glass-border-soft);
        }

        .divider::before { margin-right: 14px; }
        .divider::after  { margin-left: 14px; }

        .hidden { display: none; }

        .error-msg {
            color: var(--error-color);
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
            background: rgba(248, 113, 113, 0.12);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(248, 113, 113, 0.28);
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .success-msg {
            color: var(--success-color);
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
            background: rgba(74, 222, 128, 0.12);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(74, 222, 128, 0.28);
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .back-to-signin {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
        }

        .back-to-signin:hover {
            color: #fff;
        }

        /* Footer */
        .site-footer {
            position: relative;
            z-index: 5;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-faint);
            border-top: 1px solid var(--glass-border-soft);
            background: rgba(2, 6, 14, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Responsive */
        @media (max-width: 400px) {
            .top-nav { padding: 14px 16px; }
            .main-wrapper { padding: 24px 14px; }
            .auth-container {
                padding: 32px 22px 26px;
                border-radius: 24px;
            }
            .form-icon-header h3 { font-size: 21px; }
            .icon-circle { width: 56px; height: 56px; font-size: 24px; border-radius: 16px; }
        }

        @media (min-width: 768px) {
            .main-wrapper { padding: 48px 40px; }
            .auth-container {
                max-width: 440px;
                padding: 48px 40px 36px;
            }
            .form-icon-header h3 { font-size: 26px; }
        }

        @media (min-width: 1024px) {
            .top-nav { padding: 20px 48px; }
            .auth-container { max-width: 460px; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <img class="brand-logo-img" src="https://atczodlljmlayvldxfmv.supabase.co/storage/v1/object/public/avatars/dark%20background%20log" alt="MJ HUB">

    <!-- Main Auth Card -->
    <div class="main-wrapper">

            <div class="form-icon-header">

    <script>
        // Initialize Supabase Client
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
        
        // Referral: persist ?ref=CODE and open Register (create account)
        (function(){
          try {
            var p = new URLSearchParams(window.location.search);
            var ref = (p.get('ref') || p.get('referral') || '').trim();
            if (ref) localStorage.setItem('mjhub_ref_code', ref.toUpperCase());
            var tab = (p.get('tab') || p.get('mode') || '').toLowerCase();
            if (ref || tab === 'signup' || tab === 'register') {
              window.__mjhub_open_signup = true;
            }
          } catch (e) {}
        })();

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            // Check for saved "Remember Me" details within the 24-hour expiry window
            const rememberedDataString = localStorage.getItem('mjhub_remember_user');
            if (rememberedDataString) {
                try {
                    const rememberedData = JSON.parse(rememberedDataString);
                    const now = new Date().getTime();
                    if (now < rememberedData.expiry) {
                        document.getElementById('signinEmail').value = rememberedData.email;
                        document.getElementById('rememberMe').checked = true;
                    } else {
                        localStorage.removeItem('mjhub_remember_user');
                    }
                } catch (err) {
                    localStorage.removeItem('mjhub_remember_user');
                }
            }

            const urlParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const type = urlParams.get('type') || hashParams.get('type');

            if (type === 'recovery') {
                switchTab('updatePassword');
                return;
            }

            if (urlParams.get('verified') === '1') {
                switchTab('signin');
                showSuccess('✅ Your email has been verified! Please sign in below.');
                // Clean the query param off the visible URL without reloading.
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (urlParams.get('banned') === '1') {
                switchTab('signin');
                showBannedError();
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            async function attachReferralIfNeeded(session) {
            try {
              var refCode = localStorage.getItem('mjhub_ref_code');
              if (!refCode || !session || !session.access_token) return;
              // Profile row may lag signup trigger — retry a few times
              for (var attempt = 0; attempt < 5; attempt++) {
                if (attempt > 0) await new Promise(function(r){ setTimeout(r, 800 * attempt); });
                var res = await fetch('/api/pocketfi?action=referral_attach', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    Authorization: 'Bearer ' + session.access_token
                  },
                  body: JSON.stringify({ code: refCode })
                });
                var j = {};
                try { j = await res.json(); } catch (e) {}
                if (j && j.success) {
                  localStorage.removeItem('mjhub_ref_code');
                  console.log('[referral] linked', j);
                  return;
                }
                // invalid code — stop
                if (res.status === 404 || res.status === 400) {
                  console.warn('[referral] attach failed', j);
                  return;
                }
              }
            } catch (e) {
              console.warn('[referral] attach error', e);
            }
          }
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
              attachReferralIfNeeded(session);
            }
                if (event === 'PASSWORD_RECOVERY') {
                    switchTab('updatePassword');
                }
            });

            if (urlParams.get('mode') === 'signup' || window.__mjhub_open_signup) {
                switchTab('signup');
            }
        });

        function switchTab(tab) {
            const errorEl = document.getElementById('errorContainer');
            const successEl = document.getElementById('successContainer');
            errorEl.innerText = '';
            errorEl.classList.add('hidden');
            successEl.innerText = '';
            successEl.classList.add('hidden');

            const formIcon = document.getElementById('formIcon');
            const formHeading = document.getElementById('formHeading');
            const formSubheading = document.getElementById('formSubheading');
            const tabSwitcherContainer = document.getElementById('tabSwitcherContainer');

            document.getElementById('signinForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('hidden');
            document.getElementById('updatePasswordForm').classList.add('hidden');
            tabSwitcherContainer.style.display = 'flex';

            if (tab === 'signin') {
                document.getElementById('signinTabBtn').classList.add('active');
                document.getElementById('signupTabBtn').classList.remove('active');
                document.getElementById('signinForm').classList.remove('hidden');
                formIcon.innerText = '🔒';
                formHeading.innerText = 'Welcome Back';
                formSubheading.innerText = 'Sign in to access your dashboard';
            } else if (tab === 'signup') {
                document.getElementById('signupTabBtn').classList.add('active');
                document.getElementById('signinTabBtn').classList.remove('active');
                document.getElementById('signupForm').classList.remove('hidden');
                formIcon.innerText = '👤';
                formHeading.innerText = 'Create Your Account';
                formSubheading.innerText = 'Join MJ HUB in just a few seconds';
            } else if (tab === 'forgot') {
                tabSwitcherContainer.style.display = 'none';
                document.getElementById('forgotForm').classList.remove('hidden');
                formIcon.innerText = '🔑';
                formHeading.innerText = 'Recover Account';
                formSubheading.innerText = 'Enter your email to receive reset instructions';
            } else if (tab === 'updatePassword') {
                tabSwitcherContainer.style.display = 'none';
                document.getElementById('updatePasswordForm').classList.remove('hidden');
                formIcon.innerText = '🛡️';
                formHeading.innerText = 'Set New Password';
                formSubheading.innerText = 'Please enter your new secure password';
            }
        }

        function formatAuthError(error) {
            if (!error) return 'Something went wrong. Please try again.';
            const tag = [];
            if (error.status) tag.push('[' + error.status + ']');
            if (error.code) tag.push('(' + error.code + ')');
            let msg = error.message;
            if (!msg || msg === '{}' || msg === '[object Object]') {
                msg = error.error_description || error.msg || error.error || 'Registration failed — no details were returned by the server. Please try again in a moment.';
            }
            return (tag.length ? tag.join(' ') + ' ' : '') + msg;
        }

        function showError(message) {
            const errorEl = document.getElementById('errorContainer');
            errorEl.innerText = message;
            errorEl.classList.remove('hidden');
        }

        // Supabase returns a 403 with a message containing "banned" when a
        // banned user tries to sign in via password grant. Give those users
        // a clear explanation instead of a generic auth error, with a way
        // to reach support.
        function isBannedError(error) {
            if (!error) return false;
            const msg = (error.message || error.error_description || '').toLowerCase();
            return msg.includes('banned');
        }

        function showBannedError() {
            const errorEl = document.getElementById('errorContainer');
            errorEl.innerHTML = 'You have been banned from MJ HUB. If you believe this is a mistake, please <a href="support.html" style="color:inherit;font-weight:700;text-decoration:underline;">contact support</a>.';
            errorEl.classList.remove('hidden');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successContainer');
            successEl.innerText = message;
            successEl.classList.remove('hidden');
        }


        function setAuthButtonLoading(btn, loading, loadingText) {
            if (!btn) return;
            if (loading) {
                if (!btn.dataset.idleHtml) btn.dataset.idleHtml = btn.innerHTML;
                btn.disabled = true;
                btn.classList.add('is-loading');
                btn.innerHTML = '<span class="btn-spinner"></span>' + (loadingText || 'Please wait…');
            } else {
                btn.disabled = false;
                btn.classList.remove('is-loading');
                if (btn.dataset.idleHtml) btn.innerHTML = btn.dataset.idleHtml;
            }
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('signinEmail').value.trim();
            const password = document.getElementById('signinPassword').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('signinSubmitBtn') || (e.submitter) || e.target.querySelector('.btn-submit');
            setAuthButtonLoading(btn, true, 'Signing in…');

            let data, error;
            try {
                ({ data, error } = await supabaseClient.auth.signInWithPassword({ email, password }));
            } catch (e) {
                setAuthButtonLoading(btn, false);
                showError(formatAuthError(e));
                return;
            }

            if (error) {
                setAuthButtonLoading(btn, false);
                if (isBannedError(error)) {
                    showBannedError();
                } else {
                    showError(formatAuthError(error));
                }
                return;
            }

            // Belt-and-suspenders: even if the auth-level ban somehow let a
            // session through (e.g. an existing token that hasn't refreshed
            // yet), check the profile flag we mirror on ban/unban and block
            // access here too.
            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('is_banned')
                    .eq('id', data.user.id)
                    .maybeSingle();
                if (profile && profile.is_banned) {
                    await supabaseClient.auth.signOut();
                    setAuthButtonLoading(btn, false);
                    showBannedError();
                    return;
                }
            } catch (e) {
                // If this check fails for any reason, don't block a
                // legitimate sign-in over it — the auth-level ban above is
                // the real enforcement.
            }

            if (rememberMe) {
                const twentyFourHoursMs = 24 * 60 * 60 * 1000;
                const expiryTime = new Date().getTime() + twentyFourHoursMs;
                // Only ever remember the email, never the password — storing
                // a real account password in localStorage in plain text is a
                // security risk on its own (readable by any script/extension,
                // or anyone else who later uses the device), and it was also
                // what made sign-in feel "automatic": the password field
                // arrived pre-filled and ready to submit the instant the page
                // loaded. This still saves the retyping of the email without
                // either problem.
                const rememberData = {
                    email: email,
                    expiry: expiryTime
                };
                localStorage.setItem('mjhub_remember_user', JSON.stringify(rememberData));
            } else {
                localStorage.removeItem('mjhub_remember_user');
            }

            showSuccess('Signed in successfully!');
            try { sessionStorage.setItem('mjhub-fresh-login', '1'); } catch (e) {}
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 500);
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const phone = document.getElementById('phoneNumber').value.trim();
            const email = document.getElementById('emailAddress').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const btn = document.getElementById('signupSubmitBtn') || e.target.querySelector('.btn-submit');
            setAuthButtonLoading(btn, true, 'Creating account…');

            let data, error;
            try {
                ({ data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            username: username,
                            phone_number: phone
                        },
                        // Where Supabase sends the user after they click the
                        // confirm-email link — back to the sign-in page here,
                        // with ?verified=1 so auth.html can greet them.
                        emailRedirectTo: window.location.origin + window.location.pathname + '?verified=1'
                    }
                }));
            } catch (e) {
                console.error('signUp threw:', e);
                setAuthButtonLoading(btn, false);
                showError(formatAuthError(e));
                return;
            }

            if (error) {
                console.error('signUp error:', error);
                setAuthButtonLoading(btn, false);
                showError(formatAuthError(error));
                return;
            }

            // Profile row creation is handled server-side by a database
            // trigger (on_auth_user_created) the moment the auth user is
            // created — this works whether or not "Confirm email" is on,
            // unlike inserting from here, which used to fail with an RLS
            // error whenever the user isn't signed in yet post-signup.

            if (data.session) {
                // Email confirmation is off — user is already signed in.
                showSuccess('Account created successfully!');
                try {
                  if (data.session) await attachReferralIfNeeded(data.session);
                } catch (e) {}
                try { sessionStorage.setItem('mjhub-fresh-login', '1'); } catch (e) {}
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1200);
            } else {
                // Email confirmation is required — send them to the
                // dedicated "check your email" page with their address,
                // instead of redirecting into a session that doesn't exist yet.
                window.location.href = 'check-email.html?email=' + encodeURIComponent(email);
            }
        }

        async function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const btn = document.getElementById('forgotSubmitBtn') || e.target.querySelector('.btn-submit');
            setAuthButtonLoading(btn, true, 'Sending…');

            const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + window.location.pathname
            });

            if (error) {
                setAuthButtonLoading(btn, false);
                showError(error.message);
                return;
            }

            setAuthButtonLoading(btn, false);
            showSuccess('Password reset instructions sent! Check your email inbox.');
        }

        async function handleUpdatePassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value.trim();
            const btn = document.getElementById('updatePassSubmitBtn') || e.target.querySelector('.btn-submit');
            setAuthButtonLoading(btn, true, 'Updating…');

            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                setAuthButtonLoading(btn, false);
                showError(error.message);
                return;
            }

            showSuccess('Password successfully updated!');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        }
    </script>
