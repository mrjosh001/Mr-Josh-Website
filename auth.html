    <meta charset="UTF-8">

    <title>MJ HUB - Sign In & Sign Up</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0356C5;
            --primary-bright: #1a6fe0;
            --primary-deep: #0248a8;
            --primary-glow: rgba(3, 86, 197, 0.5);
            --midnight: #02060E;
            --navy: #071525;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-strong: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.22);
            --glass-border-soft: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-muted: rgba(226, 232, 240, 0.78);
            --text-faint: rgba(203, 213, 225, 0.5);
            --input-bg: rgba(8, 18, 36, 0.45);
            --input-border: rgba(255, 255, 255, 0.2);
            --error-color: #f87171;
            --success-color: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background: var(--midnight);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        /* Fluid abstract ribbons — blue only (sample-style) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(3, 86, 197, 0.55) 0%, transparent 55%),
                radial-gradient(ellipse 70% 50% at 85% 75%, rgba(26, 111, 224, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse 50% 40% at 50% 100%, rgba(2, 72, 168, 0.35) 0%, transparent 45%),
                linear-gradient(165deg, #02060E 0%, #061428 40%, #0a1a35 100%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: -20%;
            z-index: 0;
            background:
                radial-gradient(circle at 30% 40%, rgba(59, 130, 246, 0.18) 0%, transparent 35%),
                radial-gradient(circle at 70% 30%, rgba(3, 86, 197, 0.22) 0%, transparent 40%),
                radial-gradient(circle at 55% 80%, rgba(37, 99, 235, 0.15) 0%, transparent 38%);
            filter: blur(40px);
            animation: fluidDrift 18s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes fluidDrift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(-3%, 2%) scale(1.05); }
        }

        /* Ribbon shapes */
        .bg-ribbon {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            border-radius: 50%;
            filter: blur(2px);
        }
        .bg-ribbon.r1 {
            width: 55vw; max-width: 520px; height: 55vw; max-height: 520px;
            top: -12%; right: -18%;
            background: linear-gradient(135deg, rgba(3,86,197,0.35), rgba(26,111,224,0.12));
            border-radius: 40% 60% 55% 45%;
            animation: floatA 14s ease-in-out infinite;
        }
        .bg-ribbon.r2 {
            width: 45vw; max-width: 420px; height: 45vw; max-height: 420px;
            bottom: -10%; left: -15%;
            background: linear-gradient(200deg, rgba(37,99,235,0.28), rgba(2,72,168,0.1));
            border-radius: 55% 45% 40% 60%;
            animation: floatB 16s ease-in-out infinite;
        }
        @keyframes floatA {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(8deg) translateY(18px); }
        }
        @keyframes floatB {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(-6deg) translateY(-14px); }
        }

        .top-nav {
            position: relative;
            z-index: 10;
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
        }

        .brand-logo-img {
            height: 32px;
            width: auto;
            max-width: 150px;
            object-fit: contain;
            display: block;
        }

        .home-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border: 1px solid var(--glass-border-soft);
            border-radius: 999px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .home-link:hover {
            background: var(--glass-strong);
            color: #fff;
            border-color: rgba(255,255,255,0.28);
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px 36px;
            position: relative;
            z-index: 5;
        }

        /* Sample-style tall glass card */
        .auth-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 36px 32px 28px;
            border-radius: 28px;
            background: linear-gradient(
                165deg,
                rgba(255, 255, 255, 0.14) 0%,
                rgba(255, 255, 255, 0.06) 40%,
                rgba(255, 255, 255, 0.04) 100%
            );
            backdrop-filter: blur(48px) saturate(1.85);
            -webkit-backdrop-filter: blur(48px) saturate(1.85);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 40px 80px -20px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 1px 0 rgba(255, 255, 255, 0.22) inset;
            animation: cardIn 0.75s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            pointer-events: none;
        }

        /* Soft inner sheen */
        .auth-container::after {
            content: '';
            position: absolute;
            top: -40%;
            left: -20%;
            width: 140%;
            height: 70%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.08) 0%, transparent 65%);
            pointer-events: none;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(32px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }
        .auth-brand-mark {
            width: 52px;
            height: 52px;
            margin: 0 auto 12px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #1a6fe0, #0356C5);
            box-shadow: 0 12px 28px rgba(3, 86, 197, 0.45), inset 0 1px 0 rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 22px;
            color: #fff;
        }
        .auth-brand-name {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
        }

        .form-icon-header {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }
        .form-icon-header .icon-circle { display: none; }
        .form-icon-header h3 {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: -0.35px;
        }
        .form-icon-header p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .tab-switcher {
            display: flex;
            margin-bottom: 22px;
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
            background: rgba(0, 0, 0, 0.32);
            border: 1px solid var(--glass-border-soft);
            position: relative;
            z-index: 1;
        }
        .tab-btn {
            flex: 1;
            padding: 11px 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 13px;
            border-radius: 11px;
            font-family: inherit;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-bright) 100%);
            color: #fff;
            box-shadow: 0 6px 18px var(--primary-glow);
        }

        .form-group {
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 7px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            color: var(--text-main);
            border-radius: 14px;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
            backdrop-filter: blur(8px);
        }
        .form-group input::placeholder {
            color: rgba(203, 213, 225, 0.38);
        }
        .form-group input:focus {
            border-color: rgba(59, 130, 246, 0.75);
            background: rgba(8, 22, 48, 0.55);
            box-shadow: 0 0 0 3px rgba(3, 86, 197, 0.22);
        }

        .remember-me-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            position: relative;
            z-index: 1;
        }
        .remember-me-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1a6fe0 0%, #0356C5 55%, #0248a8 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 6px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 28px rgba(3, 86, 197, 0.45);
            font-family: inherit;
            letter-spacing: 0.2px;
            position: relative;
            z-index: 1;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(3, 86, 197, 0.55);
        }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled {
            opacity: 0.75;
            cursor: wait;
            transform: none;
            pointer-events: none;
        }
        .btn-submit.is-loading .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: authSpin 0.7s linear infinite;
            vertical-align: -3px;
            margin-right: 8px;
        }
        @keyframes authSpin { to { transform: rotate(360deg); } }

        
        .pw-field {
            position: relative;
            display: flex;
            align-items: center;
        }
        .pw-field input {
            width: 100%;
            padding-right: 48px !important;
        }
        .pw-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-muted, #8b9bb4);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 2;
        }
        .pw-toggle:hover { color: var(--text-main, #fff); background: rgba(255,255,255,0.06); }
        .pw-toggle svg { width: 20px; height: 20px; display: block; pointer-events: none; }
        .pw-match-hint {
            font-size: 12px;
            margin-top: 6px;
            font-weight: 600;
        }
        .pw-match-hint.ok { color: #34d399; }
        .pw-match-hint.bad { color: #f87171; }

        .forgot-password-link {
            display: block;
            text-align: right;
            margin-top: -4px;
            margin-bottom: 14px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }
        .forgot-password-link:hover { color: #fff; }
        .pw-strength { margin-top: 8px; }
        .pw-strength-bar {
            height: 4px; border-radius: 2px; background: rgba(148,163,184,.2);
            overflow: hidden; margin-bottom: 6px;
        }
        .pw-strength-bar > span {
            display: block; height: 100%; width: 0%; transition: width .25s, background .25s;
            border-radius: 2px;
        }
        .pw-strength-label { font-size: 11px; color: #94a3b8; }
        .pw-rules { list-style: none; padding: 0; margin: 6px 0 0; font-size: 11px; color: #64748b; }
        .pw-rules li { margin: 2px 0; }
        .pw-rules li.ok { color: #34d399; }
        .pw-rules li.bad { color: #f87171; }


        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0 0;
            color: var(--text-faint);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--glass-border-soft);
        }
        .divider::before { margin-right: 12px; }
        .divider::after  { margin-left: 12px; }

        .hidden { display: none; }

        .error-msg, .success-msg {
            font-size: 13px;
            margin-bottom: 14px;
            text-align: center;
            padding: 12px 14px;
            border-radius: 12px;
            font-weight: 600;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(8px);
        }
        .error-msg {
            color: var(--error-color);
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.28);
        }
        .success-msg {
            color: var(--success-color);
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.28);
        }

        .back-to-signin {
            display: block;
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }
        .back-to-signin:hover { color: #fff; }

        .site-footer {
            position: relative;
            z-index: 5;
            padding: 18px 20px;
            text-align: center;
            font-size: 12px;
            color: rgba(203, 213, 225, 0.45);
        }

        @media (max-width: 380px) {
            .top-nav { padding: 14px 16px; }
            .auth-container { padding: 28px 20px 24px; border-radius: 24px; }
            .form-icon-header h3 { font-size: 20px; }
        }
        @media (min-width: 768px) {
            .auth-container { max-width: 420px; padding: 40px 36px 32px; }
            .form-icon-header h3 { font-size: 24px; }
        }
    
/* ===== Animated floating inputs (SmoothUI-style) ===== */
.form-group.ai-field {
  position: relative;
  margin-bottom: 18px;
}
.form-group.ai-field > label {
  position: absolute;
  left: 44px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  font-weight: 500;
  color: #94a3b8;
  pointer-events: none;
  transition: top .2s ease, transform .2s ease, font-size .2s ease, color .2s ease, left .2s ease;
  margin: 0;
  background: transparent;
  z-index: 2;
}
.form-group.ai-field.has-icon > label { left: 44px; }
.form-group.ai-field .ai-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: #64748b;
  z-index: 2;
  pointer-events: none;
  transition: color .2s;
}
.form-group.ai-field .ai-icon svg {
  width: 18px; height: 18px; display: block;
}
.form-group.ai-field input {
  width: 100%;
  padding: 16px 14px 12px 44px !important;
  background: var(--input-bg);
  border: 1.5px solid var(--input-border);
  border-radius: 12px;
  color: #f1f5f9;
  font-size: 15px;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.form-group.ai-field .pw-field input {
  padding-right: 46px !important;
}
.form-group.ai-field input::placeholder {
  color: transparent !important;
}
.form-group.ai-field input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,.2);
}
.form-group.ai-field.is-focused .ai-icon,
.form-group.ai-field input:focus ~ .ai-icon,
.form-group.ai-field:focus-within .ai-icon {
  color: #60a5fa;
}
/* float label when focused or has value */
.form-group.ai-field.is-active > label,
.form-group.ai-field:focus-within > label {
  top: 0;
  transform: translateY(-50%);
  left: 12px;
  font-size: 11px;
  font-weight: 700;
  color: #60a5fa;
  padding: 0 6px;
  background: linear-gradient(180deg, transparent 40%, rgba(8,18,36,.95) 40%);
}
body[data-theme="light"] .form-group.ai-field.is-active > label,
body[data-theme="light"] .form-group.ai-field:focus-within > label {
  background: linear-gradient(180deg, transparent 40%, #fff 40%);
  color: #2563eb;
}
@media (prefers-reduced-motion: reduce) {
  .form-group.ai-field > label { transition: none; }
}

</style>

}
.form-group.is-valid input {
  border-color: rgba(74,222,128,.55) !important;
}

}
.form-group.is-valid .field-hint { color: #86efac; }

  font-weight: 600;

  width: 18px;

  font-size: 12px;

  color: #fbbf24;

<style>
/* Single clean password requirements list */
.pw-strength { margin-top: 10px; clear: both; position: relative; z-index: 1; }
.pw-strength-bar {
  height: 4px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-bottom: 8px;
}
.pw-strength-bar > span { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .25s, background .25s; }
.pw-strength-label { font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; }
.pw-rules {
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-direction: column; gap: 6px;
}
.pw-rules li {
  font-size: 12px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  color: #94a3b8;
}

        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
        
        // Referral: persist ?ref=CODE and open Register (create account)
        (function(){
          try {
            var p = new URLSearchParams(window.location.search);
            var ref = (p.get('ref') || p.get('referral') || '').trim();
            if (ref) localStorage.setItem('mjhub_ref_code', ref.toUpperCase());
            var tab = (p.get('tab') || p.get('mode') || '').toLowerCase();
            if (ref || tab === 'signup' || tab === 'register') {
              window.__mjhub_open_signup = true;
            }
          } catch (e) {}
        })();

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                // sessionStorage: token clears when the browser tab/window closes (harder for XSS to keep long-lived access)
                storage: window.sessionStorage
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            // Check for saved "Remember Me" details within the 24-hour expiry window
            const rememberedDataString = localStorage.getItem('mjhub_remember_user');
            if (rememberedDataString) {
                try {
                    const rememberedData = JSON.parse(rememberedDataString);
                    const now = new Date().getTime();
                    if (now < rememberedData.expiry) {
                        document.getElementById('signinEmail').value = rememberedData.email;
                        document.getElementById('rememberMe').checked = true;
                    } else {
                        localStorage.removeItem('mjhub_remember_user');
                    }
                } catch (err) {
                    localStorage.removeItem('mjhub_remember_user');
                }
            }

            const urlParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const type = urlParams.get('type') || hashParams.get('type');

            if (type === 'recovery') {
                switchTab('updatePassword');
                // Links expire (Supabase default ~1 hour). If session missing, show help.
                setTimeout(async function () {
                    try {
                        var s = await supabaseClient.auth.getSession();
                        if (!s.data || !s.data.session) {
                            showError('This reset link is invalid or has expired. Request a new one below.');
                            switchTab('forgot');
                        }
                    } catch (e) {}
                }, 800);
                return;
            }

            // ---- Email confirmation / magic-link / recovery error handling ----
            (async function handleEmailConfirmSession() {
              try {
                if (!supabaseClient) return;
                function cleanAuthUrl() {
                  try {
                    var path = window.location.pathname || '/auth.html';
                    window.history.replaceState({}, document.title, path);
                  } catch (e) {}
                }
                function friendlyAuthLinkError(raw) {
                  if (window.mjExplainError) return window.mjExplainError(raw, 'auth').text;
                  var s = String(raw || '').toLowerCase();
                  if (/expired|otp_expired|invalid/.test(s)) {
                    return 'This confirmation link has expired or was already used. Sign in if you already confirmed, or sign up again to get a new email.';
                  }
                  return 'We could not confirm your email from this link. Please sign in, or sign up again for a new confirmation email.';
                }
                var hashStr = (window.location.hash || '').replace(/^#/, '');
                var hashParams = new URLSearchParams(hashStr);
                var q = new URLSearchParams(window.location.search || '');
                var errCode = q.get('error') || hashParams.get('error') || q.get('error_code') || hashParams.get('error_code');
                var errDesc = q.get('error_description') || hashParams.get('error_description') || '';
                try { errDesc = decodeURIComponent(String(errDesc).replace(/\+/g, ' ')); } catch (e) {}
                if (errCode || /error=|error_description=/i.test(window.location.href)) {
                  switchTab('signin');
                  showError(friendlyAuthLinkError(errDesc || errCode));
                  cleanAuthUrl();
                  return;
                }
                var hasAuthHash = /access_token=|refresh_token=|type=signup|type=email|type=magiclink/i.test(window.location.hash || '');
                var code = q.get('code');
                var verifiedFlag = q.get('verified') === '1';
                if (code) {
                  try {
                    var exch = await supabaseClient.auth.exchangeCodeForSession(code);
                    if (exch.error) {
                      switchTab('signin');
                      showError(friendlyAuthLinkError(exch.error.message || 'code'));
                      cleanAuthUrl();
                      return;
                    }
                  } catch (ex) {
                    switchTab('signin');
                    showError(friendlyAuthLinkError(ex.message || 'code'));
                    cleanAuthUrl();
                    return;
                  }
                }
                if (!hasAuthHash && !code && !verifiedFlag) return;
                var session = null;
                for (var i = 0; i < 6; i++) {
                  var res = await supabaseClient.auth.getSession();
                  session = res && res.data && res.data.session;
                  if (session && session.user) break;
                  await new Promise(function (r) { setTimeout(r, 200); });
                }
                switchTab('signin');
                cleanAuthUrl();
                if (session && session.user) {
                  try { sessionStorage.setItem('mjhub-fresh-login', '1'); } catch (e) {}
                  showSuccess('Your email is confirmed. Sign in with your email and password to continue.');
                  try {
                    var em = session.user.email;
                    if (em && document.getElementById('signinEmail')) document.getElementById('signinEmail').value = em;
                  } catch (e3) {}
                } else {
                  showSuccess('Your email is confirmed. Please sign in below.');
                }
              } catch (e) {
                console.warn('confirm session', e);
                try {
                  switchTab('signin');
                  showError(window.mjExplainError ? window.mjExplainError(e, 'auth').text : 'Something went wrong opening the confirmation link. Please sign in.');
                } catch (e4) {}
              }
            })();

            if (urlParams.get('banned') === '1') {
                switchTab('signin');
                showBannedError();
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            async function attachReferralIfNeeded(session) {
            try {
              var refCode = localStorage.getItem('mjhub_ref_code');
              if (!refCode || !session || !session.access_token) return;
              // Profile row may lag signup trigger — retry a few times
              for (var attempt = 0; attempt < 5; attempt++) {
                if (attempt > 0) await new Promise(function(r){ setTimeout(r, 800 * attempt); });
                var res = await fetch('/api/pocketfi?action=referral_attach', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    Authorization: 'Bearer ' + session.access_token
                  },
                  body: JSON.stringify({ code: refCode })
                });
                var j = {};
                try { j = await res.json(); } catch (e) {}
                if (j && j.success) {
                  localStorage.removeItem('mjhub_ref_code');
                  console.log('[referral] linked', j);
                  return;
                }
                // invalid code — stop
                if (res.status === 404 || res.status === 400) {
                  console.warn('[referral] attach failed', j);
                  return;
                }
              }
            } catch (e) {
              console.warn('[referral] attach error', e);
            }
          }
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
              attachReferralIfNeeded(session);
            }
                if (event === 'PASSWORD_RECOVERY') {
                    switchTab('updatePassword');
                }
            });

            if (urlParams.get('mode') === 'signup' || window.__mjhub_open_signup) {
                switchTab('signup');
            }
        });

        function switchTab(tab) {
            const errorEl = document.getElementById('errorContainer');
            const successEl = document.getElementById('successContainer');
            errorEl.innerText = '';
            errorEl.classList.add('hidden');
            successEl.innerText = '';
            successEl.classList.add('hidden');

            const formIcon = document.getElementById('formIcon');
            const formHeading = document.getElementById('formHeading');
            const formSubheading = document.getElementById('formSubheading');
            const tabSwitcherContainer = document.getElementById('tabSwitcherContainer');

            document.getElementById('signinForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('hidden');
            document.getElementById('updatePasswordForm').classList.add('hidden');
            tabSwitcherContainer.style.display = 'flex';

            if (tab === 'signin') {
                document.getElementById('signinTabBtn').classList.add('active');
                document.getElementById('signupTabBtn').classList.remove('active');
                document.getElementById('signinForm').classList.remove('hidden');
                formIcon.innerText = '🔒';
                formHeading.innerText = 'Welcome Back';
                formSubheading.innerText = 'Sign in to access your dashboard';
            } else if (tab === 'signup') {
                document.getElementById('signupTabBtn').classList.add('active');
                document.getElementById('signinTabBtn').classList.remove('active');
                document.getElementById('signupForm').classList.remove('hidden');
                formIcon.innerText = '👤';
                formHeading.innerText = 'Create Your Account';
                formSubheading.innerText = 'Join MJ HUB in just a few seconds';
            } else if (tab === 'forgot') {
                tabSwitcherContainer.style.display = 'none';
                document.getElementById('forgotForm').classList.remove('hidden');
                formIcon.innerText = '🔑';
                formHeading.innerText = 'Recover Account';
                formSubheading.innerText = 'Enter your email to receive reset instructions';
            } else if (tab === 'updatePassword') {
                tabSwitcherContainer.style.display = 'none';
                document.getElementById('updatePasswordForm').classList.remove('hidden');
                formIcon.innerText = '🛡️';
                formHeading.innerText = 'Set New Password';
                formSubheading.innerText = 'Please enter your new secure password';
            }
        }

        function formatAuthError(error) {
            if (window.mjExplainError) {
                var e = window.mjExplainError(error, 'auth');
                return e.text || (e.what + ' ' + e.action);
            }
            if (!error) return 'Something went wrong. Please try again.';
            const raw = String(error.message || error.error_description || error.msg || error.error || '').trim();
            const code = String(error.code || error.error_code || '').toLowerCase();
            const low = raw.toLowerCase();
            if (code === 'email_not_confirmed' || low.includes('email not confirmed') || low.includes('not confirmed')) {
                return 'Your email is not confirmed yet. Open the link we sent you, then sign in.';
            }
            if (low.includes('already registered') || low.includes('already been registered') || low.includes('user already')) {
                return 'An account with this email already exists. Please sign in instead.';
            }
            if (low.includes('failed to fetch') || low.includes('network')) {
                return 'Network error. Check your connection and try again.';
            }
            if (low.includes('invalid login') || low.includes('invalid credentials')) {
                return 'Incorrect email or password. Check both and try again.';
            }
            return raw || 'Something went wrong. Please try again.';
        }

        /**
         * After a failed password login, try to tell "no account" vs "wrong password".
         * Uses optional RPC public.email_registered(p_email) when you add it in Supabase.
         * Falls back to a clear combined message if the RPC is not installed.
         */
        async function resolveLoginError(error, email) {
            const raw = String(error && (error.message || error.error_description) || '').toLowerCase();
            const code = String(error && (error.code || error.error_code) || '').toLowerCase();
            const isInvalidCreds = code === 'invalid_credentials' || raw.includes('invalid login credentials') || raw.includes('invalid credentials');

            if (!isInvalidCreds) {
                return formatAuthError(error);
            }

            try {
                const { data, error: rpcErr } = await supabaseClient.rpc('email_registered', { p_email: String(email || '').trim().toLowerCase() });
                if (!rpcErr && data === true) {
                    return 'Incorrect password. Try again or use Forgot Password.';
                }
                if (!rpcErr && data === false) {
                    return 'No account found with this email. Please sign up first.';
                }
            } catch (e) { /* RPC not installed yet */ }

            return 'Incorrect email or password. If you do not have an account, sign up first.';
        }

        function showError(message) {
            const errorEl = document.getElementById('errorContainer');
            errorEl.innerText = message;
            errorEl.classList.remove('hidden');
        }

        // Supabase returns a 403 with a message containing "banned" when a
        // banned user tries to sign in via password grant. Give those users
        // a clear explanation instead of a generic auth error, with a way
        // to reach support.
        function isBannedError(error) {
            if (!error) return false;
            const msg = (error.message || error.error_description || '').toLowerCase();
            return msg.includes('banned');
        }

        function showBannedError() {
            const errorEl = document.getElementById('errorContainer');
            errorEl.innerHTML = 'You have been banned from MJ HUB. If you believe this is a mistake, please <a href="support.html" style="color:inherit;font-weight:700;text-decoration:underline;">contact support</a>.';
            errorEl.classList.remove('hidden');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successContainer');
            successEl.innerText = message;
            successEl.classList.remove('hidden');
        }


        function setAuthButtonLoading(btn, loading, loadingText) {
            if (!btn) return;
            if (loading) {
                if (!btn.dataset.idleHtml) btn.dataset.idleHtml = btn.innerHTML;
                btn.disabled = true;
                btn.classList.add('is-loading');
                btn.innerHTML = '<span class="btn-spinner"></span>' + (loadingText || 'Please wait…');
            } else {
                btn.disabled = false;
                btn.classList.remove('is-loading');
                if (btn.dataset.idleHtml) btn.innerHTML = btn.dataset.idleHtml;
            }
        }


        // ========== Security helpers (login rate limit + password rules) ==========
        var MJ_LOGIN_MAX = 5;
        var MJ_LOGIN_WINDOW_MS = 15 * 60 * 1000; // 15 minutes
        var MJ_RESET_MAX = 3;
        var MJ_RESET_WINDOW_MS = 15 * 60 * 1000;

        function mjRateKey(kind) {
            return 'mjhub_rl_' + kind;
        }
        function mjGetAttempts(kind) {
            try {
                var raw = sessionStorage.getItem(mjRateKey(kind));
                if (!raw) return [];
                var arr = JSON.parse(raw);
                var cutoff = Date.now() - (kind === 'reset' ? MJ_RESET_WINDOW_MS : MJ_LOGIN_WINDOW_MS);
                return (arr || []).filter(function (t) { return t > cutoff; });
            } catch (e) { return []; }
        }
        function mjRecordAttempt(kind) {
            var arr = mjGetAttempts(kind);
            arr.push(Date.now());
            try { sessionStorage.setItem(mjRateKey(kind), JSON.stringify(arr)); } catch (e) {}
            return arr.length;
        }
        function mjClearAttempts(kind) {
            try { sessionStorage.removeItem(mjRateKey(kind)); } catch (e) {}
        }
        function mjIsRateLimited(kind) {
            var max = kind === 'reset' ? MJ_RESET_MAX : MJ_LOGIN_MAX;
            return mjGetAttempts(kind).length >= max;
        }
        function mjRateLimitMessage(kind) {
            return kind === 'reset'
                ? 'Too many reset requests. Wait 15 minutes and try again.'
                : 'Too many sign-in attempts. Wait 15 minutes or reset your password.';
        }

        function validatePasswordStrength(password) {
            var p = String(password || '');
            var checks = {
                len: p.length >= 8,
                up: /[A-Z]/.test(p),
                low: /[a-z]/.test(p),
                num: /[0-9]/.test(p)
            };
            var score = (checks.len ? 1 : 0) + (checks.up ? 1 : 0) + (checks.low ? 1 : 0) + (checks.num ? 1 : 0);
            var ok = checks.len && checks.up && checks.low && checks.num;
            return { ok: ok, score: score, checks: checks };
        }

        function updatePasswordStrength(password) {
            var r = validatePasswordStrength(password);
            var bar = document.getElementById('pwStrengthBar');
            var label = document.getElementById('pwStrengthLabel');
            var bar2 = document.getElementById('pwStrengthBar2');
            var label2 = document.getElementById('pwStrengthLabel2');
            var colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
            var texts = ['Too weak', 'Weak', 'Fair', 'Strong'];
            var pct = (r.score / 4) * 100;
            var col = colors[Math.max(0, r.score - 1)] || '#ef4444';
            var txt = r.score === 0 ? 'Password strength' : texts[r.score - 1];
            if (bar) { bar.style.width = pct + '%'; bar.style.background = col; }
            if (label) label.textContent = txt;
            if (bar2) { bar2.style.width = pct + '%'; bar2.style.background = col; }
            if (label2) label2.textContent = txt;
            var map = { pwRuleLen: 'len', pwRuleUp: 'up', pwRuleLow: 'low', pwRuleNum: 'num' };
            Object.keys(map).forEach(function (id) {
                var el = document.getElementById(id);
                if (!el) return;
                var good = r.checks[map[id]];
                el.className = good ? 'ok' : 'bad';
            });
            return r;
        }

        
        function togglePasswordVisibility(btn) {
            if (!btn) return;
            const wrap = btn.closest('.pw-field');
            const input = wrap ? wrap.querySelector('input') : null;
            if (!input) return;
            const show = btn.getAttribute('data-visible') !== '1';
            input.type = show ? 'text' : 'password';
            btn.setAttribute('data-visible', show ? '1' : '0');
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            btn.innerHTML = show
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
        }

        function checkSignupPasswordMatch() {
            const a = document.getElementById('signupPassword');
            const b = document.getElementById('signupPasswordConfirm');
            const hint = document.getElementById('signupPwMatchHint');
            if (!a || !b || !hint) return true;
            const p1 = a.value;
            const p2 = b.value;
            if (!p2) {
                hint.textContent = '';
                hint.className = 'pw-match-hint';
                return false;
            }
            if (p1 === p2) {
                hint.textContent = 'Passwords match';
                hint.className = 'pw-match-hint ok';
                return true;
            }
            hint.textContent = 'Passwords do not match';
            hint.className = 'pw-match-hint bad';
            return false;
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('signinEmail').value.trim();
            const password = document.getElementById('signinPassword').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('signinSubmitBtn') || (e.submitter) || e.target.querySelector('.btn-submit');

            if (typeof mjIsRateLimited === 'function' && mjIsRateLimited('login')) {
                showError(mjRateLimitMessage('login'));
                return;
            }

            setAuthButtonLoading(btn, true, 'Signing in…');

            let data, error;
            try {
                ({ data, error } = await supabaseClient.auth.signInWithPassword({ email, password }));
            } catch (e) {
                if (typeof mjRecordAttempt === 'function') mjRecordAttempt('login');
                setAuthButtonLoading(btn, false);
                showError(formatAuthError(e));
                return;
            }

            if (error) {
                if (typeof mjRecordAttempt === 'function') mjRecordAttempt('login');
                setAuthButtonLoading(btn, false);
                if (isBannedError(error)) {
                    showBannedError();
                } else {
                    var msg = await resolveLoginError(error, email);
                    if (typeof mjGetAttempts === 'function') {
                        var left = MJ_LOGIN_MAX - mjGetAttempts('login').length;
                        if (left <= 2 && left > 0) msg += ' (' + left + ' attempts left before temporary lockout)';
                        if (left <= 0) msg = mjRateLimitMessage('login');
                    }
                    showError(msg);
                }
                return;
            }
            if (typeof mjClearAttempts === 'function') mjClearAttempts('login');

            // Belt-and-suspenders: even if the auth-level ban somehow let a
            // session through (e.g. an existing token that hasn't refreshed
            // yet), check the profile flag we mirror on ban/unban and block
            // access here too.
            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('is_banned')
                    .eq('id', data.user.id)
                    .maybeSingle();
                if (profile && profile.is_banned) {
                    await supabaseClient.auth.signOut();
                    setAuthButtonLoading(btn, false);
                    showBannedError();
                    return;
                }
            } catch (e) {
                // If this check fails for any reason, don't block a
                // legitimate sign-in over it — the auth-level ban above is
                // the real enforcement.
            }

            if (rememberMe) {
                const twentyFourHoursMs = 24 * 60 * 60 * 1000;
                const expiryTime = new Date().getTime() + twentyFourHoursMs;
                // Only ever remember the email, never the password — storing
                // a real account password in localStorage in plain text is a
                // security risk on its own (readable by any script/extension,
                // or anyone else who later uses the device), and it was also
                // what made sign-in feel "automatic": the password field
                // arrived pre-filled and ready to submit the instant the page
                // loaded. This still saves the retyping of the email without
                // either problem.
                const rememberData = {
                    email: email,
                    expiry: expiryTime
                };
                localStorage.setItem('mjhub_remember_user', JSON.stringify(rememberData));
            } else {
                localStorage.removeItem('mjhub_remember_user');
            }

            showSuccess('Signed in successfully!');
            try { sessionStorage.setItem('mjhub-fresh-login', '1'); } catch (e) {}
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 500);
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            let phone = document.getElementById('phoneNumber').value.trim();
            if (window.MJFormUX && MJFormUX.normalizePhone) phone = MJFormUX.normalizePhone(phone);
            const email = document.getElementById('emailAddress').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const passwordConfirm = (document.getElementById('signupPasswordConfirm') || {}).value
                ? document.getElementById('signupPasswordConfirm').value.trim()
                : '';
            const btn = document.getElementById('signupSubmitBtn') || e.target.querySelector('.btn-submit');

            var pwCheck = validatePasswordStrength(password);
            if (!pwCheck.ok) {
                showError('Password must be at least 8 characters and include uppercase, lowercase, and a number.');
                updatePasswordStrength(password);
                return;
            }
            if (!passwordConfirm) {
                showError('Please confirm your password.');
                return;
            }
            if (password !== passwordConfirm) {
                showError('Passwords do not match. Please re-enter the same password.');
                checkSignupPasswordMatch();
                return;
            }

            setAuthButtonLoading(btn, true, 'Creating account…');

            let data, error;
            try {
                ({ data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            username: username,
                            phone_number: phone
                        },
                        // Where Supabase sends the user after they click the
                        // confirm-email link — back to the sign-in page here,
                        // with ?verified=1 so auth.html can greet them.
                        emailRedirectTo: window.location.origin + '/auth.html?verified=1'
                    }
                }));
            } catch (e) {
                console.error('signUp threw:', e);
                setAuthButtonLoading(btn, false);
                showError(formatAuthError(e));
                return;
            }

            if (error) {
                console.error('signUp error:', error);
                setAuthButtonLoading(btn, false);
                showError(formatAuthError(error));
                return;
            }

            // Profile row creation is handled server-side by a database
            // trigger (on_auth_user_created) the moment the auth user is
            // created — this works whether or not "Confirm email" is on,
            // unlike inserting from here, which used to fail with an RLS
            // error whenever the user isn't signed in yet post-signup.

            if (data.session) {
                // Email confirmation is off — user is already signed in.
                showSuccess('Account created successfully!');
                try {
                  if (data.session) await attachReferralIfNeeded(data.session);
                } catch (e) {}
                try { sessionStorage.setItem('mjhub-fresh-login', '1'); } catch (e) {}
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1200);
            } else {
                // Email confirmation is required — send them to the
                // dedicated "check your email" page with their address,
                // instead of redirecting into a session that doesn't exist yet.
                window.location.href = 'check-email.html?email=' + encodeURIComponent(email);
            }
        }

        async function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const btn = document.getElementById('forgotSubmitBtn') || e.target.querySelector('.btn-submit');

            if (mjIsRateLimited('reset')) {
                showError(mjRateLimitMessage('reset'));
                return;
            }
            mjRecordAttempt('reset');

            setAuthButtonLoading(btn, true, 'Sending…');

            const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/auth.html?type=recovery'
            });

            if (error) {
                setAuthButtonLoading(btn, false);
                showError(error.message);
                return;
            }

            setAuthButtonLoading(btn, false);
            showSuccess('Password reset instructions sent! Check your email inbox.');
        }

        async function handleUpdatePassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value.trim();
            const btn = document.getElementById('updatePassSubmitBtn') || e.target.querySelector('.btn-submit');

            var pwCheck = validatePasswordStrength(newPassword);
            if (!pwCheck.ok) {
                showError('Password must be at least 8 characters and include uppercase, lowercase, and a number.');
                updatePasswordStrength(newPassword);
                return;
            }

            setAuthButtonLoading(btn, true, 'Updating…');

            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                setAuthButtonLoading(btn, false);
                showError(error.message);
                return;
            }

            showSuccess('Password successfully updated!');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        }
    </script>

<script>
(function(){
  function syncAiField(field){
    var input = field.querySelector('input:not([type="checkbox"])');
    if (!input) return;
    if (input.value && String(input.value).length) field.classList.add('is-active');
    else field.classList.remove('is-active');
  }
  function bind(){
    document.querySelectorAll('.form-group.ai-field').forEach(function(field){
      var input = field.querySelector('input:not([type="checkbox"])');
      if (!input || input.dataset.aiBound) return;
      input.dataset.aiBound = '1';
      input.addEventListener('focus', function(){ field.classList.add('is-focused','is-active'); });
      input.addEventListener('blur', function(){
        field.classList.remove('is-focused');
        syncAiField(field);
      });
      input.addEventListener('input', function(){ syncAiField(field); });
      syncAiField(field);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
  // re-bind when tabs switch
  document.addEventListener('click', function(e){
    if (e.target && (e.target.classList.contains('tab-btn') || e.target.closest('.tab-btn'))) {
      setTimeout(bind, 50);
    }
  });
  window.MJAuthAnimatedInputs = { bind: bind };
})();
</script>
