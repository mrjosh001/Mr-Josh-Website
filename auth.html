<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ HUB - Sign In & Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --input-bg: rgba(255, 255, 255, 0.06);
            --input-border: rgba(255, 255, 255, 0.15);
            --error-color: #f87171;
            --success-color: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            /* Nature-inspired gradient background with layered effect */
            background:
                linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.85)),
                url('https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?w=1920&auto=format&fit=crop') center/cover no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        /* Animated overlay pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Top Nav Bar */
        .top-nav {
            position: relative;
            z-index: 10;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            background: rgba(15, 23, 42, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .brand-logo-img { height: 34px; width: auto; max-width: 160px; object-fit: contain; display: block; }

        .home-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 18px;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .home-link:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Main content area */
        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            z-index: 5;
        }

        /* Auth Card - Frosted Glass */
        .auth-container {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            padding: 40px 36px;
            border-radius: 24px;
            width: 100%;
            max-width: 460px;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Form Header */
        .form-icon-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon-circle {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(139, 92, 246, 0.25));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 26px;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }

        .form-icon-header h3 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .form-icon-header p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Tab Switcher */
        .tab-switcher {
            display: flex;
            margin-bottom: 24px;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 11px 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 13px;
            border-radius: 8px;
            font-family: inherit;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: #fff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(203, 213, 225, 0.4);
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* Remember Me */
        .remember-me-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .remember-me-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .forgot-password-link {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 600;
        }

        .forgot-password-link:hover {
            color: #fff;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0 0;
            color: rgba(203, 213, 225, 0.5);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--card-border);
        }

        .divider::before { margin-right: 14px; }
        .divider::after { margin-left: 14px; }

        .hidden {
            display: none;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
            background: rgba(248, 113, 113, 0.15);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(248, 113, 113, 0.3);
            font-weight: 600;
        }

        .success-msg {
            color: var(--success-color);
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
            background: rgba(74, 222, 128, 0.15);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(74, 222, 128, 0.3);
            font-weight: 600;
        }

        .back-to-signin {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
        }

        .back-to-signin:hover {
            color: #fff;
        }

        /* Footer */
        .site-footer {
            position: relative;
            z-index: 5;
            padding: 24px 20px;
            text-align: center;
            font-size: 12px;
            color: rgba(203, 213, 225, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            background: rgba(15, 23, 42, 0.3);
        }

        /* ============ RESPONSIVE BREAKPOINTS ============ */

        /* Small phones */
        @media (max-width: 380px) {
            .top-nav { padding: 16px 20px; }
            .brand-logo { font-size: 18px; }
            .home-link { padding: 7px 14px; font-size: 13px; }
            .main-wrapper { padding: 24px 14px; }
            .auth-container { padding: 28px 22px; border-radius: 20px; }
            .form-icon-header h3 { font-size: 20px; }
            .icon-circle { width: 52px; height: 52px; font-size: 22px; }
        }

        /* Tablets */
        @media (min-width: 768px) {
            .main-wrapper { padding: 60px 40px; }
            .auth-container { max-width: 480px; padding: 44px 40px; }
            .form-icon-header h3 { font-size: 26px; }
        }

        /* Laptops */
        @media (min-width: 1024px) {
            .top-nav { padding: 24px 48px; }
            .brand-logo { font-size: 24px; }
            .auth-container { max-width: 500px; padding: 48px 44px; }
        }

        /* Large desktops */
        @media (min-width: 1440px) {
            .top-nav { padding: 28px 64px; }
            .auth-container { max-width: 520px; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <img class="brand-logo-img" src="https://atczodlljmlayvldxfmv.supabase.co/storage/v1/object/public/avatars/dark%20background%20log" alt="MJ HUB">
        <a href="landing.html" class="home-link">
            <span>←</span> Home
        </a>
    </nav>

    <!-- Main Auth Card -->
    <div class="main-wrapper">
        <div class="auth-container">

            <div class="form-icon-header">
                <div class="icon-circle" id="formIcon">🔒</div>
                <h3 id="formHeading">Welcome Back</h3>
                <p id="formSubheading">Sign in to access your dashboard</p>
            </div>

            <div class="tab-switcher" id="tabSwitcherContainer">
                <button id="signinTabBtn" class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
                <button id="signupTabBtn" class="tab-btn" onclick="switchTab('signup')">Register</button>
            </div>

            <div id="errorContainer" class="error-msg hidden"></div>
            <div id="successContainer" class="success-msg hidden"></div>

            <!-- Sign In Form -->
            <form id="signinForm" onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signinEmail" required autocomplete="off" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signinPassword" required autocomplete="new-password" placeholder="••••••••">
                </div>
                <label class="remember-me-group">
                    <input type="checkbox" id="rememberMe"> Remember me for 24 hours
                </label>
                <a href="#" class="forgot-password-link" onclick="switchTab('forgot'); return false;">Forgot Password?</a>
                <button type="submit" class="btn-submit">Sign In to Dashboard</button>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" class="hidden" onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" required autocomplete="off" placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required autocomplete="off" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="emailAddress" required autocomplete="off" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phoneNumber" required autocomplete="off" placeholder="Enter phone number">
                </div>
                <div class="form-group">
                    <label>Choose Password</label>
                    <input type="password" id="signupPassword" required autocomplete="new-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Register Account</button>
            </form>

            <!-- Forgot Password Form -->
            <form id="forgotForm" class="hidden" onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label>Enter Your Email Address</label>
                    <input type="email" id="forgotEmail" required autocomplete="off" placeholder="name@example.com">
                </div>
                <button type="submit" class="btn-submit">Send Reset Instructions</button>
                <a href="#" class="back-to-signin" onclick="switchTab('signin'); return false;">← Back to Sign In</a>
            </form>

            <!-- Update New Password Form -->
            <form id="updatePasswordForm" class="hidden" onsubmit="handleUpdatePassword(event)">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" required autocomplete="new-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Update Password</button>
            </form>

            <div class="divider">Secure Access</div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 MJ HUB. All rights reserved.</p>
    </footer>

    <script>
        // Initialize Supabase Client
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            // Check for saved "Remember Me" details within the 24-hour expiry window
            const rememberedDataString = localStorage.getItem('mjhub_remember_user');
            if (rememberedDataString) {
                try {
                    const rememberedData = JSON.parse(rememberedDataString);
                    const now = new Date().getTime();
                    if (now < rememberedData.expiry) {
                        document.getElementById('signinEmail').value = rememberedData.email;
                        document.getElementById('rememberMe').checked = true;
                    } else {
                        localStorage.removeItem('mjhub_remember_user');
                    }
                } catch (err) {
                    localStorage.removeItem('mjhub_remember_user');
                }
            }

            const urlParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const type = urlParams.get('type') || hashParams.get('type');

            if (type === 'recovery') {
                switchTab('updatePassword');
                return;
            }

            if (urlParams.get('verified') === '1') {
                switchTab('signin');
                showSuccess('✅ Your email has been verified! Please sign in below.');
                // Clean the query param off the visible URL without reloading.
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (urlParams.get('banned') === '1') {
                switchTab('signin');
                showBannedError();
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (event === 'PASSWORD_RECOVERY') {
                    switchTab('updatePassword');
                }
            });

            if (urlParams.get('mode') === 'signup') {
                switchTab('signup');
            }
        });

        function switchTab(tab) {
            const errorEl = document.getElementById('errorContainer');
            const successEl = document.getElementById('successContainer');
            errorEl.innerText = '';
            errorEl.classList.add('hidden');
            successEl.innerText = '';
            successEl.classList.add('hidden');

            const formIcon = document.getElementById('formIcon');
            const formHeading = document.getElementById('formHeading');
            const formSubheading = document.getElementById('formSubheading');
            const tabSwitcherContainer = document.getElementById('tabSwitcherContainer');

            document.getElementById('signinForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('hidden');
            document.getElementById('updatePasswordForm').classList.add('hidden');
            tabSwitcherContainer.style.display = 'flex';

            if (tab === 'signin') {
                document.getElementById('signinTabBtn').classList.add('active');
                document.getElementById('signupTabBtn').classList.remove('active');
                document.getElementById('signinForm').classList.remove('hidden');
                formIcon.innerText = '🔒';
                formHeading.innerText = 'Welcome Back';
                formSubheading.innerText = 'Sign in to access your dashboard';
            } else if (tab === 'signup') {
                document.getElementById('signupTabBtn').classList.add('active');
                document.getElementById('signinTabBtn').classList.remove('active');
                document.getElementById('signupForm').classList.remove('hidden');
                formIcon.innerText = '👤';
                formHeading.innerText = 'Create Your Account';
                formSubheading.innerText = 'Join MJ HUB in just a few seconds';
            } else if (tab === 'forgot') {
                tabSwitcherContainer.style.display = 'none';
                document.getElementById('forgotForm').classList.remove('hidden');
                formIcon.innerText = '🔑';
                formHeading.innerText = 'Recover Account';
                formSubheading.innerText = 'Enter your email to receive reset instructions';
            } else if (tab === 'updatePassword') {
                tabSwitcherContainer.style.display = 'none';
                document.getElementById('updatePasswordForm').classList.remove('hidden');
                formIcon.innerText = '🛡️';
                formHeading.innerText = 'Set New Password';
                formSubheading.innerText = 'Please enter your new secure password';
            }
        }

        function formatAuthError(error) {
            if (!error) return 'Something went wrong. Please try again.';
            const tag = [];
            if (error.status) tag.push('[' + error.status + ']');
            if (error.code) tag.push('(' + error.code + ')');
            let msg = error.message;
            if (!msg || msg === '{}' || msg === '[object Object]') {
                msg = error.error_description || error.msg || error.error || 'Registration failed — no details were returned by the server. Please try again in a moment.';
            }
            return (tag.length ? tag.join(' ') + ' ' : '') + msg;
        }

        function showError(message) {
            const errorEl = document.getElementById('errorContainer');
            errorEl.innerText = message;
            errorEl.classList.remove('hidden');
        }

        // Supabase returns a 403 with a message containing "banned" when a
        // banned user tries to sign in via password grant. Give those users
        // a clear explanation instead of a generic auth error, with a way
        // to reach support.
        function isBannedError(error) {
            if (!error) return false;
            const msg = (error.message || error.error_description || '').toLowerCase();
            return msg.includes('banned');
        }

        function showBannedError() {
            const errorEl = document.getElementById('errorContainer');
            errorEl.innerHTML = 'You have been banned from MJ HUB. If you believe this is a mistake, please <a href="support.html" style="color:inherit;font-weight:700;text-decoration:underline;">contact support</a>.';
            errorEl.classList.remove('hidden');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successContainer');
            successEl.innerText = message;
            successEl.classList.remove('hidden');
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('signinEmail').value.trim();
            const password = document.getElementById('signinPassword').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            let data, error;
            try {
                ({ data, error } = await supabaseClient.auth.signInWithPassword({ email, password }));
            } catch (e) {
                showError(formatAuthError(e));
                return;
            }

            if (error) {
                if (isBannedError(error)) {
                    showBannedError();
                } else {
                    showError(formatAuthError(error));
                }
                return;
            }

            // Belt-and-suspenders: even if the auth-level ban somehow let a
            // session through (e.g. an existing token that hasn't refreshed
            // yet), check the profile flag we mirror on ban/unban and block
            // access here too.
            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('is_banned')
                    .eq('id', data.user.id)
                    .maybeSingle();
                if (profile && profile.is_banned) {
                    await supabaseClient.auth.signOut();
                    showBannedError();
                    return;
                }
            } catch (e) {
                // If this check fails for any reason, don't block a
                // legitimate sign-in over it — the auth-level ban above is
                // the real enforcement.
            }

            if (rememberMe) {
                const twentyFourHoursMs = 24 * 60 * 60 * 1000;
                const expiryTime = new Date().getTime() + twentyFourHoursMs;
                // Only ever remember the email, never the password — storing
                // a real account password in localStorage in plain text is a
                // security risk on its own (readable by any script/extension,
                // or anyone else who later uses the device), and it was also
                // what made sign-in feel "automatic": the password field
                // arrived pre-filled and ready to submit the instant the page
                // loaded. This still saves the retyping of the email without
                // either problem.
                const rememberData = {
                    email: email,
                    expiry: expiryTime
                };
                localStorage.setItem('mjhub_remember_user', JSON.stringify(rememberData));
            } else {
                localStorage.removeItem('mjhub_remember_user');
            }

            showSuccess('Signed in successfully!');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const phone = document.getElementById('phoneNumber').value.trim();
            const email = document.getElementById('emailAddress').value.trim();
            const password = document.getElementById('signupPassword').value.trim();

            let data, error;
            try {
                ({ data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            username: username,
                            phone_number: phone
                        },
                        // Where Supabase sends the user after they click the
                        // confirm-email link — back to the sign-in page here,
                        // with ?verified=1 so auth.html can greet them.
                        emailRedirectTo: window.location.origin + window.location.pathname + '?verified=1'
                    }
                }));
            } catch (e) {
                console.error('signUp threw:', e);
                showError(formatAuthError(e));
                return;
            }

            if (error) {
                console.error('signUp error:', error);
                showError(formatAuthError(error));
                return;
            }

            // Profile row creation is handled server-side by a database
            // trigger (on_auth_user_created) the moment the auth user is
            // created — this works whether or not "Confirm email" is on,
            // unlike inserting from here, which used to fail with an RLS
            // error whenever the user isn't signed in yet post-signup.

            if (data.session) {
                // Email confirmation is off — user is already signed in.
                showSuccess('Account created successfully!');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                // Email confirmation is required — send them to the
                // dedicated "check your email" page with their address,
                // instead of redirecting into a session that doesn't exist yet.
                window.location.href = 'check-email.html?email=' + encodeURIComponent(email);
            }
        }

        async function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();

            const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + window.location.pathname
            });

            if (error) {
                showError(error.message);
                return;
            }

            showSuccess('Password reset instructions sent! Check your email inbox.');
        }

        async function handleUpdatePassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value.trim();

            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                showError(error.message);
                return;
            }

            showSuccess('Password successfully updated!');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>
</body>
</html>
