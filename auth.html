<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ HUB - Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --text-main: #ffffff;
            --text-muted: #93c5fd;
            --border-color: rgba(59, 130, 246, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); padding: 40px; border-radius: 20px; width: 100%; max-width: 450px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .tab-switcher { display: flex; margin-bottom: 30px; border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; background: rgba(15, 23, 42, 0.6); }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-muted); font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary-color); color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; outline: none; font-size: 14px; }
        .form-group input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; transition: all 0.2s ease-in-out; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); }
        .btn-submit:hover { opacity: 0.9; }
        .hidden { display: none; }
        .error-msg { color: #f87171; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .success-msg { color: #4ade80; font-size: 13px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="tab-switcher">
            <button id="signinTabBtn" class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
            <button id="signupTabBtn" class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <div id="errorContainer" class="error-msg"></div>
        <div id="successContainer" class="success-msg"></div>

        <!-- Sign In Form (Email + Password + Security Flow) -->
        <form id="signinForm" onsubmit="handleSignIn(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signinEmail" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signinPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signupForm" class="hidden" onsubmit="handleSignUp(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="signupUsername" required placeholder="johndoe123">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="signupPhone" required placeholder="+234...">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Create Account</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'signup') {
                switchTab('signup');
            }
        });

        function switchTab(tab) {
            document.getElementById('errorContainer').innerText = '';
            document.getElementById('successContainer').innerText = '';

            if (tab === 'signin') {
                document.getElementById('signinTabBtn').classList.add('active');
                document.getElementById('signupTabBtn').classList.remove('active');
                document.getElementById('signinForm').classList.remove('hidden');
                document.getElementById('signupForm').classList.add('hidden');
            } else {
                document.getElementById('signupTabBtn').classList.add('active');
                document.getElementById('signinTabBtn').classList.remove('active');
                document.getElementById('signupForm').classList.remove('hidden');
                document.getElementById('signinForm').classList.add('hidden');
            }
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('signinEmail').value.trim();
            const password = document.getElementById('signinPassword').value.trim();
            const errorEl = document.getElementById('errorContainer');
            const successEl = document.getElementById('successContainer');
            errorEl.innerText = '';
            successEl.innerText = '';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorEl.innerText = error.message;
                return;
            }

            // Check if email confirmation is enforced and pending
            if (data.user && data.user.confirmation_sent_at && !data.session) {
                successEl.innerText = 'Verification email/link sent! Please check your inbox.';
                return;
            }

            // Successfully signed in, head directly to dashboard
            window.location.href = 'index.html';
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const fullName = document.getElementById('signupName').value.trim();
            const username = document.getElementById('signupUsername').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const errorEl = document.getElementById('errorContainer');
            errorEl.innerText = '';

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { full_name: fullName, username: username, phone: phone },
                    emailRedirectTo: 'https://mrjosh001.github.io/auth.html'
                }
            });

            if (error) {
                errorEl.innerText = error.message;
                return;
            }

            alert('Account created successfully! Please check your email to confirm your account.');
            switchTab('signin');
        }
    </script>
</body>
</html>
