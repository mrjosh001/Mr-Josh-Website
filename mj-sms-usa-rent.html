<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>USA Physical Rental · MJ HUB</title>
<script>(function(){try{var t=localStorage.getItem('mjhub-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<script src="/js/mj-page-loader.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,html[data-theme="dark"]{--bg:#0b1220;--card:#111827;--text:#f1f5f9;--muted:#94a3b8;--border:#1e293b;--primary:#3b82f6;--primary-glow:rgba(59,130,246,.14);--ok:#22c55e;--danger:#ef4444}
html[data-theme="light"]{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#2563eb;--primary-glow:rgba(37,99,235,.1);--ok:#16a34a;--danger:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
.header{padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.page-title{font-size:17px;font-weight:800;flex:1}
.hist-link{font-size:12px;font-weight:800;color:var(--primary);text-decoration:none;padding:8px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--primary) 35%,var(--border));background:var(--primary-glow);white-space:nowrap}
.main{padding:16px;max-width:560px;margin:0 auto;padding-bottom:100px}
.content-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}
.content-card h2{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.helper-text{font-size:12px;color:var(--muted);line-height:1.45;margin:-4px 0 12px}
.search-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);margin-bottom:12px}
.search-bar input{flex:1;border:none;background:transparent;color:var(--text);font:600 14px inherit;outline:none}
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px}
.svc-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;cursor:pointer;border-radius:14px;border:1px solid transparent}
.svc-tile:active,.svc-tile:hover{background:var(--primary-glow);border-color:color-mix(in srgb,var(--primary) 25%,transparent)}
.svc-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#1d4ed8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.svc-label{font-size:11px;font-weight:700;text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sk-svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px}
.sk-svc-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px}
.sk-svc-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(90deg,rgba(148,163,184,.12),rgba(148,163,184,.22),rgba(148,163,184,.12));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
.sk-svc-label{width:56px;height:10px;border-radius:6px;background:linear-gradient(90deg,rgba(148,163,184,.12),rgba(148,163,184,.22),rgba(148,163,184,.12));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
.sk-line{height:48px;border-radius:12px;margin-bottom:10px;background:linear-gradient(90deg,rgba(148,163,184,.12),rgba(148,163,184,.22),rgba(148,163,184,.12));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.selected-service-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--primary-glow);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.selected-service-bar .name{font-weight:800;font-size:14px;color:var(--primary)}
.selected-service-bar button{background:none;border:1px solid var(--primary);color:var(--primary);font-size:11px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
label.f{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:12px 0 6px}
input.f,select.f{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font:600 14px inherit}
.plan{border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--bg);margin-bottom:8px}
.plan.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.plan .row{display:flex;justify-content:space-between;gap:10px}.plan .dur{font-weight:800}.plan .price{font-weight:800;color:var(--primary)}
.qty{display:flex;align-items:center;gap:12px}.qty button{width:40px;height:40px;border-radius:12px;border:none;background:var(--primary-glow);color:var(--primary);font-size:18px;font-weight:800;cursor:pointer}
.total{margin-top:14px;padding:14px;border-radius:14px;background:var(--primary-glow)}.total .lbl{font-size:12px;font-weight:700;color:var(--muted)}.total .amt{font-size:22px;font-weight:800;color:var(--primary)}
.btn-buy{width:100%;margin-top:14px;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),#1d4ed8);color:#fff;font:800 15px inherit;cursor:pointer}
.btn-buy:disabled{opacity:.5}.err{color:var(--danger);font-weight:700;font-size:13px;margin-top:10px}.ok{color:var(--ok);font-weight:700;font-size:13px;margin-top:10px}
.success-banner{border:1px solid color-mix(in srgb,var(--ok) 40%,var(--border));background:color-mix(in srgb,var(--ok) 12%,var(--card));border-radius:16px;padding:16px;margin-bottom:14px}
.countdown{font-size:22px;font-weight:800;color:var(--primary);margin:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions a,.actions button{flex:1;min-width:120px;padding:11px;border-radius:12px;font:800 13px inherit;text-align:center;text-decoration:none;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.actions a.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{text-align:center;padding:28px;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<header class="header">
  <a href="mj-sms-choose-server.html" class="back"><i class="fa-solid fa-arrow-left"></i></a>
  <h1 class="page-title">USA Physical Rental</h1>
  <a class="hist-link" href="mj-sms-history.html?view=rent">My numbers</a>
</header>
<main class="main">
  <div id="successBox" class="success-banner" style="display:none"></div>

  <!-- STEP 1: services (OTP-style grid) -->
  <div class="content-card" id="serviceStep">
    <h2><i class="fa-solid fa-grid-2" style="color:var(--primary)"></i> Choose a service</h2>
    <p class="helper-text">Pick the app you need a USA number for. Next screen lets you set duration, carrier, and area code.</p>
    <div class="search-bar"><i class="fa-solid fa-magnifying-glass" style="color:var(--muted)"></i><input type="search" id="svcSearch" placeholder="Search WhatsApp, Telegram…" autocomplete="off"></div>
    <div id="svcGrid" class="sk-svc-grid" aria-busy="true">
      <div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>
      <div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>
      <div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>
      <div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>
      <div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>
      <div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>
      <div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>
      <div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>
    </div>
  </div>

  <!-- STEP 2: full details -->
  <div class="content-card" id="detailStep" style="display:none">
    <h2><i class="fa-solid fa-sliders" style="color:var(--primary)"></i> Rental details</h2>
    <div class="selected-service-bar">
      <span class="name" id="selectedServiceName">—</span>
      <button type="button" id="changeServiceBtn">Change</button>
    </div>
    <div id="detailBody">
      <div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div>
    </div>
  </div>
</main>
<script>
(function(){
const SUPABASE_URL='https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}});
let allServices=[],selectedService=null,plans=[],selectedPlan=null,qty=1,rentBusy=false,carriers=[];
const POPULAR=['whatsapp','telegram','google','facebook','instagram','tiktok','twitter','x','discord','paypal','amazon','apple','microsoft'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function fmtNgn(n){return '₦'+Number(n||0).toLocaleString('en-NG');}
function initial(name){var n=String(name||'?').trim();return (n[0]||'?').toUpperCase();}
async function headers(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='auth.html';return null;}return{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Accept:'application/json'};}
async function api(action,opts){const h=await headers();if(!h)return{success:false,message:'Sign in required'};const method=(opts&&opts.method)||'GET';let url='/api/sms-bus?action=gotsms_'+encodeURIComponent(action);if(opts&&opts.query)url+='&'+opts.query;const res=await fetch(url,{method:method,headers:h,body:opts&&opts.body?JSON.stringify(opts.body):undefined});const raw=await res.text();try{const clean=String(raw||'').replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?:[^\uD800-\uDBFF]|^)[\uDC00-\uDFFF]/g,'');return clean?JSON.parse(clean):{};}catch(e){return{success:false,message:'Bad server response'};}}

function skGrid(){var h='';for(var i=0;i<8;i++)h+='<div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>';return h;}

async function loadServices(){
  var grid=document.getElementById('svcGrid');
  grid.className='sk-svc-grid';grid.setAttribute('aria-busy','true');grid.innerHTML=skGrid();
  var j=await api('services',{query:'per_page=100'});
  if(!j.success){grid.className='';grid.innerHTML='<div class="empty">'+esc(j.message||'Could not load services')+'</div>';return;}
  allServices=j.data||[];
  allServices.sort(function(a,b){var an=String(a.name||'').toLowerCase(),bn=String(b.name||'').toLowerCase();var ai=POPULAR.findIndex(function(p){return an.indexOf(p)>=0;});var bi=POPULAR.findIndex(function(p){return bn.indexOf(p)>=0;});if(ai===-1&&bi===-1)return an.localeCompare(bn);if(ai===-1)return 1;if(bi===-1)return -1;return ai-bi;});
  renderServices();
  api('carriers').then(function(c){carriers=c.data||[];});
}
function renderServices(){
  var q=String(document.getElementById('svcSearch').value||'').toLowerCase().trim();
  var list=allServices;if(q)list=list.filter(function(s){return String(s.name||'').toLowerCase().indexOf(q)>=0;});
  var grid=document.getElementById('svcGrid');
  grid.className='svc-grid';grid.removeAttribute('aria-busy');
  if(!list.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">No match</div>';return;}
  grid.innerHTML=list.slice(0,120).map(function(s){
    return '<div class="svc-tile" data-id="'+esc(s.id)+'" data-name="'+esc(s.name)+'"><div class="svc-icon">'+esc(initial(s.name))+'</div><div class="svc-label">'+esc(s.name)+'</div></div>';
  }).join('');
  grid.querySelectorAll('.svc-tile').forEach(function(tile){
    tile.onclick=function(){
      selectedService={id:tile.getAttribute('data-id'),name:tile.getAttribute('data-name')};
      openDetail();
    };
  });
}
document.getElementById('svcSearch').oninput=renderServices;

function openDetail(){
  document.getElementById('serviceStep').style.display='none';
  document.getElementById('detailStep').style.display='block';
  document.getElementById('selectedServiceName').textContent=selectedService.name;
  document.getElementById('detailBody').innerHTML='<div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div>';
  selectedPlan=null;qty=1;
  loadPlans();
}
document.getElementById('changeServiceBtn').onclick=function(){
  document.getElementById('detailStep').style.display='none';
  document.getElementById('serviceStep').style.display='block';
  selectedService=null;selectedPlan=null;
};

async function loadPlans(){
  var j=await api('plans',{query:'service_id='+encodeURIComponent(selectedService.id)+'&per_page=100'});
  plans=(j.success?(j.data||[]):[]).filter(function(p){return p.is_available!==false;});
  var order={min:0,hour:1,day:2,week:3,month:4,year:5};
  plans.sort(function(a,b){var da=order[a.duration_type]??9,db=order[b.duration_type]??9;if(da!==db)return da-db;return(a.duration_in_type||0)-(b.duration_in_type||0);});
  renderDetailForm();
}

function renderDetailForm(){
  var body=document.getElementById('detailBody');
  if(!plans.length){body.innerHTML='<div class="empty">No plans in stock for this service</div>';return;}
  var planHtml=plans.map(function(p,i){
    return '<div class="plan" data-i="'+i+'"><div class="row"><span class="dur">'+esc(p.duration_translation||(p.duration_in_type+' '+p.duration_type))+'</span><span class="price">'+fmtNgn(p.price_ngn)+'</span></div></div>';
  }).join('');
  var carHtml='<option value="">Any US carrier</option>'+carriers.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>';}).join('');
  body.innerHTML=
    '<label class="f">Duration plan</label><div id="planList">'+planHtml+'</div>'+
    '<label class="f">Preferred carrier (optional)</label><select class="f" id="carrierSel">'+carHtml+'</select>'+
    '<label class="f">Area code (optional)</label><input class="f" id="areaCode" inputmode="numeric" placeholder="e.g. 212, 305" maxlength="6">'+
    '<label class="f">Quantity (1–25)</label><div class="qty"><button type="button" id="qtyMinus">−</button><span id="qtyVal" style="font-weight:800;min-width:28px;text-align:center">1</span><button type="button" id="qtyPlus">+</button></div>'+
    '<div class="total"><div class="lbl">Total</div><div class="amt" id="totalAmt">₦0</div></div>'+
    '<button type="button" class="btn-buy" id="rentBtn" disabled>Rent number</button>'+
    '<div class="err" id="rentErr"></div><div class="ok" id="rentOk"></div>';
  body.querySelectorAll('.plan').forEach(function(card){
    card.onclick=function(){
      body.querySelectorAll('.plan').forEach(function(c){c.classList.remove('on');});
      card.classList.add('on');
      selectedPlan=plans[Number(card.getAttribute('data-i'))];
      document.getElementById('rentBtn').disabled=false;
      updateTotal();
    };
  });
  document.getElementById('qtyMinus').onclick=function(){if(qty>1){qty--;document.getElementById('qtyVal').textContent=qty;updateTotal();}};
  document.getElementById('qtyPlus').onclick=function(){if(qty<25){qty++;document.getElementById('qtyVal').textContent=qty;updateTotal();}};
  document.getElementById('rentBtn').onclick=doRent;
}
function updateTotal(){var el=document.getElementById('totalAmt');if(!el)return;el.textContent=selectedPlan?fmtNgn(selectedPlan.price_ngn*qty):'₦0';}

function showSuccess(rent){
  var box=document.getElementById('successBox');
  var till=rent.active_till?new Date(rent.active_till).getTime():0;
  var rid=rent.id||rent.rent_id;
  box.style.display='';
  box.innerHTML='<div style="font-weight:800;margin-bottom:6px">Number ready</div><div style="font-size:20px;font-weight:800">'+esc(rent.phone||'')+'</div><div class="helper-text">'+esc((rent.service&&rent.service.name)||selectedService.name)+'</div>'+(till?'<div class="helper-text">Time remaining</div><div class="countdown" id="cdMain">—</div>':'')+'<div class="actions"><a class="primary" href="mj-sms-usa-number.html?rent_id='+encodeURIComponent(rid)+'">Open inbox</a><a href="mj-sms-history.html?view=rent">My numbers</a></div>';
  if(till){(function tick(){var left=till-Date.now();var el=document.getElementById('cdMain');if(!el)return;if(left<=0){el.textContent='Expired';return;}var h=Math.floor(left/3600000),m=Math.floor((left%3600000)/60000),s=Math.floor((left%60000)/1000);el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');setTimeout(tick,1000);})();}
  try{box.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}
}

async function doRent(){
  if(rentBusy||!selectedPlan)return;rentBusy=true;
  var btn=document.getElementById('rentBtn');btn.disabled=true;btn.textContent='Processing…';
  document.getElementById('rentErr').textContent='';document.getElementById('rentOk').textContent='';
  var body={plan_id:selectedPlan.id,quoted_price_ngn:selectedPlan.price_ngn};
  var area=String(document.getElementById('areaCode').value||'').replace(/\D/g,'');if(area)body.area_code=area;
  var car=document.getElementById('carrierSel').value;if(car)body.cellular_carrier_id=car;
  var j;if(qty>1){body.quantity=qty;j=await api('rent_bulk',{method:'POST',body:body});}else{j=await api('rent',{method:'POST',body:body});}
  rentBusy=false;btn.disabled=false;btn.textContent='Rent number';
  if(!j.success){document.getElementById('rentErr').textContent=j.message||'Rental failed';if(j.data&&j.data.price_ngn){selectedPlan.price_ngn=j.data.price_ngn;updateTotal();}return;}
  var rent=Array.isArray(j.data)?j.data[0]:j.data;
  document.getElementById('rentOk').textContent=j.message||'Success';
  if(rent)showSuccess(rent);
}
loadServices();
})();
</script>
</body>
</html>
