.ps-close{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer}

.ps-err{color:var(--danger);font-size:13px;font-weight:700;margin-top:10px;text-align:center}



</style>
</head>

async function headers(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='auth.html';return null;}return{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Accept:'application/json'};}
async function api(action,opts){const h=await headers();if(!h)return{success:false,message:'Sign in required'};const method=(opts&&opts.method)||'GET';let url='/api/sms-bus?action=gotsms_'+encodeURIComponent(action);if(opts&&opts.query)url+='&'+opts.query;const res=await fetch(url,{method:method,headers:h,body:opts&&opts.body?JSON.stringify(opts.body):undefined});const raw=await res.text();try{const clean=String(raw||'').replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?:[^\uD800-\uDBFF]|^)[\uDC00-\uDFFF]/g,'');return clean?JSON.parse(clean):{};}catch(e){return{success:false,message:'Bad server response'};}}

    var j=await api('services',{query:qs});
    if(!j.success){if(page===1)return{ok:false,message:j.message||'Could not load services'};break;}
    var chunk=Array.isArray(j.data)?j.data:[];
    if(!chunk.length)break;
    all=all.concat(chunk);
    var last=Number((j.meta&&j.meta.last_page)||page);
    if(page>=last)break;
  }
  return{ok:true,services:dedupeServices(all)};
}
function sortServices(){
  allServices.sort(function(a,b){
    var an=String(a.name||'').toLowerCase(),bn=String(b.name||'').toLowerCase();
    var ai=POPULAR.findIndex(function(p){return an.indexOf(p)>=0;});
    var bi=POPULAR.findIndex(function(p){return bn.indexOf(p)>=0;});
    if(ai===-1&&bi===-1)return an.localeCompare(bn);
    if(ai===-1)return 1;if(bi===-1)return -1;return ai-bi;
  });
}
function paintServices(list){
  var grid=document.getElementById('svcGrid');
  grid.className='svc-grid';grid.removeAttribute('aria-busy');
  if(!list.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">No match</div>';return;}
  grid.innerHTML=list.map(function(s){
    return '<div class="svc-tile" data-id="'+esc(s.id)+'" data-name="'+esc(s.name)+'">'+
      serviceLogoHtml(s.name)+'<div class="svc-label">'+esc(s.name)+'</div></div>';
  }).join('');
  grid.querySelectorAll('.svc-tile').forEach(function(tile){
    tile.onclick=function(){
      selectedService={id:tile.getAttribute('data-id'),name:tile.getAttribute('data-name')};
      openDetail();
    };
  });
}
var _searchTimer=null;
function renderServices(){
  var q=String(document.getElementById('svcSearch').value||'').trim();
  var ql=q.toLowerCase();
  var list=allServices;
  if(ql) list=allServices.filter(function(s){return String(s.name||'').toLowerCase().indexOf(ql)>=0;});
  paintServices(list);
  // If local list has no match, search supplier API (WhatsApp may not be on first pages)
  if(ql && !list.length){
    clearTimeout(_searchTimer);
    _searchTimer=setTimeout(async function(){
      var grid=document.getElementById('svcGrid');
      grid.innerHTML='<div class="empty" style="grid-column:1/-1">Searching…</div>';
      var r=await fetchAllServices(q);
      if(!r.ok){grid.innerHTML='<div class="empty" style="grid-column:1/-1">'+esc(r.message||'Search failed')+'</div>';return;}
      // merge into allServices for next time
      var map={};allServices.forEach(function(s){map[s.id]=s;});
      r.services.forEach(function(s){map[s.id]=s;});
      allServices=Object.keys(map).map(function(k){return map[k];});
      sortServices();writeCache(allServices);
      var still=allServices.filter(function(s){return String(s.name||'').toLowerCase().indexOf(ql)>=0;});
      paintServices(still);
      var note=document.getElementById('cacheNote');
      if(note) note.textContent=allServices.length+' services';
    },350);
  }
}
async function loadServices(){
  var grid=document.getElementById('svcGrid');
  var note=document.getElementById('cacheNote');
  var cached=readCache();
  if(cached&&cached.services.length){
    allServices=dedupeServices(cached.services);sortServices();renderServices();
    if(note)note.textContent='Cached · '+allServices.length+' services · refreshes in background';
    fetchAllServices().then(function(r){
      if(r.ok&&r.services.length){
        allServices=dedupeServices(r.services);writeCache(allServices);sortServices();renderServices();
        if(note)note.textContent=allServices.length+' services';
      }
    });
  }else{
    grid.className='sk-svc-grid';grid.setAttribute('aria-busy','true');
    grid.innerHTML='';for(var i=0;i<8;i++)grid.innerHTML+='<div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>';
    var r=await fetchAllServices();
    if(!r.ok){grid.className='';grid.innerHTML='<div class="empty">'+esc(r.message)+'</div>';return;}
    allServices=dedupeServices(r.services);writeCache(allServices);sortServices();renderServices();
    if(note)note.textContent=allServices.length+' services';
  }
  api('carriers').then(function(c){carriers=c.data||[];});
}
document.getElementById('svcSearch').oninput=renderServices;

function openDetail(){
  document.getElementById('serviceStep').style.display='none';
  document.getElementById('detailStep').style.display='block';
  var logo=serviceLogo(selectedService.name);
  var nameEl=document.getElementById('selectedServiceName');
  if(logo)nameEl.innerHTML='<img class="mini-logo" src="'+esc(logo)+'" alt="" onerror="this.style.display=\'none\'">'+esc(selectedService.name);
  else nameEl.textContent=selectedService.name;
  document.getElementById('detailBody').innerHTML='<div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div>';
  selectedPlan=null;qty=1;loadPlans();
}
document.getElementById('changeServiceBtn').onclick=function(){
  document.getElementById('detailStep').style.display='none';
  document.getElementById('serviceStep').style.display='block';
  selectedService=null;selectedPlan=null;
};
async function loadPlans(){
  var j=await api('plans',{query:'service_id='+encodeURIComponent(selectedService.id)+'&per_page=100'});
  plans=(j.success?(j.data||[]):[]).filter(function(p){return p.is_available!==false;});
  var order={min:0,hour:1,day:2,week:3,month:4,year:5};
  plans.sort(function(a,b){var da=order[a.duration_type]??9,db=order[b.duration_type]??9;if(da!==db)return da-db;return(a.duration_in_type||0)-(b.duration_in_type||0);});
  renderDetailForm();
}
function buildAreaOptions(){
  var html='<option value="">Any Area Code</option>';
  US_AREA_CODES.forEach(function(st){
    html+='<optgroup label="'+esc(st.state)+'">';
    html+='<option value="__random_'+esc(st.state)+'">'+esc(st.state)+' (random area code)</option>';
    st.codes.forEach(function(x){
      html+='<option value="'+esc(x.c)+'">'+esc(x.c)+(x.carrier?' ('+x.carrier+')':'')+'</option>';
    });
    html+='</optgroup>';
  });
  return html;
}
function renderDetailForm(){
  var body=document.getElementById('detailBody');
  if(!plans.length){body.innerHTML='<div class="empty">No plans in stock for this service</div>';return;}
  var planHtml=plans.map(function(p,i){
    return '<div class="plan" data-i="'+i+'"><div class="dur">'+esc(p.duration_translation||(p.duration_in_type+' '+p.duration_type))+'</div><div class="price">'+fmtNgn(p.price_ngn)+'</div></div>';
  }).join('');
  var carHtml='<option value="">Any Carrier</option>'+carriers.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>';}).join('');
  body.innerHTML=
    '<label class="f">Duration</label><div class="plan-grid" id="planList">'+planHtml+'</div>'+
    '<label class="f">Carrier (optional)</label><select class="f" id="carrierSel">'+carHtml+'</select>'+
    '<label class="f">Area code (optional)</label><select class="f" id="areaCode">'+buildAreaOptions()+'</select>'+
    '<label class="f">Quantity (1–25)</label><div class="qty"><button type="button" id="qtyMinus">−</button><span id="qtyVal" style="font-weight:800;min-width:28px;text-align:center">1</span><button type="button" id="qtyPlus">+</button></div>'+
    '<div class="total"><div class="lbl">Total</div><div class="amt" id="totalAmt">₦0</div></div>'+
    '<button type="button" class="btn-buy" id="rentBtn" disabled>Rent number</button>'+
    '<div class="err" id="rentErr"></div><div class="ok" id="rentOk"></div>';
  body.querySelectorAll('.plan').forEach(function(card){
    card.onclick=function(){
      body.querySelectorAll('.plan').forEach(function(c){c.classList.remove('on');});
      card.classList.add('on');
      selectedPlan=plans[Number(card.getAttribute('data-i'))];
      var rb=document.getElementById('rentBtn');rb.disabled=false;rb.onclick=openPurchaseModal;updateTotal();
    };
  });
  var first=body.querySelector('.plan');if(first)first.click();
  document.getElementById('qtyMinus').onclick=function(){if(qty>1){qty--;document.getElementById('qtyVal').textContent=qty;updateTotal();}};
  document.getElementById('qtyPlus').onclick=function(){if(qty<25){qty++;document.getElementById('qtyVal').textContent=qty;updateTotal();}};
  document.getElementById('rentBtn').onclick=openPurchaseModal;
}
function updateTotal(){var el=document.getElementById('totalAmt');if(!el)return;el.textContent=selectedPlan?fmtNgn(selectedPlan.price_ngn*qty):'₦0';}
function resolveAreaCode(){
  var v=String(document.getElementById('areaCode').value||'');
  if(!v)return '';
  if(v.indexOf('__random_')===0){
    var state=v.replace('__random_','');
    var st=US_AREA_CODES.find(function(s){return s.state===state;});
    if(st&&st.codes.length)return st.codes[Math.floor(Math.random()*st.codes.length)].c;
    return '';
  }
  return v.replace(/\D/g,'').slice(0,6);
}
function showSuccess(rent){
  var box=document.getElementById('successBox');
  var till=rent.active_till?new Date(rent.active_till).getTime():0;
  var rid=rent.id||rent.rent_id;
  box.style.display='';
  box.innerHTML='<div style="font-weight:800;margin-bottom:6px">Number ready</div><div style="font-size:20px;font-weight:800">'+esc(rent.phone||'')+'</div><div class="helper-text">'+esc((rent.service&&rent.service.name)||selectedService.name)+'</div>'+(till?'<div class="helper-text">Time remaining</div><div class="countdown" id="cdMain">—</div>':'')+'<div class="actions"><a class="primary" href="mj-sms-usa-number.html?rent_id='+encodeURIComponent(rid)+'">Open inbox</a><a href="mj-sms-history.html?view=rent">My numbers</a></div>';
  if(till){(function tick(){var left=till-Date.now();var el=document.getElementById('cdMain');if(!el)return;if(left<=0){el.textContent='Expired';return;}var h=Math.floor(left/3600000),m=Math.floor((left%3600000)/60000),s=Math.floor((left%60000)/1000);el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');setTimeout(tick,1000);})();}
  try{box.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}
}

function openPurchaseModal(){
  if(!selectedPlan||!selectedService)return;
  document.getElementById('psService').textContent=selectedService.name||'—';
  document.getElementById('psDuration').textContent=selectedPlan.duration_translation||((selectedPlan.duration_in_type||'')+' '+(selectedPlan.duration_type||''))||'—';
  var carSel=document.getElementById('carrierSel');
  var carTxt='Any carrier';
  if(carSel&&carSel.value){
    var opt=carSel.options[carSel.selectedIndex];
    carTxt=opt?opt.textContent:'Selected carrier';
  }
  document.getElementById('psCarrier').textContent=carTxt;
  var area=resolveAreaCode();
  var areaSel=document.getElementById('areaCode');
  var areaTxt='Any';
  if(area) areaTxt=area;
  else if(areaSel&&areaSel.tagName==='SELECT'&&areaSel.value){
    var ao=areaSel.options[areaSel.selectedIndex];
    areaTxt=ao?ao.textContent:areaSel.value;
  }
  document.getElementById('psArea').textContent=areaTxt;
  document.getElementById('psQty').textContent=String(qty);
  document.getElementById('psTotal').textContent=fmtNgn(selectedPlan.price_ngn*qty);
  document.getElementById('psErr').textContent='';
  var modal=document.getElementById('purchaseModal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
}
function closePurchaseModal(){
  var modal=document.getElementById('purchaseModal');
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
  var btn=document.getElementById('confirmBuyBtn');
  if(btn){btn.disabled=false;btn.textContent='Buy number';}
}
document.getElementById('purchaseCloseBtn').onclick=closePurchaseModal;
document.getElementById('purchaseModal').addEventListener('click',function(e){
  if(e.target===this) closePurchaseModal();
});
document.getElementById('confirmBuyBtn').onclick=function(){ doRent(); };

async function doRent(){
  if(rentBusy||!selectedPlan)return;rentBusy=true;
  var btn=document.getElementById('confirmBuyBtn')||document.getElementById('rentBtn');
  var rentBtn=document.getElementById('rentBtn');
  if(btn){btn.disabled=true;btn.textContent='Processing…';}
  if(rentBtn){rentBtn.disabled=true;}
  document.getElementById('psErr').textContent='';
  var errEl=document.getElementById('rentErr');if(errEl)errEl.textContent='';
  var okEl=document.getElementById('rentOk');if(okEl)okEl.textContent='';
  var body={plan_id:selectedPlan.id,service_id:selectedService&&selectedService.id,quoted_price_ngn:selectedPlan.price_ngn,quoted_usd:selectedPlan.price_usd||selectedPlan.price||null};
  var area=resolveAreaCode();if(area)body.area_code=area;
  var car=document.getElementById('carrierSel').value;if(car)body.cellular_carrier_id=car;
  var j;if(qty>1){body.quantity=qty;j=await api('rent_bulk',{method:'POST',body:body});}else{j=await api('rent',{method:'POST',body:body});}
  rentBusy=false;
  if(btn){btn.disabled=false;btn.textContent='Buy number';}
  if(rentBtn){rentBtn.disabled=false;rentBtn.textContent='Rent number';}
  if(!j.success){
    var msg=j.message||'Rental failed';
    document.getElementById('psErr').textContent=msg;
    if(errEl)errEl.textContent=msg;
    if(j.data&&j.data.price_ngn){selectedPlan.price_ngn=j.data.price_ngn;updateTotal();document.getElementById('psTotal').textContent=fmtNgn(selectedPlan.price_ngn*qty);}
    return;
  }
  closePurchaseModal();
  var rent=Array.isArray(j.data)?j.data[0]:j.data;
  if(okEl)okEl.textContent=j.message||'Success';
  if(rent)showSuccess(rent);
}


loadServices();
})();
</script>
</body>
