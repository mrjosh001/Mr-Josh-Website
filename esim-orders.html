<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My eSIM — MJ HUB</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b14;--surface:#101827;--surface-2:#0c1422;--border:rgba(148,163,184,.16);--text:#f3f6fc;--muted:#94a3b8;--brand:#2f5bea;--accent:#4f83ff;--tab:#8fb0ff;--shadow:0 10px 30px rgba(0,0,0,.28)}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f6fb;--surface:#fff;--surface-2:#f8faff;--border:rgba(15,23,42,.1);--text:#0f172a;--muted:#64748b;--brand:#2f5bea;--accent:#285fe8;--tab:#2f5bea;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(25,50,90,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}button,input{font:inherit}
.topbar{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px)}
.icon-btn,.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;cursor:pointer}
.icon-btn{width:38px;height:38px;display:grid;place-items:center}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand-mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--brand);font-size:12px;font-weight:800}
.brand strong{display:block;font-size:13px}.brand span{display:block;font-size:10px;color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.btn{padding:9px 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.btn.primary{background:var(--brand);border-color:transparent;color:#fff}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:3px solid #9db5ff;outline-offset:2px}

.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 14px}
.titlebar h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14.5px;padding:11px 8px;border-radius:9px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--brand);color:#fff}
.seg em{font-style:normal;opacity:.85;margin-left:4px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:0 12px;margin-bottom:16px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:11px 0;font-size:14px}

.esim{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
.plan-hero{background:var(--brand);color:#fff}
.hero-top{padding:18px 20px 20px}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:38px}
.hero-row span{font-size:17px;font-weight:600}
.renew{border:0;border-radius:9px;padding:10px 16px;background:#fff;color:#1d2433;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.plan-hero h2{margin:16px 0 0;font-size:21px;line-height:1.28;font-weight:700;letter-spacing:-.2px}
.plan-hero h2 small{display:block;font-size:16px;font-weight:600;opacity:.95;letter-spacing:0;margin-bottom:3px}
.strip{background:rgba(0,0,0,.22);padding:13px 20px;font-size:15px}

.usage{padding:18px 20px 20px}
.usage h3{margin:0 0 12px;font-size:19px;font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tab{position:relative;background:none;border:0;padding:14px 4px;font-weight:500;font-size:15px;color:var(--text);cursor:pointer}
.tab+.tab{border-left:1px solid var(--border)}
.tab[aria-selected="true"]{color:var(--tab);font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:16%;right:16%;bottom:0;height:3px;border-radius:3px;background:var(--tab)}
.panel{margin-top:12px;border:1px solid var(--border);border-radius:10px}
.panel-head{display:flex;align-items:center;gap:8px;padding:13px 16px;font-weight:700;font-size:14px;letter-spacing:.3px;border-bottom:1px solid var(--border)}
.panel-main{padding:20px 16px 4px;text-align:center}
.panel-main b{font-size:30px;font-weight:700;letter-spacing:-.5px;display:block}
.panel-main span{color:var(--muted);font-size:14px}
.bar{margin:16px 16px 8px;height:8px;border-radius:8px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--brand)}
.bar-meta{display:flex;justify-content:space-between;margin:0 16px 16px;color:var(--muted);font-size:13px}
.cd{font-variant-numeric:tabular-nums}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.details b{display:block;color:var(--text);font-size:14px;font-weight:600;margin-top:1px;word-break:break-all}
.copy-ref{border:0;background:transparent;color:var(--muted);cursor:pointer;margin-left:4px;padding:0}

.state{text-align:center;padding:30px 12px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:16px}
.state-icon{width:44px;height:44px;margin:0 auto 8px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);color:var(--accent)}
.state h3{margin:0 0 4px;color:var(--text);font-size:15px}.state p{margin:0;font-size:13px;line-height:1.45}
.skeleton{height:200px;border-radius:16px;border:1px solid var(--border);margin-bottom:18px;background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:200% 100%;animation:shine 1.3s infinite}
@keyframes shine{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:999px;font-size:12px;font-weight:700;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.footnote{font-size:12px;color:var(--muted);line-height:1.45;margin:6px 2px 0}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}.toast{transition:none}}
</style>
  <script src="/js/mj-pull-refresh.js" defer></script>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" type="button" onclick="location.href='dashboard.html'" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="brand"><div class="brand-mark">MJ</div><div><strong>My eSIM</strong><span>Plans · usage · expiry</span></div></div>
  <button class="icon-btn" type="button" id="refreshBtn" aria-label="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
</header>
<main class="wrap">
  <div class="titlebar">
    <h1>My plans</h1>
    <a class="btn primary" href="esim.html"><i class="fa-solid fa-plus"></i> Buy eSIM</a>
  </div>

  <div class="seg" role="tablist" id="seg" aria-label="Plan status">
    <button type="button" role="tab" data-v="active" aria-selected="true">Active plans<em id="nA"></em></button>
    <button type="button" role="tab" data-v="expired" aria-selected="false">Expired plans<em id="nE"></em></button>
  </div>
  <label class="search"><i class="fa-solid fa-magnifying-glass" style="color:var(--muted);font-size:12px"></i>
    <input id="searchInput" type="search" placeholder="Search plan, ref, IMEI…" autocomplete="off">
  </label>

  <div id="list" aria-live="polite"><div class="skeleton"></div></div>
  <p class="footnote">Expiry is estimated from plan length after order date (or delivery when available). Your QR email is the activation source of truth.</p>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  try {
    var pref = localStorage.getItem('mjhub-theme-pref') || localStorage.getItem('mjhub-theme') || 'system';
    var theme = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
  } catch (e) {}
})();

const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.sessionStorage }
});

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const ngn = (v) => '₦' + Number(v || 0).toLocaleString('en-NG', { maximumFractionDigits: 0 });
const fmtDate = (v) => {
  const d = v instanceof Date ? v : new Date(v);
  return (!v || Number.isNaN(d.getTime())) ? '—' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Africa/Lagos' });
};

/* ---- Plan catalogue (same for every carrier). Talk & text are unlimited on all plans. ---- */
const BRAND_NAME = 'MJ Wireless Prepaid';
const PLAN_DAYS = { '1m': 30, '3m': 90, '6m': 180, '12m': 365 };
const PLAN_INFO = {
  30:  { period: 'Monthly',  gb: 1 },
  90:  { period: '3 Months', gb: 2.5 },
  180: { period: '6 Months', gb: 6 },
  365: { period: 'Yearly',   gb: 10 }
};
const RENEW_WINDOW = 14 * 86400000;
const gbText = (g) => (Number.isInteger(g) ? g : g.toFixed(1)) + 'GB';

let allOrders = [];
let view = 'active';
let loading = false;
let toastTimer;
const tabState = {};

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function statusKey(v) {
  const s = String(v || 'processing').toLowerCase();
  if (['success', 'successful', 'paid', 'complete', 'completed', 'delivered'].includes(s)) return 'completed';
  if (['failed', 'cancelled', 'canceled', 'expired', 'refunded'].includes(s)) return 'failed';
  return 'processing';
}

function planDays(order) {
  if (PLAN_DAYS[order.plan_id]) return PLAN_DAYS[order.plan_id];
  const m = String(order.plan_name || '').match(/(\d+)\s*month/i);
  if (m) return Number(m[1]) * 30;
  if (/year/i.test(String(order.plan_name || ''))) return 365;
  return 30;
}
const planInfo = (o) => PLAN_INFO[planDays(o)] || { period: planDays(o) + ' Days', gb: 1 };

function expiryDate(order) {
  const d = new Date(order.delivered_at || order.created_at || Date.now());
  d.setDate(d.getDate() + planDays(order));
  return d;
}
const msLeft = (o) => expiryDate(o).getTime() - Date.now();
const keyOf = (o) => String(o.id || o.order_ref || '');

function isActiveOrder(order) {
  const k = statusKey(order.status);
  if (k === 'failed') return false;
  if (k === 'processing') return true;
  return msLeft(order) > 0;
}

function leftText(order) {
  const k = statusKey(order.status);
  if (k === 'processing') return 'Starts after activation';
  let ms = msLeft(order);
  if (ms <= 0) return 'Expired';
  const days = Math.floor(ms / 86400000); ms -= days * 86400000;
  const hours = Math.floor(ms / 3600000); ms -= hours * 3600000;
  const mins = Math.floor(ms / 60000);
  if (days > 0) return days + 'd ' + hours + 'h left';
  if (hours > 0) return hours + 'h ' + mins + 'm left';
  return Math.max(1, mins) + 'm left';
}

const TAB_LABELS = { data: 'Data', text: 'Text', minutes: 'Minutes' };
const TAB_ICONS = { data: 'fa-wifi', text: 'fa-comment-dots', minutes: 'fa-phone' };

function panelHtml(o, key) {
  const p = planInfo(o);
  const k = statusKey(o.status);
  const total = planDays(o) * 86400000;
  const pct = (k === 'processing' || msLeft(o) <= 0) ? 0 : Math.min(100, msLeft(o) / total * 100);
  const main = key === 'data' ? [gbText(p.gb), 'High-speed data included']
             : key === 'text' ? ['Unlimited', 'Texts included']
             : ['Unlimited', 'Talk minutes included'];
  const title = key === 'data' ? 'HIGH SPEED DATA' : key === 'text' ? 'TEXTS' : 'MINUTES';
  return '<div class="panel-head"><i class="fa-solid ' + TAB_ICONS[key] + '"></i>' + title + '</div>' +
    '<div class="panel-main"><b>' + main[0] + '</b><span>' + main[1] + '</span></div>' +
    '<div class="bar" aria-hidden="true"><i style="width:' + pct + '%"></i></div>' +
    '<div class="bar-meta"><span class="cd">' + esc(leftText(o)) + '</span><span>' + planDays(o) + '-day plan</span></div>';
}

function failedLabel(o) {
  const s = String(o.status || '').toLowerCase();
  if (s === 'refunded') return 'Refunded';
  if (s === 'cancelled' || s === 'canceled') return 'Cancelled';
  if (s === 'expired') return 'Past Plan';
  return 'Order Failed';
}

function planCard(o) {
  const p = planInfo(o);
  const k = statusKey(o.status);
  const failed = k === 'failed';
  const processing = k === 'processing';
  const expired = !failed && !processing && msLeft(o) <= 0;
  const soon = !failed && !processing && !expired && msLeft(o) <= RENEW_WINDOW;
  const renew = !failed && !processing && (expired || soon);
  const tab = tabState[keyOf(o)] || 'data';
  const label = failed ? failedLabel(o) : processing ? 'Processing' : expired ? 'Past Plan' : 'Current Plan';
  const name = BRAND_NAME + ' - ' + gbText(p.gb) + ' + Unlimited Talk and Text';
  const strip = failed ? 'Plan not activated'
              : processing ? 'Expiry starts after activation'
              : 'Plan ' + (expired ? 'Expired' : 'Expiration') + ' Date: ' + fmtDate(expiryDate(o));
  const tabs = Object.keys(TAB_LABELS).map((t) =>
    '<button class="tab" type="button" role="tab" data-tab="' + t + '" aria-selected="' + (t === tab) + '">' + TAB_LABELS[t] + '</button>').join('');
  return (
    '<article class="esim" data-key="' + esc(keyOf(o)) + '" data-ref="' + esc(o.order_ref || '') + '">' +
      '<div class="plan-hero"><div class="hero-top">' +
        '<div class="hero-row"><span>My Plan</span>' +
          (renew ? '<button class="renew" type="button" onclick="location.href=\'esim.html\'">Renew plan</button>' : '') + '</div>' +
        '<h2><small>' + label + ' | ' + esc(p.period) + '</small>' + esc(name) + '</h2></div>' +
        '<div class="strip">' + esc(strip) + '</div></div>' +
      '<div class="usage">' +
        (failed ? '' :
          '<h3>Usage</h3><div class="tabs" role="tablist">' + tabs + '</div>' +
          '<div class="panel" role="tabpanel">' + panelHtml(o, tab) + '</div>') +
        '<div class="details">' +
          '<div>Reference<b>' + esc(o.order_ref || '—') +
            '<button class="copy-ref" type="button" data-copy="' + esc(o.order_ref || '') + '" aria-label="Copy reference"><i class="fa-regular fa-copy"></i></button></b></div>' +
          '<div>IMEI<b>' + esc(o.imei || '—') + '</b></div>' +
          '<div>Ordered<b>' + esc(fmtDate(o.created_at)) + '</b></div>' +
          '<div>Amount<b>' + esc(ngn(o.wallet_ngn_debited || o.amount_ngn)) + '</b></div>' +
        '</div>' +
      '</div>' +
    '</article>'
  );
}

function matches(o) {
  const q = ($('searchInput').value || '').trim().toLowerCase();
  if (!q) return true;
  return [o.plan_name, o.plan_id, o.order_ref, o.imei, o.status].join(' ').toLowerCase().includes(q);
}

function render() {
  const act = allOrders.filter(isActiveOrder).sort((a, b) => expiryDate(a) - expiryDate(b));
  const exp = allOrders.filter((o) => !isActiveOrder(o)).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  $('nA').textContent = act.length ? '(' + act.length + ')' : '';
  $('nE').textContent = exp.length ? '(' + exp.length + ')' : '';
  const rows = (view === 'active' ? act : exp).filter(matches);
  if (!rows.length) {
    const searching = ($('searchInput').value || '').trim();
    $('list').innerHTML =
      '<div class="state"><div class="state-icon"><i class="fa-solid fa-sim-card"></i></div>' +
      '<h3>' + (searching ? 'No matching plans' : view === 'active' ? 'No active eSIM plans' : 'No expired plans yet') + '</h3>' +
      '<p>' + (searching ? 'Try another search.' : view === 'active' ? 'Buy an eSIM to see it here with its expiry date.' : 'Past and failed orders appear here.') + '</p>' +
      (view === 'active' && !searching ? '<div style="margin-top:12px"><a class="btn primary" href="esim.html"><i class="fa-solid fa-plus"></i> Buy eSIM</a></div>' : '') +
      '</div>';
    return;
  }
  $('list').innerHTML = rows.map(planCard).join('');
}

async function loadOrders() {
  if (loading) return;
  loading = true;
  $('refreshBtn').innerHTML = '<i class="fa-solid fa-rotate-right fa-spin"></i>';
  $('refreshBtn').disabled = true;
  if (!allOrders.length) $('list').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  try {
    const { data: { session }, error: sessionError } = await sb.auth.getSession();
    if (sessionError) throw sessionError;
    if (!session) {
      location.href = 'auth.html?redirect=' + encodeURIComponent('esim-orders.html');
      return;
    }

    let rows = null;
    let lastError = null;

    // 1) Preferred: service-side list (works even if table RLS is tight)
    try {
      const res = await fetch('/api/esim', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ action: 'my_orders' })
      });
      const json = await res.json().catch(() => ({}));
      if (res.ok && json && json.success && Array.isArray(json.orders)) {
        rows = json.orders;
      } else {
        lastError = new Error((json && json.message) || 'API order list failed');
      }
    } catch (e) {
      lastError = e;
    }

    // 2) Fallback: direct table read
    if (!rows) {
      const { data, error } = await sb
        .from('esim_orders')
        .select('id,order_ref,plan_id,plan_name,amount_ngn,imei,wallet_ngn_debited,wallet_usd_debited,status,created_at')
        .eq('user_id', session.user.id)
        .order('created_at', { ascending: false })
        .limit(100);
      if (error) throw lastError || error;
      rows = data || [];
    }

    allOrders = rows || [];

    // Deep link: ?order_ref=... opens the right tab and highlights the plan
    const ref = new URLSearchParams(location.search).get('order_ref');
    const target = ref && allOrders.find((o) => o.order_ref === ref);
    if (target) setView(isActiveOrder(target) ? 'active' : 'expired', true);
    render();
    if (target) {
      const card = [...document.querySelectorAll('.esim')].find((el) => el.dataset.ref === ref);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.style.outline = '2px solid var(--accent)';
        setTimeout(() => { card.style.outline = ''; }, 1600);
      }
    }
  } catch (err) {
    console.error(err);
    $('list').innerHTML =
      '<div class="state"><div class="state-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>' +
      '<h3>Orders could not be loaded</h3>' +
      '<p>Check your connection and try again. Refreshing does not charge your wallet.</p>' +
      '<div style="margin-top:12px"><button class="btn primary" type="button" id="retryLoad"><i class="fa-solid fa-rotate-right"></i> Try again</button></div></div>';
    const retry = $('retryLoad');
    if (retry) retry.onclick = loadOrders;
  } finally {
    loading = false;
    $('refreshBtn').innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
    $('refreshBtn').disabled = false;
  }
}

function setView(v, silent) {
  view = v;
  document.querySelectorAll('#seg button').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.v === v)));
  if (!silent) render();
}

$('seg').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) setView(b.dataset.v);
});
$('list').addEventListener('click', (e) => {
  const t = e.target.closest('.tab');
  if (!t) return;
  const art = t.closest('.esim');
  const o = allOrders.find((x) => keyOf(x) === art.dataset.key);
  if (!o) return;
  tabState[keyOf(o)] = t.dataset.tab;
  art.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', String(x === t)));
  art.querySelector('.panel').innerHTML = panelHtml(o, t.dataset.tab);
});
$('searchInput').addEventListener('input', render);
$('refreshBtn').addEventListener('click', loadOrders);
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const value = b.getAttribute('data-copy');
  if (!value) return showToast('No order reference');
  try {
    await navigator.clipboard.writeText(value);
    showToast('Order reference copied');
  } catch (_) {
    showToast('Could not copy');
  }
});
loadOrders();
setInterval(function () {
