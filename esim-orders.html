<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>eSIM Orders — MJ HUB</title>
<meta name="theme-color" content="#06080f">
<link rel="icon" href="https://atczodlljmlayvldxfmv.supabase.co/storage/v1/object/public/avatars/dark%20background%20log">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#06080f;--card:#0f1524;--input:#0a0e18;--border:rgba(148,163,184,.14);--text:#f1f5f9;--muted:#94a3b8;--primary:#5b8af5;--success:#34d399;--danger:#f87171}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}body{padding-bottom:40px}a{color:inherit;text-decoration:none}.header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(6,8,15,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.back{width:40px;height:40px;border:1px solid var(--border);border-radius:12px;background:var(--card);display:grid;place-items:center}.header h1{font-size:17px;margin:0;flex:1}.wrap{max-width:560px;margin:0 auto;padding:18px 16px}.hero{padding:20px;border-radius:20px;background:linear-gradient(135deg,rgba(91,138,245,.18),var(--card));border:1px solid var(--border);margin-bottom:14px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.14em;color:var(--primary);text-transform:uppercase}.hero h2{margin:6px 0 5px;font-size:24px}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;margin-top:15px}.btn{flex:1;border:0;border-radius:13px;padding:12px 14px;font-weight:800;background:var(--primary);color:#fff;text-align:center}.btn.alt{background:var(--input);border:1px solid var(--border);color:var(--text)}.order{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:17px;margin-bottom:12px}.order-top{display:flex;align-items:flex-start;gap:12px}.icon{width:44px;height:44px;border-radius:13px;background:rgba(91,138,245,.14);color:var(--primary);display:grid;place-items:center;flex:none}.order-title{font-weight:850;font-size:16px;margin:1px 0 4px}.ref{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.status{margin-left:auto;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:850;text-transform:capitalize;background:rgba(52,211,153,.12);color:var(--success)}.status.failed,.status.cancelled{background:rgba(248,113,113,.12);color:var(--danger)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.detail{padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--input)}.detail span{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.detail strong{display:block;font-size:12px;overflow-wrap:anywhere}.total{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:13px;border-top:1px solid var(--border)}.total span{color:var(--muted);font-size:12px}.total strong{font-size:20px}.empty,.loading{padding:35px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:18px}.empty i,.loading i{font-size:24px;color:var(--primary);margin-bottom:10px}.empty h3{color:var(--text);margin:7px 0}.empty p{font-size:13px;line-height:1.5;margin:0}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;font-size:12px;font-weight:700;display:none}.toast.show{display:block}
</style>
</head>
<body>
<header class="header"><a class="back" href="dashboard.html#home" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a><h1>eSIM Orders</h1><a class="back" href="esim.html" aria-label="Buy eSIM"><i class="fa-solid fa-plus"></i></a></header>
<main class="wrap">
  <section class="hero"><div class="eyebrow">MJ HUB eSIM</div><h2>Your eSIM orders</h2><p>View every eSIM purchase, payment split, IMEI and order reference in one place.</p><div class="actions"><a class="btn" href="esim.html">Buy another eSIM</a><a class="btn alt" href="dashboard.html#home">Dashboard</a></div></section>
  <div id="orders" class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i><div>Loading your eSIM orders…</div></div>
</main>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.sessionStorage}});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ngn=v=>'₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const usd=v=>'$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=v=>v?new Date(v).toLocaleString():'';
function render(rows){
 const root=document.getElementById('orders');
 if(!rows.length){root.className='empty';root.innerHTML='<i class="fa-solid fa-sim-card"></i><h3>No eSIM orders yet</h3><p>Your completed eSIM purchases will appear here after payment.</p>';return;}
 root.className='';root.innerHTML=rows.map(o=>{
   const st=String(o.status||'processing').toLowerCase();
   return `<article class="order"><div class="order-top"><div class="icon"><i class="fa-solid fa-sim-card"></i></div><div style="min-width:0;flex:1"><div class="order-title">eSIM · ${esc(o.plan_name||o.plan_id||'Plan')}</div><div class="ref">${esc(o.order_ref||'')}</div></div><span class="status ${st==='failed'||st==='cancelled'?'failed':''}">${esc(o.status||'processing')}</span></div><div class="grid"><div class="detail"><span>IMEI</span><strong>${esc(o.imei||'—')}</strong></div><div class="detail"><span>Placed</span><strong>${esc(fmtDate(o.created_at))}</strong></div><div class="detail"><span>NGN wallet</span><strong>${ngn(o.wallet_ngn_debited)}</strong></div><div class="detail"><span>USD wallet</span><strong>${usd(o.wallet_usd_debited)}</strong></div></div><div class="total"><span>Order total</span><strong>${ngn(o.amount_ngn)}</strong></div></article>`;
 }).join('');
}
async function load(){
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='auth.html?redirect='+encodeURIComponent('esim-orders.html');return;}
  const {data,error}=await sb.from('esim_orders').select('id,order_ref,plan_id,plan_name,amount_ngn,imei,wallet_ngn_debited,wallet_usd_debited,status,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(100);
  if(error) throw error;
  render(data||[]);
  const ref=new URLSearchParams(location.search).get('order_ref');
  if(ref){const hit=(data||[]).find(x=>x.order_ref===ref);if(hit){const el=[...document.querySelectorAll('.order')].find(x=>x.textContent.includes(ref));if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--primary)';setTimeout(()=>el.style.outline='',1800);}}}
 }catch(e){document.getElementById('orders').className='empty';document.getElementById('orders').innerHTML='<i class="fa-solid fa-triangle-exclamation"></i><h3>Could not load eSIM orders</h3><p>Please refresh or return to the dashboard. Your payment records are not affected.</p>';}
}
load();
</script>
</body>
</html>
