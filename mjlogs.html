<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MJ Logs - MJ HUB</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"]{--primary-color:#3b82f6;--primary-hover:#2563eb;--bg-main:#07090e;--card-bg:#0d1322;--text-main:#f8fafc;--text-muted:#94a3b8;--border-color:#1e293b;--success-color:#10b981;--danger-color:#ef4444;}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;}
        html,body{width:100%;max-width:100vw;overflow-x:hidden;}
        body{background:var(--bg-main);color:var(--text-main);min-height:100vh;padding-bottom:90px;}
        .header{padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg-main);z-index:100;border-bottom:1px solid var(--border-color);}
        .back-button{background:var(--card-bg);border:1px solid var(--border-color);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-main);text-decoration:none;font-size:16px;}
        .page-title{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--primary-color),#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .main-content{padding:16px;max-width:100%;margin:0 auto;}
        @media(min-width:768px){.main-content{max-width:700px;}}
        .content-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:20px;padding:18px;margin-bottom:16px;overflow:hidden;}
        .content-card h2{font-size:17px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
        .helper-text{font-size:12px;color:var(--text-muted);margin-bottom:16px;line-height:1.4;}
        .filter-dropdown{width:100%;padding:14px 16px;border:1px solid var(--border-color);border-radius:12px;background-color:var(--bg-main);color:var(--text-main);font-size:14px;font-weight:600;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;background-size:22px;padding-right:44px;margin-bottom:14px;font-family:inherit;}
        .product-count-badge{display:inline-block;background:rgba(59,130,246,.15);color:var(--primary-color);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:14px;}
        .product-grid{display:grid;grid-template-columns:1fr;gap:12px;}
        @media(min-width:600px){.product-grid{grid-template-columns:repeat(2,1fr);}}
        .product-card{background:var(--bg-main);border:1px solid var(--border-color);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
        .product-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
        .product-name{font-size:14px;font-weight:700;line-height:1.3;flex:1;min-width:0;word-wrap:break-word;}
        .product-price{font-size:16px;font-weight:800;color:var(--primary-color);white-space:nowrap;}
        .product-description-toggle{font-size:12px;font-weight:700;color:var(--primary-color);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;user-select:none;}
        .product-description-toggle::-webkit-details-marker{display:none;}
        .product-description-toggle::before{content:'▸';font-size:10px;transition:transform .15s;}
        details[open] .product-description-toggle::before{transform:rotate(90deg);}
        .product-description-body{font-size:12px;color:var(--text-muted);line-height:1.6;word-wrap:break-word;padding-top:8px;border-top:1px solid var(--border-color);margin-top:4px;}
        .product-badges{display:flex;gap:6px;flex-wrap:wrap;}
        .badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:10px;font-weight:700;}
        .badge-stock{background:rgba(16,185,129,.15);color:var(--success-color);}
        .badge-out{background:rgba(239,68,68,.15);color:var(--danger-color);}
        .product-actions{display:flex;gap:8px;margin-top:4px;}
        .btn{flex:1;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
        .btn-primary{background:var(--primary-color);color:#fff;}
        .btn-primary:disabled{opacity:.5;}
        .btn-outline{background:transparent;color:var(--text-main);border:1px solid var(--border-color);}
        .loading-spinner{display:flex;flex-direction:column;align-items:center;padding:60px 20px;gap:14px;}
        .spinner{width:40px;height:40px;border:3px solid var(--border-color);border-top-color:var(--primary-color);border-radius:50%;animation:spin .8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .loading-text{font-size:13px;color:var(--text-muted);font-weight:600;text-align:center;}
        .empty-state{text-align:center;padding:40px 20px;}
        .empty-state-icon{font-size:44px;margin-bottom:12px;opacity:.5;}
        .empty-state h4{font-size:15px;font-weight:700;margin-bottom:6px;}
        .empty-state p{font-size:13px;color:var(--text-muted);margin-bottom:16px;word-break:break-word;}
        .toast-container{position:fixed;top:80px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
        .toast{background:var(--card-bg);border:1px solid var(--success-color);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;max-width:280px;pointer-events:all;}
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="header">
        <a href="index.html" class="back-button"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="page-title">MJ Logs</h1>
    </div>

    <main class="main-content">
        <div class="content-card">
            <h2><i class="fa-solid fa-box-archive" style="color:var(--primary-color);"></i>Browse Logs</h2>
            <p class="helper-text">Browse our verified social media logs and aged accounts. All quality-checked.</p>

            <select class="filter-dropdown" id="categoryFilter">
                <option value="all">Loading categories...</option>
            </select>

            <div id="productCountBadge"></div>

            <div id="productGrid">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <span class="loading-text" id="statusText">Starting up...</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';

        const productGrid = document.getElementById('productGrid');
        const categoryFilter = document.getElementById('categoryFilter');
        const productCountBadge = document.getElementById('productCountBadge');
        const toastContainer = document.getElementById('toastContainer');

        let allProducts = [];

        function setStatus(msg) {
            const s = document.getElementById('statusText');
            if (s) s.textContent = msg;
        }

        function cleanText(str) {
            if (!str) return '';
            const t = document.createElement('div');
            t.innerHTML = str;
            return (t.textContent || t.innerText || '').replace(/\s+/g, ' ').trim();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = '<span>✅</span><span>' + msg + '</span>';
            toastContainer.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function showError(reason) {
            productGrid.innerHTML =
                '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h4>Failed to Load</h4><p>' +
                escapeHtml(reason) +
                '</p><button class="btn btn-primary" style="max-width:200px;margin:0 auto;" onclick="location.reload()">Retry</button></div>';
        }

        async function loadProducts() {
            try {
                setStatus('Connecting to database...');

                if (!window.supabase) {
                    showError('Supabase library did not load. Check your internet and retry.');
                    return;
                }

                const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                setStatus('Fetching products...');

                const { data: products, error } = await sb
                    .from('products')
                    .select('*')
                    .eq('is_available', true)
                    .order('category', { ascending: true });

                if (error) {
                    showError('Database error: ' + error.message);
                    return;
                }

                if (!products || products.length === 0) {
                    productGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><h4>No Products</h4><p>Check back later</p></div>';
                    categoryFilter.innerHTML = '<option value="all">No categories</option>';
                    return;
                }

                allProducts = products;

                const categories = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
                categoryFilter.innerHTML = '<option value="all">📋 All Categories (' + products.length + ')</option>';
                categories.forEach(cat => {
                    const count = products.filter(p => p.category === cat).length;
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat + ' (' + count + ')';
                    categoryFilter.appendChild(opt);
                });

                renderProducts(products);

            } catch (err) {
                showError('Unexpected error: ' + (err.message || err));
            }
        }

        function renderProducts(products) {
            if (!products || products.length === 0) {
                productGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><h4>No Products Found</h4><p>Try a different category</p></div>';
                productCountBadge.innerHTML = '';
                return;
            }

            productCountBadge.innerHTML = '<span class="product-count-badge">' + products.length + ' product' + (products.length !== 1 ? 's' : '') + '</span>';

            let html = '<div class="product-grid">';

            products.forEach(p => {
                const name = escapeHtml(cleanText(p.name || 'Product'));
                const desc = escapeHtml(cleanText(p.description || ''));
                const price = parseFloat(p.price) || 0;
                const stock = parseInt(p.stock_quantity) || 0;
                const inStock = stock > 0;

                html += '<div class="product-card">';
                html += '<div class="product-header"><div class="product-name">' + name + '</div><div class="product-price">₦' + price.toLocaleString() + '</div></div>';
                if (desc) html += '<details><summary class="product-description-toggle">Description</summary><div class="product-description-body">' + desc + '</div></details>';
                html += '<div class="product-badges">' + (inStock ? '<span class="badge badge-stock">In Stock (' + stock + ')</span>' : '<span class="badge badge-out">Out of Stock</span>') + '</div>';
                html += '<div class="product-actions">';
                if (inStock) {
                    html += '<button class="btn btn-primary" data-name="' + name + '" data-price="' + price + '" data-desc="' + desc + '" data-action="cart">Add to Cart</button>';
                    html += '<button class="btn btn-outline" data-name="' + name + '" data-price="' + price + '" data-desc="' + desc + '" data-action="buy">Buy Now</button>';
                } else {
                    html += '<button class="btn btn-primary" disabled>Out of Stock</button>';
                }
                html += '</div></div>';
            });

            html += '</div>';
            productGrid.innerHTML = html;

            document.querySelectorAll('.btn[data-action]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const n = this.dataset.name, pr = parseFloat(this.dataset.price), d = this.dataset.desc, a = this.dataset.action;
                    if (a === 'cart') addToCart(n, pr, d);
                    else if (a === 'buy') buyNow(n, pr, d);
                });
            });
        }

        categoryFilter.addEventListener('change', () => {
            const c = categoryFilter.value;
            renderProducts(c === 'all' ? allProducts : allProducts.filter(p => p.category === c));
        });

        function addToCart(name, price, desc) {
            const cart = JSON.parse(localStorage.getItem('mjhub_cart') || '[]');
            if (cart.find(i => i.title === name)) { showToast('"' + name + '" already in cart'); return; }
            cart.push({ title: name, price: price, type: 'log', subtitle: desc });
            localStorage.setItem('mjhub_cart', JSON.stringify(cart));
            showToast('"' + name + '" added to cart!');
        }

        function buyNow(name, price, desc) {
            localStorage.setItem('mjhub_cart', JSON.stringify([{ title: name, price: price, type: 'log', subtitle: desc }]));
            showToast('Redirecting to cart...');
            setTimeout(() => { window.location.href = 'index.html#cart'; }, 600);
        }

        loadProducts();
    </script>
</body>
</html>
