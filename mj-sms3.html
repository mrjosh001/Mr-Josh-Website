    whatsapp:'whatsapp.com',telegram:'telegram.org',facebook:'facebook.com',instagram:'instagram.com',
    tiktok:'tiktok.com',twitter:'x.com',google:'google.com',gmail:'gmail.com',discord:'discord.com',
    snapchat:'snapchat.com',linkedin:'linkedin.com',amazon:'amazon.com',apple:'apple.com',microsoft:'microsoft.com',

  };
  function serviceLogo(name){
    const n = String(name||'').toLowerCase();
    let domain = null;
    for(const k of Object.keys(SERVICE_DOMAIN)){ if(n.includes(k)){ domain = SERVICE_DOMAIN[k]; break; } }
    if(!domain){
      // try first word as domain guess
      const w = n.replace(/[^a-z0-9]+/g,' ').trim().split(' ')[0];
      if(w && w.length > 2) domain = w + '.com';
    }
    if(!domain) return null;
    // Brandfetch CDN (public icon path) + Google favicon fallback via onerror
    return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(domain)+'&sz=64';
  }

  async function ensureAccessToken(){
    if(!sbClient) return accessToken;
    try{
      const r = await sbClient.auth.getSession();
      if(r.data && r.data.session && r.data.session.access_token){
        accessToken = r.data.session.access_token;
        return accessToken;
      }
    }catch(_){}
    try{
      const r2 = await sbClient.auth.refreshSession();
      if(r2.data && r2.data.session && r2.data.session.access_token){
        accessToken = r2.data.session.access_token;
        return accessToken;
      }
    }catch(_){}
    return accessToken;
  }

  async function api(action, opts){
    opts = opts || {};
    const qs = opts.qs || '';
    await ensureAccessToken();
    const doFetch = async () => {
      const res = await fetch('/api/sms-bus?action='+encodeURIComponent(action)+qs, {
        method: opts.method || 'GET',
        headers: Object.assign({'Authorization':'Bearer '+(accessToken||'')}, opts.body?{'Content-Type':'application/json'}:{}),
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      const data = await res.json().catch(()=>({}));
      return { res, data };
    };
    let { res, data } = await doFetch();
    // One silent refresh + retry on session errors
    if(res.status === 401 || /session expired|sign in/i.test(String(data.message||''))){
      try{
        const r2 = await sbClient.auth.refreshSession();
        if(r2.data && r2.data.session){
          accessToken = r2.data.session.access_token;
          ({ res, data } = await doFetch());
        }
      }catch(_){}
    }
    if(!res.ok || data.success === false){
      const msg = data.message || ('HTTP '+res.status);
      if(res.status === 401 || /session expired|sign in/i.test(msg)){
        throw new Error('Session expired. Sign in again.');
      }
      throw new Error(msg);
    }
    return data;
  }

  async function init(){
    countryList.innerHTML = skCountries();
    const url = (typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL) || window.SUPABASE_URL;
    const key = window.SUPABASE_ANON_KEY;
    if(!window.supabase || !url || !key){
      // try global from supabase-config
    }
    const SU = window.SUPABASE_URL || url;
    const SK = window.SUPABASE_ANON_KEY;
    if(!window.supabase || !SU || !SK){
      countryList.innerHTML = '<div class="empty-state"><h4>Config missing</h4></div>';
      return;
    }
    // Align with dashboard + Server 1: session lives in sessionStorage
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k&&(k.indexOf('sb-')===0||k.indexOf('supabase')!==-1)){
          if(!sessionStorage.getItem(k)) sessionStorage.setItem(k, localStorage.getItem(k));
        }
      }
    }catch(_){}
    sbClient = window.supabase.createClient(SU, SK, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.sessionStorage}});
    let session = null;
    try {
      const r = await sbClient.auth.getSession();
      session = r.data && r.data.session;
    } catch (_) {}
    if (!session) {
      try {
        const r2 = await sbClient.auth.refreshSession();
        session = r2.data && r2.data.session;
      } catch (_) {}
    }
    if (!session) {
      // Last try: sessionStorage-backed client (some pages still store there)
      try {
        const sb2 = window.supabase.createClient(SU, SK, {auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}});
        const r4 = await sb2.auth.getSession();
        session = r4.data && r4.data.session;
        if(session){
          // copy into localStorage client
          try{
            for(let i=0;i<sessionStorage.length;i++){
              const k=sessionStorage.key(i);
              if(k&&(k.indexOf('sb-')===0||k.indexOf('supabase')!==-1)){
                localStorage.setItem(k, sessionStorage.getItem(k));
              }
            }
          }catch(_){}
          const r5 = await sbClient.auth.getSession();
          if(r5.data && r5.data.session) session = r5.data.session;
        }
      } catch (_) {}
    }
    if (!session) {
      accessToken = '';
      await loadCountries();
      return;
    }
    accessToken = session.access_token;
    await loadCountries();
  }


  var allServiceCatalog = [];
  var serviceCountryIndex = {};
  var currentServicePick = null;
  var allCountriesForService = [];
  var __s2CatalogLoading = false;
  var __s2SearchTimer = null;
  var POPULAR = ['whatsapp','telegram','facebook','instagram','tiktok','google','gmail','twitter','discord','snapchat','microsoft','amazon','netflix','spotify','uber','paypal','linkedin','signal','viber','wechat'];

  function popularRank(name){
    var n = String(name||'').toLowerCase().trim();
    for(var i=0;i<POPULAR.length;i++){
      var k = POPULAR[i];
      if(k.length >= 4 && n.indexOf(k) !== -1) return i;
      if(n === k) return i;
    }
    if(n === 'x' || n.indexOf('twitter') !== -1) return POPULAR.indexOf('twitter');
    return 1000;
  }
  function isJunkService(name){
    var n = String(name||'').trim();
    if(!n) return true;
    if(/^[a-z]{1,4}x$/i.test(n)) return true;
    if(/^[a-z0-9]{1,3}$/i.test(n)) return true;
    if(/^[0-9]+$/.test(n)) return true;
    return false;
  }
  function countryMatchesQuery(name, q){
    if(!q) return true;
    var n = String(name||'').toLowerCase();
    if(n.indexOf(q) !== -1) return true;
    if(/^(usa|us|america)$/i.test(q) || q.indexOf('united st') === 0){
      if(/united states|usa|america/i.test(n)) return true;
    }
    return false;
  }
  function serviceTileHtml(name){
    var logo = serviceLogo(name);
    var fa = serviceFa(name);
    if(logo){
      return '<div class="svc-icon-wrap"><img class="svc-logo" src="'+logo+'" alt="" loading="lazy" onerror="this.style.display=\'none\';var n=this.nextElementSibling;if(n)n.style.display=\'flex\'"/><div class="svc-icon" style="display:none;background:'+fa.color+'"><i class="'+fa.cls+'"></i></div></div>';
    }
    return '<div class="svc-icon" style="background:'+fa.color+'"><i class="'+fa.cls+'"></i></div>';
  }

  async function loadServiceCatalogS2(opts){
    opts = opts || {};
    try{
      if(!opts.force){
        try{
          var raw = sessionStorage.getItem('mj_sms2_catalog_v1');
          if(raw){
            var cached = JSON.parse(raw);
            if(cached && cached.catalog && cached.catalog.length){
              allServiceCatalog = cached.catalog;
              serviceCountryIndex = cached.index || {};
              renderServiceCatalogS2(allServiceCatalog);
              if(cached.complete && (Date.now() - (cached.t||0)) < 15*60*1000){
                return;
              }
              // soft continue fill below
            }
          }
        }catch(e){}
      }

      if(serviceGrid && !(allServiceCatalog && allServiceCatalog.length)){
        serviceGrid.innerHTML = '<div class="sk-svc-grid">'+Array.from({length:12}).map(function(){return '<div class="sk-svc-tile"><div class="sk-svc-icon"></div><div class="sk-svc-label"></div></div>';}).join('')+'</div>';
      }

      if(__s2CatalogLoading && !opts.force) return;
      __s2CatalogLoading = true;

      var map = new Map();
      (allServiceCatalog||[]).forEach(function(s){ if(s && s.key) map.set(s.key, s); });

      function ingestRow(row){
        var name = String(row.service_name || row.title || row.service_id || row.id || '').replace(/_/g,' ').trim();
        if(!name) return;
        var sid = row.service_id || row.project_id || row.id;
        var key = name.toLowerCase();
        if(!map.has(key)) map.set(key, { project_id: sid, service_id: sid, title: name, service_name: name, key: key });
        if(row.country_id != null){
          if(!serviceCountryIndex[key]) serviceCountryIndex[key] = [];
          var exists = serviceCountryIndex[key].some(function(x){ return String(x.country_id) === String(row.country_id); });
          if(!exists){
            serviceCountryIndex[key].push({
              country_id: row.country_id,
              country_name: row.country_name || ('Country '+row.country_id),
              price: row.price,
              available_quantity: row.available_quantity,
              project_id: sid,
              service_id: sid,
              title: name
            });
          }
        }
      }

      function paint(){
        allServiceCatalog = Array.from(map.values()).sort(function(a,b){
          var ra = popularRank(a.title||a.service_name), rb = popularRank(b.title||b.service_name);
          if(ra !== rb) return ra - rb;
          return String(a.title||'').localeCompare(String(b.title||''));
        });
        renderServiceCatalogS2(allServiceCatalog);
        try{
          sessionStorage.setItem('mj_sms2_catalog_v1', JSON.stringify({
            t: Date.now(), complete: false, catalog: allServiceCatalog, index: serviceCountryIndex
          }));
        }catch(e){}
      }

      // 1+2 parallel: projects API + first DB page (faster first paint)
      try{
        var jobs = [api('projects').catch(function(e){ return null; })];
        if(sbClient){
          jobs.push(sbClient.from('number_services')
            .select('service_id, service_name, price, available_quantity, country_id, country_name')
            .eq('source', 'smsbus').eq('is_available', true).gt('price', 0).range(0, 999));
        }
        var settled = await Promise.all(jobs);
        var j = settled[0];
        if(j){
          var list = (j && j.data) ? j.data : (Array.isArray(j) ? j : []);
          list.forEach(function(p){
            ingestRow({
              service_id: p.id || p.project_id,
              service_name: p.title || p.name || String(p.id),
              title: p.title || p.name
            });
          });
        }
        if(settled[1] && settled[1].data){
          settled[1].data.forEach(ingestRow);
        }
        paint();
      }catch(e){ console.warn('fast catalog', e); }

      // More DB pages in background (non-blocking feel — still awaited but after first paint)
      if(sbClient){
        try{
          for(var pg = 1; pg < 5; pg++){
            var from = pg * 1000, to = from + 999;
            var res = await sbClient
              .from('number_services')
              .select('service_id, service_name, price, available_quantity, country_id, country_name')
              .eq('source', 'smsbus')
              .eq('is_available', true)
              .gt('price', 0)
              .range(from, to);
            if(res.error || !(res.data && res.data.length)) break;
            res.data.forEach(ingestRow);
            if(pg % 2 === 0) paint();
            if(res.data.length < 1000) break;
          }
          paint();
        }catch(e){ console.warn('smsbus catalog', e); }
      }

      // 3) Countries list kept available for fallback names
      try{
        var cj = await api('countries');
        var clist = (cj && cj.data) ? cj.data : [];
        allCountries = clist.map(function(c){
          return {
            country_id: c.id || c.country_id,
            country_name: c.title || c.name || c.country_name || String(c.id),
            service_count: c.service_count || null
          };
        });
      }catch(e){}

      try{
        sessionStorage.setItem('mj_sms2_catalog_v1', JSON.stringify({
          t: Date.now(), complete: true, catalog: allServiceCatalog, index: serviceCountryIndex
        }));
      }catch(e){}

      __s2CatalogLoading = false;
      if(!allServiceCatalog.length){
        serviceGrid.innerHTML = '<div class="empty-state"><h4>No services</h4><button type="button" class="btn-buy" style="margin-top:12px" onclick="loadServiceCatalogS2({force:true})">Retry</button></div>';
      }
    }catch(err){
      __s2CatalogLoading = false;
      console.error(err);
      if(serviceGrid && !allServiceCatalog.length){
        serviceGrid.innerHTML = '<div class="empty-state"><h4>Failed to load</h4><p>'+esc(err.message||String(err))+'</p></div>';
      }
    }
  }

  function renderServiceCatalogS2(list, searchQ){
    var q = (searchQ != null ? searchQ : (serviceSearch && serviceSearch.value) || '').trim().toLowerCase();
    var filtered = (list || []).filter(function(s){
      var name = s.title || s.service_name || '';
      if(isJunkService(name)){
        if(q && name.toLowerCase().indexOf(q) !== -1 && q.length >= 2) return true;
        return false;
      }
      if(q) return name.toLowerCase().indexOf(q) !== -1;
      return true;
    });
    if(!q && filtered.length > 400) filtered = filtered.slice(0, 400);
    if(!filtered.length){
      serviceGrid.innerHTML = '<div class="empty-state"><h4>No services</h4></div>';
      if(serviceCountBadge) serviceCountBadge.innerHTML = '';
      return;
    }
    if(serviceCountBadge){
      serviceCountBadge.innerHTML = '<span class="product-count-badge">'+filtered.length+' service'+(filtered.length!==1?'s':'')+'</span>';
    }
    serviceGrid.innerHTML = '<div class="svc-icon-grid">'+filtered.map(function(s){
      var name = s.title || s.service_name || 'Service';
      var key = s.key || name.toLowerCase();
      return '<button type="button" class="svc-tile" data-key="'+esc(key)+'">'+serviceTileHtml(name)+'<span class="svc-label">'+esc(name)+'</span></button>';
    }).join('')+'</div>';
    serviceGrid.querySelectorAll('.svc-tile').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-key');
        var svc = (list || []).find(function(x){ return (x.key || (x.title||x.service_name||'').toLowerCase()) === key; });
        if(svc) selectServiceS2(svc);
      });
    });
  }

  async function selectServiceS2(svc){
    currentServicePick = svc;
    currentCountry = null;
    activeService = null;
    serviceStep.style.display = 'none';
    countryStep.style.display = 'block';
    var name = svc.title || svc.service_name || 'Service';
    var nameEl = document.getElementById('selectedServiceName');
    nameEl.innerHTML = '';
    var mini = document.createElement('span');
    mini.className = 'mini-icon';
    var logo = serviceLogo(name);
    var fa = serviceFa(name);
    if(logo){
      var im = document.createElement('img');
      im.src = logo;
      im.alt = '';
      im.onerror = function(){ mini.style.background = fa.color; mini.innerHTML = '<i class="'+fa.cls+'"></i>'; };
      mini.appendChild(im);
    } else {
      mini.style.background = fa.color;
      mini.innerHTML = '<i class="'+fa.cls+'"></i>';
    }
    nameEl.appendChild(mini);
    nameEl.appendChild(document.createTextNode(name));
    countrySearch.value = '';
    countryList.innerHTML = '<div class="loading-text">Loading countries…</div>';

    var key = (svc.key || name).toLowerCase();
    var rows = (serviceCountryIndex[key] || []).slice();

    // Refresh from DB for full country list (existing number_services / smsbus)
    try{
      if(sbClient){
        var res = await sbClient
          .from('number_services')
          .select('service_id, service_name, country_id, country_name, price, available_quantity')
          .eq('source', 'smsbus')
          .eq('is_available', true)
          .eq('service_id', String(svc.project_id || svc.service_id))
          .gt('price', 0)
          .order('price', { ascending: true })
          .limit(500);
        if(!(res.data && res.data.length)){
          res = await sbClient
            .from('number_services')
            .select('service_id, service_name, country_id, country_name, price, available_quantity')
            .eq('source', 'smsbus')
            .eq('is_available', true)
            .ilike('service_name', name)
            .gt('price', 0)
            .order('price', { ascending: true })
            .limit(500);
        }
        if(res.data && res.data.length){
          rows = res.data.map(function(r){
            return {
              country_id: r.country_id,
              country_name: r.country_name || ('Country '+r.country_id),
              price: r.price,
              available_quantity: r.available_quantity,
              project_id: r.service_id,
              service_id: r.service_id,
              title: r.service_name || name
            };
          });
          serviceCountryIndex[key] = rows;
        }
      }
    }catch(e){ console.warn(e); }

    // Fallback: if still empty, use live prices API for a few countries (existing endpoint)
    if(!rows.length && allCountries && allCountries.length && accessToken){
      var sample = allCountries.slice(0, 12);
      for(var i=0;i<sample.length;i++){
        try{
          var pj = await api('prices', { qs: '&country_id='+encodeURIComponent(sample[i].country_id) });
          var plist = (pj && pj.data) ? pj.data : [];
          plist.forEach(function(s){
            var tname = String(s.title || s.name || '').toLowerCase();
            if(tname === name.toLowerCase() || tname.indexOf(name.toLowerCase()) !== -1){
              rows.push({
                country_id: sample[i].country_id,
                country_name: sample[i].country_name,
                price: s.price,
                available_quantity: s.stock || s.count,
                project_id: s.project_id || s.id,
                service_id: s.project_id || s.id,
                title: s.title || name
              });
            }
          });
        }catch(e){}
      }
    }

    var byC = new Map();
    rows.forEach(function(c){
      var id = String(c.country_id);
      if(!byC.has(id) || Number(c.price) < Number(byC.get(id).price)) byC.set(id, c);
    });
    allCountriesForService = Array.from(byC.values()).sort(function(a,b){ return Number(a.price)-Number(b.price); });
    renderCountryPricesS2(allCountriesForService);
  }

          stock: c.available_quantity
        });
      });
    });

  }
  document.getElementById('purchaseCloseBtn').addEventListener('click', closePurchaseModal);
  document.getElementById('purchaseModal').addEventListener('click', function(e){ if(e.target===this) closePurchaseModal(); });
  document.getElementById('psBuyBtn').addEventListener('click', function(){
    if(!activeService || isBuying) return;
    if(!currentCountry){
      toast('Please select a country first', 'error');
      return;
    }
    const svc = activeService, btn = document.getElementById('psBuyBtn');
    isBuying = true;
    btn.disabled = true;
    const prevHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Purchasing...';
    if(!window.__mjSms3BuyId){
      window.__mjSms3BuyId = 'MJ-SB-' + Date.now() + '-' + Math.random().toString(36).slice(2,9);
    }
    // Keep modal open so user sees progress; close on success right before redirect
    buy(svc.project_id, btn, prevHtml, window.__mjSms3BuyId);
  });

  serviceSearch.addEventListener('input', function(){
    var q = serviceSearch.value.trim().toLowerCase();
    renderServiceCatalogS2(allServiceCatalog, q);
    clearTimeout(__s2SearchTimer);
    if(q.length >= 2 && sbClient){
      __s2SearchTimer = setTimeout(async function(){
        try{
          var res = await sbClient.from('number_services')
            .select('service_id, service_name, price, available_quantity, country_id, country_name')
            .eq('source', 'smsbus').eq('is_available', true)
            .ilike('service_name', '%'+q+'%').limit(120);
          if(res.data && res.data.length){
            res.data.forEach(function(row){
              var name = String(row.service_name||'').replace(/_/g,' ').trim();
              if(!name) return;
              var key = name.toLowerCase();
              if(!allServiceCatalog.some(function(s){ return s.key === key; })){
                allServiceCatalog.push({ project_id: row.service_id, service_id: row.service_id, title: name, service_name: name, key: key });
              }
              if(!serviceCountryIndex[key]) serviceCountryIndex[key] = [];
              if(!serviceCountryIndex[key].some(function(x){ return String(x.country_id)===String(row.country_id); })){
                serviceCountryIndex[key].push({
                  country_id: row.country_id, country_name: row.country_name, price: row.price,
                  available_quantity: row.available_quantity, project_id: row.service_id, service_id: row.service_id, title: name
                });
              }
            });
            if((serviceSearch.value||'').trim().toLowerCase() === q) renderServiceCatalogS2(allServiceCatalog, q);
          }
        }catch(e){}
      }, 180);
    }
  });
  countrySearch.addEventListener('input', function(){
    var q = countrySearch.value.trim().toLowerCase();
    renderCountryPricesS2(q ? allCountriesForService.filter(function(c){ return countryMatchesQuery(c.country_name, q); }) : allCountriesForService);
  });
  var chg = document.getElementById('changeServiceBtn');
  if(chg) chg.onclick = backToServicesS2;


  async function buy(projectId, btn, prevHtml, idemKey){
    if(!accessToken){
      toast('Please sign in to buy a number', 'error');
      isBuying = false;
      if(btn){ btn.disabled = false; if(prevHtml) btn.innerHTML = prevHtml; }
      setTimeout(function(){ location.href = 'auth.html?next=' + encodeURIComponent('mj-sms3.html'); }, 700);
      return;
    }
    if(!currentCountry){
      toast('Country missing — go back and pick a country', 'error');
      isBuying = false;
      if(btn){ btn.disabled = false; if(prevHtml) btn.innerHTML = prevHtml; }
      return;
    }
    if(btn){ btn.disabled = true; }
    try{
      toast('Placing your order…', 'success');
      const j = await api('order', {
        method: 'POST',
        body: {
          country_id: currentCountry.country_id,
          project_id: projectId,
          reuse: !!(document.getElementById('reusePref') && document.getElementById('reusePref').checked),
          external_order_id: idemKey || window.__mjSms3BuyId || undefined
        }
      });
      const oid = j && j.data && j.data.order_id;
      if(!oid) throw new Error((j && j.message) || 'Purchase failed — no order id returned. Try again.');
      const num = (j.data && (j.data.number || j.data.phone_number)) || '';
      const payload = {
        order_id: oid, number: num, phone_number: num,
        price: j.data && j.data.price,
        service_name: j.data && j.data.service_name,
        country_name: j.data && j.data.country_name,
        ts: Date.now()
      };
      try{
        sessionStorage.setItem('mj_sms3_last_order', JSON.stringify(payload));
        localStorage.setItem('mj_sms3_last_order', JSON.stringify(payload));
      }catch(_){}
      const q = new URLSearchParams({ order_id: String(oid) });
      if(num) q.set('number', num);
      if(j.data && j.data.service_name) q.set('service_name', j.data.service_name);
      if(j.data && j.data.country_name) q.set('country_name', j.data.country_name);
      if(j.data && j.data.price != null) q.set('price', String(j.data.price));
      toast('Number purchased! Redirecting…', 'success');
      closePurchaseModal();
      // Short delay so user can read success toast
      setTimeout(function(){
        location.href = 'mj-sms3-number.html?' + q.toString();
      }, 450);
    }catch(e){
      var msg = (e && e.message) ? e.message : 'Purchase failed. Please try again.';
      if(/insufficient|balance/i.test(msg)){
        toast(msg + ' — redirecting to deposit…', 'error');
        isBuying = false;
        if(btn){ btn.disabled = false; btn.innerHTML = prevHtml || '<i class="fa-solid fa-mobile-screen"></i> Confirm Purchase'; }
        setTimeout(function(){ location.href = 'deposit.html'; }, 900);
        return;
      }
      toast(msg, 'error');
      window.__mjSms3BuyId = null;
      if(btn){ btn.disabled = false; btn.innerHTML = prevHtml || '<i class="fa-solid fa-mobile-screen"></i> Confirm Purchase'; }
      isBuying = false;
    }
  }

  init();
})();
</script>
</body>
</html>
