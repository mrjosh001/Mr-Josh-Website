<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server 2 · OTP · MJ HUB</title>
<script>(function(){try{var t=localStorage.getItem('mjhub-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<script src="/js/mj-page-loader.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{--bg:#06080f;--card:#0f1524;--text:#f1f5f9;--muted:#8b9bb4;--border:rgba(148,163,184,.12);--primary:#3b82f6}
:root[data-theme="light"]{--bg:#f4f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:rgba(15,23,42,.08);--primary:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.shell{max-width:560px;margin:0 auto;padding:0 16px 48px}
.hdr{display:flex;align-items:center;gap:12px;padding:14px 0;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);z-index:10}
.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
h1{font-size:18px;font-weight:800}
.note{font-size:12px;color:var(--muted);margin:8px 0 16px;line-height:1.45}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
select,button.primary{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:600 14px inherit}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:800;cursor:pointer;margin-top:16px}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}
.list{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.card b{display:block;font-size:14px}
.card span{font-size:12px;color:var(--muted)}
.price{color:var(--primary);font-weight:800}
.err{color:#f87171;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="shell">
  <header class="hdr">
    <a class="back" href="mj-sms-choose-server.html"><i class="fa-solid fa-arrow-left"></i></a>
    <h1>Server 2 · OTP</h1>
  </header>
  <p class="note">Reuse of the same number is only possible within about <strong>20 minutes</strong> when available — not the next day.</p>
  <label>Country</label>
  <select id="country"></select>
  <label>Service</label>
  <select id="project"><option value="">Select country first</option></select>
  <div class="row"><input type="checkbox" id="reusePref"> <label for="reusePref" style="margin:0">Prefer reusable numbers</label></div>
  <div id="priceBox" class="note"></div>
  <button type="button" class="primary" id="buyBtn">Buy number</button>
  <div class="err" id="err"></div>
  <div class="list" id="services"></div>
</div>
<script>
const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
});
let priceMap = {};
async function authHeaders() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'auth.html'; return null; }
  return { Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' };
}
async function api(action, opts) {
  opts = opts || {};
  const h = await authHeaders();
  if (!h) return null;
  const res = await fetch('/api/sms-bus?action=' + encodeURIComponent(action) + (opts.qs || ''), {
    method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  return res.json();
}
function money(n){ return '₦' + Number(n||0).toLocaleString(); }
async function loadCountries() {
  const j = await api('countries');
  const sel = document.getElementById('country');
  if (!j || !j.success) { document.getElementById('err').textContent = (j && j.message) || 'Failed to load countries'; return; }
  sel.innerHTML = '<option value="">Select country</option>' + j.data.map(function(c){
    return '<option value="'+c.id+'">'+c.title+'</option>';
  }).join('');
}
document.getElementById('country').onchange = async function() {
  var id = this.value;
  document.getElementById('project').innerHTML = '<option value="">Loading…</option>';
  document.getElementById('services').innerHTML = '';
  if (!id) return;
  var j = await api('prices', { qs: '&country_id=' + encodeURIComponent(id) });
  if (!j || !j.success) {
    document.getElementById('project').innerHTML = '<option value="">No services</option>';
    document.getElementById('err').textContent = (j && j.message) || 'No prices';
    return;
  }
  priceMap = {};
  j.data.forEach(function(r){ priceMap[r.project_id] = r; });
  document.getElementById('project').innerHTML = '<option value="">Select service</option>' +
    j.data.map(function(r){
      return '<option value="'+r.project_id+'">'+(r.title||('Service '+r.project_id))+' — '+money(r.price)+'</option>';
    }).join('');
  document.getElementById('services').innerHTML = j.data.map(function(r){
    return '<div class="card svc" data-id="'+r.project_id+'" style="cursor:pointer"><b>'+(r.title||('Service '+r.project_id))+'</b><span>Stock '+r.stock+' · <span class="price">'+money(r.price)+'</span></span></div>';
  }).join('');
  document.querySelectorAll('.svc').forEach(function(el){
    el.onclick = function(){
      document.getElementById('project').value = el.getAttribute('data-id');
      document.getElementById('project').dispatchEvent(new Event('change'));
      el.scrollIntoView({behavior:'smooth', block:'nearest'});
    };
  });
};
document.getElementById('project').onchange = function() {
  var r = priceMap[this.value];
  document.getElementById('priceBox').textContent = r ? ('You pay ' + money(r.price)) : '';
};
document.getElementById('buyBtn').onclick = async function() {
  var err = document.getElementById('err');
  err.textContent = '';
  var country_id = document.getElementById('country').value;
  var project_id = document.getElementById('project').value;
  if (!country_id || !project_id) { err.textContent = 'Select country and service'; return; }
  this.disabled = true; this.textContent = 'Buying…';
  var j = await api('order', { method: 'POST', body: { country_id: country_id, project_id: project_id, reuse: document.getElementById('reusePref').checked } });
  this.disabled = false; this.textContent = 'Buy number';
  if (!j || !j.success) { err.textContent = (j && j.message) || 'Purchase failed'; return; }
  location.href = 'mj-sms3-number.html?order_id=' + encodeURIComponent(j.data.order_id);
};
loadCountries();
</script>
</body>
</html>
