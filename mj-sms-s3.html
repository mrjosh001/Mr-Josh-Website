const SHORT_BRANDS_KEEP = ['vk','ok','qq','imo','olx','hbo','x','ea','mi'];
function isJunkService(name){
  const n = String(name||'').trim();
  if(!n) return true;
  const low = n.toLowerCase();
  // "Any other" is a real catch-all — never treat as junk
  if(/^any\s*other$/i.test(n) || low === 'other') return false;
  if(SHORT_BRANDS_KEEP.indexOf(low) !== -1) return false;
  if(/^[0-9]+$/.test(n)) return true;
  if(n.length <= 1) return true;
  // Server 3 sends real names. A bare 2–3 letter ALL-CAPS value is just the supplier code
  // echoed back (e.g. "WA", "ABX") — hide those, but keep real brands like Uber, Line, Bolt, eBay.
  if(/^[A-Z0-9]{2,3}$/.test(n)) return true;
  return false;
}
function isAnyOtherService(name){
  const low = String(name||'').toLowerCase().trim();
  return low === 'any other' || low === 'other' || /^any\s*other/.test(low);
}
function findAnyOtherService(list){
  return (list || []).find(function(s){ return isAnyOtherService(s.service_name || s.title || ''); }) || null;
}
function popularRank(name){
  const n = String(name||'').toLowerCase().trim();
  // Prefer exact / word-boundary matches so "abx" does not match "x" (Twitter)
  for(let i=0;i<POPULAR_SERVICES.length;i++){
    const k = POPULAR_SERVICES[i];
    if(k.length <= 1) continue; // skip single-letter keys
    if(n === k) return i;
    // word boundary style: key as whole token or clear brand substring for long keys
    if(k.length >= 4 && n.includes(k)) return i;
    if(k.length >= 2 && (n === k || n.startsWith(k + ' ') || n.endsWith(' ' + k) || n.includes(' ' + k + ' '))) return i;
  }
  // special short brands
  if(n === 'x' || n === 'x / twitter' || n === 'x/twitter' || n === 'twitter') {
    const i = POPULAR_SERVICES.indexOf('twitter');
    return i >= 0 ? i : 0;
  }
  return 1000;
}

// --- Country search: works however the person types it -------------------------------
// "usa", "U.S.A", "u s a", "US", "america", "united states", "United States of America" all find the
// United States. Same idea for UK, UAE, DR Congo, Ivory Coast, South Korea, etc.
function normText(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/&/g,'and')
    .replace(/[^a-z0-9]+/g,'');
}
const COUNTRY_ALIAS_GROUPS = [
  ['unitedstates','unitedstatesofamerica','usa','us','america','american','states','theus','theusa','usavirtual','unitedstatesvirtual'],
  ['unitedkingdom','uk','gb','greatbritain','britain','british','england','scotland','wales','northernireland'],

];
function countryMatchesQuery(name, q){
  var nq = normText(q);
  if(!nq) return true;
  var nn = normText(name);
  if(!nn) return false;
  // 1) alias groups: if what was typed is one of the names for a country, match that country
  for(var g = 0; g < COUNTRY_ALIAS_GROUPS.length; g++){
    var grp = COUNTRY_ALIAS_GROUPS[g];
    if(grp.indexOf(nq) === -1) continue;
    for(var i = 0; i < grp.length; i++){
      var t = grp[i];
      // very short tokens (us, uk, gb, hk…) must match the whole name; longer ones can sit inside it
      if(t.length <= 2 ? nn === t : nn.indexOf(t) !== -1) return true;
    }
  }
  // 2) normal "contains" search (needs 2+ letters so one letter doesn't match half the list)
  if(nq.length >= 2 && nn.indexOf(nq) !== -1) return true;
  if(nq.length === 1) return nn.charAt(0) === nq;
  // 3) typing a prefix of an alias, e.g. "united st", "unit", "amer"
  if(nq.length >= 3){
    for(var g2 = 0; g2 < COUNTRY_ALIAS_GROUPS.length; g2++){
      var grp2 = COUNTRY_ALIAS_GROUPS[g2];
      var hit = false;
      for(var j = 0; j < grp2.length; j++){ if(grp2[j].length > 2 && grp2[j].indexOf(nq) === 0){ hit = true; break; } }
      if(!hit) continue;
      for(var k = 0; k < grp2.length; k++){
        var tt = grp2[k];
        if(tt.length > 2 && nn.indexOf(tt) !== -1) return true;
      }
    }
  }
  return false;
}

function serviceDomain(name){
  const n = String(name||'').toLowerCase().trim();
  if(!n) return null;
  // exact key first
  if(SERVICE_DOMAIN[n]) return SERVICE_DOMAIN[n];
  // longer keys first so "twitter" wins before "x"
  const keys = Object.keys(SERVICE_DOMAIN).sort(function(a,b){ return b.length - a.length; });
  for(let i=0;i<keys.length;i++){
    const key = keys[i];
    if(key.length <= 1) continue;
    if(n === key) return SERVICE_DOMAIN[key];
    if(key.length >= 4 && n.includes(key)) return SERVICE_DOMAIN[key];
  }
  // twitter / x exact only
  if(n === 'x' || n === 'twitter' || /^x\s*\/?\s*twitter/i.test(n)) return 'x.com';
  // do NOT guess domain from junk codes like abx
  if(isJunkService(name)) return null;
  const slug = n.replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/)[0];
  if(slug && slug.length >= 4 && !isJunkService(slug)) return slug + '.com';
  return null;
}

function isoToFlagEmoji(iso2){
  if(!iso2 || iso2.length!==2) return '';
  return String.fromCodePoint(...[...iso2.toUpperCase()].map(c => 127397 + c.charCodeAt(0)));
}
function vsIsoFromId(id){
  var n = Number(id) - 1000;
  if(!Number.isInteger(n) || n < 0 || n >= 676) return null;
  return String.fromCharCode(65 + Math.floor(n / 26)) + String.fromCharCode(65 + (n % 26));
}
function countryFlag(name, id){
  var iso = (id != null) ? vsIsoFromId(id) : null;
  if(iso) return isoToFlagEmoji(iso);
  const byName = COUNTRY_ISO[(name||'').toLowerCase().trim()];
  return byName ? isoToFlagEmoji(byName) : '🌍';
}

// a general history/recent-numbers list here — this page is for buying a
// new number, not browsing past ones; that's what mj-sms-history.html is for.
async function loadRecentActivity(){
  const area = document.getElementById('recentActivityArea');
  if(!area || !sbClient || !currentUserId) return;
  try{
    const { data, error } = await sbClient
      .from('number_orders')
      .select('order_id, service_name, phone_number, status')
      .eq('source', 'virtualsms')
      .eq('user_id', currentUserId)
      .eq('status', 'waiting_for_code')
      .order('created_at', { ascending: false })
      .limit(1);
    if(error || !data || !data.length){ return; }

var __smsCatalogComplete = false;

/** Match server salePriceFromUsd (fixed 80% band) for display only — server re-prices on order */
function salePriceFromUsdClient(usd){
  var rate = 1500;
  var percent = 80;
  var minProfit = 500;
  var minSale = 1000;
  var supplierNgn = Number(usd) * rate;
  if(!Number.isFinite(supplierNgn) || supplierNgn <= 0) return minSale;
  var percentPrice = Math.ceil(supplierNgn * (1 + percent / 100));
  var floorPrice = Math.ceil(supplierNgn + minProfit);
  var finalPrice = Math.max(percentPrice, floorPrice, minSale);
  return Math.ceil(finalPrice / 50) * 50;
}
function providersToPoolOptions(providersRaw, poolPriceOverrides){
  if(!providersRaw || typeof providersRaw !== 'object') return [];
  var overrides = (poolPriceOverrides && typeof poolPriceOverrides === 'object') ? poolPriceOverrides : {};
  var out = [];
  Object.keys(providersRaw).forEach(function(key){
    var p = providersRaw[key];
    if(!p) return;
    var arr = Array.isArray(p.price) ? p.price : [p.price];
    var nums = arr.map(Number).filter(function(n){ return Number.isFinite(n) && n > 0; });
    if(!nums.length) return;
    var usd = Math.min.apply(null, nums);
    var pid = p.provider_id != null ? String(p.provider_id) : String(key);
    // Admin's custom price for this exact pool wins — matches what the
    // server actually charges (see grizzly-sync.js handleOrder). Falls
    // back to the fixed-formula price only when no override is set.
    var overridden = Number(overrides[pid]);
    var finalPrice = (Number.isFinite(overridden) && overridden > 0) ? overridden : salePriceFromUsdClient(usd);
    out.push({
      provider_id: pid,
      count: Number(p.count) || 0,
      supplier_usd: usd,
      price_ngn: finalPrice
    });
  });
  out.sort(function(a,b){ return a.price_ngn - b.price_ngn; });
  return out;
}


// ---------------------------------------------------------------------------------------
// Server 3 catalog loader.
// WHY THIS WAS SHOWING "ONLY A FEW SERVICES / COUNTRIES": Supabase returns at most 1000 rows per
// request no matter what .limit() says, and the old loader asked for "8000 countries" / "3000 rows
// per batch" in single calls — so every call was silently cut to 1000 rows, and that partial result
// was then cached as "complete" for the whole day. This loader pages through everything with
// .range() (1000 rows per page, a few pages in parallel) until a page comes back short.
// ---------------------------------------------------------------------------------------
async function loadServiceCatalog(opts){
  opts = opts || {};
  var force = !!opts.force;
  try{
    if(!sbClient){
      if(!window.supabase) throw new Error('Supabase not loaded — refresh the page');
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
      });
    }

    // v2 key: ignores the old v1 cache that was stuck on a partial list
    var CACHE_KEY = 'mj_sms3_virtualsms_catalog_v2';
    try{ localStorage.removeItem('mj_sms3_virtualsms_catalog_v1'); sessionStorage.removeItem('mj_sms3_virtualsms_catalog_v1'); }catch(e){}
    function lagosDay(){
      try{ return new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Lagos' }); }
      catch(e){ return new Date().toISOString().slice(0,10); }
    }
    function cacheGet(){
      try{
        var raw = localStorage.getItem(CACHE_KEY) || sessionStorage.getItem(CACHE_KEY);
        if(!raw) return null;
        var o = JSON.parse(raw);
        if(!o || o.day !== lagosDay()) return null; // new day → reload
        if(!(o.catalog && o.catalog.length)) return null;
        return o;
      }catch(e){ return null; }
    }
    // Only the service list is cached (small). Countries per service are always read fresh from the DB when a service is tapped.
    function cacheSet(complete){
      try{
        var payload = JSON.stringify({
          day: lagosDay(),
          t: Date.now(),
          complete: !!complete,
          catalog: allServiceCatalog
        });
        try{ localStorage.setItem(CACHE_KEY, payload); }catch(e1){
          try{ sessionStorage.setItem(CACHE_KEY, payload); }catch(e2){}
        }
      }catch(e){}
    }

    var catalogMap = new Map();

    function ingest(rows, countryId, countryName){
      (rows || []).forEach(function(row){
        var name = String(row.service_name || row.service_id || '').replace(/_/g, ' ').trim();
        if(!name) return;
        var key = name.toLowerCase();
        if(!catalogMap.has(key)){
          catalogMap.set(key, { service_id: row.service_id, service_name: name, key: key });
        }
        if(!serviceCountryIndex[key]) serviceCountryIndex[key] = [];
        var cid = countryId != null ? countryId : row.country_id;
        var exists = serviceCountryIndex[key].some(function(x){ return String(x.country_id) === String(cid); });
        if(exists) return;
        serviceCountryIndex[key].push({
          country_id: cid,
          country_name: countryName || row.country_name || ('Country ' + cid),
          price: row.price,
          available_quantity: row.available_quantity,
          service_id: row.service_id,
          service_name: name
        });
      });
    }

    function rebuildMapFromCatalog(){
      catalogMap = new Map();
      (allServiceCatalog || []).forEach(function(s){
        if(s && s.key) catalogMap.set(s.key, s);
      });
    }

    function paintProgress(){
      allServiceCatalog = Array.from(catalogMap.values()).sort(function(a,b){
        var ra = popularRank(a.service_name), rb = popularRank(b.service_name);
        if(ra !== rb) return ra - rb;
        return a.service_name.localeCompare(b.service_name);
      });
      renderServiceCatalog(allServiceCatalog);
    }

    // --- Instant restore: stay loaded while user is in this session ---
    var cached = cacheGet();
    if(!force && cached && cached.catalog && cached.catalog.length){
      allServiceCatalog = cached.catalog;
      serviceCountryIndex = {};
      __smsCatalogComplete = !!cached.complete;
      rebuildMapFromCatalog();
      paintProgress();
      if(serviceGrid){ serviceGrid.dataset.skelReady = '1'; serviceGrid.dataset.loaded = '1'; }
      if(cached.complete){
        __smsCatalogComplete = true;
        __smsCatalogLoading = false;
        return;
      }
      // Incomplete cache: continue filling in background without blocking UI
    } else if(serviceGrid && !(allServiceCatalog && allServiceCatalog.length) && serviceGrid.dataset.loaded !== '1'){
      serviceGrid.innerHTML = serviceCatalogSkeleton();
      serviceGrid.dataset.skelReady = '1';
    }

    if(__smsCatalogLoading && !force) return;
    __smsCatalogLoading = true;
    if(force){ catalogMap = new Map(); serviceCountryIndex = {}; }

    var PAGE = 1000;       // Supabase's hard cap per request
    var PARALLEL = 4;      // pages fetched at the same time

    async function fetchPage(from){
      var base = function(){
        return sbClient
          .from('number_services')
          .select('service_id, service_name, price, available_quantity, country_id, country_name')
          .eq('source', 'virtualsms')
          .eq('is_available', true);
      };
      var res = await base().gt('price', 0).order('id', { ascending: true }).range(from, from + PAGE - 1);
      if(res.error){
        res = await base().order('id', { ascending: true }).range(from, from + PAGE - 1);
      }
      return res;
    }

    var from = 0;
    var finished = false;
    var totalRows = 0;
    var countryIds = new Set();
    while(!finished && from < 300000){
      var jobs = [];
      for(var k = 0; k < PARALLEL; k++) jobs.push(fetchPage(from + k * PAGE));
      var parts = await Promise.all(jobs);
      for(var p = 0; p < parts.length; p++){
        var part = parts[p];
        if(part.error) throw new Error(part.error.message || 'Could not load Server 3 catalog');
        var data = part.data || [];
        totalRows += data.length;
        data.forEach(function(row){
          if(row.country_id != null) countryIds.add(String(row.country_id));
          ingest([row], row.country_id, row.country_name);
        });
        if(data.length < PAGE){ finished = true; break; }
      }
      from += PARALLEL * PAGE;
      if(catalogMap.size){ paintProgress(); cacheSet(false); }
    }

    allCountriesMaster = Array.from(countryIds).map(function(id){ return { country_id: id }; });
    __smsCatalogComplete = true;
    __smsCatalogLoading = false;

    if(!catalogMap.size){
      serviceGrid.innerHTML = '<div class="empty-state"><h4>Server 3 catalog empty</h4><p>Admin must run <b>Sync Server 3</b> first. Do not use Server 1 data here.</p><button type="button" class="btn btn-primary" style="margin-top:12px;width:auto;padding:10px 16px" onclick="loadServiceCatalog({force:true})">Retry</button></div>';
      return;
    }
    paintProgress();
    cacheSet(true);
  }catch(err){
    __smsCatalogLoading = false;
    console.error('loadServiceCatalog', err);
    if(serviceGrid && !(allServiceCatalog && allServiceCatalog.length)){
      serviceGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h4>Failed to load</h4><p>'+escapeHtml(err.message||String(err))+'</p><button type="button" class="btn btn-primary" style="margin-top:12px;width:auto;padding:10px 16px" onclick="loadServiceCatalog({force:true})">Retry</button></div>';
    }
  }
}

// Soft refresh after a complete cache — no skeleton, silent

  return;
}

// Search hits DB even while catalog is still filling
async function searchServicesInDb(q){
  q = String(q || '').trim();
  if(q.length < 2 || !sbClient) return;
  try{
    var res = await sbClient
      .from('number_services')
      .select('service_id, service_name, price, available_quantity, country_id, country_name')
      .eq('source', 'virtualsms')
      .eq('is_available', true)
      .ilike('service_name', '%' + q + '%')
      .gt('price', 0)
      .limit(150);
    if(res.error || !(res.data && res.data.length)){
      res = await sbClient
        .from('number_services')
        .select('service_id, service_name, price, available_quantity, country_id, country_name')
        .eq('source', 'virtualsms')
        .eq('is_available', true)
        .ilike('service_name', '%' + q + '%')
        .limit(150);
    }
    var rows = (res && res.data) || [];
    if(!rows.length) return;
    var map = new Map();
    (allServiceCatalog || []).forEach(function(s){ if(s && s.key) map.set(s.key, s); });
    rows.forEach(function(row){
      var name = String(row.service_name || row.service_id || '').replace(/_/g,' ').trim();
      if(!name) return;
      var key = name.toLowerCase();
      if(!map.has(key)) map.set(key, { service_id: row.service_id, service_name: name, key: key });
      if(!serviceCountryIndex[key]) serviceCountryIndex[key] = [];
      var exists = serviceCountryIndex[key].some(function(x){ return String(x.country_id) === String(row.country_id); });
      if(!exists){
        serviceCountryIndex[key].push({
          country_id: row.country_id,
          country_name: row.country_name || ('Country ' + row.country_id),
          price: row.price,
          available_quantity: row.available_quantity,
          service_id: row.service_id,
          service_name: name
        });
      }
    });
    allServiceCatalog = Array.from(map.values()).sort(function(a,b){
      var ra = popularRank(a.service_name), rb = popularRank(b.service_name);
      if(ra !== rb) return ra - rb;
      return a.service_name.localeCompare(b.service_name);
    });
    // Only update UI if search box still has same query
    var currentQ = (serviceSearch && serviceSearch.value || '').trim().toLowerCase();
    if(currentQ === q.toLowerCase()) renderServiceCatalog(allServiceCatalog, currentQ);
  }catch(e){ console.warn('searchServicesInDb', e); }
}

var SERVICE_GRID_DEFAULT_CAP = 120;

function renderServiceCatalog(list, searchQ){
  var q = (searchQ != null ? searchQ : (serviceSearch && serviceSearch.value) || '').trim().toLowerCase();
  var filtered = (list || []).filter(function(s){
    var name = s.service_name || '';
    if(isAnyOtherService(name)) return false; // inject separately when needed
    if(isJunkService(name)){
      if(q && name.toLowerCase().includes(q) && q.length >= 2) return true;
      return false;
    }
    if(q) return name.toLowerCase().includes(q);
    return true;
  });
  // When user searches for something we don't list, offer "Any other"
  if(q){
    var anyOther = findAnyOtherService(list);
    var hasRealMatch = filtered.some(function(s){
      var n = String(s.service_name || '').toLowerCase();
      return n === q || n.indexOf(q) === 0 || n.split(/\s|\/|-/).indexOf(q) !== -1;
    });
    if(anyOther && (!filtered.length || !hasRealMatch)){
      // Put Any other first so it's obvious
      filtered = [anyOther].concat(filtered.filter(function(s){ return !isAnyOtherService(s.service_name); }));
    } else if(anyOther && filtered.length && !filtered.some(function(s){ return isAnyOtherService(s.service_name); }) && q.length >= 2 && !hasRealMatch){
      filtered = [anyOther].concat(filtered);
    }
  }
  var matchedTotal = filtered.length;
  // Default grid: popular-first and capped so the page paints instantly — "Show all" reveals the rest
  var capped = false;
  if(!q && !__showAllServices && filtered.length > SERVICE_GRID_DEFAULT_CAP){
    filtered = filtered.slice(0, SERVICE_GRID_DEFAULT_CAP);
    capped = true;
  }
  if(!filtered.length){
    var fallback = q ? findAnyOtherService(list) : null;
    if(fallback){
      filtered = [fallback];
    } else {
      serviceGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📵</div><h4>No Services Found</h4><p>Try a different search</p></div>';
      if(serviceCountBadge) serviceCountBadge.innerHTML = '';
      serviceGrid.dataset.skelReady = '1';
      serviceGrid.dataset.loaded = '1';
      return;
    }
  }
  if(serviceCountBadge){
    serviceCountBadge.innerHTML = '<span class="product-count-badge">' + (capped ? ('Top ' + filtered.length + ' of ' + matchedTotal) : (filtered.length + ' service' + (filtered.length!==1?'s':''))) + (__smsCatalogComplete ? '' : ' · loading more…') + '</span>';
  }
  var html = '<div class="svc-icon-grid">';
  filtered.forEach(function(s){
    var name = s.service_name || 'Service';
    var iconHtml = serviceLogoHtml(name);
    html += '<button type="button" class="svc-tile" data-key="'+escapeHtml(s.key || name.toLowerCase())+'">'+iconHtml+'<span class="svc-label">'+escapeHtml(name)+'</span></button>';
  });
  html += '</div>';
  if(capped){
    html += '<div class="show-all-wrap"><button type="button" class="show-all-btn" id="showAllServicesBtn">Show all ' + matchedTotal + ' services</button></div>';
  }
  serviceGrid.innerHTML = html;
  // Prevent global skeleton paint() from wiping real tiles
  serviceGrid.dataset.skelReady = '1';
  serviceGrid.dataset.loaded = '1';
  serviceGrid.querySelectorAll('.svc-tile').forEach(function(btn){
    btn.addEventListener('click', function(){
      var key = btn.getAttribute('data-key');
      var svc = (list || []).find(function(x){ return (x.key || (x.service_name||'').toLowerCase()) === key; });
      if(svc) selectService(svc);
    });
  });
  var showAllBtn = document.getElementById('showAllServicesBtn');
  if(showAllBtn){
    showAllBtn.addEventListener('click', function(){
      __showAllServices = true;
      renderServiceCatalog(allServiceCatalog, (serviceSearch && serviceSearch.value || '').trim().toLowerCase());
    });
  }
}

async function selectService(svc){
  currentServicePick = svc;
  currentCountry = null;
  activeService = null;
  serviceStep.style.display = 'none';
  countryStep.style.display = 'block';
  const fa = serviceIconFa(svc.service_name);
  const logo = serviceLogo(svc.service_name);
  const nameEl = document.getElementById('selectedServiceName');
  nameEl.innerHTML = '';
  const mini = document.createElement('span');
  mini.className = 'mini-icon';
  if(logo){
    mini.style.background = '#fff';
    mini.style.padding = '2px';
    mini.style.overflow = 'hidden';
    const im = document.createElement('img');
    im.src = logo;
    im.alt = '';
    im.style.cssText = 'width:100%;height:100%;object-fit:contain';
    im.onerror = function(){
      mini.innerHTML = '';
      if(fa){ mini.style.background = fa.color; mini.innerHTML = '<i class="'+fa.cls+'"></i>'; }
    };
    mini.appendChild(im);
  } else if(fa){
    mini.style.background = fa.color;
    mini.innerHTML = '<i class="'+fa.cls+'"></i>';
  }
  nameEl.appendChild(mini);
  nameEl.appendChild(document.createTextNode(svc.service_name || ''));

  countrySearch.value = '';
  countryList.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><div class="loading-text">Loading all countries…</div></div>';

  const key = (svc.key || svc.service_name || '').toLowerCase();
  let rows = (serviceCountryIndex[key] || []).slice();

  // Always refresh from DB so every country for this service is included (not just the bulk page sample)
  try{
    if(!sbClient) await loadServiceCatalog();
    // one service has at most a few hundred countries, but page anyway so nothing is ever cut at 1000
    const pageSize = 1000;
    let fetched = [];
    for(let from = 0; from < 10000; from += pageSize){
      let res = await sbClient
        .from('number_services')
        .select('service_id, service_name, country_id, country_name, price, available_quantity, providers_raw, supplier_price, pool_price_overrides')
        .eq('source', 'virtualsms')
        .eq('is_available', true)
        .eq('service_id', svc.service_id)
        .gt('price', 0)
        .order('price', { ascending: true })
        .range(from, from + pageSize - 1);
      if(res.error) break;
      fetched = fetched.concat(res.data || []);
      if(!res.data || res.data.length < pageSize) break;
    }
    if(!fetched.length && svc.service_name){
      const res2 = await sbClient
        .from('number_services')
        .select('service_id, service_name, country_id, country_name, price, available_quantity, providers_raw, supplier_price, pool_price_overrides')
        .eq('source', 'virtualsms')
        .eq('is_available', true)
        .ilike('service_name', svc.service_name)
        .gt('price', 0)
        .order('price', { ascending: true })
        .range(0, 999);
      fetched = res2.data || [];
    }
    if(fetched.length){
      rows = fetched.map(r => ({
        country_id: r.country_id,
        country_name: r.country_name || ('Country ' + r.country_id),
        price: r.price,
        available_quantity: r.available_quantity,
        service_id: r.service_id,
        service_name: r.service_name || svc.service_name,
        providers_raw: r.providers_raw || null,
        pool_price_overrides: r.pool_price_overrides || null,
        supplier_price: r.supplier_price
      }));
      serviceCountryIndex[key] = rows;
    }
  }catch(e){ console.warn('country refresh', e); }

  const byC = new Map();
  rows.forEach(c => {
    const id = String(c.country_id);
    if(!byC.has(id) || Number(c.price) < Number(byC.get(id).price)) byC.set(id, c);
  });
  allCountries = Array.from(byC.values()).sort((a,b) => Number(a.price) - Number(b.price));
  renderCountryPrices(allCountries);
}

function renderCountryPrices(list){
  if(!list.length){
    var searching = (countrySearch && countrySearch.value || '').trim().length > 0;
    countryList.innerHTML = searching
      ? '<div class="empty-state"><h4>No country matches that</h4><p>Check the spelling or clear the search</p></div>'
      : '<div class="empty-state"><h4>No countries for this service</h4><p>Try another service</p></div>';
    return;
  }
  countryList.innerHTML = list.map(function(c,i){
    var pools = providersToPoolOptions(c.providers_raw, c.pool_price_overrides);
    var showPrice = c.price;
    if(pools.length){
      showPrice = Math.min.apply(null, pools.map(function(p){ return p.price_ngn; }));
    }
    var extra = pools.length > 1 ? (' · ' + pools.length + ' pools') : '';
    return '<div class="country-price-row" data-index="'+i+'"><div class="left"><span class="flag">'+countryFlag(c.country_name, c.country_id)+'</span><span class="cname">'+escapeHtml(c.country_name)+extra+'</span></div><div class="right"><span class="cprice">from '+money(showPrice)+'</span><span class="chev"><i class="fa-solid fa-chevron-right"></i></span></div></div>';
  }).join('');
  countryList.querySelectorAll('.country-price-row').forEach(function(row){
    row.addEventListener('click', function(){
      var c = list[Number(row.getAttribute('data-index'))];
      if(!c) return;
      currentCountry = { country_id: c.country_id, country_name: c.country_name };
      selectedProviderId = null;
      var pools = providersToPoolOptions(c.providers_raw, c.pool_price_overrides);
      if(pools.length > 1){
        openPoolStep(c, pools);
      } else {
        if(pools.length === 1) selectedProviderId = pools[0].provider_id;
        openPurchaseModal({
          service_id: c.service_id,
          service_name: c.service_name || (currentServicePick && currentServicePick.service_name),
          price: pools.length === 1 ? pools[0].price_ngn : c.price,
          available_quantity: pools.length === 1 ? pools[0].count : c.available_quantity,
          provider_id: selectedProviderId
        });
      }
    });
  });
}

        available_quantity: p.count,
        provider_id: p.provider_id
      });
    });
  });
}

function openPurchaseModal(s){
  activeService = s;
  if(s && s.provider_id) selectedProviderId = s.provider_id;

  const name = (s.service_name || s.service_id || 'Service').replace(/_/g,' ');
  const icon = serviceIconFa(name);
  const iconEl = document.getElementById('psIcon');
  const logo = serviceLogo(name);
  if(logo){
    iconEl.style.background = '#fff';
    iconEl.innerHTML = '';
    var im = document.createElement('img');
    im.src = logo;
    im.alt = '';
    im.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:12px;padding:6px';
    im.onerror = function(){
      iconEl.innerHTML = '';
      if(icon){ iconEl.style.background = icon.color; iconEl.innerHTML = '<i class="'+icon.cls+'"></i>'; }
      else { iconEl.style.background = '#1877f2'; iconEl.textContent = (name.charAt(0)||'M').toUpperCase(); }
    };
    iconEl.appendChild(im);
  } else if(icon){
    iconEl.innerHTML = '<i class="'+icon.cls+'"></i>';
    iconEl.style.background = icon.color;
  } else {
    iconEl.textContent = (name.charAt(0)||'M').toUpperCase();
    iconEl.style.background = '#1877f2';
  }
  document.getElementById('psName').textContent = name;
  document.getElementById('psUnitPrice').textContent = money(s.price);
  document.getElementById('psStock').textContent = (s.available_quantity ?? '—') + ' available';
  document.getElementById('psCountry').innerHTML = '<span class="flag">'+countryFlag(currentCountry.country_name, currentCountry.country_id)+'</span>'+escapeHtml(currentCountry.country_name);
  document.getElementById('psTotal').textContent = money(s.price);
  window.__mjSmsBuyId = null;
  document.getElementById('purchaseModal').classList.add('active');
}
function closePurchaseModal(){
  document.getElementById('purchaseModal').classList.remove('active');
  activeService = null;

document.getElementById('psBuyBtn').addEventListener('click', async function(){
  if(!activeService || !currentCountry || isBuying) return;
  if(!currentUserId){
    showToast('Please sign in to buy a number','error');
    setTimeout(() => window.location.href = 'auth.html', 900);
    return;
  }
  // Lock immediately — before any await — so rapid taps cannot start a second buy
  isBuying = true;
  const btn = this;
  btn.disabled = true;
  const originalLabel = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Purchasing...';

  const price = parseFloat(activeService.price) || 0;
  // Stable id for this confirmation attempt (reused if network retries)
  if(!window.__mjSmsBuyId){
    window.__mjSmsBuyId = 'MJ-GZ-' + Date.now() + '-' + Math.random().toString(36).slice(2,9);
  }
  const externalOrderId = window.__mjSmsBuyId;

  try{
    const balCheck = await refreshBalance();
    if(!balCheck.ok){
      showToast('Could not verify your balance: ' + balCheck.reason, 'error');
      isBuying = false; btn.disabled = false; btn.innerHTML = originalLabel;
      return;
    }
    if(currentBalanceNgn < price){
      showToast('Insufficient balance. Redirecting to deposit...', 'error');
      isBuying = false; btn.disabled = false; btn.innerHTML = originalLabel;
      setTimeout(() => window.location.href = 'deposit.html', 900);
      return;
    }

    const res = await fetch('/api/grizzly-sync?action=order&provider=virtualsms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        country_id: currentCountry.country_id,
        service_id: activeService.service_id,
        provider: 'virtualsms', user_id: currentUserId,
        external_order_id: externalOrderId,
        provider_id: selectedProviderId || activeService.provider_id || undefined
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      showToast(data.message || 'Purchase failed. Please try again.', 'error');
      window.__mjSmsBuyId = null;
      isBuying = false; btn.disabled = false; btn.innerHTML = originalLabel;
      return;
    }
    // Success: keep locked and navigate — do not re-enable (prevents second buy)
    showToast('Number purchased! Redirecting…', 'success');
    const oid = data.data && data.data.order_id;
    setTimeout(() => {
      window.location.href = 'mj-sms-number.html?order_id=' + encodeURIComponent(oid);
    }, 500);
  }catch(err){
    showToast('Network error: ' + (err.message || err), 'error');
    window.__mjSmsBuyId = null;
    isBuying = false; btn.disabled = false; btn.innerHTML = originalLabel;
  }
});

(async function bootSms(){
  // Start catalog ASAP; session/balance in parallel (smoother first paint)
  try {
    if(!window.supabase) throw new Error('Supabase not loaded');
    if(!sbClient){
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
      });
    }
  } catch(e){ console.warn(e); }
  var catalogP = loadServiceCatalog().catch(function(e){
    console.error(e);
    if(serviceGrid && !(allServiceCatalog && allServiceCatalog.length)){
      serviceGrid.innerHTML = '<div class="empty-state"><h4>Failed to load</h4><p>'+escapeHtml(e.message||String(e))+'</p></div>';
    }
  });
  try { await initSession(); } catch(e){ console.warn(e); }
  await catalogP;
})();

serviceSearch.addEventListener('input', () => {
  const q = serviceSearch.value.trim().toLowerCase();
  // 1) Instant filter from local / memory cache
  renderServiceCatalog(allServiceCatalog, q);
  clearTimeout(__smsSearchTimer);
  if(q.length < 2) return;
  // 2) Only hit DB if local has no matches for this query
  var localHits = (allServiceCatalog || []).filter(function(s){
    var name = (s.service_name || '').toLowerCase();
    if(isJunkService(s.service_name || '') && !name.includes(q)) return false;
    return name.includes(q);
  });
  if(localHits.length > 0) return; // already available locally
  __smsSearchTimer = setTimeout(function(){ searchServicesInDb(q); }, 200);
});
countrySearch.addEventListener('input', () => {
  const q = countrySearch.value.trim();
  renderCountryPrices(q ? allCountries.filter(c => countryMatchesQuery(c.country_name, q)) : allCountries);
});

<script>
(function(){
  function paint(){
    if(!window.mjSkeleton && !window.MJSkeleton) return;
    var mjSkeleton = window.mjSkeleton || window.MJSkeleton;
    var nodes = document.querySelectorAll('[data-skel], #countryList, #serviceGrid, #list, #catalog, #servicesGrid, #productsGrid, #orderList');
    nodes.forEach(function(el){
      if(el.dataset.skelReady || el.dataset.loaded === '1') return;
      if(el.id === 'serviceGrid'){
        // Do not wipe if tiles or catalog already present
        if(el.querySelector('.svc-icon-grid') || el.querySelector('.svc-tile') || (typeof allServiceCatalog !== 'undefined' && allServiceCatalog && allServiceCatalog.length)){
          el.dataset.skelReady = '1';
          el.dataset.loaded = '1';
          return;
        }
        if(typeof serviceCatalogSkeleton === 'function') el.innerHTML = serviceCatalogSkeleton();
        el.dataset.skelReady = '1';
        return;
      }
      if(el.id === 'countryList'){ el.dataset.skelReady = '1'; return; }
      var type = el.getAttribute('data-skel') || (el.id && /list|order/i.test(el.id) ? 'cards' : 'grid');
      el.innerHTML = (mjSkeleton[type] || mjSkeleton.grid)(type === 'cards' ? 3 : 6);
      el.dataset.skelReady = '1';
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);
  else paint();
  // retry once scripts loaded
  setTimeout(paint, 50);
})();
</script>
