<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vendor portal | MJ HUB</title>
<style>
:root{--bg:#06080f;--card:#0f1524;--text:#e8eefc;--muted:#94a3b8;--primary:#3b82f6;--border:rgba(148,163,184,.14);--danger:#f87171;--ok:#34d399}
html[data-theme=light]{--bg:#f4f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:rgba(15,23,42,.1)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.35rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:16px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.25rem;color:var(--primary)}
.stat span{font-size:.75rem;color:var(--muted)}
label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
input,textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px}
button{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
button:disabled{opacity:.6;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.err{color:var(--danger);font-size:.9rem;margin-top:8px}
.ok{color:var(--ok);font-size:.9rem;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:8px;border-bottom:1px solid var(--border);text-align:left}
.auth-box{max-width:400px;margin:40px auto}
.brand{text-align:center;margin-bottom:18px}
.brand h1{font-size:1.5rem}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--muted);padding:6px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

  <div id="authScreen" class="auth-box">
    <div class="brand">
      <h1>Vendor portal</h1>
      <p class="sub">Sign in with the account the main admin assigned as sub-admin.</p>
    </div>
    <div class="card">
      <form id="signinForm">
        <label>Email</label>
        <input type="email" id="authEmail" required autocomplete="username" placeholder="you@email.com"/>
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="authPassword" required autocomplete="current-password" placeholder="Password"/>
          <button type="button" class="pw-toggle" id="togglePw" aria-label="Show password">👁</button>
        </div>
        <div class="row" style="margin-top:16px">
          <button type="submit" id="authBtn" style="width:100%">Sign in</button>
        </div>
        <p id="authMsg" class="err" style="display:none"></p>
      </form>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="topbar">
      <div>
        <h1>Vendor portal</h1>
        <p class="sub" style="margin:0" id="whoami"></p>
      </div>
      <button type="button" class="ghost" id="signOutBtn">Sign out</button>
    </div>
    <div class="stats" id="stats"></div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin:0 0 4px">Your products</h3>
      <div id="plist"></div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 6px" id="formTitle">Add product</h3>
      <p class="sub">One form: product details + stock. Paste one account per line. Qty 3 gives 3 different lines; sold lines are not resold.</p>
      <input type="hidden" id="editId"/>
      <input type="hidden" id="editKey"/>

      <label>Name</label>
      <input id="pname" placeholder="Product name"/>

      <label>Price (₦)</label>
      <input id="pprice" type="number" min="0" step="50" placeholder="3000"/>

      <label>Category</label>
      <select id="pcat"><option value="">Loading categories…</option></select>
      <p class="sub" style="margin-top:6px">Existing site categories only.</p>

      <label>Login format (optional hint for buyers)</label>
      <input id="pformat" placeholder="e.g. Username:pass:2fa:email:emailpass"/>

      <label>Credentials — one account per line</label>
      <textarea id="pcreds" rows="8" placeholder="user1:pass1:token1&#10;user2:pass2:token2&#10;user3:pass3:token3"></textarea>
      <p class="sub" id="stockHint" style="margin-top:6px"></p>

      <div class="row">
        <button type="button" id="saveBtn">Save product</button>
        <button type="button" class="ghost" id="resetBtn">Clear form</button>
      </div>
      <p id="msg"></p>
    </div>

    <div class="card">
      <h3 style="margin:0 0 8px">Recent sales</h3>
      <div id="sales"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage }
});

function esc(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(n){ return '₦' + Number(n||0).toLocaleString(); }

function showAuth(msg){
  document.getElementById('authScreen').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  const m = document.getElementById('authMsg');
  if (msg) { m.style.display = 'block'; m.textContent = msg; m.className = 'err'; }
  else { m.style.display = 'none'; m.textContent = ''; }
}
function showApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

async function api(body) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('Please sign in');
  const res = await fetch('/api/admin', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + session.access_token
    },
    body: JSON.stringify(body)
  });
  const json = await res.json().catch(()=>({}));
  if (!json.success) throw new Error(json.message || 'Request failed');
  return json;
}

async function loadCategories() {
  const sel = document.getElementById('pcat');
  if (!sel) return;
  try {
    const res = await api({ resource: 'vendor', action: 'categories' });
    const list = res.data || [];
    if (!list.length) {
      sel.innerHTML = '<option value="MANUAL">MANUAL</option>';
      return;
    }
    sel.innerHTML = list.map(c => '<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
  } catch (e) {
    sel.innerHTML = '<option value="MANUAL">MANUAL</option>';
  }
}

async function refresh() {
  const st = await api({ resource: 'vendor', action: 'stats' });
  const d = st.data || {};
  document.getElementById('stats').innerHTML =
    '<div class="stat"><b>'+(d.products||0)+'</b><span>Products</span></div>'+
    '<div class="stat"><b>'+(d.orders||0)+'</b><span>Orders</span></div>'+
    '<div class="stat"><b>'+money(d.revenue_ngn)+'</b><span>Revenue</span></div>';

  const sales = d.recent_orders || [];
  document.getElementById('sales').innerHTML = sales.length
    ? '<table><tr><th>Product</th><th>Qty</th><th>Amount</th><th>Date</th></tr>'+
      sales.map(o=>'<tr><td>'+esc(o.product_name)+'</td><td>'+o.quantity+'</td><td>'+money(o.amount)+'</td><td>'+esc((o.created_at||'').slice(0,16))+'</td></tr>').join('')+
      '</table>'
    : '<p class="sub">No sales yet.</p>';

  const pr = await api({ resource: 'vendor', action: 'products' });
  const list = pr.data || [];
  document.getElementById('plist').innerHTML = list.length
    ? '<table><tr><th>Name</th><th>Price</th><th>Stock</th><th></th></tr>'+
      list.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+money(p.price)+'</td><td>'+(p.stock_quantity!=null?p.stock_quantity:'—')+'</td><td><button type="button" class="ghost" data-edit="'+encodeURIComponent(JSON.stringify(p))+'">Edit</button></td></tr>').join('')+
      '</table>'
    : '<p class="sub">No products yet. Use the form below.</p>';

  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = async ()=>{
      const p = JSON.parse(decodeURIComponent(btn.getAttribute('data-edit')));
      document.getElementById('formTitle').textContent = 'Edit product';
      document.getElementById('editId').value = p.id || '';
      document.getElementById('editKey').value = p.product_key || '';
      document.getElementById('pname').value = p.name || '';
      document.getElementById('pprice').value = p.price || '';
      document.getElementById('pformat').value = p.display_description || p.description || '';
      document.getElementById('pcreds').value = '';
      document.getElementById('pcreds').placeholder = 'Paste NEW accounts to add to stock (one per line). Leave empty to only update details.';
      const sel = document.getElementById('pcat');
      const cat = p.category || '';
      if (cat && ![...sel.options].some(o => o.value === cat)) {
        const opt = document.createElement('option');
        opt.value = cat; opt.textContent = cat;
        sel.appendChild(opt);
      }
      if (cat) sel.value = cat;
      document.getElementById('stockHint').textContent = 'Current stock on product: ' + (p.stock_quantity != null ? p.stock_quantity : '—') + '. New lines below are added to inventory.';
      try {
        if (p.product_key) {
          const inv = await api({
            resource: 'vendor', action: 'inventory',
            inventory_action: 'stock_count', product_key: p.product_key
          });
          const x = inv.data || {};
          document.getElementById('stockHint').textContent =
            'Available: ' + (x.available||0) + ' · Sold: ' + (x.sold||0) + '. Paste more lines below to add stock.';
        }
      } catch (_) {}
      window.scrollTo({ top: document.getElementById('formTitle').offsetTop - 20, behavior: 'smooth' });
    };
  });
}

async function enterPortal() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showAuth(); return; }
  try {
    await loadCategories();
    await refresh();
    const email = session.user && session.user.email;
    document.getElementById('whoami').textContent = email ? ('Signed in as ' + email) : 'Signed in';
    showApp();
  } catch (e) {
    await sb.auth.signOut();
    showAuth(((e && e.message) || 'Access denied') + ' — Ask main admin to assign you as sub-admin.');
  }
}

document.getElementById('signinForm').onsubmit = async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('authBtn');
  const msg = document.getElementById('authMsg');
  msg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (!data.session) throw new Error('Sign in failed');
    await enterPortal();
  } catch (err) {
    msg.style.display = 'block';
    msg.className = 'err';
    msg.textContent = err.message || 'Sign in failed';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
};

document.getElementById('togglePw').onclick = ()=>{
  const i = document.getElementById('authPassword');
  i.type = i.type === 'password' ? 'text' : 'password';
};

document.getElementById('signOutBtn').onclick = async ()=>{
  await sb.auth.signOut();
  showAuth();
};

document.getElementById('saveBtn').onclick = async ()=>{
  const msg = document.getElementById('msg');
  msg.className = '';
  msg.textContent = 'Saving…';
  const name = document.getElementById('pname').value.trim();
  const price = document.getElementById('pprice').value;
  const category = document.getElementById('pcat').value;
  const format = document.getElementById('pformat').value.trim();
  const creds = document.getElementById('pcreds').value;
  const editId = document.getElementById('editId').value;
  let productKey = document.getElementById('editKey').value;

  try {
    if (!name) throw new Error('Enter a product name');
    if (!price || Number(price) < 0) throw new Error('Enter a valid price');

    // 1) Save product details
    const saved = await api({
      resource: 'vendor',
      action: 'product_save',
      id: editId || undefined,
      fields: {
        name,
        price,
        category,
        display_description: format || null,
        description: format || null,
        is_available: true
      }
    });

    const product = saved.data || {};
    productKey = product.product_key || productKey;
    if (!productKey) throw new Error('Product saved but no product_key returned');

    // 2) If credentials pasted, upload inventory in same action
    let invNote = '';
    const lines = creds.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length) {
      const inv = await api({
        resource: 'vendor',
        action: 'inventory',
        inventory_action: 'bulk_upload',
        product_key: productKey,
        text: creds
      });
      const d = inv.data || {};
      invNote = ' · Stock +' + (d.inserted||0) + ' (available ' + (d.available_stock||0) + ')';
    }

    msg.className = 'ok';
    msg.textContent = 'Saved' + invNote;
    document.getElementById('resetBtn').click();
    await refresh();
  } catch (e) {
    msg.className = 'err';
    msg.textContent = e.message || 'Failed';
  }
};

document.getElementById('resetBtn').onclick = ()=>{
  document.getElementById('formTitle').textContent = 'Add product';
  document.getElementById('editId').value = '';
  document.getElementById('editKey').value = '';
  document.getElementById('pname').value = '';
  document.getElementById('pprice').value = '';
  document.getElementById('pformat').value = '';
  document.getElementById('pcreds').value = '';
  document.getElementById('pcreds').placeholder = 'user1:pass1:token1\nuser2:pass2:token2\nuser3:pass3:token3';
  document.getElementById('stockHint').textContent = '';
  document.getElementById('msg').textContent = '';
  const sel = document.getElementById('pcat');
  if (sel && sel.options.length) sel.selectedIndex = 0;
};

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) await enterPortal();
  else showAuth();
})();
</script>
</body>
</html>
