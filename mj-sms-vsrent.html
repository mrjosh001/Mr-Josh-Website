<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.header,main{position:relative;z-index:1}
.header{padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}

h1{font-size:18px;font-weight:800;letter-spacing:-.025em}

.intro{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 14px}

<header class="header"><a class="back" href="dashboard.html" aria-label="Back to dashboard"><i class="fa-solid fa-arrow-left"></i></a><h1>MJ SMS</h1><a class="hist" href="mj-sms-history.html?view=rent"><i class="fa-solid fa-clock-rotate-left"></i> My numbers</a></header>

<p class="intro">Choose a service, country and rental duration.</p>
<section class="card" id="serviceStep"><h2>1. Choose a service</h2><p class="sub">Available services and countries are updated automatically.</p><input class="search" id="serviceSearch" placeholder="Search services"><div class="grid" id="services"><div class="empty">Loading live rental catalogue…</div></div></section>

<div class="message hidden" id="message"></div><div class="err" id="error"></div>
</main>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}});
const $=id=>document.getElementById(id);
let plans=[],services=[],selectedService=null,selectedCountry=null,selectedPlan=null,busy=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return '₦'+Number(v||0).toLocaleString('en-NG');}
const SERVICE_DOMAIN={whatsapp:'whatsapp.com',telegram:'telegram.org',facebook:'facebook.com',instagram:'instagram.com',tiktok:'tiktok.com',twitter:'x.com',x:'x.com',google:'google.com',gmail:'gmail.com',discord:'discord.com',snapchat:'snapchat.com',linkedin:'linkedin.com',pinterest:'pinterest.com',reddit:'reddit.com',spotify:'spotify.com',uber:'uber.com',airbnb:'airbnb.com',amazon:'amazon.com',apple:'apple.com',microsoft:'microsoft.com',paypal:'paypal.com'};
const SERVICE_ICON_MAP=[['whatsapp','fa-brands fa-whatsapp','#25D366'],['telegram','fa-brands fa-telegram','#26A5E4'],['facebook','fa-brands fa-facebook-f','#1877F2'],['instagram','fa-brands fa-instagram','#E1306C'],['tiktok','fa-brands fa-tiktok','#000000'],['twitter','fa-brands fa-x-twitter','#000000'],['google','fa-brands fa-google','#4285F4'],['discord','fa-brands fa-discord','#5865F2'],['amazon','fa-brands fa-amazon','#FF9900'],['apple','fa-brands fa-apple','#000000'],['microsoft','fa-brands fa-microsoft','#00A4EF'],['paypal','fa-brands fa-paypal','#003087'],['airbnb','fa-brands fa-airbnb','#FF5A5F'],['spotify','fa-brands fa-spotify','#1DB954']];
function serviceDomain(name){const n=String(name||'').toLowerCase().trim();if(SERVICE_DOMAIN[n])return SERVICE_DOMAIN[n];const keys=Object.keys(SERVICE_DOMAIN).sort((a,b)=>b.length-a.length);for(const key of keys){if(key.length>1&&(n===key||(key.length>=4&&n.includes(key))))return SERVICE_DOMAIN[key];}if(!n||n.length<=2||/^[a-z0-9]{1,3}$/.test(n))return null;const slug=n.replace(/[^a-z0-9]+/g,' ').trim().split(/\\s+/)[0];return slug&&slug.length>=4?slug+'.com':null;}
function serviceLogoHtml(name){const n=String(name||'').toLowerCase();const domain=serviceDomain(name);let icon=null;for(const row of SERVICE_ICON_MAP){if(n.includes(row[0])){icon=row;break;}}const bg=icon?icon[2]:'#3b82f6';const fa=icon?icon[1]:'fa-solid fa-mobile-screen';const fallback='<span class="service-icon" style="background:'+bg+'"><i class="'+fa+'"></i></span>';if(!domain)return fallback;const url='https://www.google.com/s2/favicons?domain='+encodeURIComponent(domain)+'&sz=128';return '<span class="svc-icon-wrap"><img class="svc-logo" src="'+url+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">'+fallback+'</span>';}
function flag(code){const iso=String(code||'').toLowerCase();if(!/^[a-z]{2}$/.test(iso))return '<span class="country-flag-fallback">🌍</span>';const emoji=String.fromCodePoint(...iso.toUpperCase().split('').map(ch=>127397+ch.charCodeAt(0)));return '<img class="country-flag" src="https://flagcdn.com/w40/'+iso+'.png" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('+JSON.stringify(emoji)+'))">';}
function msg(text,isError){$('error').textContent=isError?text:'';$('message').textContent=isError?'':text;$('message').classList.toggle('hidden',isError||!text);}
async function authHeaders(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='auth.html';return null;}return{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'};}
async function api(action,opts){const h=await authHeaders();if(!h)return{success:false,message:'Sign in required'};opts=opts||{};const r=await fetch('/api/sms-bus?action=vsrent_'+encodeURIComponent(action)+(opts.query?'&'+opts.query:''),{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});const raw=await r.text();try{return raw?JSON.parse(raw):{};}catch(_){return{success:false,message:'Invalid server response'};}}
function renderServices(){const q=$('serviceSearch').value.trim().toLowerCase();const list=services.filter(s=>!q||(s.service_name+' '+s.service_id).toLowerCase().includes(q));$('services').innerHTML=list.length?list.map((s,i)=>'<button type="button" class="item service-item" data-i="'+i+'">'+serviceLogoHtml(s.service_name)+'<span class="name">'+esc(s.service_name)+'</span><span class="meta">'+s.country_count+' countries</span></button>').join(''):'<div class="empty">No matching services are currently available.</div>';Array.from($('services').querySelectorAll('[data-i]')).forEach(btn=>btn.addEventListener('click',()=>chooseService(list[Number(btn.dataset.i)])));}
function renderCountries(){const q=$('countrySearch').value.trim().toLowerCase();const list=plans.filter(p=>p.service_id===selectedService.service_id&&(!q||(p.country_name+' '+p.country_code).toLowerCase().includes(q)));const by=new Map();list.forEach(p=>{if(!by.has(p.country_code))by.set(p.country_code,p);});const countries=Array.from(by.values()).sort((a,b)=>a.country_name.localeCompare(b.country_name));$('countries').innerHTML=countries.length?countries.map((c,i)=>'<button type="button" class="item" data-code="'+esc(c.country_code)+'"><span class="name"><span aria-hidden="true" style="font-size:21px">'+flag(c.country_code)+'</span>'+esc(c.country_name)+'</span><span class="meta">'+list.filter(p=>p.country_code===c.country_code).length+' plans</span></button>').join(''):'<div class="empty">No plans are currently available for this service in this country.</div>';Array.from($('countries').querySelectorAll('[data-code]')).forEach(btn=>btn.addEventListener('click',()=>chooseCountry(btn.dataset.code)));}
function chooseService(service){selectedService=service;selectedCountry=null;selectedPlan=null;$('serviceStep').classList.add('hidden');$('countryStep').classList.remove('hidden');$('planStep').classList.add('hidden');$('serviceContext').textContent=service.service_name;$('countrySearch').value='';renderCountries();}
function chooseCountry(code){selectedCountry=plans.find(p=>p.service_id===selectedService.service_id&&p.country_code===code);selectedPlan=null;$('countryStep').classList.add('hidden');$('planStep').classList.remove('hidden');$('planContext').textContent=selectedService.service_name+' · '+flag(code)+' '+selectedCountry.country_name;renderPlans();}
function renderPlans(){const list=plans.filter(p=>p.service_id===selectedService.service_id&&p.country_code===selectedCountry.country_code).sort((a,b)=>a.duration_hours-b.duration_hours);$('plans').innerHTML=list.map((p,i)=>'<button type="button" class="item" data-i="'+i+'"><span class="name">'+esc(p.duration_label)+'</span><span class="meta">MJ HUB number rental</span><span class="price">'+money(p.price_ngn)+'</span></button>').join('');Array.from($('plans').querySelectorAll('[data-i]')).forEach(btn=>btn.addEventListener('click',()=>{selectedPlan=list[Number(btn.dataset.i)];Array.from($('plans').querySelectorAll('.item')).forEach(x=>x.style.borderColor='var(--border)');btn.style.borderColor='var(--primary)';$('buyBtn').classList.remove('hidden');$('selectedPrice').textContent=selectedPlan.country_name+' · '+selectedService.service_name+' · '+selectedPlan.duration_label+' · '+money(selectedPlan.price_ngn);}));}
const RENT_CACHE_KEY='mj_virtualsms_global_rental_catalog_v1';
const RENT_CACHE_TTL=7*24*60*60*1000;
function buildRentalServices(rows){const map=new Map();rows.forEach(p=>{const k=String(p.service_id||'');if(!k)return;if(!map.has(k))map.set(k,{service_id:k,service_name:p.service_name,country_count:0,countries:new Set()});map.get(k).countries.add(p.country_code);});return Array.from(map.values()).map(s=>({...s,country_count:s.countries.size})).sort((a,b)=>a.service_name.localeCompare(b.service_name));}
function applyRentalCatalog(rows){plans=rows.filter(p=>String(p.country_code||'').toUpperCase()!=='US'&&p.is_available===true&&p.availability_known===true);services=buildRentalServices(plans);renderServices();if(!plans.length)$('services').innerHTML='<div class="empty">No global rental plans are available right now. Please check again shortly.</div>';}
function readRentalCache(){try{const o=JSON.parse(localStorage.getItem(RENT_CACHE_KEY)||'null');return o&&Array.isArray(o.plans)&&o.plans.length&&Date.now()-Number(o.ts||0)<RENT_CACHE_TTL?o:null;}catch(_){return null;}}
function writeRentalCache(rows){try{localStorage.setItem(RENT_CACHE_KEY,JSON.stringify({ts:Date.now(),plans:rows}));}catch(e){console.warn('[MJ global rental cache] Could not save cache',e&&e.message||e);}}
async function load(){msg('',false);const cached=readRentalCache();if(cached){applyRentalCatalog(cached.plans);$('services').setAttribute('aria-busy','true');}else{$('services').innerHTML='<div class="empty">Loading live rental catalogue…</div>';}
try{const j=await api('catalog',{query:'scope=global'});if(!j.success||!Array.isArray(j.data)){if(!cached){msg(j.message||'Could not load global rental plans. Please try again.',true);$('services').innerHTML='<div class="empty">Catalogue unavailable.</div>';}else msg('Showing recently cached catalogue. Live refresh is temporarily unavailable.',false);return;}const fresh=j.data.filter(p=>String(p.country_code||'').toUpperCase()!=='US'&&p.is_available===true&&p.availability_known===true);applyRentalCatalog(fresh);writeRentalCache(fresh);$('services').removeAttribute('aria-busy');}catch(e){if(!cached){msg('Could not load rental catalogue: '+String(e.message||e),true);$('services').innerHTML='<div class="empty">Catalogue unavailable.</div>';}else msg('Showing recently cached catalogue. Live refresh is temporarily unavailable.',false);}}
$('serviceSearch').addEventListener('input',renderServices);$('countrySearch').addEventListener('input',renderCountries);$('backServices').onclick=()=>{$('countryStep').classList.add('hidden');$('serviceStep').classList.remove('hidden');};$('backCountries').onclick=()=>{$('planStep').classList.add('hidden');$('countryStep').classList.remove('hidden');};
$('buyBtn').onclick=async function(){if(busy||!selectedPlan)return;const h=await authHeaders();if(!h)return;const signature=[selectedPlan.country_code,selectedPlan.service_id,selectedPlan.duration_hours].join('|');let stored=null;try{stored=JSON.parse(sessionStorage.getItem('mj_virtualsms_global_rent_request')||'null');}catch(_){}if(stored&&stored.id&&stored.signature!==signature){msg('A previous rental is still being reconciled. Open Number History or contact support before starting another purchase.',true);return;}const requestId=stored&&stored.id?stored.id:((crypto.randomUUID&&crypto.randomUUID())||('mjvsg-'+Date.now()+'-'+Math.random().toString(36).slice(2)));try{sessionStorage.setItem('mj_virtualsms_global_rent_request',JSON.stringify({id:requestId,signature}));}catch(_){}busy=true;this.disabled=true;this.textContent='Processing…';msg('',false);let j;try{j=await api('order',{method:'POST',body:{service_id:selectedPlan.service_id,service_name:selectedService.service_name,duration_hours:selectedPlan.duration_hours,country_code:selectedPlan.country_code,quoted_price_ngn:selectedPlan.price_ngn,request_id:requestId}});}catch(e){busy=false;this.disabled=false;this.textContent='Rent this number';msg('We could not confirm the rental result yet. Do not submit another rental. Check Number History or contact support.',true);return;}busy=false;this.disabled=false;this.textContent='Rent this number';if(j.success&&j.data){try{sessionStorage.removeItem('mj_virtualsms_global_rent_request');}catch(_){}const id=j.data.order_id||j.data.rent_id;if(id){location.href='mj-sms-usa-number.html?rent_id='+encodeURIComponent(id)+'&source=virtualsms_rent';return;}msg('Rental created but its reference is missing. Check Number History before retrying.',true);return;}if(j.reconciliation_required){msg(j.message||'Purchase status is being checked. Do not retry.',true);return;}if(j.refunded===true){try{sessionStorage.removeItem('mj_virtualsms_global_rent_request');}catch(_){}}msg(j.message||'Could not complete this rental.',true);};
load().catch(e=>msg('Could not load rental catalogue: '+String(e.message||e),true));
})();
