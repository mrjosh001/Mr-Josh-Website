<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Number Rental · MJ HUB</title>
<script>(function(){try{var p=localStorage.getItem('mjhub-theme-pref')||localStorage.getItem('mjhub-theme')||localStorage.getItem('mjhub_theme')||localStorage.getItem('mjhub-theme')||'system';var t=(p==='light'||p==='dark')?p:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<script src="/js/mj-page-loader.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{--bg:#06080f;--card:#0f1524;--text:#f1f5f9;--muted:#8b9bb4;--border:rgba(148,163,184,.12);--primary:#5b8af5;--soft:rgba(91,138,245,.13);--bad:#f87171;--ok:#34d399}
:root[data-theme="light"]{--bg:#f4f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:rgba(15,23,42,.08);--primary:#2563eb;--soft:#eff6ff;--bad:#dc2626;--ok:#059669}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
.header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);display:grid;place-items:center;text-decoration:none}
h1{font-size:17px;margin:0;font-weight:800}.hist{margin-left:auto;color:var(--primary);font-size:12px;font-weight:800;text-decoration:none}
main{max-width:700px;margin:0 auto;padding:16px 16px 60px}.intro{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 6px}.sub{font-size:12px;color:var(--muted);margin:0 0 13px;line-height:1.45}
.search{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:600 14px inherit;margin:5px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.item{min-width:0;text-align:left;padding:13px;border:1px solid var(--border);border-radius:13px;background:var(--bg);color:var(--text);cursor:pointer;font:inherit}
.item:active{border-color:var(--primary);background:var(--soft)}
.name{display:block;font-size:13px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}.meta{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.price{display:block;color:var(--primary);font-size:14px;font-weight:800;margin-top:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--soft);border-radius:12px;margin:10px 0 12px;font-size:12px;font-weight:800;color:var(--primary)}
.bar button,.secondary{border:1px solid var(--primary);background:transparent;color:var(--primary);border-radius:9px;padding:7px 10px;font:700 11px inherit;cursor:pointer}
.primary{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;font:800 14px inherit;cursor:pointer;margin-top:12px}
.primary:disabled{opacity:.55;cursor:not-allowed}.empty,.message{padding:18px;text-align:center;border:1px dashed var(--border);border-radius:13px;color:var(--muted);font-size:12px;line-height:1.5}
.err{color:var(--bad);font-size:12px;margin-top:10px}.ok{color:var(--ok);font-size:12px;margin-top:10px}
.hidden{display:none!important}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="/css/graceful.css"><link rel="stylesheet" href="/css/mj-motion.css">
</head>
<body>
<header class="header"><a class="back" href="mj-sms-s3.html" aria-label="Back to Server 3"><i class="fa-solid fa-arrow-left"></i></a><h1>Global Rental</h1><a class="hist" href="mj-sms-history.html?view=rent">My numbers</a></header>
<main>
<p class="intro">Choose a service, country and rental duration. USA rentals remain under USA Real Number.</p>
<section class="card" id="serviceStep"><h2>1. Choose a service</h2><p class="sub">Available services and countries are updated automatically.</p><input class="search" id="serviceSearch" placeholder="Search services"><div class="grid" id="services"><div class="empty">Loading live rental catalogue…</div></div></section>
<section class="card hidden" id="countryStep"><h2>2. Choose a country</h2><div class="bar"><span id="serviceContext"></span><button type="button" id="backServices">Change</button></div><input class="search" id="countrySearch" placeholder="Search countries"><div class="grid" id="countries"></div></section>
<section class="card hidden" id="planStep"><h2>3. Choose a duration</h2><div class="bar"><span id="planContext"></span><button type="button" id="backCountries">Change</button></div><div class="grid" id="plans"></div><button type="button" class="primary hidden" id="buyBtn">Rent this number</button><div id="selectedPrice" class="sub" style="margin-top:8px;text-align:center"></div></section>
<div class="message hidden" id="message"></div><div class="err" id="error"></div>
</main>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}});
const $=id=>document.getElementById(id);
let plans=[],services=[],selectedService=null,selectedCountry=null,selectedPlan=null,busy=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return '₦'+Number(v||0).toLocaleString('en-NG');}
function flag(code){return /^[A-Z]{2}$/.test(String(code||''))?String.fromCodePoint(...String(code).split('').map(c=>127397+c.charCodeAt(0))):'🌍';}
function msg(text,isError){$('error').textContent=isError?text:'';$('message').textContent=isError?'':text;$('message').classList.toggle('hidden',isError||!text);}
async function authHeaders(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='auth.html';return null;}return{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'};}
async function api(action,opts){const h=await authHeaders();if(!h)return{success:false,message:'Sign in required'};opts=opts||{};const r=await fetch('/api/sms-bus?action=vsrent_'+encodeURIComponent(action)+(opts.query?'&'+opts.query:''),{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});const raw=await r.text();try{return raw?JSON.parse(raw):{};}catch(_){return{success:false,message:'Invalid server response'};}}
function renderServices(){const q=$('serviceSearch').value.trim().toLowerCase();const list=services.filter(s=>!q||(s.service_name+' '+s.service_id).toLowerCase().includes(q));$('services').innerHTML=list.length?list.map((s,i)=>'<button type="button" class="item" data-i="'+i+'"><span class="name">'+esc(s.service_name)+'</span><span class="meta">'+s.country_count+' countries available</span></button>').join(''):'<div class="empty">No matching services are currently available.</div>';Array.from($('services').querySelectorAll('[data-i]')).forEach(btn=>btn.addEventListener('click',()=>chooseService(list[Number(btn.dataset.i)])));}
function renderCountries(){const q=$('countrySearch').value.trim().toLowerCase();const list=plans.filter(p=>p.service_id===selectedService.service_id&&(!q||(p.country_name+' '+p.country_code).toLowerCase().includes(q)));const by=new Map();list.forEach(p=>{if(!by.has(p.country_code))by.set(p.country_code,p);});const countries=Array.from(by.values()).sort((a,b)=>a.country_name.localeCompare(b.country_name));$('countries').innerHTML=countries.length?countries.map((c,i)=>'<button type="button" class="item" data-code="'+esc(c.country_code)+'"><span class="name">'+flag(c.country_code)+' '+esc(c.country_name)+'</span><span class="meta">'+list.filter(p=>p.country_code===c.country_code).length+' rental plans</span></button>').join(''):'<div class="empty">No plans are currently available for this service in this country.</div>';Array.from($('countries').querySelectorAll('[data-code]')).forEach(btn=>btn.addEventListener('click',()=>chooseCountry(btn.dataset.code)));}
function chooseService(service){selectedService=service;selectedCountry=null;selectedPlan=null;$('serviceStep').classList.add('hidden');$('countryStep').classList.remove('hidden');$('planStep').classList.add('hidden');$('serviceContext').textContent=service.service_name;$('countrySearch').value='';renderCountries();}
function chooseCountry(code){selectedCountry=plans.find(p=>p.service_id===selectedService.service_id&&p.country_code===code);selectedPlan=null;$('countryStep').classList.add('hidden');$('planStep').classList.remove('hidden');$('planContext').textContent=selectedService.service_name+' · '+flag(code)+' '+selectedCountry.country_name;renderPlans();}
function renderPlans(){const list=plans.filter(p=>p.service_id===selectedService.service_id&&p.country_code===selectedCountry.country_code).sort((a,b)=>a.duration_hours-b.duration_hours);$('plans').innerHTML=list.map((p,i)=>'<button type="button" class="item" data-i="'+i+'"><span class="name">'+esc(p.duration_label)+'</span><span class="meta">MJ HUB number rental</span><span class="price">'+money(p.price_ngn)+'</span></button>').join('');Array.from($('plans').querySelectorAll('[data-i]')).forEach(btn=>btn.addEventListener('click',()=>{selectedPlan=list[Number(btn.dataset.i)];Array.from($('plans').querySelectorAll('.item')).forEach(x=>x.style.borderColor='var(--border)');btn.style.borderColor='var(--primary)';$('buyBtn').classList.remove('hidden');$('selectedPrice').textContent=selectedPlan.country_name+' · '+selectedService.service_name+' · '+selectedPlan.duration_label+' · '+money(selectedPlan.price_ngn);}));}
async function load(){msg('',false);$('services').innerHTML='<div class="empty">Loading live rental catalogue…</div>';const j=await api('catalog',{query:'scope=global'});if(!j.success||!Array.isArray(j.data)){msg(j.message||'Could not load global rental plans. Please try again.',true);$('services').innerHTML='<div class="empty">Catalogue unavailable.</div>';return;}plans=j.data.filter(p=>p.country_code!=='US'&&p.is_available===true&&p.availability_known===true);const map=new Map();plans.forEach(p=>{const k=p.service_id;if(!map.has(k))map.set(k,{service_id:k,service_name:p.service_name,country_count:0,countries:new Set()});map.get(k).countries.add(p.country_code);});services=Array.from(map.values()).map(s=>({...s,country_count:s.countries.size})).sort((a,b)=>a.service_name.localeCompare(b.service_name));renderServices();if(!plans.length){$('services').innerHTML='<div class="empty">No global rental plans are available right now. Please check again shortly.</div>';}}
$('serviceSearch').addEventListener('input',renderServices);$('countrySearch').addEventListener('input',renderCountries);$('backServices').onclick=()=>{$('countryStep').classList.add('hidden');$('serviceStep').classList.remove('hidden');};$('backCountries').onclick=()=>{$('planStep').classList.add('hidden');$('countryStep').classList.remove('hidden');};
$('buyBtn').onclick=async function(){if(busy||!selectedPlan)return;const h=await authHeaders();if(!h)return;const signature=[selectedPlan.country_code,selectedPlan.service_id,selectedPlan.duration_hours].join('|');let stored=null;try{stored=JSON.parse(sessionStorage.getItem('mj_virtualsms_global_rent_request')||'null');}catch(_){}if(stored&&stored.id&&stored.signature!==signature){msg('A previous rental is still being reconciled. Open Number History or contact support before starting another purchase.',true);return;}const requestId=stored&&stored.id?stored.id:((crypto.randomUUID&&crypto.randomUUID())||('mjvsg-'+Date.now()+'-'+Math.random().toString(36).slice(2)));try{sessionStorage.setItem('mj_virtualsms_global_rent_request',JSON.stringify({id:requestId,signature}));}catch(_){}busy=true;this.disabled=true;this.textContent='Processing…';msg('',false);let j;try{j=await api('order',{method:'POST',body:{service_id:selectedPlan.service_id,service_name:selectedService.service_name,duration_hours:selectedPlan.duration_hours,country_code:selectedPlan.country_code,quoted_price_ngn:selectedPlan.price_ngn,request_id:requestId}});}catch(e){busy=false;this.disabled=false;this.textContent='Rent this number';msg('We could not confirm the rental result yet. Do not submit another rental. Check Number History or contact support.',true);return;}busy=false;this.disabled=false;this.textContent='Rent this number';if(j.success&&j.data){try{sessionStorage.removeItem('mj_virtualsms_global_rent_request');}catch(_){}const id=j.data.order_id||j.data.rent_id;if(id){location.href='mj-sms-usa-number.html?rent_id='+encodeURIComponent(id)+'&source=virtualsms_rent';return;}msg('Rental created but its reference is missing. Check Number History before retrying.',true);return;}if(j.reconciliation_required){msg(j.message||'Purchase status is being checked. Do not retry.',true);return;}if(j.refunded===true){try{sessionStorage.removeItem('mj_virtualsms_global_rent_request');}catch(_){}}msg(j.message||'Could not complete this rental.',true);};
load().catch(e=>msg('Could not load rental catalogue: '+String(e.message||e),true));
})();
</script>
</body></html>
