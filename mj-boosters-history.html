<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Booster Orders · MJ HUB</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/mj-page-loader.js" defer></script>
<script>
(function(){try{var t=localStorage.getItem('mjhub-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<meta name="theme-color" content="#2563eb">
<style>
:root[data-theme="dark"] {
  --bg: #070b14;
  --surface: #0e1524;
  --surface2: #141c2e;
  --title: #f1f5f9;
  --muted: #94a3b8;
  --line: rgba(148,163,184,.12);
  --blue: #3b82f6;
  --blue-2: #2563eb;
  --ok: #34d399;
  --ok-bg: rgba(52,211,153,.12);
  --warn: #fbbf24;
  --warn-bg: rgba(251,191,36,.12);
  --bad: #f87171;
  --bad-bg: rgba(248,113,113,.12);
  --chip: rgba(255,255,255,.04);
  --shadow: 0 12px 40px rgba(0,0,0,.4);
}
:root[data-theme="light"] {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface2: #f8fafc;
  --title: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --blue: #2563eb;
  --blue-2: #1d4ed8;
  --ok: #059669;
  --ok-bg: #ecfdf5;
  --warn: #d97706;
  --warn-bg: #fffbeb;
  --bad: #dc2626;
  --bad-bg: #fef2f2;
  --chip: #f1f5f9;
  --shadow: 0 10px 28px rgba(37,99,235,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg); color:var(--title); min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:540px;margin:0 auto;padding:0 16px 72px;position:relative;z-index:1}
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:16px 0 18px;position:sticky;top:0;z-index:20;
  background:linear-gradient(to bottom,var(--bg) 65%,transparent);
}
.back,.icon-btn{
  width:44px;height:44px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);color:var(--title);display:grid;place-items:center;
  text-decoration:none;cursor:pointer;font-size:15px;flex-shrink:0;
}
.topbar-copy{flex:1;min-width:0}
.topbar-copy h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
.topbar-copy p{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
.list{display:flex;flex-direction:column;gap:14px}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  box-shadow:var(--shadow);
}
.card .head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;
}
.card .title{font-size:15px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.pill{
  font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 10px;border-radius:999px;white-space:nowrap;
}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.pending{background:rgba(59,130,246,.12);color:var(--blue)}
.link-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--chip);border:1px solid var(--line);
  border-radius:14px;padding:11px 12px;margin-bottom:14px;
}
.link-bar .txt{
  flex:1;min-width:0;font-size:12px;font-weight:600;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.link-bar .open{
  flex-shrink:0;border:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  font:800 11px/1 'Plus Jakarta Sans',system-ui,sans-serif;
  padding:9px 12px;border-radius:11px;
  background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;
}
.stats{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;
}
.stat{
  background:var(--surface2);border:1px solid var(--line);
  border-radius:14px;padding:12px;
}
.stat .lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stat .val{font-size:15px;font-weight:800;color:var(--title)}
.prog{margin-bottom:6px}
.prog-top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.prog-top strong{color:var(--title);font-weight:800}
.track{height:8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,var(--blue));transition:width .35s ease}
.fill.done{background:linear-gradient(90deg,#34d399,var(--ok))}
.fill.partial{background:linear-gradient(90deg,#fbbf24,var(--warn))}
.prog-note{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}
.foot{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions button{
  border:1px solid var(--line);background:var(--surface2);color:var(--title);
  font:700 12px/1 'Plus Jakarta Sans',system-ui,sans-serif;
  padding:11px 14px;border-radius:12px;cursor:pointer;
}
.actions button.primary{background:linear-gradient(135deg,var(--blue),var(--blue-2));border-color:transparent;color:#fff}
.actions button.danger{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.empty{
  text-align:center;padding:52px 20px;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;
}
.empty .ico{font-size:40px;margin-bottom:10px}
.empty h3{font-size:17px;font-weight:800;margin-bottom:8px}
.empty p{font-size:13px;color:var(--muted);margin-bottom:16px}
.empty a{
  display:inline-flex;padding:12px 18px;border-radius:12px;
  background:linear-gradient(135deg,var(--blue),var(--blue-2));
  color:#fff;text-decoration:none;font-weight:800;font-size:13px;
}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);
  background:var(--blue);color:#fff;padding:12px 16px;border-radius:12px;
  font-size:13px;font-weight:700;z-index:50;transition:.25s;opacity:0;pointer-events:none;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="back" href="mj-boosters.html" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="topbar-copy">
      <h1>Booster orders</h1>
      <p>Live progress · open target link</p>
    </div>
    <button type="button" class="icon-btn" id="refreshBtn" aria-label="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
  </header>
  <div class="list" id="list"></div>
</div>
<div id="toast"></div>
<script>
const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
});

function syncThemeUi(){
  /* Theme follows dashboard (localStorage mjhub-theme) — no local toggle */
  try {
    var t = localStorage.getItem('mjhub-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', document.documentElement.getAttribute('data-theme') === 'light' ? '#f0f3f9' : '#06080f');
}
function toggleTheme(){ /* disabled — use dashboard theme */ syncThemeUi(); }
syncThemeUi();
function esc(s){
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmt(n){ return '₦' + Number(n || 0).toLocaleString(); }

function progressHtml(o){
  const st = String(o.status || '').toLowerCase();
  const qty = Math.max(0, Number(o.quantity) || 0);
  let remains = o.remains == null || o.remains === '' ? null : Number(o.remains);
  let start = o.start_count == null || o.start_count === '' ? null : Number(o.start_count);
  if (remains != null && Number.isNaN(remains)) remains = null;
  if (start != null && Number.isNaN(start)) start = null;

  let done = 0;
  let pct = 0;
  if (/completed|complete/.test(st)) {
    done = qty; remains = 0; pct = 100;
  } else if (remains != null && qty > 0) {
    done = Math.max(0, Math.min(qty, qty - remains));
    pct = Math.round((done / qty) * 100);
  } else if (o.delivered != null && qty > 0) {
    done = Math.max(0, Math.min(qty, Number(o.delivered) || 0));
    remains = Math.max(0, qty - done);
    pct = Math.round((done / qty) * 100);
  } else if (/pending|awaiting/.test(st)) {
    done = 0; remains = qty || 0; pct = 0;
  } else if (/progress|processing|waiting/.test(st)) {
    pct = Math.max(pct, 2);
  }
  if (remains == null && qty > 0) remains = Math.max(0, qty - done);

  const fillClass = pct >= 100 ? 'done' : (/partial/.test(st) ? 'partial' : '');

  return `<div class="prog">
    <div class="prog-top">
      <span><strong>${done.toLocaleString()}</strong> of <strong>${qty.toLocaleString()}</strong> complete</span>
      <span>${remains != null ? remains.toLocaleString() + ' left' : ''}</span>
    </div>
    <div class="track"><div class="fill ${fillClass}" style="width:${Math.max(0, Math.min(100, pct))}%"></div></div>
    <div class="prog-note">${pct}% done${start != null ? ' · started at ' + start.toLocaleString() : ''}</div>
  </div>`;
}

function canCancel(o){
  const s = String(o.status || '').toLowerCase();
  return /pending|awaiting|waiting/.test(s);
}
function canRefill(o){
  const s = String(o.status || '').toLowerCase();
  return /completed|partial/.test(s);
}
function isActive(o){
  const s = String(o.status || '').toLowerCase();
  return /pending|progress|processing|awaiting|waiting|partial/.test(s)
    && !/completed|canceled|cancelled|refunded|failed/.test(s);
}

(async function main(){
  const el = document.getElementById('list') || document.querySelector('.list');
  if (!el) {
    console.error('No #list container');
    return;
  }
  el.innerHTML = ((window.mjSkeleton||window.MJSkeleton)?(window.mjSkeleton||window.MJSkeleton).cards(3) : '<div class="empty"><p>Loading orders…</p></div>');

  // Session required for API
  let session = null;
  try {
    const res = await sb.auth.getSession();
    session = res.data && res.data.session;
  } catch (e) {
    console.error(e);
  }
  if (!session || !session.access_token) {
    el.innerHTML = `<div class="empty"><h3>Please sign in</h3><p>Your session is missing. Sign in again to see booster orders.</p><a href="auth.html">Sign in</a></div>`;
    return;
  }

  const headers = {
    Authorization: 'Bearer ' + session.access_token,
    Accept: 'application/json'
  };

  window.cancelOrder = async function(orderId){
    if (!orderId || !confirm('Cancel this order?')) return;
    try {
      const res = await fetch('/api/owlet?action=cancel', {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: orderId })
      });
      const json = await res.json();
      if (!json.success) alert(json.message || 'Cancel failed');
      else loadOrders(true);
    } catch (e) { alert(e.message || 'Network error'); }
  };

  window.refillOrder = async function(orderId){
    if (!orderId) return;
    try {
      const res = await fetch('/api/owlet?action=refill', {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: orderId })
      });
      const json = await res.json();
      if (!json.success) alert(json.message || 'Refill failed');
      else { alert('Refill requested'); loadOrders(true); }
    } catch (e) { alert(e.message || 'Network error'); }
  };

  
  function openSocialLink(url) {
    const u = String(url || '').trim();
    if (!u) return;
    let href = u;
    if (!/^https?:\/\//i.test(href) && !/^[a-z][a-z0-9+.-]*:/i.test(href)) {
      href = 'https://' + href.replace(/^\/\//, '');
    }
    // App-intent style where possible; OS falls back to browser/website
    try {
      const parsed = new URL(href);
      const host = parsed.hostname.replace(/^www\./, '').toLowerCase();
      const path = parsed.pathname + parsed.search + parsed.hash;
      if (host.includes('tiktok.com')) {
        // Universal link — opens app if installed
        href = 'https://www.tiktok.com' + path;
      } else if (host.includes('instagram.com')) {
        href = 'https://www.instagram.com' + path;
      } else if (host.includes('youtube.com') || host.includes('youtu.be')) {
        href = href;
      } else if (host.includes('twitter.com') || host.includes('x.com')) {
        href = href.replace('twitter.com', 'x.com');
      } else if (host.includes('facebook.com') || host.includes('fb.com')) {
        href = href;
      }
    } catch (e) {}
    window.open(href, '_blank', 'noopener,noreferrer');
  }
  window.openSocialLink = openSocialLink;

function renderRows(rows){
    if (!rows.length) {
      el.innerHTML = `<div class="empty"><div class="ico">⚡</div><h3>No boost orders yet</h3><p>Your growth orders will show here with live progress.</p><a href="mj-boosters.html">Place first boost</a></div>`;
      return;
    }
    el.innerHTML = rows.map(o => {
      const oid = o.supplier_order_id || '';
      const st = String(o.status || 'Pending');
      let pill = 'pending';
      if (/complete/i.test(st)) pill = 'ok';
      else if (/cancel|fail|refund/i.test(st)) pill = 'bad';
      else if (/partial|progress|process/i.test(st)) pill = 'warn';
      const actions = [];
      if (canCancel(o) && oid) actions.push(`<button type="button" class="danger" onclick="cancelOrder('${esc(oid)}')">Cancel</button>`);
      if (canRefill(o) && oid) actions.push(`<button type="button" class="primary" onclick="refillOrder('${esc(oid)}')">Request refill</button>`);
      const link = o.link || '';
      return `<div class="card" data-order="${esc(oid)}">
        <div class="head">
          <div class="title">${esc(o.service_name || 'Boost')}</div>
          <span class="pill ${pill}">${esc(st)}</span>
        </div>
        <div class="link-bar">
          <span class="txt">${link ? esc(link) : 'No link provided'}</span>
          ${link ? `<button type="button" class="open" onclick='openSocialLink(${JSON.stringify(String(link))})'><i class="fa-solid fa-arrow-up-right-from-square"></i> Open</button>` : ''}
        </div>
        <div class="stats">
          <div class="stat"><div class="lbl">Ordered</div><div class="val">${Number(o.quantity || 0).toLocaleString()}</div></div>
          <div class="stat"><div class="lbl">Paid</div><div class="val">${fmt(o.price_ngn)}</div></div>
        </div>
        ${progressHtml(o)}
        <div class="foot">
          <span>Order #${esc(oid || o.id || '')}</span>
          <span>${o.created_at ? new Date(o.created_at).toLocaleString() : ''}</span>
        </div>
        ${actions.length ? `<div class="actions">${actions.join('')}</div>` : ''}
      </div>`;
    }).join('');
  }

  let pollTimer = null;
  let loading = false;

  async function loadOrders(silent){
    if (loading && silent) return;
    loading = true;
    try {
      if (!silent) el.innerHTML = ((window.mjSkeleton||window.MJSkeleton)?(window.mjSkeleton||window.MJSkeleton).cards(3) : '<div class="empty"><p>Loading orders…</p></div>');

      // Fast: DB only
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), 20000);
      const url = silent
        ? '/api/owlet?action=my_orders&page_size=50&source=owlet'
        : '/api/owlet?action=my_orders&page_size=50&live=0&source=owlet';
      const resFast = await fetch(url, {
        headers,
        signal: controller.signal
      });
      clearTimeout(t);
      const jsonFast = await resFast.json().catch(() => ({}));
      if (!jsonFast.success) {
        el.innerHTML = `<div class="empty"><h3>Could not load orders</h3><p>${esc(jsonFast.message || resFast.statusText || 'Error')}</p><a href="auth.html">Sign in again</a></div>`;
        return;
      }
      let rows = (jsonFast.data || []).filter(o => String(o.source||'owlet').toLowerCase() !== 'smmkings');
      if (window.__mjSkelDone) {
        var _rows = rows;
        window.__mjSkelDone(function(){ renderRows(_rows); });
        window.__mjSkelDone = null;
      } else {
        renderRows(rows);
      }

      const hasActive = rows.some(isActive);
      if (hasActive) {
        // Background live update (do not block UI)
        fetch('/api/owlet?action=my_orders&page_size=50&source=owlet', { headers })
          .then(r => r.json())
          .then(json => {
            if (json && json.success && Array.isArray(json.data)) renderRows(json.data);
          })
          .catch(() => {});
      }

      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (hasActive) pollTimer = setInterval(() => loadOrders(true), 12000);
    } catch (e) {
      const msg = e.name === 'AbortError' ? 'Request timed out. Try refresh.' : (e.message || 'Network error');
      if (!silent) el.innerHTML = `<div class="empty"><h3>Could not load</h3><p>${esc(msg)}</p><button type="button" class="btn-mini primary" onclick="location.reload()">Retry</button></div>`;
    } finally {
      loading = false;
    }
  }

  const rb = document.getElementById('refreshBtn');
  if (rb) rb.onclick = () => loadOrders(false);

  await loadOrders(false);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadOrders(true);
  });
})();





</script>
</body>
</html>
