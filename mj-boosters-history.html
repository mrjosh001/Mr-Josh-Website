<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ Boosters Orders | MJ HUB</title>
<link rel="icon" href="https://atczodlljmlayvldxfmv.supabase.co/storage/v1/object/public/avatars/dark%20background%20log">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>(function(){try{var th=localStorage.getItem('mjhub-theme');document.documentElement.setAttribute('data-theme',(th==='light'||th==='dark')?th:'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<meta name="theme-color" content="#06080f">
<style>
:root[data-theme="dark"]{--bg:#06080f;--card:#0f1524;--border:rgba(148,163,184,.12);--text:#f1f5f9;--muted:#8b9bb4;--primary:#3b82f6;--success:#34d399;--warn:#fbbf24;--danger:#f87171;--header-bg:rgba(6,8,15,.92)}
:root[data-theme="light"]{--bg:#f4f6fb;--card:#fff;--border:rgba(15,23,42,.08);--text:#0f172a;--muted:#64748b;--primary:#3b6ef5;--success:#059669;--warn:#d97706;--danger:#dc2626;--header-bg:rgba(255,255,255,.92)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--header-bg);backdrop-filter:blur(12px);z-index:10}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
h1{font-size:17px;font-weight:800}
.list{padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.title{font-size:14px;font-weight:800;line-height:1.3}
.status{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(59,130,246,.15);color:#93c5fd;white-space:nowrap}
.status.Completed,.status.completed{background:rgba(52,211,153,.15);color:var(--success)}
.status.Partial,.status.partial{background:rgba(251,191,36,.15);color:var(--warn)}
.status.Canceled,.status.Cancelled,.status.canceled{background:rgba(248,113,113,.15);color:var(--danger)}
.meta{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45;word-break:break-all}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;font-weight:700}
.progress-wrap{margin-top:12px}
.progress-label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty a{display:inline-block;margin-top:14px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;padding:12px 18px;border-radius:12px;font-weight:800;text-decoration:none}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn-mini{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer}
.btn-mini:disabled{opacity:.5;cursor:not-allowed}
.btn-mini.danger{border-color:rgba(248,113,113,.4);color:var(--danger)}
.btn-mini.primary{border-color:rgba(91,138,245,.4);color:var(--primary)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:50;opacity:0;pointer-events:none;transition:.2s;max-width:90%}
.toast.show{opacity:1}

.prog{margin-top:12px}
.prog-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.prog-meta .left{font-size:12px;color:var(--muted);font-weight:600}
.prog-meta .right{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.prog-detail{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
.bar{height:8px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#2563eb,#3b82f6);transition:width .5s ease;min-width:0}
.bar-fill.done{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.bar-fill.partial{background:linear-gradient(90deg,#fbbf24,#fcd34d)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#34d399;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 3px rgba(52,211,153,.2)}

</style>
<link rel="stylesheet" href="/css/skeleton.css">
<script src="/js/skeleton.js" defer></script>
  <script src="/js/mj-page-loader.js" defer></script>
</head>
<body>
<header class="header">
  <a class="back" href="mj-boosters.html"><i class="fa-solid fa-arrow-left"></i></a>
  <h1 style="flex:1">Booster Orders</h1>
<button type="button" class="back" id="refreshBtn" title="Refresh" aria-label="Refresh" style="border:none;cursor:pointer;font-size:16px">↻</button>
  <button type="button" id="themeBtn" onclick="toggleTheme()" style="margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:16px;">🌙</button>
</header>
<div class="list" id="list"><div class="sk-cards" aria-hidden="true" aria-busy="true"><div class="sk-card-row"><div class="sk-bone sk-avatar"></div><div class="sk-card-body"><div class="sk-bone sk-line w70"></div><div class="sk-bone sk-line w90"></div></div><div class="sk-bone sk-pill"></div></div><div class="sk-card-row"><div class="sk-bone sk-avatar"></div><div class="sk-card-body"><div class="sk-bone sk-line w70"></div><div class="sk-bone sk-line w90"></div></div><div class="sk-bone sk-pill"></div></div><div class="sk-card-row"><div class="sk-bone sk-avatar"></div><div class="sk-card-body"><div class="sk-bone sk-line w70"></div><div class="sk-bone sk-line w90"></div></div><div class="sk-bone sk-pill"></div></div><div class="sk-card-row"><div class="sk-bone sk-avatar"></div><div class="sk-card-body"><div class="sk-bone sk-line w70"></div><div class="sk-bone sk-line w90"></div></div><div class="sk-bone sk-pill"></div></div></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
});

function syncThemeUi(){
  const dark = document.documentElement.getAttribute('data-theme') !== 'light';
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = dark ? '🌙' : '☀️';
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', dark ? '#06080f' : '#f4f6fb');
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('mjhub-theme', next); } catch (e) {}
  syncThemeUi();
}
syncThemeUi();
const themeBtn = document.getElementById('themeBtn');
if (themeBtn) themeBtn.onclick = toggleTheme;

function esc(s){
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmt(n){ return '₦' + Number(n || 0).toLocaleString(); }

function progressHtml(o){
  const qty = Number(o.quantity) || 0;
  const st = String(o.status || '').toLowerCase();
  let remains = o.remains == null || o.remains === '' ? null : Number(o.remains);
  let start = o.start_count == null || o.start_count === '' ? null : Number(o.start_count);
  if (remains != null && Number.isNaN(remains)) remains = null;
  if (start != null && Number.isNaN(start)) start = null;

  let done = 0;
  let pct = 0;
  if (/completed|complete/.test(st)) {
    done = qty;
    remains = 0;
    pct = 100;
  } else if (remains != null && qty > 0) {
    done = Math.max(0, Math.min(qty, qty - remains));
    pct = Math.round((done / qty) * 100);
  } else if (o.delivered != null && qty > 0) {
    done = Math.max(0, Math.min(qty, Number(o.delivered) || 0));
    remains = Math.max(0, qty - done);
    pct = Math.round((done / qty) * 100);
  } else if (/pending|awaiting/.test(st)) {
    done = 0;
    remains = qty || 0;
    pct = 0;
  } else if (/progress|processing|waiting/.test(st)) {
    pct = Math.max(pct, 2);
  }
  if (remains == null && qty > 0) remains = Math.max(0, qty - done);

  const fillClass = pct >= 100 ? 'done' : (/partial/.test(st) ? 'partial' : '');

  return `<div class="prog">
    <div class="prog-meta">
      <span class="left"><strong style="color:var(--text)">${done.toLocaleString()}</strong> of <strong style="color:var(--text)">${qty.toLocaleString()}</strong> complete</span>
      <span class="right">${remains != null ? remains.toLocaleString() + ' left' : ''}</span>
    </div>
    <div class="bar"><div class="bar-fill ${fillClass}" style="width:${Math.max(0, Math.min(100, pct))}%"></div></div>
    <div class="prog-detail">${pct}% done${start != null ? ' · was at ' + start.toLocaleString() + ' when order started' : ''}</div>
  </div>`;
}

function canCancel(o){
  const s = String(o.status || '').toLowerCase();
  return /pending|awaiting|waiting/.test(s);
}
function canRefill(o){
  const s = String(o.status || '').toLowerCase();
  return /completed|partial/.test(s);
}
function isActive(o){
  const s = String(o.status || '').toLowerCase();
  return /pending|progress|processing|awaiting|waiting|partial/.test(s)
    && !/completed|canceled|cancelled|refunded|failed/.test(s);
}

(async function main(){
  const el = document.getElementById('list') || document.querySelector('.list');
  if (!el) {
    console.error('No #list container');
    return;
  }
  el.innerHTML = ((window.mjSkeleton||window.MJSkeleton)?(window.mjSkeleton||window.MJSkeleton).cards(3) : '<div class="empty"><p>Loading orders…</p></div>');

  // Session required for API
  let session = null;
  try {
    const res = await sb.auth.getSession();
    session = res.data && res.data.session;
  } catch (e) {
    console.error(e);
  }
  if (!session || !session.access_token) {
    el.innerHTML = `<div class="empty"><h3>Please sign in</h3><p>Your session is missing. Sign in again to see booster orders.</p><a href="auth.html">Sign in</a></div>`;
    return;
  }

  const headers = {
    Authorization: 'Bearer ' + session.access_token,
    Accept: 'application/json'
  };

  window.cancelOrder = async function(orderId){
    if (!orderId || !confirm('Cancel this order?')) return;
    try {
      const res = await fetch('/api/owlet?action=cancel', {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: orderId })
      });
      const json = await res.json();
      if (!json.success) alert(json.message || 'Cancel failed');
      else loadOrders(true);
    } catch (e) { alert(e.message || 'Network error'); }
  };

  window.refillOrder = async function(orderId){
    if (!orderId) return;
    try {
      const res = await fetch('/api/owlet?action=refill', {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: orderId })
      });
      const json = await res.json();
      if (!json.success) alert(json.message || 'Refill failed');
      else { alert('Refill requested'); loadOrders(true); }
    } catch (e) { alert(e.message || 'Network error'); }
  };

  function renderRows(rows){
    if (!rows.length) {
      el.innerHTML = `<div class="empty"><div style="font-size:40px;margin-bottom:8px">⚡</div><h3>No boost orders yet</h3><p>Your growth orders will show here with live progress.</p><a href="mj-boosters.html">Place first boost</a></div>`;
      return;
    }
    el.innerHTML = rows.map(o => {
      const oid = o.supplier_order_id || '';
      const actions = [];
      if (canCancel(o) && oid) actions.push(`<button type="button" class="btn-mini danger" onclick="cancelOrder('${esc(oid)}')">Cancel</button>`);
      if (canRefill(o) && oid) actions.push(`<button type="button" class="btn-mini primary" onclick="refillOrder('${esc(oid)}')">Request refill</button>`);
      return `<div class="card" data-order="${esc(oid)}">
        <div class="top">
          <div class="title">${esc(o.service_name || 'Boost')}</div>
          <span class="status ${esc(o.status || '')}">${esc(o.status || 'Pending')}</span>
        </div>
        <div class="meta">${esc(o.link || '')}</div>
        <div class="row"><span>Ordered ${Number(o.quantity || 0).toLocaleString()}</span><span>${fmt(o.price_ngn)}</span></div>
        ${progressHtml(o)}
        <div class="row"><span>Order #${esc(oid || o.id || '')}</span><span>${o.created_at ? new Date(o.created_at).toLocaleString() : ''}</span></div>
        ${actions.length ? `<div class="btn-row">${actions.join('')}</div>` : ''}
      </div>`;
    }).join('');
  }

  let pollTimer = null;
  let loading = false;

  async function loadOrders(silent){
    if (loading && silent) return;
    loading = true;
    try {
      if (!silent) el.innerHTML = ((window.mjSkeleton||window.MJSkeleton)?(window.mjSkeleton||window.MJSkeleton).cards(3) : '<div class="empty"><p>Loading orders…</p></div>');

      // Fast: DB only
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), 20000);
      const url = silent
        ? '/api/owlet?action=my_orders&page_size=50'
        : '/api/owlet?action=my_orders&page_size=50&live=0';
      const resFast = await fetch(url, {
        headers,
        signal: controller.signal
      });
      clearTimeout(t);
      const jsonFast = await resFast.json().catch(() => ({}));
      if (!jsonFast.success) {
        el.innerHTML = `<div class="empty"><h3>Could not load orders</h3><p>${esc(jsonFast.message || resFast.statusText || 'Error')}</p><a href="auth.html">Sign in again</a></div>`;
        return;
      }
      let rows = jsonFast.data || [];
      if (window.__mjSkelDone) {
        var _rows = rows;
        window.__mjSkelDone(function(){ renderRows(_rows); });
        window.__mjSkelDone = null;
      } else {
        renderRows(rows);
      }

      const hasActive = rows.some(isActive);
      if (hasActive) {
        // Background live update (do not block UI)
        fetch('/api/owlet?action=my_orders&page_size=50', { headers })
          .then(r => r.json())
          .then(json => {
            if (json && json.success && Array.isArray(json.data)) renderRows(json.data);
          })
          .catch(() => {});
      }

      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (hasActive) pollTimer = setInterval(() => loadOrders(true), 12000);
    } catch (e) {
      const msg = e.name === 'AbortError' ? 'Request timed out. Try refresh.' : (e.message || 'Network error');
      if (!silent) el.innerHTML = `<div class="empty"><h3>Could not load</h3><p>${esc(msg)}</p><button type="button" class="btn-mini primary" onclick="location.reload()">Retry</button></div>`;
    } finally {
      loading = false;
    }
  }

  const rb = document.getElementById('refreshBtn');
  if (rb) rb.onclick = () => loadOrders(false);

  await loadOrders(false);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadOrders(true);
  });
})();
</script>
</body>
</html>
