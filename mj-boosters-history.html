<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Booster Orders · MJ HUB</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/mj-page-loader.js" defer></script>
<script>
(function(){try{var t=localStorage.getItem('mjhub-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<meta name="theme-color" content="#2563eb">
<style>

:root[data-theme="dark"] {
  --bg: #0b1220;
  --bg-soft: #111827;
  --card: #ffffff;
  --card-ink: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --blue: #2563eb;
  --blue-2: #1d4ed8;
  --blue-soft: #eff6ff;
  --blue-ring: rgba(37, 99, 235, 0.2);
  --ok: #059669;
  --ok-soft: #ecfdf5;
  --warn: #d97706;
  --warn-soft: #fffbeb;
  --bad: #dc2626;
  --bad-soft: #fef2f2;
  --shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
}
:root[data-theme="light"] {
  --bg: #f0f5ff;
  --bg-soft: #e8effc;
  --card: #ffffff;
  --card-ink: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --blue: #2563eb;
  --blue-2: #1d4ed8;
  --blue-soft: #eff6ff;
  --blue-ring: rgba(37, 99, 235, 0.18);
  --ok: #059669;
  --ok-soft: #ecfdf5;
  --warn: #d97706;
  --warn-soft: #fffbeb;
  --bad: #dc2626;
  --bad-soft: #fef2f2;
  --shadow: 0 10px 28px rgba(37, 99, 235, 0.08);
}
/* Cards always white + dark text for brand clarity on both themes */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--card-ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 100% 60% at 50% -20%, rgba(37,99,235,.22), transparent 55%),
    linear-gradient(180deg, #dbeafe 0%, var(--bg) 42%);
}
:root[data-theme="dark"] body::before {
  background:
    radial-gradient(ellipse 100% 60% at 50% -20%, rgba(37,99,235,.35), transparent 55%),
    linear-gradient(180deg, #0f1a33 0%, var(--bg) 45%);
}
.shell { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; padding: 0 16px 72px; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 0 12px;
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 75%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.btn-icon {
  width: 44px; height: 44px; border-radius: 14px;
  border: 1.5px solid #bfdbfe; background: #fff; color: var(--blue);
  display: inline-flex; align-items: center; justify-content: center;
  text-decoration: none; cursor: pointer; font-size: 15px; flex-shrink: 0;
  box-shadow: var(--shadow);
}
.btn-icon:active { transform: scale(.97); }
.topbar-copy { flex: 1; min-width: 0; }
.topbar-copy h1 {
  font-size: 20px; font-weight: 800; letter-spacing: -0.04em;
  color: #fff;
}
:root[data-theme="light"] .topbar-copy h1 { color: #0f172a; }
.topbar-copy p { font-size: 12px; font-weight: 600; margin-top: 2px; color: #93c5fd; }
:root[data-theme="light"] .topbar-copy p { color: var(--blue); }
.brand-bar {
  height: 4px; border-radius: 999px;
  background: linear-gradient(90deg, #60a5fa, var(--blue), #1d4ed8);
  margin: 0 0 14px; opacity: .95;
}

.list { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--card); color: var(--card-ink);
  border: 1.5px solid #dbeafe; border-radius: 20px;
  padding: 16px; box-shadow: var(--shadow);
}
.top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
.title { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.35; color: #0f172a; }
.status {
  font-size: 10px; font-weight: 800; padding: 6px 10px; border-radius: 999px;
  background: var(--blue-soft); color: var(--blue); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
}
.status.Completed, .status.completed { background: var(--ok-soft); color: var(--ok); }
.status.Partial, .status.partial { background: var(--warn-soft); color: var(--warn); }
.status.Canceled, .status.Cancelled, .status.canceled, .status.cancelled,
.status.Refunded, .status.refunded { background: var(--bad-soft); color: var(--bad); }
.link-row {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--blue-soft); border: 1px solid #bfdbfe;
  border-radius: 14px; padding: 11px 12px; margin-bottom: 12px;
}
.link-text { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: #1e3a8a; word-break: break-all; line-height: 1.4; }
.link-text.muted { color: var(--muted); }
.btn-open {
  flex-shrink: 0; border: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  font: 800 11px/1 'Plus Jakarta Sans', system-ui, sans-serif;
  padding: 10px 12px; border-radius: 11px;
  background: linear-gradient(135deg, var(--blue), var(--blue-2)); color: #fff;
  box-shadow: 0 8px 18px var(--blue-ring);
}
.row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 6px 0; }
.row span:last-child { color: #0f172a; font-weight: 700; }
.prog { margin: 12px 0 4px; }
.prog-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.prog-meta strong { color: #0f172a; font-weight: 800; }
.bar { height: 10px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #60a5fa, var(--blue), var(--blue-2)); transition: width .35s ease; }
.bar-fill.done { background: linear-gradient(90deg, #34d399, var(--ok)); }
.bar-fill.partial { background: linear-gradient(90deg, #fbbf24, var(--warn)); }
.prog-detail { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 6px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.btn-mini {
  border: 1.5px solid #bfdbfe; background: #fff; color: var(--blue);
  font: 700 12px/1 'Plus Jakarta Sans', system-ui, sans-serif;
  padding: 10px 14px; border-radius: 12px; cursor: pointer;
}
.btn-mini.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-mini.danger { border-color: #fecaca; color: var(--bad); background: var(--bad-soft); }
.empty {
  text-align: center; padding: 48px 20px; background: #fff; border: 1.5px solid #dbeafe;
  border-radius: 20px; box-shadow: var(--shadow); color: #0f172a;
}
.empty h3 { font-size: 17px; font-weight: 800; margin: 10px 0 8px; }
.empty p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.empty a {
  display: inline-flex; font-size: 13px; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, var(--blue), var(--blue-2));
  text-decoration: none; padding: 12px 18px; border-radius: 12px;
}
#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(80px);
  background: var(--blue); color: #fff; padding: 12px 16px; border-radius: 12px;
  font-size: 13px; font-weight: 700; opacity: 0; transition: .25s; z-index: 60;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="btn-icon" href="mj-boosters.html" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="topbar-copy">
      <h1>Booster orders</h1>
      <p>White · Blue · MJ HUB</p>
    </div>
    <button type="button" class="btn-icon" id="refreshBtn" aria-label="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
  </header>
  <div class="brand-bar"></div>
  <div class="list" id="list"></div>
</div>
<div id="toast"></div>
<script>



const SUPABASE_URL = 'https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3pvZGxsam1sYXl2bGR4Zm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzUyMzgsImV4cCI6MjEwMDY1MTIzOH0.ufthD-p7BmeD_B7xyuMM6PNPL8DmcL4AtRYgg-MuoLI';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage }
});

function syncThemeUi(){
  /* Theme follows dashboard (localStorage mjhub-theme) — no local toggle */
  try {
    var t = localStorage.getItem('mjhub-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', document.documentElement.getAttribute('data-theme') === 'light' ? '#f0f3f9' : '#06080f');
}
function toggleTheme(){ /* disabled — use dashboard theme */ syncThemeUi(); }
syncThemeUi();
function esc(s){
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmt(n){ return '₦' + Number(n || 0).toLocaleString(); }

function progressHtml(o){
  const qty = Number(o.quantity) || 0;
  const st = String(o.status || '').toLowerCase();
  let remains = o.remains == null || o.remains === '' ? null : Number(o.remains);
  let start = o.start_count == null || o.start_count === '' ? null : Number(o.start_count);
  if (remains != null && Number.isNaN(remains)) remains = null;
  if (start != null && Number.isNaN(start)) start = null;

  let done = 0;
  let pct = 0;
  if (/completed|complete/.test(st)) {
    done = qty;
    remains = 0;
    pct = 100;
  } else if (remains != null && qty > 0) {
    done = Math.max(0, Math.min(qty, qty - remains));
    pct = Math.round((done / qty) * 100);
  } else if (o.delivered != null && qty > 0) {
    done = Math.max(0, Math.min(qty, Number(o.delivered) || 0));
    remains = Math.max(0, qty - done);
    pct = Math.round((done / qty) * 100);
  } else if (/pending|awaiting/.test(st)) {
    done = 0;
    remains = qty || 0;
    pct = 0;
  } else if (/progress|processing|waiting/.test(st)) {
    pct = Math.max(pct, 2);
  }
  if (remains == null && qty > 0) remains = Math.max(0, qty - done);

  const fillClass = pct >= 100 ? 'done' : (/partial/.test(st) ? 'partial' : '');

  return `<div class="prog">
    <div class="prog-meta">
      <span class="left"><strong style="color:var(--text)">${done.toLocaleString()}</strong> of <strong style="color:var(--text)">${qty.toLocaleString()}</strong> complete</span>
      <span class="right">${remains != null ? remains.toLocaleString() + ' left' : ''}</span>
    </div>
    <div class="bar"><div class="bar-fill ${fillClass}" style="width:${Math.max(0, Math.min(100, pct))}%"></div></div>
    <div class="prog-detail">${pct}% done${start != null ? ' · was at ' + start.toLocaleString() + ' when order started' : ''}</div>
  </div>`;
}

function canCancel(o){
  const s = String(o.status || '').toLowerCase();
  return /pending|awaiting|waiting/.test(s);
}
function canRefill(o){
  const s = String(o.status || '').toLowerCase();
  return /completed|partial/.test(s);
}
function isActive(o){
  const s = String(o.status || '').toLowerCase();
  return /pending|progress|processing|awaiting|waiting|partial/.test(s)
    && !/completed|canceled|cancelled|refunded|failed/.test(s);
}

(async function main(){
  const el = document.getElementById('list') || document.querySelector('.list');
  if (!el) {
    console.error('No #list container');
    return;
  }
  el.innerHTML = ((window.mjSkeleton||window.MJSkeleton)?(window.mjSkeleton||window.MJSkeleton).cards(3) : '<div class="empty"><p>Loading orders…</p></div>');

  // Session required for API
  let session = null;
  try {
    const res = await sb.auth.getSession();
    session = res.data && res.data.session;
  } catch (e) {
    console.error(e);
  }
  if (!session || !session.access_token) {
    el.innerHTML = `<div class="empty"><h3>Please sign in</h3><p>Your session is missing. Sign in again to see booster orders.</p><a href="auth.html">Sign in</a></div>`;
    return;
  }

  const headers = {
    Authorization: 'Bearer ' + session.access_token,
    Accept: 'application/json'
  };

  window.cancelOrder = async function(orderId){
    if (!orderId || !confirm('Cancel this order?')) return;
    try {
      const res = await fetch('/api/owlet?action=cancel', {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: orderId })
      });
      const json = await res.json();
      if (!json.success) alert(json.message || 'Cancel failed');
      else loadOrders(true);
    } catch (e) { alert(e.message || 'Network error'); }
  };

  window.refillOrder = async function(orderId){
    if (!orderId) return;
    try {
      const res = await fetch('/api/owlet?action=refill', {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: orderId })
      });
      const json = await res.json();
      if (!json.success) alert(json.message || 'Refill failed');
      else { alert('Refill requested'); loadOrders(true); }
    } catch (e) { alert(e.message || 'Network error'); }
  };

  
  function openSocialLink(url) {
    const u = String(url || '').trim();
    if (!u) return;
    let href = u;
    if (!/^https?:\/\//i.test(href) && !/^[a-z][a-z0-9+.-]*:/i.test(href)) {
      href = 'https://' + href.replace(/^\/\//, '');
    }
    // App-intent style where possible; OS falls back to browser/website
    try {
      const parsed = new URL(href);
      const host = parsed.hostname.replace(/^www\./, '').toLowerCase();
      const path = parsed.pathname + parsed.search + parsed.hash;
      if (host.includes('tiktok.com')) {
        // Universal link — opens app if installed
        href = 'https://www.tiktok.com' + path;
      } else if (host.includes('instagram.com')) {
        href = 'https://www.instagram.com' + path;
      } else if (host.includes('youtube.com') || host.includes('youtu.be')) {
        href = href;
      } else if (host.includes('twitter.com') || host.includes('x.com')) {
        href = href.replace('twitter.com', 'x.com');
      } else if (host.includes('facebook.com') || host.includes('fb.com')) {
        href = href;
      }
    } catch (e) {}
    window.open(href, '_blank', 'noopener,noreferrer');
  }
  window.openSocialLink = openSocialLink;

function renderRows(rows){
    if (!rows.length) {
      el.innerHTML = `<div class="empty"><div style="font-size:40px;margin-bottom:8px">⚡</div><h3>No boost orders yet</h3><p>Your growth orders will show here with live progress.</p><a href="mj-boosters.html">Place first boost</a></div>`;
      return;
    }
    el.innerHTML = rows.map(o => {
      const oid = o.supplier_order_id || '';
      const actions = [];
      if (canCancel(o) && oid) actions.push(`<button type="button" class="btn-mini danger" onclick="cancelOrder('${esc(oid)}')">Cancel</button>`);
      if (canRefill(o) && oid) actions.push(`<button type="button" class="btn-mini primary" onclick="refillOrder('${esc(oid)}')">Request refill</button>`);
      return `<div class="card" data-order="${esc(oid)}">
        <div class="top">
          <div class="title">${esc(o.service_name || 'Boost')}</div>
          <span class="status ${esc(o.status || '')}">${esc(o.status || 'Pending')}</span>
        </div>
        <div class="link-row">${o.link ? `<span class="link-text">${esc(o.link)}</span><button type="button" class="btn-open" onclick='openSocialLink(${JSON.stringify(String(o.link||""))})'><i class="fa-solid fa-arrow-up-right-from-square"></i> Open</button>` : `<span class="link-text muted">No link provided</span>`}</div>
        <div class="row"><span>Ordered ${Number(o.quantity || 0).toLocaleString()}</span><span>${fmt(o.price_ngn)}</span></div>
        ${progressHtml(o)}
        <div class="row"><span>Order #${esc(oid || o.id || '')}</span><span>${o.created_at ? new Date(o.created_at).toLocaleString() : ''}</span></div>
        ${actions.length ? `<div class="btn-row">${actions.join('')}</div>` : ''}
      </div>`;
    }).join('');
  }

  let pollTimer = null;
  let loading = false;

  async function loadOrders(silent){
    if (loading && silent) return;
    loading = true;
    try {
      if (!silent) el.innerHTML = ((window.mjSkeleton||window.MJSkeleton)?(window.mjSkeleton||window.MJSkeleton).cards(3) : '<div class="empty"><p>Loading orders…</p></div>');

      // Fast: DB only
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), 20000);
      const url = silent
        ? '/api/owlet?action=my_orders&page_size=50'
        : '/api/owlet?action=my_orders&page_size=50&live=0';
      const resFast = await fetch(url, {
        headers,
        signal: controller.signal
      });
      clearTimeout(t);
      const jsonFast = await resFast.json().catch(() => ({}));
      if (!jsonFast.success) {
        el.innerHTML = `<div class="empty"><h3>Could not load orders</h3><p>${esc(jsonFast.message || resFast.statusText || 'Error')}</p><a href="auth.html">Sign in again</a></div>`;
        return;
      }
      let rows = jsonFast.data || [];
      if (window.__mjSkelDone) {
        var _rows = rows;
        window.__mjSkelDone(function(){ renderRows(_rows); });
        window.__mjSkelDone = null;
      } else {
        renderRows(rows);
      }

      const hasActive = rows.some(isActive);
      if (hasActive) {
        // Background live update (do not block UI)
        fetch('/api/owlet?action=my_orders&page_size=50', { headers })
          .then(r => r.json())
          .then(json => {
            if (json && json.success && Array.isArray(json.data)) renderRows(json.data);
          })
          .catch(() => {});
      }

      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (hasActive) pollTimer = setInterval(() => loadOrders(true), 12000);
    } catch (e) {
      const msg = e.name === 'AbortError' ? 'Request timed out. Try refresh.' : (e.message || 'Network error');
      if (!silent) el.innerHTML = `<div class="empty"><h3>Could not load</h3><p>${esc(msg)}</p><button type="button" class="btn-mini primary" onclick="location.reload()">Retry</button></div>`;
    } finally {
      loading = false;
    }
  }

  const rb = document.getElementById('refreshBtn');
  if (rb) rb.onclick = () => loadOrders(false);

  await loadOrders(false);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadOrders(true);
  });
})();




</script>
</body>
</html>
