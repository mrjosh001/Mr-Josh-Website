function escapeHtml(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

/** Split full MSISDN into dial code + national number. Copy uses national only. */
function splitPhoneDisplay(raw, countryName) {
  var digits = String(raw || '').replace(/\D/g, '');
  var cn = String(countryName || '').toLowerCase().replace(/\s+/g, ' ').trim();
  var dialMap = {
    'united states':'1','usa':'1','us':'1','usa (2)':'1','canada':'1','ca':'1',
    'united kingdom':'44','uk':'44','nigeria':'234','ng':'234','india':'91','germany':'49','france':'33',
    'austria':'43','netherlands':'31','sweden':'46','poland':'48','spain':'34','italy':'39',
    'brazil':'55','mexico':'52','indonesia':'62','philippines':'63','vietnam':'84','thailand':'66',
    'malaysia':'60','singapore':'65','australia':'61','south africa':'27','kenya':'254','ghana':'233',
    'egypt':'20','turkey':'90','russia':'7','ukraine':'380','china':'86','hong kong':'852','japan':'81',
    'south korea':'82','korea':'82','israel':'972','uae':'971','united arab emirates':'971',
    'portugal':'351','belgium':'32','switzerland':'41','ireland':'353','romania':'40','czech':'420',
    'czech republic':'420','hungary':'36','denmark':'45','norway':'47','finland':'358',
    'colombia':'57','argentina':'54','chile':'56','peru':'51','bangladesh':'880','pakistan':'92',
    'cambodia':'855','laos':'856','myanmar':'95','nepal':'977','sri lanka':'94','morocco':'212',
    'tunisia':'216','algeria':'213','ivory coast':'225','senegal':'221','cameroon':'237',
    'uganda':'256','tanzania':'255','ethiopia':'251','new zealand':'64'
  };
  var dial = '';
  if (cn && dialMap[cn]) dial = dialMap[cn];
  else if (cn) {
    for (var k in dialMap) { if (cn.indexOf(k) === 0 || k.indexOf(cn) === 0) { dial = dialMap[k]; break; } }
  }
  var national = digits;
  if (dial && digits.indexOf(dial) === 0 && digits.length > dial.length + 4) national = digits.slice(dial.length);
  else if (!dial && digits.length === 11 && digits.charAt(0) === '1') { dial = '1'; national = digits.slice(1); }
  return { dial: dial ? ('+' + dial) : '', national: national || digits || '—' };
}

  );
}

function money(n){return '₦'+Number(n||0).toLocaleString()}
function showToast(msg,type){const t=document.createElement('div');t.className='toast'+(type==='error'?' error':'');t.innerHTML='<span>'+(type==='error'?'❌':'✅')+'</span><span>'+escapeHtml(msg)+'</span>';toastContainer.appendChild(t);setTimeout(()=>t.remove(),3500)}
function formatCountdown(seconds){if(seconds<=0)return'0:00';const m=Math.floor(seconds/60);const s=Math.floor(seconds%60);return m+':'+String(s).padStart(2,'0')}

// Clipboard with a fallback for in-app browsers / non-secure contexts.
function copyText(val,label){
  var text=String(val==null?'':val);
  function ok(){showToast((label||'Copied')+'!','success')}
  function fail(){showToast('Copy failed — press and hold the text instead','error')}
  function legacy(){
    try{
      var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);
      var good=document.execCommand('copy');document.body.removeChild(ta);good?ok():fail();
    }catch(e){fail()}
  }
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok).catch(legacy)}else legacy();
}
function bindCopyPhone(){
  var b=document.getElementById('copyPhoneBtn');
  if(b)b.onclick=function(){var n=(document.getElementById('phoneValue')||{}).textContent||'';copyText(String(n).replace(/\s/g,''),'Number copied')};
}

function stopCountdown(){if(countdownTimer)clearInterval(countdownTimer);countdownTimer=null}
function stopCancelCooldown(){if(cancelCooldownTimer)clearInterval(cancelCooldownTimer);cancelCooldownTimer=null}
function stopPolling(){if(pollTimer)clearTimeout(pollTimer);pollTimer=null}

function updateCancelButtonState(){
  const btn=document.getElementById('cancelBtn'),avail=document.getElementById('cancelAvailable'),hint=document.getElementById('cancelHint');
  if(!btn||cancelling)return;
  const startMs=orderCreatedAt?new Date(orderCreatedAt).getTime():Date.now();
  const waitLeft=CANCEL_COOLDOWN_SECONDS-Math.floor((Date.now()-startMs)/1000);
  btn.innerHTML='Cancel';
  if(waitLeft>0){
    btn.disabled=true;
    if(avail){avail.style.display='';avail.innerHTML='Available in : <strong>'+formatCountdown(waitLeft)+'</strong>'}
    if(hint)hint.textContent='';
  }else{
    btn.disabled=false;
    if(avail){avail.style.display='none';avail.innerHTML=''}
    if(hint)hint.textContent='No code yet? Cancel to restore your balance.';
  }
}
function startCancelCooldown(){stopCancelCooldown();updateCancelButtonState();cancelCooldownTimer=setInterval(updateCancelButtonState,1000)}

function startCountdown(createdAt,timeLeft){
  stopCountdown();
  orderCreatedAt=createdAt||orderCreatedAt||new Date().toISOString();
  const startMs=new Date(orderCreatedAt).getTime();
  function tick(){
    let remaining=EXPIRY_SECONDS-Math.floor((Date.now()-startMs)/1000);
    if(timeLeft!=null&&Number(timeLeft)>=0)remaining=Math.min(remaining,Number(timeLeft));
    const label=document.getElementById('countdownValue');
    if(!label){stopCountdown();return}
    const bar=document.getElementById('mjWaitBar');
    if(bar)bar.style.transform='scaleX('+Math.max(0,Math.min(1,remaining/EXPIRY_SECONDS))+')';
    if(remaining<=0){
      label.textContent='Expired — refunding…';
      if(bar)bar.style.transform='scaleX(0)';
      if(!autoRefundStarted&&!cancelling){autoRefundStarted=true;autoRefundOnExpiry()}
      return;
    }
    label.textContent=formatCountdown(remaining);
  }
  tick();
  countdownTimer=setInterval(tick,1000);
  startCancelCooldown();
}

async function api(action,body){
  const res=await fetch('/api/sms-bus?action='+encodeURIComponent(action),{
    method:'POST',
    headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
    body:JSON.stringify(body||{})
  });
  const data=await res.json().catch(()=>({}));
  return {ok:res.ok,data};
}

function isRefundedStatus(d){return d&&(d.status==='refunded'||d.status==='expired'||d.status==='cancelled'||d.refunded===true)}

async function autoRefundOnExpiry(){
  if(!orderId)return;
  stopPolling();
  const btn=document.getElementById('cancelBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Refunding…'}
  try{
    const {ok,data}=await api('cancel',{order_id:orderId});
    if(ok&&data.success){showToast('Time expired — balance restored','success');renderCancelled('Time ran out with no SMS. Your balance has been restored.');return}
    const check=await api('check',{order_id:orderId});
    if(check.ok&&check.data.success&&isRefundedStatus(check.data.data)){showToast('Balance restored','success');renderCancelled('No SMS received. Your balance has been restored.');return}
    if(check.ok&&check.data.success&&check.data.data?.status==='completed'&&check.data.data?.code){renderCompleted(Object.assign({},meta,check.data.data));return}
    showToast(data.message||'Could not auto-refund yet. Try Cancel.','error');
    autoRefundStarted=false;
    pollTimer=setTimeout(checkStatus,5000);
  }catch(e){autoRefundStarted=false;showToast('Network error during refund. Try Cancel.','error');pollTimer=setTimeout(checkStatus,6000)}
}

  document.getElementById('cancelBtn').addEventListener('click',cancelOrder);

function renderCompleted(data){
  stopPolling();stopCountdown();stopCancelCooldown();
  const phone=data.number||data.phone_number||meta.phone_number||'';
  const code=String(data.code||'—');
  const digits=code.split('').map(function(ch){return '<span>'+escapeHtml(ch)+'</span>'}).join('');
  statusCard.className='n3';
  statusCard.innerHTML=
    '<div class="n3-state"><div class="n3-live" style="background:var(--ok-soft);color:var(--ok)"><i class="fa-solid fa-circle-check"></i></div><div><div class="n3-st">Code received</div><div class="n3-ss">Copy the code and finish your verification. This order is complete, so there is no cancel or refund.</div></div></div>'+
    '<div class="n3-card n3-codecard"><div class="n3-lab">Verification code</div><div class="n3-digits" id="codeValue">'+digits+'</div></div>'+
    '<button type="button" class="n3-btn ok" id="copyCodeBtn"><i class="fa-solid fa-copy"></i> Copy Code</button>'+
    '<button type="button" class="n3-btn n3-primary" id="reuseBtn" style="display:none"><i class="fa-solid fa-rotate"></i> Reuse this number</button>'+
    phoneBlockHtml(phone,data.country_name||meta.country_name||'')+
    infoBlocks(data)+
    '<div class="n3-tip" id="codeSecureAdvice"><i class="fa-solid fa-triangle-exclamation"></i><div><b>Protect this account</b><span>If this code was for a messaging app (WhatsApp, Telegram, etc.), secure the account first. Add a passkey and email where the app allows it.<br><br>Do not rush to send messages. Let the account sit on your phone. Prefer that someone messages you first.<br><br>That helps keep the number from getting banned. Enjoy.</span></div></div>'+
    '<div class="n3-links"><a href="'+BACK_PAGE+'" class="n3-btn n3-ghost">Buy Another Number</a><a href="dashboard.html" class="n3-btn n3-ghost">Back to Home</a></div>';
  document.getElementById('copyCodeBtn').onclick=function(){copyText(code,'Code copied')};
  bindCopyPhone();

  // Reuse (only while the reuse window is still open and the service allows it)
  var rb=document.getElementById('reuseBtn');
  if(rb){
    var cid=meta.country_id||data.country_id, sid=meta.service_id||data.service_id;
    var ph=String(phone||'').replace(/\D/g,'');
    var doneAt=new Date(data.updated_at||meta.updated_at||data.created_at||meta.created_at||Date.now()).getTime();
    var left=(doneAt+20*60*1000)-Date.now();
    if(cid&&sid&&ph&&left>0&&(meta.is_reusable===true||data.is_reusable===true||meta.is_reusable===1||data.is_reusable===1)){
      rb.style.display='flex';
      rb.onclick=async function(){
        rb.disabled=true;rb.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Reusing…';
        try{
          var r=await api('reuse',{country_id:cid,project_id:sid,mobile_number:ph,country_name:meta.country_name||data.country_name,service_name:meta.service_name||data.service_name});
          if(!r.ok||!r.data||!r.data.success||!r.data.data||!r.data.data.order_id)throw new Error((r.data&&r.data.message)||'Reuse failed');
          var d=r.data.data, num=d.number||d.phone_number||ph;
          try{sessionStorage.setItem('mj_sms3_last_order',JSON.stringify({order_id:d.order_id,number:num,price:d.price,service_name:d.service_name,country_name:d.country_name,ts:Date.now()}))}catch(_){}
          var q=new URLSearchParams({order_id:String(d.order_id),number:num});
          if(d.service_name)q.set('service_name',d.service_name);
          if(d.country_name)q.set('country_name',d.country_name);
          if(d.price!=null)q.set('price',String(d.price));
          location.href='mj-sms3-number.html?'+q.toString();
        }catch(e){showToast(e.message||'Reuse failed','error');rb.disabled=false;rb.innerHTML='<i class="fa-solid fa-rotate"></i> Reuse this number'}
      };
    }
  }
}

function renderCancelled(msg){
  stopPolling();stopCountdown();stopCancelCooldown();
  statusCard.className='n3-card n3-center';
  statusCard.innerHTML=
    '<div class="n3-ico bad"><i class="fa-solid fa-rotate-left"></i></div><h2>Balance restored</h2>'+
    '<p>'+escapeHtml(msg||'This number was cancelled and your wallet balance has been restored.')+'</p>'+
    '<div style="display:grid;gap:10px;margin-top:16px"><a href="'+BACK_PAGE+'" class="n3-btn n3-primary">Buy Another Number</a><a href="dashboard.html" class="n3-btn n3-ghost">Back to Home</a></div>';
}

function renderError(msg){
  stopPolling();stopCountdown();stopCancelCooldown();
  statusCard.className='n3-card n3-center';
  statusCard.innerHTML=
    '<div class="n3-ico bad"><i class="fa-solid fa-triangle-exclamation"></i></div><h2>Something went wrong</h2>'+
    '<p>'+escapeHtml(msg)+'</p>'+
    '<div style="display:grid;gap:10px;margin-top:16px"><a href="'+BACK_PAGE+'" class="n3-btn n3-primary">Back to Server 2</a><a href="dashboard.html" class="n3-btn n3-ghost">Back to Home</a></div>';
}

async function cancelOrder(){
  if(cancelling||!orderId)return;
  const startMs=orderCreatedAt?new Date(orderCreatedAt).getTime():0;
  const elapsed=startMs?Math.floor((Date.now()-startMs)/1000):CANCEL_COOLDOWN_SECONDS;
  if(elapsed<CANCEL_COOLDOWN_SECONDS){showToast('Cancel available in '+formatCountdown(CANCEL_COOLDOWN_SECONDS-elapsed),'error');return}
  cancelling=true;stopPolling();
  const btn=document.getElementById('cancelBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Cancelling...'}
  try{
    const {ok,data}=await api('cancel',{order_id:orderId});
    if(ok&&data.success){showToast('Cancelled — balance restored','success');renderCancelled('Number cancelled. Your balance has been restored.');return}
    if(data&&data.code==='NUMBER_CODE_ALREADY_RECEIVED'){showToast('Code already received — cannot cancel.','error');cancelling=false;await checkStatus();return}
    showToast((data&&data.message)||'Could not cancel this order.','error');
    cancelling=false;updateCancelButtonState();pollTimer=setTimeout(checkStatus,5000);
  }catch(e){showToast('Network error. Please try again.','error');cancelling=false;updateCancelButtonState();pollTimer=setTimeout(checkStatus,5000)}
}

async function checkNow(){
  if(checkingNow)return;
  checkingNow=true;stopPolling();
  const btn=document.getElementById('checkNowBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Checking...'}
  await checkStatus(true);
  checkingNow=false;
  var b2=document.getElementById('checkNowBtn');
  if(b2){b2.disabled=false;b2.innerHTML='<i class="fa-solid fa-rotate"></i> Check for SMS Now'}
}

async function checkStatus(fromBtn){
  if(!orderId||!accessToken)return;
  try{
    const {ok,data}=await api('check',{order_id:orderId});
    if(!ok||!data.success){
      if(fromBtn===true)showToast('Could not check for SMS right now','error');
      pollTimer=setTimeout(checkStatus,5000);
      return;
    }
    const d=data.data||{};
    if(d.status==='completed'&&d.code){renderCompleted(Object.assign({},meta,d));return}
    if(isRefundedStatus(d)){renderCancelled(d.message||'No SMS received. Your balance has been restored.');return}
    if(!document.getElementById('countdownValue'))renderWaiting(Object.assign({},meta,d));
    pollTimer=setTimeout(checkStatus,5000);
  }catch(e){pollTimer=setTimeout(checkStatus,6000)}
}

async function ensureSession(){
  sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});
  let session=null;
  try{const r=await sbClient.auth.getSession();session=r.data&&r.data.session}catch(_){}
  if(!session){try{const r2=await sbClient.auth.refreshSession();session=r2.data&&r2.data.session}catch(_){}}
  // Migrate an older sessionStorage session once
  if(!session){
    try{
      const keys=[];
      for(let i=0;i<sessionStorage.length;i++){const k=sessionStorage.key(i);if(k&&(k.indexOf('sb-')===0||k.indexOf('supabase')!==-1))keys.push(k)}
      for(const k of keys){if(!localStorage.getItem(k))localStorage.setItem(k,sessionStorage.getItem(k))}
      if(keys.length){const r3=await sbClient.auth.getSession();session=r3.data&&r3.data.session}
    }catch(_){}
  }
  return session;
}

async function loadCachedMeta(){
  const params=new URLSearchParams(location.search);
  const fromUrl={
    order_id:params.get('order_id')||orderId,
    number:params.get('number')||params.get('phone')||'',
    phone_number:params.get('number')||params.get('phone')||'',
    service_name:params.get('service_name')||params.get('service')||'',
    country_name:params.get('country_name')||params.get('country')||'',
    price:params.get('price')?Number(params.get('price')):null
  };
  try{
    const raw=sessionStorage.getItem('mj_sms3_last_order')||localStorage.getItem('mj_sms3_last_order');
    if(raw){
      const j=JSON.parse(raw);
      if(j&&String(j.order_id)===String(orderId||fromUrl.order_id)){
        return Object.assign({},fromUrl,{
          number:j.number||j.phone_number||fromUrl.number,
          phone_number:j.number||j.phone_number||fromUrl.phone_number,
          service_name:j.service_name||fromUrl.service_name,
          country_name:j.country_name||fromUrl.country_name,
          price:j.price!=null?j.price:fromUrl.price,
          created_at:j.ts?new Date(j.ts).toISOString():null
        });
      }
    }
  }catch(_){}
  return fromUrl;
}

async function boot(){
  if(!orderId){renderError('Missing order id');return}
  const session=await ensureSession();
  if(!session){location.href='auth.html?next='+encodeURIComponent('mj-sms-choose-server.html');return}
  accessToken=session.access_token;

  // Show the waiting screen immediately from cache/URL, then confirm with the server
  const cached=await loadCachedMeta();
  if(cached&&(cached.number||cached.phone_number)){
    meta=Object.assign({},meta||{},cached);
    orderCreatedAt=cached.created_at||new Date().toISOString();
    renderWaiting({number:cached.number||cached.phone_number,phone_number:cached.number||cached.phone_number,service_name:cached.service_name,country_name:cached.country_name,price:cached.price,created_at:orderCreatedAt});
  }

  try{
    const {ok,data}=await api('check',{order_id:orderId});
    if(ok&&data&&data.success&&data.data){
      const d=data.data;
      meta=Object.assign({},meta||{},d);
      if(d.status==='completed'&&d.code){renderCompleted(d);return}
      if(isRefundedStatus(d)){renderCancelled(d.message||'Already refunded.');return}
      orderCreatedAt=d.created_at||meta.created_at||orderCreatedAt;
      renderWaiting({number:d.number||d.phone_number,phone_number:d.number||d.phone_number,service_name:d.service_name||meta.service_name,country_name:d.country_name||meta.country_name,price:d.price!=null?d.price:meta.price,created_at:orderCreatedAt,time_left:d.time_left});
      checkStatus();
      return;
    }
  }catch(e){console.warn('check boot',e)}

  // Fallback: direct table read
  try{
    const {data}=await sbClient.from('number_orders').select('*').eq('order_id',orderId).eq('user_id',session.user.id).maybeSingle();
    if(data){
      meta=data;orderCreatedAt=data.created_at;
      if(data.status==='completed'&&data.code){renderCompleted(data);return}
      if(data.refunded||data.status==='refunded'){renderCancelled('Already refunded.');return}
      renderWaiting({number:data.phone_number,phone_number:data.phone_number,service_name:data.service_name,country_name:data.country_name,price:data.price,created_at:data.created_at});
      checkStatus();
      return;
    }
  }catch(e){console.warn('db boot',e)}

  if(meta&&(meta.number||meta.phone_number)){
    renderWaiting({number:meta.number||meta.phone_number,phone_number:meta.phone_number||meta.number,service_name:meta.service_name||'SMS',country_name:meta.country_name||'',price:meta.price,created_at:orderCreatedAt||new Date().toISOString()});
    checkStatus();
    return;
  }
  renderError('Could not load this order. Go back and try again, or open SMS history.');
}
boot();
</script>
