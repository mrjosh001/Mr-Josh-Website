<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MJ HUB Admin Sign In</title>
<link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin>
<link rel="dns-prefetch" href="//challenges.cloudflare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#09090b;--card:#121216;--text:#fafafa;--muted:#a1a1aa;--border:#27272a;--primary:#3b82f6;--danger:#f87171}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(59,130,246,.1),transparent),var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.card{width:min(100%,400px);padding:32px 26px;background:#15151c;border:1px solid #3f3f46;border-radius:20px;box-shadow:0 18px 55px #000a;position:relative;z-index:1}
.logo{display:block;width:auto;height:42px;max-width:190px;object-fit:contain;margin:0 auto 20px}
h1{font-size:22px;margin:0 0 6px;text-align:center}p{font-size:13px;color:var(--muted);text-align:center;margin:0 0 25px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.field{margin-bottom:16px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--border);background:#09090b;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--primary)}
#adminCaptcha{display:flex;justify-content:center;min-height:65px;margin:4px 0 16px}
button{width:100%;border:0;border-radius:11px;padding:13px 16px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;font:700 14px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;min-height:46px}
button:disabled{opacity:.65;cursor:wait}.error{min-height:20px;margin-top:12px;color:var(--danger);font-size:12px;text-align:center}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<noscript><div style="max-width:400px;margin:40px auto;padding:20px;background:#121216;border:1px solid #27272a;border-radius:16px;color:#fafafa;font-family:system-ui;text-align:center">Enable JavaScript to sign in to MJ HUB Admin.</div></noscript>
<main class="card">
<img class="logo" src="/img/IMG_3027.png" alt="MJ HUB">
<h1>Admin sign in</h1><p>Sign in with an authorised MJ HUB administrator account.</p>
<form id="adminLoginForm">
<div class="field"><label for="adminEmail">Email</label><input id="adminEmail" type="email" autocomplete="username" required></div>
<div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" required></div>
<div id="adminCaptcha" aria-label="Security verification"></div>
<button id="signInButton" type="submit">Sign In</button>
<div class="error" id="loginError" role="alert" aria-live="polite"></div>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://atczodlljmlayvldxfmv.supabase.co';
const SUPABASE_KEY='sb_publishable_dwbeKLcSG7-nfKzZz8x8Zw_U9FtwJTy';
const SITE_KEY='0x4AAAAAAF0CXjc8jL8djc4l';
if(!window.supabase){document.getElementById('loginError').textContent='Security library failed to load. Check your connection and refresh.';return;}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.sessionStorage}});
const mount=document.getElementById('adminCaptcha'),errorEl=document.getElementById('loginError'),button=document.getElementById('signInButton');
let widgetId=null,token='',apiPromise=null,scriptFailed=false;
function showError(message){errorEl.textContent=message||'Security verification could not load. Refresh and try again.';}
function loadTurnstile(){
 if(window.turnstile&&typeof window.turnstile.render==='function')return Promise.resolve(window.turnstile);
 if(scriptFailed)return Promise.reject(new Error('Turnstile script previously failed to load'));
 if(apiPromise)return apiPromise;
 apiPromise=new Promise((resolve,reject)=>{
  const existing=document.getElementById('mjAdminAuthTurnstile');
  if(existing){
   if(window.turnstile){resolve(window.turnstile);return;}
   existing.addEventListener('load',()=>resolve(window.turnstile),{once:true});
   existing.addEventListener('error',()=>{scriptFailed=true;reject(new Error('Turnstile script failed to load'));},{once:true});
   return;
  }
  const script=document.createElement('script');
  script.id='mjAdminAuthTurnstile';
  script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
  script.async=true;
  script.addEventListener('load',()=>{
   try{window.turnstile.ready(()=>resolve(window.turnstile));}catch(e){resolve(window.turnstile);}
  },{once:true});
  script.addEventListener('error',()=>{scriptFailed=true;reject(new Error('Turnstile script failed to load'));},{once:true});
  setTimeout(()=>{if(!window.turnstile){scriptFailed=true;reject(new Error('Turnstile load timed out'));}},12000);
  document.head.appendChild(script);
 });
 return apiPromise;
}
async function initCaptcha(){
 try{
  const api=await loadTurnstile();
  if(!mount)return;
  if(widgetId!==null){try{api.remove(widgetId);}catch(e){} widgetId=null;}
  mount.replaceChildren();
  widgetId=api.render(mount,{
   sitekey:SITE_KEY,theme:'auto',appearance:'always',execution:'render',retry:'auto','retry-interval':8000,'refresh-expired':'auto','refresh-timeout':'auto',
   callback:value=>{token=value||'';},'expired-callback':()=>{token='';},'timeout-callback':()=>{token='';},
   'error-callback':code=>{token='';console.warn('[MJ HUB Admin Auth] Turnstile error:',code);return false;}
  });
  if(widgetId===undefined||widgetId===null){widgetId=null;showError('Unable to start security verification. Refresh the page.');}
 }catch(e){showError(e.message);console.error('[MJ HUB Admin Auth] CAPTCHA load failed:',e);}
}
function isAdmin(v){return v===true||v==='true'||v===1||v==='1';}
async function verifyExistingSession(){
 const {data:{session}}=await sb.auth.getSession();if(!session)return false;
 const {data,error}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();
 if(error){showError('Could not verify your admin access. Sign in again to retry verification.');return false;}
 if(data&&isAdmin(data.is_admin)){location.replace('/admin.html');return true;}
 await sb.auth.signOut();showError('Access denied. Admin privileges are required.');return false;
}
document.getElementById('adminLoginForm').addEventListener('submit',async event=>{
 event.preventDefault();errorEl.textContent='';
 const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPassword').value;
 if(!email||!password){showError('Enter your email and password.');return;}
 if(!token){showError('Complete the security check before signing in.');initCaptcha();return;}
 button.disabled=true;button.innerHTML='<span class="spinner"></span> Signing in…';
 try{
  const {data,error}=await sb.auth.signInWithPassword({email,password,options:{captchaToken:token}});
  token='';if(window.turnstile&&widgetId!==null)try{window.turnstile.reset(widgetId);}catch(e){}
  if(error)throw error;
  const {data:profile,error:profileError}=await sb.from('profiles').select('is_admin').eq('id',data.user.id).maybeSingle();
  if(profileError)throw new Error('Signed in, but admin access could not be verified. Please retry.');
  if(!profile||!isAdmin(profile.is_admin)){await sb.auth.signOut();throw new Error('Access denied. Admin privileges are required.');}
  location.replace('/admin.html');
 }catch(e){showError(e.message||'Sign in failed.');button.disabled=false;button.textContent='Sign In';}
});
(async()=>{try{const handled=await verifyExistingSession();if(!handled)initCaptcha();}catch(e){console.error(e);showError(e.message||'Could not start sign-in. Refresh and try again.');try{initCaptcha();}catch(err){}}})();
})();
</script>
</body></html>
