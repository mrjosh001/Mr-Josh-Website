<script>
(function(){
  function save(code){
    code=String(code||'').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');
    if(!code||code.length<3) return '';
    try{localStorage.setItem('mjhub_ref_code',code);}catch(e){}
    try{sessionStorage.setItem('mjhub_ref_code',code);}catch(e){}
    try{document.cookie='mjhub_ref_code='+encodeURIComponent(code)+'; path=/; max-age='+(30*86400)+'; SameSite=Lax; Secure';}catch(e){}
    return code;
  }
  function read(){
    try{ var c=localStorage.getItem('mjhub_ref_code')||sessionStorage.getItem('mjhub_ref_code'); if(c) return c; }catch(e){}
    try{ var m=document.cookie.match(/(?:^|;\s*)mjhub_ref_code=([^;]+)/); if(m) return decodeURIComponent(m[1]); }catch(e){}
    return '';
  }
  try{
    var p=new URLSearchParams(location.search);
    var h=String(location.hash||'').replace(/^#/,'');
    var hp=new URLSearchParams(h.indexOf('=')>=0?h:'');
    save(p.get('ref')||p.get('referral')||p.get('r')||hp.get('ref')||'');
  }catch(e){}
  window.__mjhub_save_ref=save;
  window.__mjhub_read_ref=read;
  function withRef(href){
    var code=read();
    if(!code) return href;
    try{
      var u=new URL(href, location.origin);
      if(!u.searchParams.get('ref')) u.searchParams.set('ref', code);
      return u.pathname+u.search+u.hash;
    }catch(e){ return href; }
  }
  document.addEventListener('click', function(e){
    var a=e.target && e.target.closest && e.target.closest('a[href]');
    if(!a) return;
    var href=a.getAttribute('href')||'';
    if(!/auth\.html|auth\?|\/auth/i.test(href)) return;
    a.setAttribute('href', withRef(href));
  }, true);
})();
</script>

<script>
/* Email confirm / auth tokens: send to auth, never stay on marketing home */
(function () {
  try {
    var q = window.location.search || '';
    var h = window.location.hash || '';
    if (/access_token=|refresh_token=|type=signup|type=recovery|type=email|verified=1/i.test(q + h)) {
      window.location.replace('/auth.html' + q + h);
    }
  } catch (e) {}
})();
</script>

<style>
:root {
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --glow: rgba(59,130,246,.4);
  --bg: #f1f5f9;
  --elevated: #ffffff;
  --card: rgba(255,255,255,.55);
  --text: #0f172a;
  --text2: #475569;
  --muted: #64748b;
  --border: rgba(255,255,255,.35);
  --success: #10b981;
  --radius: 22px;
}
[data-theme="dark"] {
  --primary: #60a5fa;
  --primary-hover: #3b82f6;
  --glow: rgba(96,165,250,.35);
  --bg: #030712;
  --elevated: #0b0f19;
  --card: rgba(17,24,39,.55);
  --text: #f1f5f9;
  --text2: #94a3b8;
  --muted: #cbd5e1;
  --border: rgba(255,255,255,.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  transition: background .35s, color .35s;
}

/* ===== 3D CANVAS ===== */
#webgl-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ===== HEADER ===== */
.header {
  position: fixed !important; top: 0; left: 0; right: 0; z-index: 500 !important;
  overflow: visible;
  background: color-mix(in srgb, var(--elevated) 75%, transparent);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1120px; margin: 0 auto;
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.logo {
  font-size: 22px; font-weight: 800; letter-spacing: -.5px;
  display: inline-flex; align-items: center; gap: 8px; position: relative; z-index: 2;
  text-decoration: none; color: var(--text); line-height: 1;
}
.logo span {
  background: linear-gradient(135deg, var(--primary), #a855f7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo img { height: 36px; width: auto; max-width: 48px; object-fit: contain; display: block; background: transparent; }
.logo-word {
  font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif !important;
  font-size: 16px !important; font-weight: 800;
  letter-spacing: -.02em;
  line-height: 32px;
  background: none !important;
  -webkit-background-clip: unset !important;
  color: #1e3a8a !important;
  -webkit-text-fill-color: #1e3a8a !important;
}
html[data-theme="dark"] .logo-word,
body[data-theme="dark"] .logo-word {
  color: #dbeafe !important;
  -webkit-text-fill-color: #dbeafe !important;
}
.nav-desktop { display: flex; gap: 4px; }
.nav-desktop a {
  padding: 8px 14px; font-size: 14px; font-weight: 500;
  color: var(--text2); border-radius: 9px; transition: .2s;
  text-decoration: none;
}
.nav-desktop a:hover { color: var(--text); background: color-mix(in srgb, var(--primary) 12%, transparent); }
.header-actions { display: flex; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; font-size: 14px; font-weight: 600;
  border-radius: 12px; border: none; cursor: pointer;
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  text-decoration: none;
}
.btn-ghost {
  background: color-mix(in srgb, var(--card) 80%, transparent);
  color: var(--text); border: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
.btn-ghost:hover { border-color: var(--primary); transform: translateY(-2px); }
.btn-primary {
  background: var(--primary); color: #fff;
  box-shadow: 0 4px 24px var(--glow);
}
.btn-primary:hover {
  background: var(--primary-hover);
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 10px 36px var(--glow);
}
.header-actions, .icon-btn, .menu-btn { pointer-events: auto !important; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 11px;
  border: 1px solid var(--border); background: color-mix(in srgb, var(--card) 70%, transparent);
  backdrop-filter: blur(10px); color: var(--text); font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: .2s;
  position: relative; z-index: 5;
  pointer-events: auto;
}
.icon-btn:hover { background: color-mix(in srgb, var(--primary) 15%, transparent); transform: scale(1.08); }
.menu-btn { display: none; }




.mobile-menu.kinetic-nav {
  display: none;
  position: fixed; inset: 0; z-index: 600 !important;
}
.mobile-menu.kinetic-nav[hidden] { display: none !important; }
.mobile-menu.kinetic-nav.active,
.mobile-menu.kinetic-nav[data-nav="open"] {
  display: block !important;
  visibility: visible !important;
}
.kinetic-overlay {
  position: absolute; inset: 0;
  background: rgba(2,6,23,.45);
  backdrop-filter: blur(8px);
}
.kinetic-panel {
  position: absolute; top: 0; left: 0; bottom: 0; right: auto;
  width: min(300px, 84vw);
  overflow: auto;
  padding: 22px 0 20px;
  background: #1d3fa8;
  color: #e8eeff;
  box-shadow: 18px 0 50px rgba(15,23,42,.28);
  transform: translateX(-105%);
  transition: transform .32s cubic-bezier(.22,1,.36,1);
  display: flex;
  flex-direction: column;
}
.mobile-menu.active .kinetic-panel,
.mobile-menu[data-nav="open"] .kinetic-panel { transform: translateX(0); }
.menu-sheet-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 0 18px 16px;
}
.menu-brand { display: flex; align-items: center; gap: 10px; }
.menu-brand img { width: 34px; height: 34px; object-fit: contain; border-radius: 10px; background: #fff; }
.menu-brand b { display: block; font-size: 15px; font-weight: 800; color: #fff; }
.menu-brand small { display: block; font-size: 11px; color: #c7d7ff; }
.kinetic-close {
  width: 36px; height: 36px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.1); color: #fff;
  display: grid; place-items: center; cursor: pointer;
}
.kinetic-links {
  list-style: none; margin: 8px 0 0; padding: 0 0 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.kinetic-links a {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  margin-left: 14px; margin-right: 0;
  padding: 13px 18px 13px 16px;
  border-radius: 22px 0 0 22px;
  color: #d7e3ff; text-decoration: none;
  font-size: 15px; font-weight: 650;
  background: transparent; border: 0;
}
.kinetic-links a svg { width: 18px; height: 18px; flex: 0 0 auto; opacity: .9; }

.nav-sub { margin: 0; }
.nav-sub-toggle {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  margin-left: 14px; margin-right: 0;
  padding: 13px 18px 13px 16px;
  border-radius: 22px 0 0 22px;
  color: #d7e3ff; text-decoration: none;
  font-size: 15px; font-weight: 650;
  background: transparent; border: 0;
  width: calc(100% - 14px);
  cursor: pointer; font-family: inherit; text-align: left;
}
.nav-sub-toggle svg.icon { width: 18px; height: 18px; flex: 0 0 auto; opacity: .9; }
.nav-sub-toggle .chev {
  margin-left: auto; width: 16px; height: 16px; opacity: .85;
  transition: transform .2s ease;
}
.nav-sub.open .nav-sub-toggle .chev { transform: rotate(180deg); }
.nav-sub-panel {
  display: none;
  flex-direction: column;
  gap: 2px;
  padding: 4px 0 8px 0;
}
.nav-sub.open .nav-sub-panel { display: flex; }
.nav-sub-panel a {
  margin-left: 28px !important;
  padding: 11px 18px 11px 16px !important;
  font-size: 14px !important;
  font-weight: 600 !important;
  opacity: .95;
}

.kinetic-links a.on {
  background: #fff;
  color: #1d3fa8;
  font-weight: 800;
  z-index: 1;
}
.kinetic-links a.on svg { opacity: 1; }
.kinetic-links a.on:before,
.kinetic-links a.on:after {
  content: "";
  position: absolute;
  left: 0;
  width: 22px;
  height: 22px;
  background: transparent;
}
.kinetic-links a.on:before {
  top: -22px;
  border-bottom-left-radius: 22px;
  box-shadow: -6px 6px 0 6px #fff;
}
.kinetic-links a.on:after {
  bottom: -22px;
  border-top-left-radius: 22px;
  box-shadow: -6px -6px 0 6px #fff;
}
.kinetic-auth, .mobile-auth {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-top: auto; padding: 16px 16px 8px;
}
.kinetic-auth .btn-ghost { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.2); }
.kinetic-auth .btn { width: 100%; }
body.menu-open { overflow: hidden; }




/* ===== LIVE STOCK TICKER ===== */
.ticker-strip {
  position: relative; z-index: 2;
  background: color-mix(in srgb, var(--elevated) 60%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
  overflow: hidden;
}
.ticker-track {
  display: flex;
  gap: 48px;
  white-space: nowrap;
  animation: tickerScroll 40s linear infinite;
  padding-left: 100%;
}
.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
}
.ticker-dot {
  width: 8px; height: 8px;
  background: var(--success);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--success);
}
@keyframes tickerScroll {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}
.ticker-strip:hover .ticker-track { animation-play-state: paused; }

/* ===== HERO + 3D STAGE ===== */
.hero {
  position: relative; z-index: 2;
  padding: 80px 24px 80px;
  min-height: auto;
  display: flex; align-items: center;
}
.hero-grid {
  max-width: 1120px; margin: 0 auto; width: 100%;
  display: grid; grid-template-columns: 1.1fr 0.9fr;
  gap: 48px; align-items: center;
}
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; gap: 40px; }
}

.hero-copy { position: relative; z-index: 3; }
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 16px; margin-bottom: 24px;
  background: color-mix(in srgb, var(--primary) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent);
  border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--primary);
  backdrop-filter: blur(8px);
}
.badge-dot {
  width: 8px; height: 8px; background: var(--success); border-radius: 50%;
  box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

.hero h1 {
  font-size: clamp(36px, 5.5vw, 52px); font-weight: 800;
  letter-spacing: -1.8px; line-height: 1.12; margin-bottom: 18px;
}
